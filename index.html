(r.upgrade.label.toUpperCase() + ' PURCHASED', '#00ff41');\n    }\n    this._persist();\n  }\n\n  render(ctx, t) {\n    this._rects = [];\n    // Clear background\n    ctx.fillStyle = '#0a0420';\n    ctx.fillRect(0, 0, CFG.VIEW_W, CFG.VIEW_H);\n\n    // Animated background\n    for (let i = 0; i < 3; i++) {\n      ctx.fillStyle = `rgba(255, 90, 51, ${0.02 * Math.sin(t * 0.5 + i)})`;\n      ctx.fillRect(0, (i * 50 + t * 20) % CFG.VIEW_H, CFG.VIEW_W, 50);\n    }\n\n    // Title\n    ctx.fillStyle = '#ff5a33';\n    ctx.font = 'bold 10px Arial';\n    ctx.textAlign = 'center';\n    ctx.fillText('COIN SHOP - PERMANENT PROGRESSION', CFG.VIEW_W / 2, 15);\n\n    // Coins display\n    ctx.fillStyle = '#ffd700';\n    ctx.font = 'bold 8px Arial';\n    ctx.textAlign = 'left';\n    ctx.fillText(`COINS: ${this.coins}`, 10, 30);\n\n    // Tab buttons\n    this.renderTabs(ctx, t);\n\n    // Content area\n    this.renderTabContent(ctx, t);\n\n    // Instructions\n    ctx.fillStyle = '#b0b0ff';\n    ctx.font = '6px monospace';\n    ctx.textAlign = 'center';\n    ctx.fillText('CLICK TO BUY | [C]haracter [T]rain [S]kins | [↑↓] Scroll | [ESC] Back', CFG.VIEW_W / 2, CFG.VIEW_H - 5);\n    if (this.toast) {\n      ctx.globalAlpha = Math.min(1, this.toast.t * 2);\n      ctx.fillStyle = 'rgba(0,0,0,0.85)';\n      ctx.fillRect(CFG.VIEW_W / 2 - 90, CFG.VIEW_H - 32, 180, 14);\n      ctx.strokeStyle = this.toast.color; ctx.lineWidth = 1;\n      ctx.strokeRect(CFG.VIEW_W / 2 - 90, CFG.VIEW_H - 32, 180, 14);\n      ctx.fillStyle = this.toast.color; ctx.font = 'bold 7px monospace'; ctx.textAlign = 'center';\n      ctx.fillText(this.toast.msg, CFG.VIEW_W / 2, CFG.VIEW_H - 22);\n      ctx.globalAlpha = 1;\n    }\n  }\n\n  renderTabs(ctx, t) {\n    const tabWidth = CFG.VIEW_W / 3;\n    const tabY = 40;\n\n    this.tabs.forEach((tab, idx) => {\n      const x = idx * tabWidth;\n      const isActive = tab === this.selectedTab;\n\n      // Tab background\n      ctx.fillStyle = isActive ? '#ff5a33' : '#1a0e3d';\n      ctx.fillRect(x, tabY, tabWidth, 16);\n\n      // Tab border\n      ctx.strokeStyle = isActive ? '#ffd700' : '#00d4ff';\n      ctx.lineWidth = 2;\n      ctx.strokeRect(x, tabY, tabWidth, 16);\n\n      // Tab label\n      ctx.fillStyle = isActive ? '#ffffff' : '#b0b0ff';\n      ctx.font = 'bold 7px Arial';\n      ctx.textAlign = 'center';\n      ctx.fillText(tab.toUpperCase(), x + tabWidth / 2, tabY + 11);\n    });\n  }\n\n  renderTabContent(ctx, t) {\n    const contentY = 60;\n    const contentH = CFG.VIEW_H - contentY - 20;\n\n    // Clipping region for scrollable content\n    ctx.save();\n    ctx.beginPath();\n    ctx.rect(0, contentY, CFG.VIEW_W, contentH);\n    ctx.clip();\n\n    if (this.selectedTab === 'character') {\n      this.renderCharacterUpgrades(ctx, t, contentY);\n    } else if (this.selectedTab === 'train') {\n      this.renderTrainUpgrades(ctx, t, contentY);\n    } else if (this.selectedTab === 'skins') {\n      this.renderSkins(ctx, t, contentY);\n    }\n\n    ctx.restore();\n  }\n\n  renderCharacterUpgrades(ctx, t, startY) {\n    ctx.textAlign = 'left';\n    const categories = ['maxHP', 'attackDamage', 'attackSpeed', 'critChance', 'dodge', 'cooldownReduction'];\n    const itemWidth = CFG.VIEW_W / 2 - 6;\n    let y = startY - this.scrollOffset;\n\n    ctx.fillStyle = '#ff5a33';\n    ctx.font = 'bold 7px Arial';\n    ctx.fillText('CHARACTER UPGRADES', 10, startY + 12);\n    y += 20;\n\n    categories.forEach((cat) => {\n      const upgrades = COIN_SHOP.CHARACTER[cat];\n      if (!upgrades) return;\n\n      ctx.fillStyle = '#ffd700';\n      ctx.font = 'bold 6px Arial';\n      ctx.fillText(cat.toUpperCase(), 10, y);\n      y += 10;\n\n      upgrades.forEach((upgrade, idx) => {\n        const x = 10 + (idx % 2) * (itemWidth + 4);\n        const row = Math.floor(idx / 2);\n        const itemY = y + row * 28;\n\n        if (itemY < startY - 30 || itemY > startY + 250) return; // Culling\n\n        this.renderUpgradeCard(ctx, t, x, itemY, itemWidth, upgrade, cat);\n      });\n\n      y += Math.ceil(upgrades.length / 2) * 28 + 8;\n    });\n  }\n\n  renderTrainUpgrades(ctx, t, startY) {\n    ctx.textAlign = 'left';\n    const categories = ['hp', 'damage', 'fireRate', 'armour'];\n    const itemWidth = CFG.VIEW_W / 2 - 6;\n    let y = startY - this.scrollOffset;\n\n    ctx.fillStyle = '#ff5a33';\n    ctx.font = 'bold 7px Arial';\n    ctx.fillText('TRAIN UPGRADES', 10, startY + 12);\n    y += 20;\n\n    categories.forEach((cat) => {\n      const upgrades = COIN_SHOP.TRAIN[cat];\n      if (!upgrades) return;\n\n      ctx.fillStyle = '#ffd700';\n      ctx.font = 'bold 6px Arial';\n      ctx.fillText(cat.toUpperCase(), 10, y);\n      y += 10;\n\n      upgrades.forEach((upgrade, idx) => {\n        const x = 10 + (idx % 2) * (itemWidth + 4);\n        const row = Math.floor(idx / 2);\n        const itemY = y + row * 28;\n\n        if (itemY < startY - 30 || itemY > startY + 250) return;\n\n        this.renderUpgradeCard(ctx, t, x, itemY, itemWidth, upgrade, 'train' + cat.charAt(0).toUpperCase() + cat.slice(1));\n      });\n\n      y += Math.ceil(upgrades.length / 2) * 28 + 8;\n    });\n  }\n\n  renderSkins(ctx, t, startY) {\n    ctx.textAlign = 'left';\n    const types = ['character', 'train'];\n    let y = startY - this.scrollOffset;\n\n    ctx.fillStyle = '#ff5a33';\n    ctx.font = 'bold 7px Arial';\n    ctx.fillText('COSMETIC SKINS', 10, startY + 12);\n    y += 20;\n\n    types.forEach((type) => {\n      const skins = COIN_SHOP.SKINS[type];\n      if (!skins) return;\n\n      ctx.fillStyle = '#00d4ff';\n      ctx.font = 'bold 6px Arial';\n      ctx.fillText(`${type.toUpperCase()} SKINS`, 10, y);\n      y += 10;\n\n      skins.forEach((skin, idx) => {\n        const x = 10 + (idx % 2) * (CFG.VIEW_W / 2 - 6 + 4);\n        const row = Math.floor(idx / 2);\n        const itemY = y + row * 28;\n\n        if (itemY < startY - 30 || itemY > startY + 250) return;\n\n        this.renderSkinCard(ctx, t, x, itemY, CFG.VIEW_W / 2 - 6, skin);\n      });\n\n      y += Math.ceil(skins.length / 2) * 28 + 8;\n    });\n  }\n\n  renderUpgradeCard(ctx, t, x, y, w, upgrade, key) {\n    const owned = this.upgrades[key] || 0;\n    if (y > 55 && y < CFG.VIEW_H - 14) this._rects.push({ x, y, w, h: 24, upgrade, key, kind: 'upgrade' });\n    const canAfford = this.coins >= upgrade.cost;\n    const isMaxed = owned >= upgrade.level;\n\n    // Card background\n    if (isMaxed) {\n      ctx.fillStyle = '#1a0e3d';\n      ctx.globalAlpha = 0.5;\n    } else if (canAfford) {\n      ctx.fillStyle = '#2a1a5d';\n      ctx.globalAlpha = 0.9;\n    } else {\n      ctx.fillStyle = '#1a0a2d';\n      ctx.globalAlpha = 0.7;\n    }\n    ctx.fillRect(x, y, w, 24);\n    ctx.globalAlpha = 1.0;\n\n    // Border\n    ctx.strokeStyle = canAfford ? '#00d4ff' : '#6a5a8a';\n    ctx.lineWidth = 1;\n    ctx.strokeRect(x, y, w, 24);\n\n    // Content\n    ctx.fillStyle = isMaxed ? '#888888' : '#ffd700';\n    ctx.font = 'bold 5px Arial';\n    ctx.textAlign = 'left';\n    ctx.fillText(upgrade.label, x + 2, y + 6);\n\n    ctx.fillStyle = isMaxed ? '#666666' : '#b0b0ff';\n    ctx.font = '4px Arial';\n    ctx.fillText(upgrade.desc, x + 2, y + 12);\n\n    ctx.fillStyle = isMaxed ? '#00aa00' : canAfford ? '#00ff41' : '#ff3344';\n    ctx.font = 'bold 5px Arial';\n    ctx.textAlign = 'right';\n    if (isMaxed) {\n      ctx.fillText('MAXED', x + w - 2, y + 20);\n    } else {\n      ctx.fillText(`${upgrade.cost} COINS`, x + w - 2, y + 20);\n    }\n    ctx.textAlign = 'left';\n  }\n\n  renderSkinCard(ctx, t, x, y, w, skin) {\n    const owned = this.engine.save?.ownedSkins?.[skin.key] || false;\n    if (y > 55 && y < CFG.VIEW_H - 14) this._rects.push({ x, y, w, h: 24, skin, kind: 'skin' });\n    const canAfford = this.coins >= skin.cost;\n\n    // Card background\n    if (owned) {\n      ctx.fillStyle = '#1a3a1d';\n      ctx.globalAlpha = 0.6;\n    } else if (canAfford) {\n      ctx.fillStyle = '#3a2a1d';\n      ctx.globalAlpha = 0.9;\n    } else {\n      ctx.fillStyle = '#2a1a1d';\n      ctx.globalAlpha = 0.7;\n    }\n    ctx.fillRect(x, y, w, 24);\n    ctx.globalAlpha = 1.0;\n\n    // Border\n    ctx.strokeStyle = owned ? '#00ff41' : canAfford ? '#ffd700' : '#6a5a8a';\n    ctx.lineWidth = 1;\n    ctx.strokeRect(x, y, w, 24);\n\n    // Content\n    ctx.fillStyle = owned ? '#00ff41' : '#ffd700';\n    ctx.font = 'bold 5px Arial';\n    ctx.textAlign = 'left';\n    ctx.fillText(skin.label, x + 2, y + 6);\n\n    ctx.fillStyle = '#b0b0ff';\n    ctx.font = '4px Arial';\n    ctx.fillText(skin.desc, x + 2, y + 12);\n\n    ctx.fillStyle = owned ? '#00ff41' : canAfford ? '#00d4ff' : '#ff3344';\n    ctx.font = 'bold 5px Arial';\n    ctx.textAlign = 'right';\n    if (owned) {\n      ctx.fillText('OWNED', x + w - 2, y + 20);\n    } else {\n      ctx.fillText(`${skin.cost} COINS`, x + w - 2, y + 20);\n    }\n    ctx.textAlign = 'left';\n  }\n}\n","js/ui/mainmenu.js":"// ============================================================\n// HELL TRAIN — Professional Main Menu (Survivor.io Style)\n// Home screen with character selection, realm select, shop\n// ============================================================\nimport { CFG } from '../core/config.js';\nimport { CHAR_SKINS } from '../data/skins.js';\nimport { REALMS } from '../data/realms.js';\nimport { saveSave } from '../core/save.js';\n\nexport class MainMenuScene {\n  constructor(engine) {\n    this.engine = engine;\n    this.selectedCharacter = 0;\n    this.selectedRealm = 0;\n    this.characters = [\n      { id: 'conductor', name: 'The Conductor', desc: 'Balanced fighter', color: '#d69a5c', unlocked: true },\n      { id: 'shadow', name: 'Shadow Assassin', desc: 'High damage, low HP', color: '#4a3a6a', unlocked: true },\n      { id: 'guardian', name: 'Iron Guardian', desc: 'Tank, high HP', color: '#9c9cb8', unlocked: true },\n    ];\n    this.realms = [\n      { id: 'purgatory', name: 'Purgatory', desc: 'Starting realm', color: '#ff6a33', difficulty: 1, unlocked: true },\n      { id: 'infernal', name: 'Infernal Fields', desc: 'Fire & fury', color: '#ff4d26', difficulty: 2, unlocked: true },\n      { id: 'frozen', name: 'Frozen Realm', desc: 'Icy depths', color: '#a8d4f4', difficulty: 3, unlocked: false },\n      { id: 'void', name: 'The Void', desc: 'Reality bends', color: '#bc84f4', difficulty: 4, unlocked: false },\n    ];\n    this.showShop = false;\n    this.shopTab = 'upgrades';\n    this.animationTime = 0;\n    this.coins = 0;\n    this.stats = { runs: 0, kills: 0, bestScore: 0 };\n  }\n\n  enter(params = {}) {\n    const save = params.save || this.engine.save;\n    this.save = save;\n    // Character roster comes from the real skin list; you can pick anything you own.\n    this.characters = CHAR_SKINS.map(sk => ({\n      id: sk.id, name: sk.name, desc: sk.desc, color: sk.pal.glow,\n      unlocked: sk.cost === 0 || (save.ownedCharSkins || []).includes(sk.id),\n    }));\n    // Realms honour the actual unlock state from the save file.\n    const unlocked = save.unlockedRealms || ['purgatory'];\n    this.realms = REALMS.map(r => ({\n      id: r.id, name: r.name, desc: r.desc, color: r.accent,\n      difficulty: r.tier, unlocked: unlocked.includes(r.id),\n    }));\n    const ci = this.characters.findIndex(c => c.id === save.charSkin);\n    if (ci >= 0) this.selectedCharacter = ci;\n    this.selectedRealm = Math.max(0, this.realms.findIndex(r => r.unlocked));\n    this.coins = save.coins || 0;\n    this.stats = {\n      runs: this.engine.save?.stats?.totalRuns || 0,\n      kills: this.engine.save?.stats?.totalKills || 0,\n      bestScore: this.engine.save?.stats?.bestScore || 0,\n    };\n    this.animationTime = 0;\n  }\n\n  update(dt, t) {\n    this.animationTime += dt;\n    const input = this.engine.input;\n\n    if (this.showShop) {\n      if (input.wasPressed('Escape')) this.showShop = false;\n      if (input.wasPressed('KeyU')) this.shopTab = 'upgrades';\n      if (input.wasPressed('KeyS')) this.shopTab = 'skins';\n      return;\n    }\n\n    // Character selection\n    if (input.wasPressed('ArrowLeft')) {\n      this.selectedCharacter = (this.selectedCharacter - 1 + this.characters.length) % this.characters.length;\n    }\n    if (input.wasPressed('ArrowRight')) {\n      this.selectedCharacter = (this.selectedCharacter + 1) % this.characters.length;\n    }\n\n    // Realm selection\n    if (input.wasPressed('ArrowUp')) {\n      this.selectedRealm = Math.max(0, this.selectedRealm - 1);\n    }\n    if (input.wasPressed('ArrowDown')) {\n      this.selectedRealm = Math.min(this.realms.length - 1, this.selectedRealm + 1);\n    }\n\n    // Start game\n    if (input.wasPressed('Enter') || input.wasPressed('Space')) {\n      const realm = this.realms[this.selectedRealm];\n      const chr = this.characters[this.selectedCharacter];\n      if (realm.unlocked && chr.unlocked) {\n        const save = this.save || this.engine.save;\n        save.charSkin = chr.id;\n        saveSave(save);\n        this.engine.setScene('gameplay', {\n          save, realmId: realm.id, stage: 1,\n          difficulty: this.engine._difficulty || 'normal',\n        });\n      }\n    }\n\n    // Open shop\n    if (input.wasPressed('KeyC')) this.engine.setScene('shop', { save: this.save || this.engine.save, from: 'characterSelect' });\n    if (input.wasPressed('Escape') || input.wasPressed('Backspace')) this.engine.setScene('menu', { save: this.save || this.engine.save });\n    if (input.wasPressed('KeyL')) this.engine.setScene('leaderboards');\n    if (input.wasPressed('KeyA')) this.engine.setScene('achievements');\n    input.endFrame();\n  }\n\n  render(ctx, t) {\n    // Clear and background\n    ctx.fillStyle = '#0a0420';\n    ctx.fillRect(0, 0, CFG.VIEW_W, CFG.VIEW_H);\n\n    // Animated background particles\n    for (let i = 0; i < 5; i++) {\n      ctx.fillStyle = `rgba(255, 90, 51, ${0.03 + 0.02 * Math.sin(t * 0.3 + i)})`;\n      ctx.fillRect(0, (i * 60 + t * 15) % CFG.VIEW_H, CFG.VIEW_W, 60);\n    }\n\n    if (this.showShop) {\n      this.renderShop(ctx, t);\n    } else {\n      this.renderMainMenu(ctx, t);\n    }\n  }\n\n  renderMainMenu(ctx, t) {\n    // Title\n    ctx.fillStyle = '#ff5a33';\n    ctx.font = 'bold 14px Arial';\n    ctx.textAlign = 'center';\n    ctx.shadowColor = 'rgba(255, 90, 51, 0.5)';\n    ctx.shadowBlur = 10;\n    ctx.fillText('HELL TRAIN', CFG.VIEW_W / 2, 25);\n    ctx.shadowColor = 'transparent';\n\n    // Stats bar (top right)\n    this.renderStatsBar(ctx, t);\n\n    // Left panel: Character selection\n    this.renderCharacterPanel(ctx, t);\n\n    // Right panel: Realm selection\n    this.renderRealmPanel(ctx, t);\n\n    // Bottom panel: Info & controls\n    this.renderControlsPanel(ctx, t);\n\n    // Coin display\n    ctx.fillStyle = '#ffd700';\n    ctx.font = 'bold 8px Arial';\n    ctx.textAlign = 'left';\n    ctx.fillText(`COINS: ${this.coins}`, 10, CFG.VIEW_H - 30);\n\n    // Shop button\n    ctx.fillStyle = this.coins > 0 ? '#00d4ff' : '#666666';\n    ctx.strokeStyle = this.coins > 0 ? '#00d4ff' : '#666666';\n    ctx.lineWidth = 2;\n    ctx.fillRect(10, CFG.VIEW_H - 25, 40, 15);\n    ctx.strokeRect(10, CFG.VIEW_H - 25, 40, 15);\n    ctx.fillStyle = '#ffffff';\n    ctx.font = 'bold 6px Arial';\n    ctx.textAlign = 'center';\n    ctx.fillText('SHOP [C]', 30, CFG.VIEW_H - 14);\n  }\n\n  renderStatsBar(ctx, t) {\n    const x = CFG.VIEW_W - 140;\n    const y = 10;\n    const w = 130;\n    const h = 40;\n\n    // Background\n    ctx.fillStyle = 'rgba(26, 14, 61, 0.9)';\n    ctx.fillRect(x, y, w, h);\n    ctx.strokeStyle = '#00d4ff';\n    ctx.lineWidth = 2;\n    ctx.strokeRect(x, y, w, h);\n\n    // Stats text\n    ctx.fillStyle = '#ffd700';\n    ctx.font = 'bold 6px Arial';\n    ctx.textAlign = 'left';\n    ctx.fillText('STATS', x + 5, y + 10);\n\n    ctx.fillStyle = '#b0b0ff';\n    ctx.font = '5px monospace';\n    ctx.fillText(`Runs: ${this.stats.runs}`, x + 5, y + 20);\n    ctx.fillText(`Kills: ${this.stats.kills}`, x + 5, y + 30);\n    ctx.fillText(`Best: ${this.stats.bestScore}`, x + 5, y + 40);\n  }\n\n  renderCharacterPanel(ctx, t) {\n    const x = 10;\n    const y = 40;\n    const w = 100;\n    const h = CFG.VIEW_H - 120;\n\n    // Panel background\n    ctx.fillStyle = 'rgba(26, 14, 61, 0.95)';\n    ctx.fillRect(x, y, w, h);\n    ctx.strokeStyle = '#ff5a33';\n    ctx.lineWidth = 2;\n    ctx.strokeRect(x, y, w, h);\n\n    // Title\n    ctx.fillStyle = '#ff5a33';\n    ctx.font = 'bold 7px Arial';\n    ctx.textAlign = 'center';\n    ctx.fillText('CHARACTER', x + w / 2, y + 12);\n\n    // Character display\n    const charY = y + 30;\n    const cWin = 4;\n    const cStart = Math.max(0, Math.min(this.characters.length - cWin, this.selectedCharacter - 1));\n    this.characters.slice(cStart, cStart + cWin).forEach((char, i) => {\n      const idx = cStart + i;\n      const isSelected = idx === this.selectedCharacter;\n      const itemY = charY + i * 45;\n\n      // Background\n      ctx.fillStyle = isSelected ? '#ff5a33' : 'rgba(0, 0, 0, 0.3)';\n      ctx.fillRect(x + 2, itemY, w - 4, 40);\n\n      // Border\n      ctx.strokeStyle = isSelected ? '#ffd700' : '#666666';\n      ctx.lineWidth = 2;\n      ctx.strokeRect(x + 2, itemY, w - 4, 40);\n\n      // Character color indicator\n      ctx.fillStyle = char.color;\n      ctx.fillRect(x + 5, itemY + 3, 8, 8);\n\n      // Name\n      ctx.fillStyle = isSelected ? '#ffffff' : '#b0b0ff';\n      ctx.font = 'bold 6px Arial';\n      ctx.textAlign = 'left';\n      ctx.fillText(char.name, x + 16, itemY + 10);\n\n      // Description\n      ctx.fillStyle = '#8a8aa0';\n      ctx.font = '4px monospace';\n      ctx.fillText(char.desc, x + 16, itemY + 20);\n\n      // Lock indicator\n      if (!char.unlocked) {\n        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';\n        ctx.fillRect(x + 2, itemY, w - 4, 40);\n        ctx.fillStyle = '#ff3344';\n        ctx.font = 'bold 5px Arial';\n        ctx.textAlign = 'center';\n        ctx.fillText('LOCKED', x + w / 2, itemY + 20);\n      }\n    });\n  }\n\n  renderRealmPanel(ctx, t) {\n    const x = CFG.VIEW_W - 140;\n    const y = 55;\n    const w = 130;\n    const h = CFG.VIEW_H - 135;\n\n    // Panel background\n    ctx.fillStyle = 'rgba(26, 14, 61, 0.95)';\n    ctx.fillRect(x, y, w, h);\n    ctx.strokeStyle = '#00d4ff';\n    ctx.lineWidth = 2;\n    ctx.strokeRect(x, y, w, h);\n\n    // Title\n    ctx.fillStyle = '#00d4ff';\n    ctx.font = 'bold 7px Arial';\n    ctx.textAlign = 'center';\n    ctx.fillText('SELECT REALM', x + w / 2, y + 12);\n\n    // Realm display\n    const realmY = y + 20;\n    const rWin = 5;\n    const rStart = Math.max(0, Math.min(this.realms.length - rWin, this.selectedRealm - 2));\n    this.realms.slice(rStart, rStart + rWin).forEach((realm, i) => {\n      const idx = rStart + i;\n      const isSelected = idx === this.selectedRealm;\n      const itemY = realmY + i * 35;\n\n      // Background\n      ctx.fillStyle = isSelected ? realm.color : 'rgba(0, 0, 0, 0.3)';\n      ctx.globalAlpha = realm.unlocked ? 1.0 : 0.5;\n      ctx.fillRect(x + 2, itemY, w - 4, 30);\n      ctx.globalAlpha = 1.0;\n\n      // Border\n      ctx.strokeStyle = isSelected ? '#ffd700' : realm.unlocked ? realm.color : '#666666';\n      ctx.lineWidth = 2;\n      ctx.strokeRect(x + 2, itemY, w - 4, 30);\n\n      // Name\n      ctx.fillStyle = isSelected ? '#000000' : '#b0b0ff';\n      ctx.font = 'bold 6px Arial';\n      ctx.textAlign = 'left';\n      ctx.fillText(realm.name, x + 6, itemY + 10);\n\n      // Difficulty stars\n      ctx.fillStyle = isSelected ? '#000000' : '#ffd700';\n      for (let i = 0; i < realm.difficulty; i++) {\n        ctx.fillText('★', x + 6 + i * 8, itemY + 20);\n      }\n\n      // Lock\n      if (!realm.unlocked) {\n        ctx.fillStyle = '#ff3344';\n        ctx.font = 'bold 5px Arial';\n        ctx.textAlign = 'right';\n        ctx.fillText('🔒', x + w - 6, itemY + 15);\n      }\n    });\n  }\n\n  renderControlsPanel(ctx, t) {\n    const x = 115;\n    const y = CFG.VIEW_H - 60;\n    const w = CFG.VIEW_W - 260;\n\n    // Background\n    ctx.fillStyle = 'rgba(26, 14, 61, 0.9)';\n    ctx.fillRect(x, y, w, 50);\n    ctx.strokeStyle = '#ffd700';\n    ctx.lineWidth = 2;\n    ctx.strokeRect(x, y, w, 50);\n\n    // Instructions\n    ctx.fillStyle = '#ffd700';\n    ctx.font = 'bold 6px Arial';\n    ctx.textAlign = 'center';\n    ctx.fillText('READY TO FIGHT?', x + w / 2, y + 12);\n\n    ctx.fillStyle = '#b0b0ff';\n    ctx.font = '5px monospace';\n    ctx.fillText('[←→] Character | [↑↓] Realm | [ENTER] Start | [C] Shop | [L] Leaderboard', x + w / 2, y + 28);\n    ctx.fillText('[A] Achievements', x + w / 2, y + 40);\n  }\n\n  renderShop(ctx, t) {\n    // Title\n    ctx.fillStyle = '#ff5a33';\n    ctx.font = 'bold 12px Arial';\n    ctx.textAlign = 'center';\n    ctx.fillText('COIN SHOP', CFG.VIEW_W / 2, 25);\n\n    // Coin display\n    ctx.fillStyle = '#ffd700';\n    ctx.font = 'bold 8px Arial';\n    ctx.fillText(`Balance: ${this.coins} COINS`, CFG.VIEW_W / 2, 40);\n\n    // Tabs\n    const tabWidth = 80;\n    const tabX = CFG.VIEW_W / 2 - tabWidth - 10;\n\n    this.renderTab(ctx, tabX, 50, tabWidth, 'UPGRADES [U]', this.shopTab === 'upgrades');\n    this.renderTab(ctx, tabX + tabWidth + 20, 50, tabWidth, 'SKINS [S]', this.shopTab === 'skins');\n\n    // Content area (placeholder - integrate with actual shop)\n    ctx.fillStyle = 'rgba(26, 14, 61, 0.9)';\n    ctx.fillRect(10, 75, CFG.VIEW_W - 20, CFG.VIEW_H - 95);\n    ctx.strokeStyle = '#00d4ff';\n    ctx.lineWidth = 2;\n    ctx.strokeRect(10, 75, CFG.VIEW_W - 20, CFG.VIEW_H - 95);\n\n    ctx.fillStyle = '#b0b0ff';\n    ctx.font = '7px monospace';\n    ctx.textAlign = 'center';\n    if (this.shopTab === 'upgrades') {\n      ctx.fillText('PERMANENT UPGRADES COMING SOON', CFG.VIEW_W / 2, CFG.VIEW_H / 2 - 10);\n      ctx.font = '6px monospace';\n      ctx.fillText('Increase your stats permanently across all runs', CFG.VIEW_W / 2, CFG.VIEW_H / 2 + 10);\n    } else {\n      ctx.fillText('COSMETIC SKINS COMING SOON', CFG.VIEW_W / 2, CFG.VIEW_H / 2 - 10);\n      ctx.font = '6px monospace';\n      ctx.fillText('Customize your character and train appearance', CFG.VIEW_W / 2, CFG.VIEW_H / 2 + 10);\n    }\n\n    // Back button\n    ctx.fillStyle = '#ff5a33';\n    ctx.fillRect(CFG.VIEW_W / 2 - 30, CFG.VIEW_H - 25, 60, 15);\n    ctx.strokeStyle = '#ffd700';\n    ctx.lineWidth = 2;\n    ctx.strokeRect(CFG.VIEW_W / 2 - 30, CFG.VIEW_H - 25, 60, 15);\n    ctx.fillStyle = '#ffffff';\n    ctx.font = 'bold 6px Arial';\n    ctx.textAlign = 'center';\n    ctx.fillText('BACK [ESC]', CFG.VIEW_W / 2, CFG.VIEW_H - 14);\n  }\n\n  renderTab(ctx, x, y, w, label, isActive) {\n    ctx.fillStyle = isActive ? '#ff5a33' : '#1a0e3d';\n    ctx.fillRect(x, y, w, 18);\n    ctx.strokeStyle = isActive ? '#ffd700' : '#00d4ff';\n    ctx.lineWidth = 2;\n    ctx.strokeRect(x, y, w, 18);\n\n    ctx.fillStyle = isActive ? '#ffffff' : '#b0b0ff';\n    ctx.font = 'bold 6px Arial';\n    ctx.textAlign = 'center';\n    ctx.fillText(label, x + w / 2, y + 12);\n  }\n}\n","js/ui/home.js":"// ============================================================\n// HELL TRAIN — HOME\n// A portrait, mobile-game front end: chunky outlined tiles, an\n// isometric stage diorama, one big Start button and a raised\n// Battle tab. Drawn straight to the output canvas — no scanlines,\n// no bloom, no aberration. Menus are clean; only the run is dirty.\n// ============================================================\nimport { CFG } from '../core/config.js';\nimport { TAU, fmtTime, fmtNum } from '../core/utils.js';\nimport { REALMS } from '../data/realms.js';\nimport { saveSave } from '../core/save.js';\nimport { ICONS } from '../data/icons.js';\n\n// Portrait phone canvas (9:16). Restored to CFG.VIEW_W/H on exit.\nconst W = 270, H = 480;\n\nconst ENERGY_COST = 5;\nconst ENERGY_MAX = 30;\nconst ENERGY_REGEN_SECONDS = 20;\n\n// ---- palette lifted from the reference look ----\nconst INK = '#241318';          // universal dark outline\nconst PANEL = '#2b2230';        // panel body\nconst PANEL_HI = '#3d3242';\nconst GOLD = '#ffc63c';\nconst GOLD_D = '#c07a12';\nconst RED = '#e8352a';\nconst RED_D = '#9c1208';\nconst GREEN = '#4ec53c';\nconst GREEN_D = '#2a7a20';\n\n// Hand-picked diorama palettes — deriving these from realm.accent alone made\n// every island grey. Each realm gets a readable, saturated little world.\nconst DIORAMA = {\n  purgatory: { a: '#7d8a6b', b: '#6b7a5b', side: '#4a4a3e', leaf: '#5f8f4a', bld: '#8e8ea6' },\n  infernal:  { a: '#9a5236', b: '#84422a', side: '#4a2416', leaf: '#8a6a2a', bld: '#a8705a' },\n  forgotten: { a: '#8286a0', b: '#70748e', side: '#3e4054', leaf: '#4a7a6a', bld: '#9aa0be' },\n  forest:    { a: '#5fa84c', b: '#4e9040', side: '#2c4a24', leaf: '#3f8a34', bld: '#7a8e6a' },\n  frozen:    { a: '#d6e9f6', b: '#bcd6ea', side: '#5e7e9c', leaf: '#6fa8b8', bld: '#a8c2da' },\n  desert:    { a: '#dcb474', b: '#c69c5c', side: '#7a5a2e', leaf: '#8aa84a', bld: '#c8a878' },\n  void:      { a: '#7a56ac', b: '#664496', side: '#33205a', leaf: '#a06ad0', bld: '#8e74c4' },\n  terminus:  { a: '#b8a878', b: '#a09062', side: '#5a4e30', leaf: '#8a9a5a', bld: '#c8b884' },\n};\nconst dio = (id) => DIORAMA[id] || DIORAMA.purgatory;\n\n// Bottom rail — the five places you go most.\nconst TABS = [\n  { id: 'train', label: 'Train', icon: 'train', scene: 'trainBase' },\n  { id: 'arsenal', label: 'Arsenal', icon: 'arsenal', scene: 'arsenal' },\n  { id: 'battle', label: 'Battle', icon: 'battle', scene: null },\n  { id: 'forge', label: 'Forge', icon: 'forge', scene: 'shop' },\n  { id: 'coins', label: 'Shop', icon: 'coinshop', scene: 'coinShop' },\n];\n\n// Everything the old fourteen-button wall used to hold, as icons.\n// Left column = things that reward you, right column = places and options.\nconst RAIL_L = [\n  { key: 'trophy', icon: 'trophy', scene: 'achievements', tip: 'Awards', badge: 1 },\n  { key: 'gift', icon: 'gift', scene: 'weeklyChallenge', tip: 'Weekly' },\n  { key: 'daily', icon: 'daily', scene: 'dailyRun', tip: 'Daily', badge: 1 },\n  { key: 'board', icon: 'leaderboard', scene: 'leaderboards', tip: 'Ranks' },\n];\nconst RAIL_R = [\n  { key: 'map', icon: 'worldmap', scene: 'worldMap', tip: 'Map' },\n  { key: 'armoury', icon: 'armoury', scene: 'armoury', tip: 'Armour' },\n  { key: 'relics', icon: 'relics', scene: 'relics', tip: 'Relics' },\n  { key: 'settings', icon: 'settings', scene: 'settings', tip: 'Options' },\n];\n\nexport class HomeScene {\n  constructor(engine) {\n    this.engine = engine;\n    this.input = engine.input;\n    this.t = 0;\n    this.tab = 2;\n    this.realmIndex = 0;\n    this.toast = null;\n    this.hover = null;\n    this._press = null;\n    this.embers = [];\n    for (let i = 0; i < 40; i++) {\n      this.embers.push({\n        x: Math.random() * W, y: Math.random() * H,\n        s: 0.35 + Math.random() * 0.9, w: Math.random() < 0.3 ? 2 : 1,\n        drift: Math.random() * TAU,\n      });\n    }\n  }\n\n  // ------------------------------------------------------------\n  enter(params = {}) {\n    this.save = params.save || this.engine.save;\n    this.art = this.engine.sprites;\n    // Optional-call: if an older engine.js is somehow cached, the portrait\n    // layout degrades instead of taking the whole boot down with it.\n    this.engine.setResolution?.(W, H);\n    this.t = 0;\n    this.tab = 2;\n    this.toast = null;\n    this._regenEnergy();\n    const unlocked = this.save.unlockedRealms || ['purgatory'];\n    const last = this.save.lastRealm || unlocked[unlocked.length - 1];\n    const i = REALMS.findIndex(r => r.id === last);\n    this.realmIndex = i >= 0 ? i : 0;\n  }\n  exit() {\n    saveSave(this.save);\n    this.engine.resetResolution?.();\n  }\n\n  _regenEnergy() {\n    const s = this.save;\n    if (s.energy === undefined) { s.energy = ENERGY_MAX; s.energyAt = Date.now(); }\n    const now = Date.now();\n    const gained = Math.floor(Math.max(0, (now - (s.energyAt || now)) / 1000) / ENERGY_REGEN_SECONDS);\n    if (gained > 0 && s.energy < ENERGY_MAX) { s.energy = Math.min(ENERGY_MAX, s.energy + gained); s.energyAt = now; }\n    else if (s.energy >= ENERGY_MAX) s.energyAt = now;\n  }\n\n  get realm() { return REALMS[this.realmIndex] || REALMS[0]; }\n  get realmUnlocked() { return (this.save.unlockedRealms || ['purgatory']).includes(this.realm.id); }\n\n  // ------------------------------------------------------------\n  // LAYOUT — single source of truth for hit tests and drawing\n  // ------------------------------------------------------------\n  layout() {\n    const cardW = 186, cardH = 172;\n    const cardX = Math.round((W - cardW) / 2), cardY = 128;\n    const navY = H - 44;\n    const L = {\n      profile: { x: 3, y: 6, w: 96, h: 22 },\n      energy: { x: 101, y: 6, w: 54, h: 22 },\n      coins: { x: 157, y: 6, w: 54, h: 22 },\n      shards: { x: 213, y: 6, w: 54, h: 22 },\n      card: { x: cardX, y: cardY, w: cardW, h: cardH },\n      prev: { x: cardX + 2, y: cardY + cardH / 2 - 16, w: 20, h: 32 },\n      next: { x: cardX + cardW - 22, y: cardY + cardH / 2 - 16, w: 20, h: 32 },\n      quick: { x: Math.round(W / 2 - 74), y: 312, w: 34, h: 34 },\n      slot: { x: Math.round(W / 2 - 20), y: 308, w: 40, h: 40 },\n      bag: { x: Math.round(W / 2 + 40), y: 312, w: 34, h: 34 },\n      start: { x: Math.round(W / 2 - 88), y: 358, w: 176, h: 52 },\n      tabs: TABS.map((t, i) => {\n        const tw = W / TABS.length;\n        const centre = i === 2;\n        return {\n          ...t, i,\n          x: Math.round(i * tw), w: Math.round(tw),\n          y: centre ? navY - 16 : navY,\n          h: centre ? 60 : 44,\n          centre,\n        };\n      }),\n    };\n    // side rails, laid out from a single step so they always line up\n    RAIL_L.forEach((b, i) => { L[b.key] = { x: 5, y: 38 + i * 44, w: 32, h: 32 }; });\n    RAIL_R.forEach((b, i) => { L[b.key] = { x: W - 37, y: 38 + i * 44, w: 32, h: 32 }; });\n    return L;\n  }\n\n  // ------------------------------------------------------------\n  update(dt) {\n    this.t += dt;\n    const inp = this.input;\n    const L = this.layout();\n    const m = inp.mouse;\n    if (this.toast) { this.toast.t -= dt; if (this.toast.t <= 0) this.toast = null; }\n    if ((this.t | 0) % 5 === 0) this._regenEnergy();\n\n    const hit = (r) => r && m.x >= r.x && m.x <= r.x + r.w && m.y >= r.y && m.y <= r.y + r.h;\n    this.hover = null;\n    for (const [name, r] of Object.entries(L)) {\n      if (name === 'tabs') continue;\n      if (hit(r)) this.hover = name;\n    }\n    for (const tb of L.tabs) if (hit(tb)) this.hover = 'tab' + tb.i;\n\n    if (inp.wasPressed('ArrowLeft') || inp.wasPressed('KeyA')) this._cycleRealm(-1);\n    if (inp.wasPressed('ArrowRight') || inp.wasPressed('KeyD')) this._cycleRealm(1);\n    if (inp.wasPressed('Enter') || inp.wasPressed('Space')) this._start();\n\n    if (m.justDown) {\n      this._press = this.hover;\n      if (hit(L.prev)) this._cycleRealm(-1);\n      else if (hit(L.next)) this._cycleRealm(1);\n      else if (hit(L.start) || hit(L.card)) this._start();\n      else if (hit(L.quick)) this._start(true);\n      else if (hit(L.bag) || hit(L.slot)) this.engine.setScene('arsenal', { save: this.save });\n      else if (hit(L.coins) || hit(L.shards)) this.engine.setScene('shop', { save: this.save });\n      else if (hit(L.energy)) this._say('+1 ENERGY / ' + ENERGY_REGEN_SECONDS + 's', '#8ef07a');\n      else if (this._railHit(L, hit)) { /* handled */ }\n      else {\n        for (const tb of L.tabs) {\n          if (!hit(tb)) continue;\n          this.tab = tb.i;\n          if (tb.scene) this.engine.setScene(tb.scene, { save: this.save, from: 'menu' });\n          else this._start();\n          break;\n        }\n      }\n    }\n    if (!m.down) this._press = null;\n    inp.endFrame();\n  }\n\n  _railHit(L, hit) {\n    for (const b of [...RAIL_L, ...RAIL_R]) {\n      if (!hit(L[b.key])) continue;\n      this.engine.setScene(b.scene, { save: this.save, from: 'menu' });\n      return true;\n    }\n    return false;\n  }\n\n  _cycleRealm(d) { this.realmIndex = (this.realmIndex + d + REALMS.length) % REALMS.length; }\n  _say(msg, color = GOLD) { this.toast = { msg, color, t: 2 }; }\n\n  _start(quick = false) {\n    if (quick) {\n      const un = this.save.unlockedRealms || ['purgatory'];\n      const i = REALMS.findIndex(r => r.id === un[un.length - 1]);\n      if (i >= 0) this.realmIndex = i;\n    }\n    if (!this.realmUnlocked) return this._say('CLEAR THE PREVIOUS REALM', '#ff7a6a');\n    this._regenEnergy();\n    if ((this.save.energy || 0) < ENERGY_COST) return this._say('NOT ENOUGH ENERGY', '#ff7a6a');\n    this.save.energy -= ENERGY_COST;\n    this.save.lastRealm = this.realm.id;\n    saveSave(this.save);\n    this.engine.setScene('gameplay', {\n      save: this.save, realmId: this.realm.id, stage: 1,\n      difficulty: this.engine._difficulty || 'normal',\n    });\n  }\n\n  // ============================================================\n  // RENDER\n  // ============================================================\n  render(ctx) {\n    ctx.imageSmoothingEnabled = false;\n    const L = this.layout();\n    this._lavaBackground(ctx);\n    this._topBar(ctx, L);\n    this._sideRails(ctx, L);\n    this._stage(ctx, L);\n    this._slot(ctx, L);\n    this._startButton(ctx, L);\n    this._navBar(ctx, L);\n    // build stamp — makes a stale cached build obvious at a glance\n    ctx.globalAlpha = 0.5;\n    label(ctx, 'v' + CFG.VERSION + '  ' + (CFG.BUILD || ''), W / 2, H - 50, '#ffe6c8', 6);\n    ctx.globalAlpha = 1;\n    if (this.toast) {\n      ctx.globalAlpha = Math.min(1, this.toast.t * 2);\n      tile(ctx, W / 2 - 92, 356, 184, 16, 6, { fill: 'rgba(20,10,14,0.9)', outline: this.toast.color, lift: 0 });\n      label(ctx, this.toast.msg, W / 2, 367, this.toast.color, 8);\n      ctx.globalAlpha = 1;\n    }\n  }\n\n  // ---- molten background ----\n  _lavaBackground(ctx) {\n    const g = ctx.createLinearGradient(0, 0, 0, H);\n    g.addColorStop(0, '#c9341c');\n    g.addColorStop(0.28, '#e8511c');\n    g.addColorStop(0.58, '#f4761d');\n    g.addColorStop(0.85, '#ff9c28');\n    g.addColorStop(1, '#ffc24a');\n    ctx.fillStyle = g;\n    ctx.fillRect(0, 0, W, H);\n\n    // slow molten currents\n    ctx.save();\n    for (let i = 0; i < 6; i++) {\n      const y0 = 60 + i * 68;\n      const amp = 10 + i * 2;\n      const ph = this.t * (0.18 + i * 0.04) + i;\n      ctx.beginPath();\n      ctx.moveTo(-10, y0);\n      for (let x = -10; x <= W + 10; x += 12) {\n        ctx.lineTo(x, y0 + Math.sin(x * 0.032 + ph) * amp);\n      }\n      ctx.lineTo(W + 10, y0 + 26);\n      for (let x = W + 10; x >= -10; x -= 12) {\n        ctx.lineTo(x, y0 + 26 + Math.sin(x * 0.028 + ph * 1.2) * amp);\n      }\n      ctx.closePath();\n      ctx.fillStyle = i % 2 ? 'rgba(255,196,74,0.16)' : 'rgba(176,38,14,0.20)';\n      ctx.fill();\n    }\n    ctx.restore();\n\n    // bright pools of molten rock\n    for (let i = 0; i < 4; i++) {\n      const cx = W * (0.15 + 0.24 * i) + Math.sin(this.t * 0.35 + i * 2) * 12;\n      const cy = 150 + i * 90;\n      const rg = ctx.createRadialGradient(cx, cy, 2, cx, cy, 74);\n      rg.addColorStop(0, 'rgba(255,232,150,0.30)');\n      rg.addColorStop(1, 'rgba(255,140,40,0)');\n      ctx.fillStyle = rg;\n      ctx.fillRect(cx - 76, cy - 76, 152, 152);\n    }\n\n    // dark cooled crust blobs\n    ctx.fillStyle = 'rgba(120,26,10,0.30)';\n    for (let i = 0; i < 7; i++) {\n      const bx = ((i * 97) % (W - 30)) + 12;\n      const by = 70 + ((i * 143) % (H - 160));\n      const bw = 16 + (i % 3) * 10;\n      blob(ctx, bx, by + Math.sin(this.t * 0.5 + i) * 2, bw, 8 + (i % 2) * 4);\n    }\n\n    for (const e of this.embers) {\n      e.y -= (9 + e.s * 20) / 60;\n      e.x += Math.sin(this.t * 0.9 + e.drift) * 0.2;\n      if (e.y < -3) { e.y = H + 3; e.x = Math.random() * W; }\n      ctx.fillStyle = `rgba(255,${190 + Math.floor(e.s * 60)},110,${(0.25 + e.s * 0.5).toFixed(2)})`;\n      ctx.fillRect(e.x | 0, e.y | 0, e.w, e.w);\n    }\n\n    // top scrim so the HUD always reads over the lava\n    const tg = ctx.createLinearGradient(0, 0, 0, 40);\n    tg.addColorStop(0, 'rgba(60,10,10,0.45)');\n    tg.addColorStop(1, 'rgba(60,10,10,0)');\n    ctx.fillStyle = tg;\n    ctx.fillRect(0, 0, W, 40);\n  }\n\n  // ---- top bar: profile + resource chips ----\n  _topBar(ctx, L) {\n    const s = this.save;\n    const p = L.profile;\n    tile(ctx, p.x, p.y, p.w, p.h, 11, { fill: PANEL, fill2: '#1d1622', outline: INK, lift: 2 });\n\n    // avatar disc\n    ctx.save();\n    ctx.beginPath(); ctx.arc(p.x + 11, p.y + 11, 9, 0, TAU);\n    ctx.fillStyle = '#f0b040'; ctx.fill();\n    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();\n    ctx.clip();\n    try {\n      const portrait = this.art.getCharSet(s.charSkin || 'conductor').portrait;\n      ctx.drawImage(portrait, p.x + 11 - 12, p.y + 11 - 11, 24, 24);\n    } catch {}\n    ctx.restore();\n\n    const tag = String(s.playerId || 'HELLTRAIN').replace(/[^a-z0-9]/gi, '').toUpperCase().padEnd(8, 'X').slice(0, 8);\n    label(ctx, 'Player ' + tag, p.x + 22, p.y + 15, '#ffffff', 6, 'left');\n\n    // level chip hanging off the avatar\n    const lvl = Math.max(1, Math.floor((s.stats?.totalRuns || 0) / 3) + 1);\n    tile(ctx, p.x + 4, p.y + p.h - 7, 16, 11, 4, { fill: '#4a3a2a', outline: INK, lift: 0 });\n    label(ctx, String(lvl), p.x + 12, p.y + p.h + 2, GOLD, 8);\n\n    this._chip(ctx, L.energy, 'energy', (s.energy ?? ENERGY_MAX) + '/' + ENERGY_MAX, '#6ef04a');\n    this._chip(ctx, L.coins, 'coin', fmtNum(s.coins || 0), GOLD);\n    this._chip(ctx, L.shards, 'shard', fmtNum(s.shards || 0), '#4ae0d0');\n  }\n\n  _chip(ctx, r, kind, value, color) {\n    tile(ctx, r.x, r.y, r.w, r.h, 11, { fill: PANEL, fill2: '#1d1622', outline: INK, lift: 2 });\n    label(ctx, value, r.x + 15, r.y + 15, '#ffffff', value.length > 4 ? 6 : value.length > 3 ? 7 : 8, 'left');\n    // icon overhangs the left edge, like the reference\n    icon(ctx, kind, r.x - 3, r.y + 1, 19, color, this.t);\n    // green plus button on the right edge\n    const px = r.x + r.w - 9;\n    tile(ctx, px - 7, r.y + 3, 15, 15, 5, { fill: GREEN, fill2: GREEN_D, outline: INK, lift: 1 });\n    ctx.fillStyle = '#ffffff';\n    ctx.fillRect(px - 4, r.y + 9, 9, 3);\n    ctx.fillRect(px - 1, r.y + 6, 3, 9);\n  }\n\n  // ---- floating side rails ----\n  _sideRails(ctx, L) {\n    for (const b of [...RAIL_L, ...RAIL_R]) this._railBtn(ctx, L[b.key], b);\n  }\n  _railBtn(ctx, r, b) {\n    const down = this._press === b.key;\n    const y = r.y + (down ? 2 : 0);\n    tile(ctx, r.x, y, r.w, r.h, 9, {\n      fill: this.hover === b.key ? PANEL_HI : PANEL, fill2: '#1d1622',\n      outline: INK, lift: down ? 1 : 3,\n    });\n    glyph(ctx, b.icon, r.x + 3, y + 1, 26, '#ffd6a0', this.t);\n    label(ctx, b.tip, r.x + r.w / 2, y + r.h + 8, '#ffe4bc', 6);\n    if (b.badge) {\n      ctx.beginPath(); ctx.arc(r.x + r.w - 2, y + 2, 6, 0, TAU);\n      ctx.fillStyle = '#e0202a'; ctx.fill();\n      ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();\n      label(ctx, String(b.badge), r.x + r.w - 2, y + 5, '#ffffff', 8);\n    }\n  }\n\n  // ---- title + isometric stage card ----\n  _stage(ctx, L) {\n    const realm = this.realm;\n    const c = L.card;\n\n    // Realm names vary a lot in length (\"The Infernal Fields\"), so the title\n    // shrinks to fit the gap between the two side rails instead of colliding.\n    const title = (this.realmIndex + 1) + '. ' + realm.name;\n    let size = 19;\n    while (size > 10) {\n      ctx.font = 'bold ' + size + 'px monospace';\n      if (ctx.measureText(title).width <= 176) break;\n      size -= 1;\n    }\n    outline(ctx, title, W / 2, 106, '#ffffff', '#8a1c0c', size);\n    outline(ctx, 'Longest Survived: ' + fmtTime(this.save.stats?.longestRun || 0),\n      W / 2, 122, '#ffe9c0', '#7a2408', 9);\n\n    tile(ctx, c.x, c.y, c.w, c.h, 12, { fill: '#20182c', fill2: '#140e1e', outline: INK, lift: 4 });\n    // little pointer tab under the card\n    ctx.beginPath();\n    ctx.moveTo(W / 2 - 9, c.y + c.h - 2);\n    ctx.lineTo(W / 2 + 9, c.y + c.h - 2);\n    ctx.lineTo(W / 2, c.y + c.h + 8);\n    ctx.closePath();\n    ctx.fillStyle = '#20182c'; ctx.fill();\n    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();\n\n    ctx.save();\n    clipRound(ctx, c.x + 2, c.y + 2, c.w - 4, c.h - 4, 10);\n    this._diorama(ctx, c, realm);\n    ctx.restore();\n\n    if (!this.realmUnlocked) {\n      ctx.save();\n      clipRound(ctx, c.x + 2, c.y + 2, c.w - 4, c.h - 4, 10);\n      ctx.fillStyle = 'rgba(10,6,14,0.7)';\n      ctx.fillRect(c.x, c.y, c.w, c.h);\n      ctx.restore();\n      icon(ctx, 'lock', W / 2 - 16, c.y + c.h / 2 - 24, 32, GOLD, this.t);   // always vector\n      outline(ctx, 'LOCKED', W / 2, c.y + c.h / 2 + 22, '#ffffff', '#5a1a08', 13);\n    }\n\n    this._chevron(ctx, L.prev, -1);\n    this._chevron(ctx, L.next, 1);\n  }\n\n  _chevron(ctx, r, dir) {\n    tile(ctx, r.x, r.y, r.w, r.h, 8, { fill: 'rgba(20,12,18,0.7)', outline: 'rgba(255,220,160,0.55)', lift: 0 });\n    ctx.fillStyle = '#ffe0a0';\n    const cx = r.x + r.w / 2 + dir, cy = r.y + r.h / 2;\n    ctx.beginPath();\n    ctx.moveTo(cx + dir * 4, cy);\n    ctx.lineTo(cx - dir * 3, cy - 6);\n    ctx.lineTo(cx - dir * 3, cy + 6);\n    ctx.closePath(); ctx.fill();\n  }\n\n  // ============================================================\n  // THE DIORAMA — a little isometric island for the chosen realm\n  // ============================================================\n  _diorama(ctx, c, realm) {\n    const t = this.t;\n    const D = dio(realm.id);\n    // sky behind the island\n    const sg = ctx.createLinearGradient(0, c.y, 0, c.y + c.h);\n    sg.addColorStop(0, realm.sky);\n    sg.addColorStop(1, shade(realm.accent, -0.25));\n    ctx.fillStyle = sg;\n    ctx.fillRect(c.x, c.y, c.w, c.h);\n    for (let i = 0; i < 18; i++) {\n      const x = c.x + ((i * 61) % (c.w - 6)) + 3;\n      const y = c.y + ((i * 37) % 40) + 4;\n      ctx.fillStyle = `rgba(255,255,255,${(0.12 + 0.22 * Math.abs(Math.sin(t + i))).toFixed(2)})`;\n      ctx.fillRect(x, y, 1, 1);\n    }\n\n    // ---- isometric grid ----\n    const N = 8, TW = 22, TH = 11;\n    const ox = c.x + c.w / 2;\n    const oy = c.y + 66 + Math.sin(t * 0.8) * 1.5;     // gentle float\n    const P = (tx, ty) => [ox + (tx - ty) * TW / 2, oy + (tx + ty) * TH / 2];\n    const inside = (tx, ty) => tx >= 0 && ty >= 0 && tx < N && ty < N;\n\n    // island underside (extruded rock)\n    const depth = 16;\n    const [lx, ly] = P(0, N), [rx, ry] = P(N, 0);\n    const ty0 = P(0, 0)[1], by0 = P(N, N)[1];\n    ctx.beginPath();\n    ctx.moveTo(lx, ly);\n    ctx.lineTo(ox, by0);\n    ctx.lineTo(rx, ry);\n    ctx.lineTo(rx, ry + depth);\n    ctx.lineTo(ox, by0 + depth + 6);\n    ctx.lineTo(lx, ly + depth);\n    ctx.closePath();\n    ctx.fillStyle = D.side;\n    ctx.fill();\n    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();\n\n    // top faces\n    const road = (tx, ty) => ty === 4;\n    const path = (tx, ty) => tx === 3 && ty < 4;\n    for (let ty = 0; ty < N; ty++) {\n      for (let tx = 0; tx < N; tx++) {\n        const [x, y] = P(tx, ty);\n        let col;\n        if (road(tx, ty)) col = ((tx + ty) & 1) ? '#5a5666' : '#4e4a5a';\n        else if (path(tx, ty)) col = ((tx + ty) & 1) ? '#c4bec8' : '#b2acb8';\n        else col = ((tx + ty) & 1) ? D.a : D.b;\n        ctx.beginPath();\n        ctx.moveTo(x, y);\n        ctx.lineTo(x + TW / 2, y + TH / 2);\n        ctx.lineTo(x, y + TH);\n        ctx.lineTo(x - TW / 2, y + TH / 2);\n        ctx.closePath();\n        ctx.fillStyle = col;\n        ctx.fill();\n      }\n    }\n    // road markings\n    for (let tx = 0; tx < N; tx++) {\n      if (tx % 2) continue;\n      const [x, y] = P(tx + 0.5, 4.5);\n      ctx.fillStyle = 'rgba(255,225,120,0.85)';\n      ctx.beginPath();\n      ctx.moveTo(x, y - 2); ctx.lineTo(x + 5, y + 0.5);\n      ctx.lineTo(x, y + 3); ctx.lineTo(x - 5, y + 0.5);\n      ctx.closePath(); ctx.fill();\n    }\n    // island rim highlight\n    ctx.beginPath();\n    ctx.moveTo(lx, ly);\n    ctx.lineTo(ox, ty0);\n    ctx.lineTo(rx, ry);\n    ctx.strokeStyle = 'rgba(255,255,255,0.20)';\n    ctx.lineWidth = 2; ctx.stroke();\n\n    // ---- props, painted back-to-front so overlaps are correct ----\n    const props = [\n      { tx: 0.7, ty: 0.7, kind: 'tower', h: 34, w: 26 },\n      { tx: 2.6, ty: 0.5, kind: 'tower', h: 46, w: 22 },\n      { tx: 5.4, ty: 0.7, kind: 'tower', h: 28, w: 24 },\n      { tx: 7.0, ty: 1.8, kind: 'tree' },\n      { tx: 0.9, ty: 2.6, kind: 'shop' },\n      { tx: 6.6, ty: 3.3, kind: 'tree' },\n      { tx: 0.5, ty: 5.8, kind: 'rock' },\n      { tx: 6.2, ty: 6.2, kind: 'tree' },\n      { tx: 2.4, ty: 6.6, kind: 'rock' },\n    ];\n    props.sort((a, b) => (a.tx + a.ty) - (b.tx + b.ty));\n    for (const pr of props) {\n      const [x, y] = P(pr.tx, pr.ty);\n      if (pr.kind === 'tower') this._isoTower(ctx, x, y, pr.w, pr.h, D, t);\n      else if (pr.kind === 'tree') this._isoTree(ctx, x, y, D, t);\n      else if (pr.kind === 'shop') this._isoShop(ctx, x, y, t);\n      else this._isoRock(ctx, x, y, D);\n    }\n\n    // the train, running the road\n    try {\n      const set = this.art.getTrainSet(this.save.trainSkin || 'iron_horse');\n      const f = Math.floor(t * 9) % set.engine.length;\n      const span = ((t * 0.55) % 1.6) - 0.3;          // in tile units along the road\n      const [rxp, ryp] = P(span * N, 4.5);\n      const eng = set.engine[f];\n      const ew = Math.round(eng.width / 2), eh = Math.round(eng.height / 2);\n      ctx.save();\n      ctx.globalAlpha = 0.35;\n      ctx.fillStyle = '#000';\n      ctx.beginPath(); ctx.ellipse(rxp, ryp + 3, ew * 0.45, 4, 0, 0, TAU); ctx.fill();\n      ctx.restore();\n      ctx.drawImage(eng, Math.round(rxp - ew / 2), Math.round(ryp - eh + 4), ew, eh);\n    } catch {}\n\n    // the player, waiting on the path\n    try {\n      const cs = this.art.getCharSet(this.save.charSkin || 'conductor');\n      const idle = cs.down.idle;\n      const fr = idle[Math.floor(t * 6) % idle.length];\n      const [px, py] = P(3.5, 2.2);\n      ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = '#000';\n      ctx.beginPath(); ctx.ellipse(px, py + 4, 8, 3, 0, 0, TAU); ctx.fill(); ctx.restore();\n      ctx.drawImage(fr, Math.round(px - fr.width / 2), Math.round(py - fr.height + 6));\n    } catch {}\n\n    // a local hostile shambling about\n    try {\n      const frames = this.art.anim['ghost_' + realm.id] || this.art.anim.ghost;\n      if (frames) {\n        const fr = frames[Math.floor(t * 7) % frames.length];\n        const [ex, ey] = P(5.2, 5.4 + Math.sin(t * 0.7) * 0.5);\n        ctx.drawImage(fr, Math.round(ex - fr.width / 2), Math.round(ey - fr.height + 6));\n      }\n    } catch {}\n\n    // sparkle, like the reference\n    const sp = (Math.sin(t * 2.4) + 1) / 2;\n    star(ctx, c.x + 34, c.y + 52, 4 + sp * 3, `rgba(255,230,120,${(0.5 + sp * 0.5).toFixed(2)})`);\n  }\n\n  _isoTower(ctx, x, y, w, h, D, t) {\n    const body = D.bld;\n    isoBox(ctx, x, y, w, h, shade(body, 0.35), body, shade(body, -0.25));\n    // windows on the two visible faces\n    for (let r = 0; r < Math.floor((h - 10) / 9); r++) {\n      for (let cIdx = 0; cIdx < 2; cIdx++) {\n        const lit = ((r * 7 + cIdx * 13 + Math.floor(x)) % 5) < 2 && Math.sin(t * 2 + r + cIdx) > -0.9;\n        const col = lit ? 'rgba(255,220,130,0.9)' : 'rgba(20,16,30,0.6)';\n        const wy = y - h + 12 + r * 9;\n        ctx.fillStyle = col;\n        ctx.fillRect(Math.round(x - w / 2 + 4 + cIdx * 6), Math.round(wy + (cIdx * 3)), 4, 5);\n        ctx.fillRect(Math.round(x + 2 + cIdx * 6), Math.round(wy + 6 - cIdx * 3), 4, 5);\n      }\n    }\n  }\n\n  _isoShop(ctx, x, y, t) {\n    isoBox(ctx, x, y, 30, 22, '#e8e4dc', '#cfc8bd', '#a89f94');\n    // striped awning\n    const ay = y - 22 + 12;\n    for (let i = 0; i < 6; i++) {\n      ctx.fillStyle = i % 2 ? '#e8362a' : '#fbf3e6';\n      ctx.fillRect(Math.round(x - 15 + i * 5), Math.round(ay + i * 0.6), 5, 6);\n    }\n    ctx.strokeStyle = INK; ctx.lineWidth = 1;\n    ctx.strokeRect(Math.round(x - 15), Math.round(ay), 30, 7);\n    ctx.fillStyle = '#4a4652';\n    ctx.fillRect(Math.round(x - 4), Math.round(y - 9), 8, 9);\n    // sign\n    ctx.fillStyle = (Math.sin(t * 3) > 0) ? '#ffd84a' : '#ffb020';\n    ctx.fillRect(Math.round(x + 8), Math.round(y - 24), 4, 4);\n  }\n\n  _isoTree(ctx, x, y, D, t) {\n    const sway = Math.sin(t * 1.4 + x) * 1.2;\n    ctx.fillStyle = '#6a4020';\n    ctx.fillRect(Math.round(x - 2), Math.round(y - 14), 4, 14);\n    ctx.strokeStyle = INK; ctx.lineWidth = 1;\n    ctx.strokeRect(Math.round(x - 2) + 0.5, Math.round(y - 14) + 0.5, 4, 14);\n    const leaf = D.leaf;\n    for (const [dx, dy, r] of [[0, -26, 10], [-6, -19, 7], [7, -19, 7]]) {\n      ctx.beginPath();\n      ctx.arc(x + dx + sway * (dy < -22 ? 1 : 0.5), y + dy, r, 0, TAU);\n      ctx.fillStyle = leaf; ctx.fill();\n      ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();\n    }\n    ctx.beginPath();\n    ctx.arc(x - 3 + sway, y - 29, 4, 0, TAU);\n    ctx.fillStyle = shade(leaf, 0.35); ctx.fill();\n  }\n\n  _isoRock(ctx, x, y, D) {\n    ctx.beginPath();\n    ctx.moveTo(x - 8, y); ctx.lineTo(x - 4, y - 8); ctx.lineTo(x + 3, y - 9);\n    ctx.lineTo(x + 8, y - 1); ctx.lineTo(x + 2, y + 3);\n    ctx.closePath();\n    ctx.fillStyle = shade(D.side, 0.30); ctx.fill();\n    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();\n  }\n\n  // ---- the row under the card: quick play, chest, bag ----\n  _slot(ctx, L) {\n    const q = L.quick, down = this._press === 'quick';\n    tile(ctx, q.x, q.y + (down ? 2 : 0), q.w, q.h, 9, {\n      fill: this.hover === 'quick' ? '#3a5a2e' : '#2e4a26', fill2: '#1a2c16',\n      outline: INK, lift: down ? 1 : 3,\n    });\n    glyph(ctx, 'quickplay', q.x + 4, q.y + 2 + (down ? 2 : 0), 26, '#8ef07a', this.t);\n    label(ctx, 'Quick', q.x + q.w / 2, q.y + q.h + 9, '#cdf0b8', 6);\n\n    const r = L.slot;\n    tile(ctx, r.x, r.y, r.w, r.h, 9, { fill: PANEL, fill2: '#181222', outline: INK, ring: GOLD_D, ringW: 2, lift: 3 });\n    glyph(ctx, 'chest', r.x + 4, r.y + 3, 32, GOLD, this.t);\n    ctx.beginPath(); ctx.arc(r.x + r.w - 2, r.y + 2, 6, 0, TAU);\n    ctx.fillStyle = '#e0202a'; ctx.fill();\n    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();\n    label(ctx, '1', r.x + r.w - 2, r.y + 5, '#ffffff', 8);\n    label(ctx, 'Co. Chest', r.x + r.w / 2, r.y + r.h + 9, '#ffe9c0', 7);\n\n    const b = L.bag, bd = this._press === 'bag';\n    tile(ctx, b.x, b.y + (bd ? 2 : 0), b.w, b.h, 9, {\n      fill: this.hover === 'bag' ? PANEL_HI : PANEL, fill2: '#1d1622',\n      outline: INK, lift: bd ? 1 : 3,\n    });\n    glyph(ctx, 'bag', b.x + 4, b.y + 2 + (bd ? 2 : 0), 26, '#ff9a4a', this.t);\n    label(ctx, 'My Bag', b.x + b.w / 2, b.y + b.h + 9, '#ffe4bc', 6);\n  }\n\n  // ---- the big Start button ----\n  _startButton(ctx, L) {\n    const b = L.start;\n    const enough = (this.save.energy || 0) >= ENERGY_COST && this.realmUnlocked;\n    const down = this._press === 'start';\n    const y = b.y + (down ? 3 : 0);\n\n    tile(ctx, b.x, y, b.w, b.h, 14, {\n      fill: enough ? '#ff5a3a' : '#8a7070',\n      fill2: enough ? RED_D : '#4a3838',\n      outline: INK, ring: enough ? GOLD : '#7a6a58', ringW: 3,\n      lift: down ? 2 : 6,\n    });\n    if (enough && this.hover === 'start') {\n      ctx.globalAlpha = 0.14 + 0.08 * Math.sin(this.t * 8);\n      roundPath(ctx, b.x + 3, y + 3, b.w - 6, b.h - 6, 11);\n      ctx.fillStyle = '#ffffff'; ctx.fill();\n      ctx.globalAlpha = 1;\n    }\n    outline(ctx, 'Start', W / 2, y + 26, '#ffffff', RED_D, 22);\n    icon(ctx, 'energy', W / 2 - 20, y + 30, 15, enough ? '#ffe066' : '#c0b0a0', this.t);\n    outline(ctx, 'x ' + ENERGY_COST, W / 2 + 8, y + 42, '#ffe9a0', RED_D, 12);\n  }\n\n  // ---- bottom nav ----\n  _navBar(ctx, L) {\n    const navY = H - 44;\n    ctx.fillStyle = '#1b1420';\n    ctx.fillRect(0, navY, W, 44);\n    ctx.fillStyle = INK;\n    ctx.fillRect(0, navY, W, 2);\n\n    for (const tb of L.tabs) {\n      const active = tb.i === this.tab;\n      if (tb.centre) {\n        const bw = 58, bx = Math.round(tb.x + tb.w / 2 - bw / 2), by = navY - 16;\n        tile(ctx, bx, by, bw, 46, 13, { fill: '#ffd24a', fill2: '#ef8a12', outline: INK, ring: '#fff0b0', ringW: 2, lift: 4 });\n        glyph(ctx, 'battle', bx + bw / 2 - 17, by + 2, 34, '#ffffff', this.t);\n        outline(ctx, tb.label, bx + bw / 2, by + 41, '#ffffff', '#8a3a08', 12);\n      } else {\n        const bw = 40, bx = Math.round(tb.x + tb.w / 2 - bw / 2), by = navY + 3;\n        tile(ctx, bx, by, bw, 25, 9, {\n          fill: active ? '#4a3a52' : '#2b2230', fill2: active ? '#2e2436' : '#1d1622',\n          outline: INK, lift: 2,\n        });\n        glyph(ctx, tb.icon, bx + bw / 2 - 11, by + 2, 22, active ? GOLD : '#c8b8c0', this.t, active ? 1 : 0.82);\n        label(ctx, tb.label, bx + bw / 2, by + 37, active ? GOLD : '#e0d0c8', 7);\n      }\n    }\n  }\n}\n\n// ============================================================\n// CHUNKY UI PRIMITIVES\n// Everything shares one look: 2px near-black outline, rounded\n// corners, a vertical gradient body, a soft top highlight and a\n// solid \"lift\" slab underneath so tiles read as physical objects.\n// ============================================================\nfunction roundPath(ctx, x, y, w, h, r) {\n  const rr = Math.max(0, Math.min(r, w / 2, h / 2));\n  ctx.beginPath();\n  ctx.moveTo(x + rr, y);\n  ctx.arcTo(x + w, y, x + w, y + h, rr);\n  ctx.arcTo(x + w, y + h, x, y + h, rr);\n  ctx.arcTo(x, y + h, x, y, rr);\n  ctx.arcTo(x, y, x + w, y, rr);\n  ctx.closePath();\n}\nfunction clipRound(ctx, x, y, w, h, r) { roundPath(ctx, x, y, w, h, r); ctx.clip(); }\n\nfunction tile(ctx, x, y, w, h, r, o = {}) {\n  const lift = o.lift ?? 3;\n  if (lift > 0) {\n    roundPath(ctx, x, y + lift, w, h, r);\n    ctx.fillStyle = o.shadow || 'rgba(20,8,10,0.55)';\n    ctx.fill();\n  }\n  const g = ctx.createLinearGradient(0, y, 0, y + h);\n  g.addColorStop(0, o.fill || PANEL);\n  g.addColorStop(1, o.fill2 || o.fill || PANEL);\n  roundPath(ctx, x, y, w, h, r);\n  ctx.fillStyle = g;\n  ctx.fill();\n  if (o.ring) {\n    ctx.strokeStyle = o.ring; ctx.lineWidth = o.ringW || 2; ctx.stroke();\n  }\n  roundPath(ctx, x, y, w, h, r);\n  ctx.strokeStyle = o.outline || INK;\n  ctx.lineWidth = 2;\n  ctx.stroke();\n  // top gloss\n  ctx.save();\n  clipRound(ctx, x, y, w, h, r);\n  ctx.globalAlpha = 0.16;\n  ctx.fillStyle = '#ffffff';\n  ctx.fillRect(x, y + 2, w, Math.max(2, h * 0.26));\n  ctx.restore();\n  ctx.lineWidth = 1;\n}\n\nfunction label(ctx, str, x, y, color, size, align = 'center') {\n  ctx.font = 'bold ' + size + 'px monospace';\n  ctx.textAlign = align;\n  ctx.fillStyle = 'rgba(20,8,12,0.75)';\n  ctx.fillText(str, x + 1, y + 1);\n  ctx.fillStyle = color;\n  ctx.fillText(str, x, y);\n  ctx.textAlign = 'left';\n}\n\nfunction outline(ctx, str, cx, y, color, ink, size) {\n  ctx.font = 'bold ' + size + 'px monospace';\n  ctx.textAlign = 'center';\n  ctx.fillStyle = ink;\n  const k = size > 15 ? 2 : 1;\n  for (let dx = -k; dx <= k; dx++) {\n    for (let dy = -k; dy <= k; dy++) {\n      if (dx || dy) ctx.fillText(str, cx + dx, y + dy);\n    }\n  }\n  ctx.fillText(str, cx, y + k + 1);\n  ctx.fillStyle = color;\n  ctx.fillText(str, cx, y);\n  ctx.textAlign = 'left';\n}\n\nfunction blob(ctx, x, y, w, h) {\n  ctx.beginPath();\n  ctx.ellipse(x, y, w, h, 0, 0, TAU);\n  ctx.fill();\n}\n\nfunction star(ctx, cx, cy, r, color) {\n  ctx.fillStyle = color;\n  ctx.beginPath();\n  for (let i = 0; i < 8; i++) {\n    const a = (i / 8) * TAU - Math.PI / 2;\n    const rr = i % 2 ? r * 0.34 : r;\n    const fn = i ? 'lineTo' : 'moveTo';\n    ctx[fn](cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);\n  }\n  ctx.closePath();\n  ctx.fill();\n}\n\n// An isometric box standing on the tile whose top vertex is (x, y).\nfunction isoBox(ctx, x, y, w, h, top, left, right) {\n  const hw = w / 2, hh = w / 4;\n  const ty = y - h;                       // y of the top face's centre\n  ctx.lineWidth = 2;\n  ctx.strokeStyle = INK;\n  // left face\n  ctx.beginPath();\n  ctx.moveTo(x - hw, ty); ctx.lineTo(x, ty + hh);\n  ctx.lineTo(x, y + hh); ctx.lineTo(x - hw, y);\n  ctx.closePath();\n  ctx.fillStyle = left; ctx.fill(); ctx.stroke();\n  // right face\n  ctx.beginPath();\n  ctx.moveTo(x + hw, ty); ctx.lineTo(x, ty + hh);\n  ctx.lineTo(x, y + hh); ctx.lineTo(x + hw, y);\n  ctx.closePath();\n  ctx.fillStyle = right; ctx.fill(); ctx.stroke();\n  // top face\n  ctx.beginPath();\n  ctx.moveTo(x, ty - hh); ctx.lineTo(x + hw, ty);\n  ctx.lineTo(x, ty + hh); ctx.lineTo(x - hw, ty);\n  ctx.closePath();\n  ctx.fillStyle = top; ctx.fill(); ctx.stroke();\n  ctx.lineWidth = 1;\n}\n\n// Lighten (k > 0) or darken (k < 0) a hex colour.\nfunction shade(hex, k) {\n  const h = String(hex).replace('#', '');\n  const n = parseInt(h.length === 3 ? h.split('').map(ch => ch + ch).join('') : h, 16) || 0;\n  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;\n  const m = (v) => k >= 0\n    ? Math.round(v + (255 - v) * k)\n    : Math.round(v * (1 + k));\n  r = m(r); g = m(g); b = m(b);\n  return `rgb(${r},${g},${b})`;\n}\n\n// Prefer the baked icon plate; fall back to the vector glyph below so the UI\n// still reads perfectly if assets/icons/ is missing.\nconst FALLBACK = {\n  battle: 'star', train: 'chest', arsenal: 'gun', forge: 'anvil', coinshop: 'coinbag',\n  trophy: 'chest', gift: 'gift', daily: 'calendar', leaderboard: 'chest',\n  worldmap: 'calendar', armoury: 'shield', relics: 'relic', settings: 'cog',\n  bag: 'bag', quickplay: 'energy', chest: 'chest',\n};\nfunction glyph(ctx, name, x, y, s, color, t = 0, alpha = 1) {\n  const im = ICONS[name];\n  if (im) {\n    if (alpha !== 1) { ctx.save(); ctx.globalAlpha = alpha; }\n    ctx.drawImage(im, Math.round(x), Math.round(y), s, s);\n    if (alpha !== 1) ctx.restore();\n    return;\n  }\n  icon(ctx, FALLBACK[name] || name, x, y, s, color, t);\n}\n\n// Chunky cartoon glyphs, authored on a 16x16 grid then scaled.\nfunction icon(ctx, kind, x, y, s, color, t = 0) {\n  ctx.save();\n  ctx.translate(x, y);\n  ctx.scale(s / 16, s / 16);\n  ctx.lineJoin = 'round';\n  const R = (a, b, c, d, col) => { ctx.fillStyle = col || color; ctx.fillRect(a, b, c, d); };\n  const ink = () => { ctx.strokeStyle = INK; ctx.lineWidth = 1.6; ctx.stroke(); };\n  ctx.fillStyle = color;\n  switch (kind) {\n    case 'energy':\n      ctx.beginPath();\n      ctx.moveTo(10, 1); ctx.lineTo(3, 9.5); ctx.lineTo(7, 9.5); ctx.lineTo(6, 15);\n      ctx.lineTo(13, 6.5); ctx.lineTo(8.5, 6.5);\n      ctx.closePath(); ctx.fill(); ink();\n      break;\n    case 'coin':\n      ctx.beginPath(); ctx.arc(8, 8, 7, 0, TAU); ctx.fill(); ink();\n      ctx.beginPath(); ctx.arc(8, 8, 4.4, 0, TAU);\n      ctx.fillStyle = shade(String(color), -0.35); ctx.fill();\n      R(7, 4.5, 2, 7, '#fff6c0'); R(5.5, 6.5, 5, 1.6, '#fff6c0');\n      break;\n    case 'shard':\n      ctx.beginPath();\n      ctx.moveTo(8, 1); ctx.lineTo(14, 7); ctx.lineTo(8, 15); ctx.lineTo(2, 7);\n      ctx.closePath(); ctx.fill(); ink();\n      ctx.beginPath(); ctx.moveTo(8, 2.5); ctx.lineTo(12, 7); ctx.lineTo(8, 7);\n      ctx.closePath(); ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();\n      break;\n    case 'list':\n      R(2, 2, 12, 12); ink();\n      ctx.fillStyle = INK;\n      for (let i = 0; i < 3; i++) { R(4, 4.5 + i * 3.4, 2, 2, INK); R(7.5, 5 + i * 3.4, 5, 1.4, INK); }\n      break;\n    case 'gift':\n      R(2, 6, 12, 8); ink();\n      R(6.5, 2, 3, 12, '#ffe066');\n      R(2, 6, 12, 2.4, '#ffe066');\n      ctx.beginPath(); ctx.arc(5.5, 4, 2.4, 0, TAU); ctx.arc(10.5, 4, 2.4, 0, TAU);\n      ctx.fillStyle = '#ffe066'; ctx.fill(); ink();\n      break;\n    case 'bag':\n      ctx.beginPath();\n      roundPath(ctx, 2.5, 5, 11, 9, 3); ctx.fill(); ink();\n      ctx.beginPath(); ctx.arc(8, 5.5, 3.4, Math.PI, 0);\n      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();\n      R(5, 8.5, 6, 3.5, '#3a2a30');\n      break;\n    case 'calendar':\n      roundPath(ctx, 2, 3.5, 12, 10.5, 2); ctx.fill(); ink();\n      R(3, 6.5, 10, 6.5, '#2a2030');\n      R(4, 1.5, 2, 3); R(10, 1.5, 2, 3);\n      R(4.5, 8, 2, 2, color); R(8, 8, 2, 2, color); R(4.5, 11, 2, 2, color);\n      break;\n    case 'cog':\n      for (let i = 0; i < 6; i++) {\n        const a = (i / 6) * TAU + t * 0.5;\n        R(8 + Math.cos(a) * 6 - 1.6, 8 + Math.sin(a) * 6 - 1.6, 3.2, 3.2);\n      }\n      ctx.beginPath(); ctx.arc(8, 8, 5, 0, TAU); ctx.fill(); ink();\n      ctx.beginPath(); ctx.arc(8, 8, 2.2, 0, TAU); ctx.fillStyle = INK; ctx.fill();\n      break;\n    case 'chest':\n      roundPath(ctx, 2, 6, 12, 8, 1.5); ctx.fill(); ink();\n      ctx.beginPath(); ctx.arc(8, 6.5, 6, Math.PI, 0); ctx.fill(); ink();\n      R(2, 8.5, 12, 1.6, INK); R(6.8, 7.5, 2.4, 4, INK);\n      R(7.2, 8.4, 1.6, 2, '#fff0a0');\n      break;\n    case 'gun':\n      roundPath(ctx, 1.5, 6, 11, 4, 1); ctx.fill(); ink();\n      roundPath(ctx, 3.5, 9.5, 3.5, 4.5, 1); ctx.fill(); ink();\n      R(11.5, 4.5, 3, 2.5); ink();\n      break;\n    case 'anvil':\n      ctx.beginPath();\n      ctx.moveTo(2, 5); ctx.lineTo(14, 5); ctx.lineTo(12, 9); ctx.lineTo(10, 9);\n      ctx.lineTo(10, 11); ctx.lineTo(12.5, 14); ctx.lineTo(3.5, 14);\n      ctx.lineTo(6, 11); ctx.lineTo(6, 9); ctx.lineTo(3.5, 9);\n      ctx.closePath(); ctx.fill(); ink();\n      break;\n    case 'coinbag':\n      ctx.beginPath(); ctx.arc(8, 10, 5.8, 0, TAU); ctx.fill(); ink();\n      R(5.5, 2, 5, 3); ink();\n      ctx.fillStyle = INK;\n      ctx.font = 'bold 7px monospace'; ctx.textAlign = 'center';\n      ctx.fillText('$', 8, 12.5); ctx.textAlign = 'left';\n      break;\n    case 'star':\n      star(ctx, 8, 8, 7.5, color);\n      ctx.beginPath();\n      for (let i = 0; i < 8; i++) {\n        const a = (i / 8) * TAU - Math.PI / 2;\n        const rr = i % 2 ? 7.5 * 0.34 : 7.5;\n        const fn = i ? 'lineTo' : 'moveTo';\n        ctx[fn](8 + Math.cos(a) * rr, 8 + Math.sin(a) * rr);\n      }\n      ctx.closePath(); ink();\n      break;\n    case 'shield':\n      ctx.beginPath();\n      ctx.moveTo(8, 1.5); ctx.lineTo(14, 4); ctx.lineTo(14, 8.5);\n      ctx.quadraticCurveTo(14, 13, 8, 15); ctx.quadraticCurveTo(2, 13, 2, 8.5);\n      ctx.lineTo(2, 4); ctx.closePath();\n      ctx.fill(); ink();\n      R(7.2, 5, 1.6, 6, INK); R(5, 7.2, 6, 1.6, INK);\n      break;\n    case 'relic':\n      ctx.beginPath(); ctx.arc(8, 2.5, 1.4, 0, TAU); ctx.fill();\n      R(7.4, 3.5, 1.2, 2.5);\n      ctx.beginPath();\n      ctx.moveTo(8, 5.5); ctx.lineTo(12.5, 9); ctx.lineTo(8, 14.5); ctx.lineTo(3.5, 9);\n      ctx.closePath(); ctx.fill(); ink();\n      ctx.beginPath();\n      ctx.moveTo(8, 7.5); ctx.lineTo(10.5, 9.4); ctx.lineTo(8, 12.2); ctx.lineTo(5.5, 9.4);\n      ctx.closePath(); ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();\n      break;\n    case 'lock':\n      roundPath(ctx, 3, 7, 10, 8, 2); ctx.fill(); ink();\n      ctx.beginPath(); ctx.arc(8, 7, 3.4, Math.PI, 0);\n      ctx.strokeStyle = color; ctx.lineWidth = 2.4; ctx.stroke();\n      R(7, 9.5, 2, 3.5, INK);\n      break;\n    default:\n      ctx.beginPath(); ctx.arc(8, 8, 5, 0, TAU); ctx.fill(); ink();\n  }\n  ctx.restore();\n}\n","js/ui/menu.js":"// ============================================================\n// HELL TRAIN — UI scenes: menu, world map, train base, summary,\n// pause, leaderboard, daily run, weekly, achievements, settings.\n// All UI is drawn directly to the low-res canvas for crisp pixels.\n// ============================================================\nimport { CFG, PAL, FONT } from '../core/config.js';\nimport { findAscension } from '../data/upgrades.js';\nimport { drawSprite, spriteCanvas } from '../core/sprite.js';\nimport { RNG, dist, TAU, easeOutCubic, fmtTime, fmtNum, easeOutBack } from '../core/utils.js';\nimport { REALMS, HIDDEN_REALM, BOSS_DEFS, ACHIEVEMENTS, WEEKLY_CHALLENGES, ARMOURS, RELICS, LORE, UPGRADES, EVENTS, findRealm, findDifficulty } from '../data/realms.js';\nimport { WEAPONS, findWeapon } from '../data/weapons.js';\n\nlet _sharedUi = null;\nexport function setSharedUI(ui) { _sharedUi = ui; }\n\n// UI primitives\nclass Button {\n  constructor(label, x, y, w, h, color = '#985ce0') {\n    this.label = label; this.x = x; this.y = y; this.w = w; this.h = h; this.color = color;\n    this.hover = false; this.pressed = false;\n  }\n  draw(ctx, font) {\n    ctx.fillStyle = this.pressed ? '#3a2a4a' : this.hover ? '#2a1a3a' : '#1a1026';\n    ctx.fillRect(this.x, this.y, this.w, this.h);\n    ctx.strokeStyle = this.color; ctx.lineWidth = 2;\n    ctx.strokeRect(this.x + 1, this.y + 1, this.w - 2, this.h - 2);\n    ctx.fillStyle = '#fff'; ctx.font = font || 'bold 9px monospace';\n    const tw = ctx.measureText(this.label).width;\n    ctx.fillText(this.label, this.x + (this.w - tw) / 2, this.y + this.h / 2 + 3);\n  }\n  hit(mx, my) { return mx >= this.x && mx <= this.x + this.w && my >= this.y && my <= this.y + this.h; }\n}\n\nfunction drawBigTitle(ctx, text, x, y, scale = 1) {\n  ctx.font = 'bold ' + (24 * scale) + 'px monospace';\n  ctx.textAlign = 'center';\n  // shadow\n  ctx.fillStyle = '#000';\n  ctx.fillText(text, x + 2, y + 2);\n  // outer\n  ctx.fillStyle = '#985ce0';\n  ctx.fillText(text, x, y - 2);\n  // inner\n  ctx.fillStyle = '#ffe066';\n  ctx.fillText(text, x, y);\n  ctx.textAlign = 'left';\n}\n\n// Pull the player's currently-equipped animated train from the Art Forge.\nfunction trainSet(engine) {\n  try { return engine.sprites?.getTrainSet?.(engine.save?.trainSkin || 'iron_horse') || null; }\n  catch { return null; }\n}\nfunction trainFrame(engine, t, which = 'engine') {\n  const set = trainSet(engine);\n  if (!set) return null;\n  const arr = set[which] || set.engine;\n  return arr[Math.floor(t * 8) % arr.length];\n}\nfunction projFrame(engine, key, t) {\n  const a = engine.sprites?.anim?.[key];\n  if (Array.isArray(a)) return a[Math.floor(t * 10) % a.length];\n  return engine.sprites?.[key] || null;\n}\n\n// =====================================================================\n// MENU SCENE\n// =====================================================================\nexport class MenuScene {\n  constructor(ctx) {\n    this.engine = ctx;\n    this.t = 0;\n    this.sprites = ctx.sprites;\n    this.buttons = [];\n    this.bgStars = [];\n    for (let i = 0; i < 80; i++) {\n      this.bgStars.push({\n        x: Math.random() * CFG.VIEW_W, y: Math.random() * CFG.VIEW_H,\n        spd: 4 + Math.random() * 12, b: Math.random() * 1.5 + 0.5,\n      });\n    }\n    this._buildButtons();\n    this.canvas = ctx.canvas;\n    this.input = ctx.input || null;\n  }\n  enter() {\n    if (!this.input) {\n      // Build a lightweight input for menu (no movement keys needed)\n      this.input = {\n        mouse: { x: CFG.VIEW_W / 2, y: CFG.VIEW_H / 2, down: false, justDown: false },\n        isDown: () => false, wasPressed: () => false, axis: () => ({ x: 0, y: 0 }),\n        justPressed: new Set(),\n      };\n      this.canvas.addEventListener('mousemove', e => {\n        const r = this.canvas.getBoundingClientRect();\n        this.input.mouse.x = (e.clientX - r.left) / r.width * CFG.VIEW_W;\n        this.input.mouse.y = (e.clientY - r.top) / r.height * CFG.VIEW_H;\n      });\n      this.canvas.addEventListener('mousedown', e => {\n        if (e.button === 0) { this.input.mouse.down = true; this.input.mouse.justDown = true; }\n      });\n      this.canvas.addEventListener('mouseup', e => {\n        if (e.button === 0) this.input.mouse.down = false;\n      });\n    }\n  }\n  _buildButtons() {\n    const W = CFG.VIEW_W;\n    const list = [\n      { label: 'PLAY', scene: 'worldMap' },\n      { label: 'THE HELL FORGE', scene: 'shop' },\n      { label: 'QUICK PLAY', scene: 'characterSelect' },\n      { label: 'COIN SHOP', scene: 'coinShop' },\n      { label: 'TRAIN BASE', scene: 'trainBase' },\n      { label: 'ARSENAL', scene: 'arsenal' },\n      { label: 'ARMOURY', scene: 'armoury' },\n      { label: 'RELICS', scene: 'relics' },\n      { label: 'WORLD MAP', scene: 'worldMap' },\n      { label: 'ACHIEVEMENTS', scene: 'achievements' },\n      { label: 'LEADERBOARDS', scene: 'leaderboards' },\n      { label: 'DAILY RUN', scene: 'dailyRun' },\n      { label: 'WEEKLY CHALLENGE', scene: 'weeklyChallenge' },\n      { label: 'SETTINGS', scene: 'settings' },\n    ];\n    const cols = 3;\n    const cw = 120, ch = 22;\n    const x0 = (W - cols * (cw + 8) - 8) / 2;\n    const y0 = 80;\n    for (let i = 0; i < list.length; i++) {\n      const r = Math.floor(i / cols), c = i % cols;\n      const b = new Button(list[i].label, x0 + c * (cw + 8), y0 + r * (ch + 6), cw, ch);\n      b.scene = list[i].scene;\n      this.buttons.push(b);\n    }\n  }\n  exit() {}\n  update(dt, t) {\n    this.t = t;\n    if (!this.input || !this.input.mouse) return;\n    for (const b of this.buttons) b.hover = b.hit(this.input.mouse.x, this.input.mouse.y);\n    if (this.input.mouse.justDown) {\n      for (const b of this.buttons) {\n        if (b.hit(this.input.mouse.x, this.input.mouse.y)) {\n          if (b.scene === 'play' || b.scene === 'worldMap') {\n            this.engine.setScene('worldMap', { save: this.engine.save });\n          } else {\n            this.engine.setScene(b.scene, { save: this.engine.save });\n          }\n          return;\n        }\n      }\n    }\n    this.input.mouse.justDown = false;\n  }\n  render(ctx, t) {\n    const W = CFG.VIEW_W, H = CFG.VIEW_H;\n    // Sky\n    ctx.fillStyle = '#080418';\n    ctx.fillRect(0, 0, W, H);\n    // Stars\n    for (const s of this.bgStars) {\n      s.x -= s.spd * 0.05;\n      if (s.x < 0) s.x = W;\n      ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.sin(t + s.x) * 0.3})`;\n      ctx.fillRect(s.x, s.y, 1, 1);\n    }\n    // Title\n    drawBigTitle(ctx, 'HELL TRAIN', W / 2, 50, 1);\n    ctx.fillStyle = '#cfd4e0'; ctx.font = '8px monospace'; ctx.textAlign = 'center';\n    ctx.fillText('A roguelite beyond the end of the line', W / 2, 70);\n    ctx.textAlign = 'left';\n    // Train silhouette background\n    const tr = trainFrame(this.engine, t) || this.sprites.trainEngine;\n    const car = trainFrame(this.engine, t, 'cargo') || this.sprites.trainCar;\n    if (tr && car) {\n      drawSprite(ctx, car, W / 2 - 110, H - 46, 1, false, 0, 0.55);\n      drawSprite(ctx, car, W / 2 - 50, H - 46, 1, false, 0, 0.55);\n      drawSprite(ctx, tr, W / 2 + 30, H - 48, 1, false, 0, 0.75);\n      // Steam\n      ctx.globalAlpha = 0.4;\n      for (let i = 0; i < 6; i++) {\n        ctx.fillStyle = '#aaa';\n        ctx.beginPath();\n        ctx.arc(W / 2 + 50 + Math.sin(t + i) * 6, H - 75 - i * 6, 4 + i, 0, TAU);\n        ctx.fill();\n      }\n      ctx.globalAlpha = 1;\n    }\n    // Buttons\n    for (const b of this.buttons) b.draw(ctx);\n    // Footer\n    ctx.fillStyle = '#cfd4e0'; ctx.font = '7px monospace'; ctx.textAlign = 'center';\n    ctx.fillText('© HELL TRAIN v' + CFG.VERSION + '   WASD/Arrows: Move   Space: Ability   Click: Select', W / 2, H - 6);\n    ctx.textAlign = 'left';\n  }\n}\n\n// =====================================================================\n// WORLD MAP SCENE\n// =====================================================================\nexport class WorldMapScene {\n  constructor(ctx) {\n    this.engine = ctx; this.sprites = ctx.sprites; this.t = 0;\n    this.canvas = ctx.canvas;\n    this.input = { mouse: { x: 0, y: 0, justDown: false }, justPressed: new Set() };\n    this.canvas.addEventListener('mousemove', e => {\n      const r = this.canvas.getBoundingClientRect();\n      this.input.mouse.x = (e.clientX - r.left) / r.width * CFG.VIEW_W;\n      this.input.mouse.y = (e.clientY - r.top) / r.height * CFG.VIEW_H;\n    });\n    this.canvas.addEventListener('mousedown', e => { if (e.button === 0) this.input.mouse.justDown = true; });\n  }\n  enter(params = {}) {\n    this.save = params.save || this.engine.save;\n    this.runStats = params.runStats || null;\n  }\n  exit() {}\n  update(dt, t) {\n    this.t = t;\n    if (this.runStats) {\n      // Subtle notification banner\n      this.runStats = null;\n    }\n    if (this.input.mouse.justDown) {\n      const x = this.input.mouse.x, y = this.input.mouse.y;\n      const W = CFG.VIEW_W;\n      // Difficulty row at top\n      const diffs = ['easy', 'normal', 'hard', 'nightmare', 'abyss', 'infinite'];\n      const dx0 = (W - diffs.length * 60) / 2;\n      for (let i = 0; i < diffs.length; i++) {\n        const x0 = dx0 + i * 60;\n        if (x >= x0 && x <= x0 + 56 && y >= 22 && y <= 36) {\n          this.engine._difficulty = diffs[i];\n          return;\n        }\n      }\n      // Realm nodes\n      const reachable = this._realmPositions();\n      for (const r of reachable) {\n        if (x >= r.x - 22 && x <= r.x + 22 && y >= r.y - 16 && y <= r.y + 16) {\n          if ((this.save.unlockedRealms || ['purgatory']).includes(r.id)) {\n            this.engine.setScene('gameplay', {\n              save: this.save, realmId: r.id, stage: 1,\n              difficulty: this.engine._difficulty || 'normal',\n            });\n            return;\n          }\n        }\n      }\n      // Train base button (top-right)\n      if (x > W - 100 && x < W - 6 && y > 6 && y < 28) {\n        this.engine.setScene('trainBase', { save: this.save });\n        return;\n      }\n    }\n    this.input.mouse.justDown = false;\n  }\n  _realmPositions() {\n    const W = CFG.VIEW_W, H = CFG.VIEW_H;\n    const list = [\n      { id: 'purgatory', name: 'Purgatory', x: 60, y: 90 },\n      { id: 'infernal', name: 'Infernal Fields', x: 120, y: 110 },\n      { id: 'forgotten', name: 'Forgotten City', x: 200, y: 100 },\n      { id: 'forest', name: 'Haunted Forest', x: 280, y: 130 },\n      { id: 'frozen', name: 'Frozen Realm', x: 350, y: 110 },\n      { id: 'desert', name: 'Sunken Desert', x: 400, y: 140 },\n      { id: 'void', name: 'The Void', x: 430, y: 100 },\n      { id: 'terminus', name: 'Terminus', x: 460, y: 80 },\n    ];\n    // Filter to those visible: show only unlocked or next\n    const unlocked = new Set(this.save.unlockedRealms || ['purgatory']);\n    return list.map(r => ({ ...r, locked: !unlocked.has(r.id) }));\n  }\n  render(ctx, t) {\n    const W = CFG.VIEW_W, H = CFG.VIEW_H;\n    ctx.fillStyle = '#0a0420';\n    ctx.fillRect(0, 0, W, H);\n    // Train railway lines connecting nodes\n    ctx.strokeStyle = '#3d2a4f'; ctx.lineWidth = 1;\n    const list = this._realmPositions();\n    for (let i = 0; i < list.length - 1; i++) {\n      ctx.beginPath();\n      ctx.moveTo(list[i].x, list[i].y);\n      ctx.lineTo(list[i + 1].x, list[i + 1].y);\n      ctx.stroke();\n    }\n    // Animated train running along tracks\n    const tx = (t * 12) % (list[list.length - 1].x + 20);\n    let idx = Math.floor(tx / 60);\n    if (idx >= list.length - 1) idx = list.length - 2;\n    const f = (tx - idx * 60) / 60;\n    const px = list[idx].x + (list[idx + 1].x - list[idx].x) * f;\n    const py = list[idx].y + (list[idx + 1].y - list[idx].y) * f;\n    const tr = trainFrame(this.engine, t) || this.sprites.trainEngine;\n    if (tr) drawSprite(ctx, tr, px, py, 0.6, false, 0, 1);\n\n    // Nodes\n    for (const r of list) {\n      const unlocked = !r.locked;\n      ctx.fillStyle = unlocked ? '#985ce0' : '#1a1026';\n      ctx.beginPath(); ctx.arc(r.x, r.y, 16, 0, TAU); ctx.fill();\n      ctx.strokeStyle = unlocked ? '#ffe066' : '#3a3a4a';\n      ctx.lineWidth = 2; ctx.stroke();\n      ctx.fillStyle = '#fff'; ctx.font = 'bold 7px monospace'; ctx.textAlign = 'center';\n      ctx.fillText(r.name.toUpperCase().slice(0, 12), r.x, r.y + 26);\n      if (r.id === 'terminus') ctx.fillText('FINAL', r.x, r.y + 36);\n      ctx.textAlign = 'left';\n    }\n    // Hidden realm hint (very subtle)\n    if (this.save.achievements.includes('secret_discovery') ||\n        (this.save.discovered || []).includes('phantom')) {\n      ctx.fillStyle = '#985ce0';\n      ctx.beginPath(); ctx.arc(80, 170, 8, 0, TAU); ctx.fill();\n      ctx.fillStyle = '#fff'; ctx.font = '6px monospace'; ctx.textAlign = 'center';\n      ctx.fillText('???', 80, 174);\n      ctx.textAlign = 'left';\n    }\n    // Difficulty row\n    const diffs = ['easy','normal','hard','nightmare','abyss','infinite'];\n    const dx0 = (W - diffs.length * 60) / 2;\n    for (let i = 0; i < diffs.length; i++) {\n      const x0 = dx0 + i * 60;\n      const isSel = (this.engine._difficulty || 'normal') === diffs[i];\n      ctx.fillStyle = isSel ? '#985ce0' : '#1a1026';\n      ctx.fillRect(x0, 18, 56, 18);\n      ctx.strokeStyle = isSel ? '#ffe066' : '#3a3a4a'; ctx.lineWidth = 1; ctx.strokeRect(x0 + 0.5, 18.5, 56, 18);\n      ctx.fillStyle = '#fff'; ctx.font = '6px monospace'; ctx.textAlign = 'center';\n      ctx.fillText(diffs[i].toUpperCase(), x0 + 28, 31);\n      ctx.textAlign = 'left';\n    }\n    // Top-right train base button\n    const tb = new Button('TRAIN BASE', W - 100, 6, 94, 22, '#ffe066');\n    tb.hover = this.input.mouse.x > W - 100 && this.input.mouse.x < W - 6 && this.input.mouse.y > 6 && this.input.mouse.y < 28;\n    tb.draw(ctx);\n    // Title\n    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';\n    ctx.fillText('WORLD MAP', W / 2, 11);\n    ctx.fillStyle = '#cfd4e0'; ctx.font = '7px monospace';\n    ctx.fillText('Click a realm node to begin a stage. Difficulty scales enemy stats.', W / 2, H - 4);\n    ctx.textAlign = 'left';\n  }\n}\n\n// =====================================================================\n// TRAIN BASE SCENE\n// =====================================================================\nexport class TrainBaseScene {\n  constructor(ctx) {\n    this.engine = ctx; this.sprites = ctx.sprites; this.t = 0;\n    this.canvas = ctx.canvas;\n    this.input = { mouse: { x: 0, y: 0, justDown: false } };\n    this.canvas.addEventListener('mousemove', e => {\n      const r = this.canvas.getBoundingClientRect();\n      this.input.mouse.x = (e.clientX - r.left) / r.width * CFG.VIEW_W;\n      this.input.mouse.y = (e.clientY - r.top) / r.height * CFG.VIEW_H;\n    });\n    this.canvas.addEventListener('mousedown', e => { if (e.button === 0) this.input.mouse.justDown = true; });\n  }\n  enter(params) {\n    this.save = params.save || this.engine.save;\n    this.tab = 'engine';\n    this.tabs = [\n      { id: 'engine', label: 'ENGINE' },\n      { id: 'arsenal', label: 'ARSENAL' },\n      { id: 'workshop', label: 'WORKSHOP' },\n      { id: 'observatory', label: 'OBSERVATORY' },\n      { id: 'library', label: 'LIBRARY' },\n      { id: 'vault', label: 'VAULT' },\n      { id: 'medical', label: 'MEDICAL' },\n      { id: 'mystery', label: 'MYSTERY' },\n    ];\n  }\n  exit() {}\n  update(dt, t) {\n    this.t = t;\n    if (this.input.mouse.justDown) {\n      const x = this.input.mouse.x, y = this.input.mouse.y;\n      // tabs\n      const tx0 = 12;\n      for (let i = 0; i < this.tabs.length; i++) {\n        const x0 = tx0 + i * 56;\n        if (x >= x0 && x <= x0 + 52 && y >= 38 && y <= 56) {\n          this.tab = this.tabs[i].id;\n        }\n      }\n      // back button\n      if (x >= 6 && x <= 70 && y >= 6 && y <= 26) {\n        this.engine.setScene('menu', { save: this.save });\n        return;\n      }\n      // Spend shard button\n      if (this._spendRect && x >= this._spendRect.x && x <= this._spendRect.x + this._spendRect.w &&\n          y >= this._spendRect.y && y <= this._spendRect.y + this._spendRect.h) {\n        const cost = this._spendRect.cost;\n        if ((this.save.shards || 0) >= cost) {\n          this.save.shards -= cost;\n          this._spendRect.effect(this.save);\n        }\n      }\n    }\n    this.input.mouse.justDown = false;\n  }\n  render(ctx, t) {\n    const W = CFG.VIEW_W, H = CFG.VIEW_H;\n    ctx.fillStyle = '#1a1026';\n    ctx.fillRect(0, 0, W, H);\n    // Top background train sprite\n    const tr = trainFrame(this.engine, t) || this.sprites.trainEngine;\n    if (tr) drawSprite(ctx, tr, W / 2 + 20, 30, 0.5, false, 0, 0.4);\n
