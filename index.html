oid', trigger: 'onApproach' },\n  { id: 'lightning_tower', name: 'Lightning Tower', family: 'lightning', dmg: 22, cd: 1.2, range: 220, sprite: 'orbLight' },\n  { id: 'flamethrower', name: 'Flamethrower', family: 'fire', dmg: 4, cd: 0.05, range: 110, sprite: 'orbFire', continuous: true },\n  { id: 'gravity_engine', name: 'Gravity Engine', family: 'void', dmg: 0, cd: 0, range: 130, pull: true },\n  { id: 'train_ram', name: 'Train Ram', family: 'train', dmg: 30, cd: 0.4, range: 24 },\n];\n\nexport const TRAIN_ULTIMATES = [\n  { id: 'hellfire_express', name: 'Hellfire Express', desc: 'Train becomes engulfed in fire.',\n    color: '#ff5a33', dur: 6, dmg: 8 },\n  { id: 'void_collapse', name: 'Void Collapse', desc: 'Pulls everyone in.',\n    color: '#9b6dff', dur: 5, pull: true, dmg: 4 },\n  { id: 'storm_departure', name: 'Storm Departure', desc: 'Massive lightning.',\n    color: '#fff066', dur: 5, dmg: 12, lightning: true },\n  { id: 'ghost_train', name: 'Ghost Train', desc: 'Summons a spectral duplicate.',\n    color: '#888899', dur: 8, copy: true },\n  { id: 'terminus_cannon', name: 'Terminus Cannon', desc: 'Charges a devastating beam.',\n    color: '#fff066', dur: 3, dmg: 90, beam: true },\n];\n\n// =============================================================\n// TRAIN CARRIAGES\n// =============================================================\nexport const CARRIAGES = [\n  { id: 'engine', name: 'Engine Room', desc: 'Engine upgrades.', icon: '🚂' },\n  { id: 'arsenal', name: 'Arsenal', desc: 'Weapons.', icon: '⚔' },\n  { id: 'workshop', name: 'Workshop', desc: 'Armour.', icon: '🛠' },\n  { id: 'library', name: 'Library', desc: 'Lore.', icon: '📜' },\n  { id: 'observatory', name: 'Observatory', desc: 'Realm intel.', icon: '🔭' },\n  { id: 'vault', name: 'Vault', desc: 'Rare resources.', icon: '💰' },\n  { id: 'medical', name: 'Medical Carriage', desc: 'Healing upgrades.', icon: '✚' },\n  { id: 'mystery', name: 'Mystery Carriage', desc: 'Random events.', icon: '❓' },\n];\n\n// =============================================================\n// EVENTS\n// =============================================================\nexport const EVENTS = [\n  { id: 'merchant', name: 'Wandering Merchant',\n    desc: 'Spend Eclipse Shards for a boon.', icon: '🛒' },\n  { id: 'shrine', name: 'Mysterious Shrine',\n    desc: 'Choose one of three stat boosts.', icon: '⛩' },\n  { id: 'ghost_passenger', name: 'Ghost Passenger',\n    desc: 'A spirit joins your train, granting a permanent buff.', icon: '👻' },\n  { id: 'treasure', name: 'Treasure Carriage',\n    desc: 'Loot explosion!', icon: '💎' },\n  { id: 'mini_boss', name: 'Rival Conductor',\n    desc: 'A wandering elite awaits.', icon: '⚔' },\n  { id: 'lore', name: 'Lore Station',\n    desc: 'Discover fragments of the truth.', icon: '📜' },\n];\n\n// =============================================================\n// PERMANENT UPGRADE TREE\n// =============================================================\nexport const PERMANENT_TREES = {\n  player: {\n    combat: [\n      { id: 'dmg1', name: 'Combat I', desc: '+10% damage.', cost: 1, maxLvl: 5, apply: (p) => p.permaMult('atkDmg', 1.10) },\n      { id: 'spd1', name: 'Haste I', desc: '+8% attack speed.', cost: 1, maxLvl: 5, apply: (p) => p.permaMult('atkSpd', 1.08) },\n    ],\n    survival: [\n      { id: 'hp1', name: 'Vitality I', desc: '+20 HP.', cost: 1, maxLvl: 5, apply: (p) => { p.permaMaxHp += 20; } },\n      { id: 'arm1', name: 'Armour I', desc: '+2 armour.', cost: 1, maxLvl: 5, apply: (p) => { p.permaArmour += 2; } },\n    ],\n    weapons: [\n      { id: 'wpn1', name: 'Weapons I', desc: '+15% weapon damage.', cost: 1, maxLvl: 5, apply: (p) => p.permaMult('wpnDmg', 1.15) },\n    ],\n    void: [\n      { id: 'void1', name: 'Void I', desc: '+10% XP gain.', cost: 1, maxLvl: 5, apply: (p) => p.permaMult('xpGain', 1.10) },\n    ],\n  },\n  train: {\n    engine: [\n      { id: 'eng1', name: 'Engine I', desc: '+20% train speed.', cost: 1, maxLvl: 5, apply: (p) => p.permaMult('trainSpeed', 1.20) },\n    ],\n    weapons: [\n      { id: 'twp1', name: 'Weapon I', desc: '+15% train damage.', cost: 1, maxLvl: 5, apply: (p) => p.permaMult('trainDmg', 1.15) },\n    ],\n    armour: [\n      { id: 'arm2', name: 'Armour I', desc: '+20% train HP.', cost: 1, maxLvl: 5, apply: (p) => p.permaMult('trainHp', 1.20) },\n    ],\n  },\n};\n\n// =============================================================\n// LORE FRAGMENTS\n// =============================================================\nexport const LORE = [\n  { id: 'ticket_01', name: 'Ticket #1029',\n    text: 'Departure: Purgatory. Return: ??? — The Conductor did not return. His watch is still ticking.' },\n  { id: 'record_01', name: 'Maintenance Log',\n    text: 'Engine 13 went dark at station 0. We replaced the heart with a void coil. The passengers... preferred it.' },\n  { id: 'news_01', name: 'Newspaper Fragment',\n    text: 'MORNING EDITION, 1889 — \"Strange train observed leaving the city at midnight. Engine sounds like thunder.\"' },\n  { id: 'symbol_01', name: 'Symbol of the Terminus',\n    text: 'A circle within a circle within a circle. The conductor\\'s mark. None return from the third ring.' },\n  { id: 'passenger_01', name: 'Passenger Log',\n    text: 'They all board the same train. They all alight at different stations. Some never alight at all.' },\n  { id: 'message_01', name: 'A Scrap of Note',\n    text: 'You are reading this because you remember. The train remembers too. It always has.' },\n  { id: 'symbol_02', name: 'Eclipse Mark',\n    text: 'When two circles touch, the world between them disappears. The Terminus is the overlap.' },\n];\n\n// =============================================================\n// SYNERGIES — combined train+player upgrades\n// =============================================================\nexport const SYNERGIES = [\n  { id: 'conductors_bond', name: \"Conductor's Bond\",\n    desc: 'Train damage temporarily increases player attack speed.',\n    apply: (p) => { p.conductorsBond = true; } },\n  { id: 'shared_energy', name: 'Shared Energy',\n    desc: 'Player abilities charge train abilities.',\n    apply: (p) => { p.sharedEnergy = true; } },\n  { id: 'phantom_link', name: 'Phantom Link',\n    desc: 'Teleport to the train, creating a shockwave.',\n    apply: (p) => { p.phantomLink = true; } },\n  { id: 'dual_eclipse', name: 'Dual Eclipse',\n    desc: 'Activating player and train ultimates together creates a special event.',\n    apply: (p) => { p.dualEclipse = true; } },\n  { id: 'trains_fury', name: \"Train's Fury\",\n    desc: 'When train HP is low, player and train gain temporary bonuses.',\n    apply: (p) => { p.trainsFury = true; } },\n];\n","js/entities/boss.js":"// ============================================================\n// HELL TRAIN — Boss entities with phase logic\n// ============================================================\nimport { uid, rand, randInt, clamp, dist, TAU, easeOutCubic } from '../core/utils.js';\nimport { BOSS_DEFS, findRealm } from '../data/realms.js';\n\nexport class Boss {\n  constructor(id, x, y, realmId, difficulty, sprites) {\n    const def = BOSS_DEFS[id];\n    this.id = id;\n    this.name = def.name;\n    this.realmId = realmId;\n    this.difficulty = difficulty;\n    this.sprites = sprites;\n    this.spriteName = def.sprite;\n    this.radius = def.radius;\n    this.color = def.color;\n    this.maxHp = def.hp * (difficulty.enemyHp || 1);\n    this.hp = this.maxHp;\n    this.x = x; this.y = y; this.vx = 0; this.vy = 0;\n    this.alive = true;\n    this.t = 0;\n    this.phase = 1;\n    this.phases = def.phases;\n    this.flashT = 0;\n    this.attackCd = 0;\n    this.specialCd = 4;\n    this.moveDir = 0;\n    this.aiT = 0;\n    this.deathT = 0;\n    this.scale = 1;\n    this.xpReward = 200;\n    this.drops = [];\n    this._introT = 1.4; // intro animation duration\n    this._id = uid();\n    this.attacks = this._setupAttacks();\n    this.attackIndex = 0;\n    this.spawnAddsAt = { 0.6: false, 0.3: false };\n  }\n\n  _setupAttacks() {\n    const a = [];\n    // Common patterns, vary by boss\n    a.push({ id: 'slam', dur: 1.2, cd: () => 4 - this.phase * 0.3 });\n    a.push({ id: 'projectiles', dur: 1.6, cd: () => 3 });\n    a.push({ id: 'dash', dur: 0.8, cd: () => 5 });\n    a.push({ id: 'special', dur: 1.0, cd: () => 6 });\n    return a;\n  }\n\n  update(dt, ctx) {\n    this.t += dt;\n    if (this._introT > 0) {\n      this._introT -= dt;\n      ctx.fx.flash(this.x, this.y, '#ffffff', 0.1);\n      return;\n    }\n    if (!this.alive) {\n      this.deathT -= dt;\n      return;\n    }\n    if (this.flashT > 0) this.flashT -= dt;\n    // Phase transitions\n    const hpPct = this.hp / this.maxHp;\n    const target = Math.min(this.phases, Math.floor((1 - hpPct) * this.phases) + 1);\n    if (target > this.phase) {\n      this.phase = target;\n      ctx.fx.shakeScreen(8, 0.5);\n      ctx.fx.flash(this.x, this.y, '#fff0a0', 0.4);\n      ctx.fx.burst(this.x, this.y, this.color, 40, { life: 0.7, spd: 200 });\n      ctx.gameStats.phaseChanges = (ctx.gameStats.phaseChanges || 0) + 1;\n    }\n    // Attack cycle\n    this.attackCd -= dt;\n    if (this.attackCd <= 0) {\n      const att = this.attacks[this.attackIndex % this.attacks.length];\n      this.attackIndex += 1;\n      this.attackCd = att.cd();\n      this._performAttack(att.id, ctx);\n    }\n    // Move (varies per boss id)\n    this._moveAI(dt, ctx);\n\n    // Contact damage\n    const p = ctx.player;\n    if (dist(this.x, this.y, p.x, p.y) < this.radius + p.radius) {\n      const dealt = p.takeDamage((this.dmg || 20) * dt * 2.2, ctx, this);\n      if (dealt > 0) ctx.onPlayerHit(dealt, this.color);\n    }\n\n    // Special adds at HP thresholds (used by some bosses)\n    if (this.id === 'boss_summoner' || this.id === 'boss_null') {\n      if (!this.spawnAddsAt[0.6] && hpPct < 0.6) {\n        this.spawnAddsAt[0.6] = true;\n        for (let i = 0; i < 6; i++) {\n          const ang = (i / 6) * TAU;\n          ctx.spawnEnemy('wraithling', this.x + Math.cos(ang) * 60, this.y + Math.sin(ang) * 60);\n        }\n      }\n      if (!this.spawnAddsAt[0.3] && hpPct < 0.3) {\n        this.spawnAddsAt[0.3] = true;\n        for (let i = 0; i < 6; i++) {\n          const ang = (i / 6) * TAU;\n          ctx.spawnEnemy('void_sentinel', this.x + Math.cos(ang) * 60, this.y + Math.sin(ang) * 60);\n        }\n      }\n    }\n  }\n\n  _moveAI(dt, ctx) {\n    const p = ctx.player;\n    const d = dist(this.x, this.y, p.x, p.y);\n    const ang = Math.atan2(p.y - this.y, p.x - this.x);\n    let spd = 50 + this.phase * 12;\n    if (d < 90) spd *= 0.3;\n    this.vx = Math.cos(ang) * spd;\n    this.vy = Math.sin(ang) * spd;\n    if (this.id === 'boss_bell') {\n      // slow drift\n      this.vx *= 0.4; this.vy *= 0.4;\n    }\n    if (this.id === 'boss_root') {\n      // stationary treant\n      this.vx *= 0.2; this.vy *= 0.2;\n    }\n    this.x += this.vx * dt;\n    this.y += this.vy * dt;\n  }\n\n  _performAttack(id, ctx) {\n    const p = ctx.player;\n    if (id === 'slam') {\n      ctx.fx.shakeScreen(5, 0.2);\n      ctx.fx.burst(this.x, this.y, this.color, 24, { life: 0.5, spd: 140, size: 2 });\n      // AOE ring\n      if (dist(this.x, this.y, p.x, p.y) < 80) { const d = p.takeDamage(15 * this.phase, ctx, this); if (d > 0) ctx.onPlayerHit(d, this.color); }\n    } else if (id === 'projectiles') {\n      const count = 6 + this.phase * 2;\n      const ang0 = Math.atan2(p.y - this.y, p.x - this.x);\n      for (let i = 0; i < count; i++) {\n        const ang = ang0 + (i - count / 2) * 0.15;\n        ctx.spawnProjectile({\n          x: this.x, y: this.y, vx: Math.cos(ang) * 110, vy: Math.sin(ang) * 110,\n          life: 2.4, dmg: 12 * this.phase, color: this.color, owner: 'enemy', size: 5,\n          family: this.realmId === 'void' ? 'void' : this.realmId === 'frozen' ? 'ice' : 'fire',\n        });\n      }\n    } else if (id === 'dash') {\n      const ang = Math.atan2(p.y - this.y, p.x - this.x);\n      this.vx = Math.cos(ang) * 360;\n      this.vy = Math.sin(ang) * 360;\n      ctx.fx.shakeScreen(4, 0.2);\n    } else if (id === 'special') {\n      // Realm-specific specials\n      if (this.realmId === 'frozen') {\n        // Frost nova\n        ctx.fx.burst(this.x, this.y, '#a8d4f4', 32, { life: 0.6, spd: 200 });\n        { const d = p.takeDamage(10 * this.phase, ctx, this); if (d > 0) ctx.onPlayerHit(d, '#a8d4f4'); }\n      } else if (this.realmId === 'infernal') {\n        // Meteor shower\n        for (let i = 0; i < 5; i++) {\n          const tx = p.x + (Math.random() - 0.5) * 100;\n          const ty = p.y + (Math.random() - 0.5) * 100;\n          ctx.spawnMeteor(tx, ty, 14 * this.phase, 40);\n        }\n      } else if (this.realmId === 'desert') {\n        // Sandstorm pull\n        for (let i = 0; i < 60; i++) {\n          const a = Math.random() * TAU;\n          ctx.fx.dust(this.x + Math.cos(a) * 100, this.y + Math.sin(a) * 100, '#d4a04a');\n        }\n        for (const e of ctx.enemiesInRange(this.x, this.y, 220)) {\n          const a = Math.atan2(this.y - e.y, this.x - e.x);\n          e.x += Math.cos(a) * 30; e.y += Math.sin(a) * 30;\n        }\n      } else if (this.realmId === 'void') {\n        // Reality shift\n        ctx.fx.flash(p.x, p.y, '#985ce0', 0.6);\n        ctx.fx.burst(this.x, this.y, '#985ce0', 40, { life: 1.0, spd: 250 });\n        { const d = p.takeDamage(8 * this.phase, ctx, this); if (d > 0) ctx.onPlayerHit(d, this.color); }\n      } else if (this.realmId === 'terminus') {\n        // Train echo ram\n        ctx.fx.shakeScreen(6, 0.4);\n        for (let i = 0; i < 6; i++) {\n          const ang = (i / 6) * TAU;\n          ctx.spawnProjectile({\n            x: this.x, y: this.y, vx: Math.cos(ang) * 140, vy: Math.sin(ang) * 140,\n            life: 2.0, dmg: 10 * this.phase, color: '#9a8aa0', owner: 'enemy', size: 5, family: 'train',\n          });\n        }\n      } else {\n        // generic\n        ctx.fx.burst(this.x, this.y, this.color, 16, { life: 0.5, spd: 160 });\n      }\n    }\n  }\n\n  takeDamage(amount, opts = {}) {\n    if (!this.alive) return 0;\n    const dealt = Math.min(this.hp, amount);\n    this.hp -= amount;\n    this.flashT = 0.1;\n    if (opts.burn) { this.burnT = opts.burnDur || 3; this.burnDps = Math.max(this.burnDps || 0, opts.burn); }\n    if (this.hp <= 0) {\n      this.hp = 0;\n      this.alive = false;\n      this.deathT = 1.2;\n    }\n    return dealt;\n  }\n}\n","js/entities/train.js":"// ============================================================\n// HELL TRAIN — The Train: a second, fully upgradable combat system\n// Animated engine + carriages, mounted weapons, ultimates,\n// overdrive mode and permanent shop progression.\n// ============================================================\nimport { rand, TAU, dist } from '../core/utils.js';\nimport { TRAIN_ULTIMATES } from '../data/realms.js';\n\nexport const TRAIN_GUNS = [\n  { id: 'fire_cannon', name: 'Hellfire Cannon', dmg: 20, cd: 1.5, range: 240, color: '#ff5a33',\n    kind: 'shot', sprite: 'orbFire', family: 'fire' },\n  { id: 'gatling', name: 'Soul Gatling', dmg: 7, cd: 0.16, range: 190, color: '#ffe066',\n    kind: 'shot', sprite: 'orbLight', family: 'plasma', spread: 0.22 },\n  { id: 'tesla_mast', name: 'Tesla Mast', dmg: 26, cd: 1.1, range: 200, color: '#8ef0ff',\n    kind: 'zap', family: 'lightning' },\n  { id: 'mortar', name: 'Carriage Mortar', dmg: 46, cd: 2.6, range: 280, color: '#ff9033',\n    kind: 'mortar', family: 'explosive', radius: 44 },\n  { id: 'flame_jet', name: 'Furnace Jets', dmg: 8, cd: 0.22, range: 96, color: '#ff7a1a',\n    kind: 'flame', family: 'fire' },\n  { id: 'void_lens', name: 'Void Lens', dmg: 16, cd: 1.8, range: 210, color: '#bc84f4',\n    kind: 'beam', family: 'void' },\n  { id: 'frost_battery', name: 'Frost Battery', dmg: 14, cd: 1.2, range: 200, color: '#8ef0ff',\n    kind: 'shot', sprite: 'orbIce', family: 'ice', slow: 0.4 },\n  { id: 'satellites', name: 'Phantom Satellites', dmg: 11, cd: 0.5, range: 74, color: '#9c8ab8',\n    kind: 'orbit', family: 'shadow' },\n  { id: 'railgun', name: 'Terminus Railgun', dmg: 90, cd: 3.4, range: 420, color: '#c0c0d8',\n    kind: 'rail', family: 'tech' },\n  { id: 'siege_ram', name: 'Siege Ram', dmg: 40, cd: 0.5, range: 30, color: '#e8c848',\n    kind: 'ram', family: 'physical' },\n];\nexport const findGun = (id) => TRAIN_GUNS.find(g => g.id === id);\n\nexport class Train {\n  constructor(x, y, art, difficulty, save) {\n    this.x = x; this.y = y;\n    this.vx = 0; this.vy = 0;\n    this.radius = 30;\n    this.art = art;\n    this.skinId = save?.trainSkin || 'iron_horse';\n    this.set = art.getTrainSet(this.skinId);\n    this.wheelPhase = 0;\n\n    this.maxHp = 900 * (difficulty?.trainHp || 1);\n    this.hp = this.maxHp;\n    this.armour = 6;\n    this.energy = 0; this.maxEnergy = 100;\n    this.dmgMul = 1; this.fireRate = 1; this.energyRate = 1;\n    this.repairRate = 0; this.ramDamage = 0; this.auraDamage = 0;\n    this.lootBonus = 0; this.extraSlots = 0;\n    this.overdrive = false; this.warMachine = false; this.finalStop = false;\n    this.guardian = false; this.guardianCd = 0;\n    this.invuln = 0; this.hitT = 0;\n    this.t = 0;\n\n    this.guns = ['fire_cannon', 'tesla_mast', 'satellites'];\n    this.gunCd = {};\n    this.orbiters = [];\n    this.ultimateId = 'hellfire_express';\n    this.ultimateCd = 0; this.ultimateT = 0;\n    this.dead = false;\n    this.carriages = ['cargo', 'gun'];\n  }\n\n  setSkin(id) { this.skinId = id; this.set = this.art.getTrainSet(id); }\n\n  mountRandomWeapon() {\n    const pool = TRAIN_GUNS.filter(g => !this.guns.includes(g.id));\n    if (!pool.length) {\n      // upgrade an existing one instead\n      const g = findGun(this.guns[Math.floor(Math.random() * this.guns.length)]);\n      if (g) this.dmgMul *= 1.1;\n      return null;\n    }\n    const g = pool[Math.floor(Math.random() * pool.length)];\n    this.guns.push(g.id);\n    if (this.carriages.length < 5) this.carriages.push(Math.random() < 0.5 ? 'gun' : 'cargo');\n    return g;\n  }\n\n  takeDamage(dmg, ctx) {\n    if (this.invuln > 0) return 0;\n    const dealt = Math.max(1, dmg - this.armour);\n    this.hp -= dealt;\n    this.hitT = 0.12;\n    ctx?.fx.sparks(this.x + rand(-20, 20), this.y + rand(-10, 6), '#ffb040', 4, rand(0, TAU));\n    if (this.hp <= 0) { this.hp = 0; this.dead = true; }\n    return dealt;\n  }\n  repair(n) { this.hp = Math.min(this.maxHp, this.hp + n); }\n\n  update(dt, ctx) {\n    this.t += dt;\n    if (this.invuln > 0) this.invuln -= dt;\n    if (this.hitT > 0) this.hitT -= dt;\n    if (this.guardianCd > 0) this.guardianCd -= dt;\n    if (this.repairRate) this.repair(this.repairRate * dt);\n\n    // --- movement: rolls along behind the player ---\n    const p = ctx.player;\n    const d = dist(this.x, this.y, p.x, p.y);\n    const want = 96;\n    if (d > want) {\n      const a = Math.atan2(p.y - this.y, p.x - this.x);\n      const spd = Math.min(190, 40 + (d - want) * 1.8);\n      this.vx += (Math.cos(a) * spd - this.vx) * Math.min(1, dt * 3);\n      this.vy += (Math.sin(a) * spd - this.vy) * Math.min(1, dt * 3);\n    } else {\n      this.vx *= Math.pow(0.15, dt); this.vy *= Math.pow(0.15, dt);\n    }\n    this.x += this.vx * dt; this.y += this.vy * dt;\n    const speed = Math.hypot(this.vx, this.vy);\n    this.wheelPhase = (this.wheelPhase + dt * (0.4 + speed * 0.02)) % 1;\n    this.facing = this.vx < -6 ? -1 : this.vx > 6 ? 1 : (this.facing || 1);\n\n    // --- smoke plume ---\n    if (Math.random() < 0.5) {\n      const sk = this.set.skin;\n      ctx.fx.spawn({ x: this.x + 12 * (this.facing || 1), y: this.y - 26, vx: rand(-8, 8) - this.vx * 0.2,\n        vy: rand(-26, -12), color: sk.pal.smoke, life: rand(0.7, 1.4), size: rand(2, 3.6),\n        endSize: 6, additive: false, drag: 0.96, light: this.overdrive ? 0.3 : 0 });\n    }\n    if (this.overdrive && Math.random() < 0.7) {\n      ctx.fx.embers(this.x + rand(-26, 26), this.y + rand(-8, 8), '#ff5a33', 2);\n    }\n\n    // --- energy ---\n    this.energy = Math.min(this.maxEnergy, this.energy + 7 * this.energyRate * dt * (this.overdrive ? 2 : 1));\n    if (this.ultimateCd > 0) this.ultimateCd -= dt;\n    if (this.ultimateT > 0) {\n      this.ultimateT -= dt;\n      this._ultimateTick(dt, ctx);\n    }\n    if (this.finalStop && this.ultimateCd <= 0) this.activateUltimate(ctx, true);\n    else if (this.energy >= this.maxEnergy && this.ultimateCd <= 0) this.activateUltimate(ctx, true);\n\n    // --- aura ---\n    if (this.auraDamage) {\n      this._auraT = (this._auraT || 0) - dt;\n      if (this._auraT <= 0) {\n        this._auraT = 0.5;\n        for (const e of ctx.enemiesInRange(this.x, this.y, 72)) {\n          ctx.dealDamage(e, this.auraDamage * 0.5 * this.dmgMul, { family: 'fire', small: true, byTrain: true });\n        }\n        ctx.fx.ring(this.x, this.y, 72, '#ff7a33', 0.3, 1);\n      }\n    }\n    // --- ram ---\n    if (this.ramDamage && speed > 30) {\n      for (const e of ctx.enemiesInRange(this.x, this.y, this.radius + 6)) {\n        if ((e._ramCd || 0) > this.t) continue;\n        e._ramCd = this.t + 0.4;\n        ctx.dealDamage(e, this.ramDamage * this.dmgMul, { family: 'physical', knockback: 160, byTrain: true });\n        ctx.fx.sparks(e.x, e.y, '#ffe066', 6, Math.atan2(e.y - this.y, e.x - this.x));\n      }\n    }\n\n    // --- guns ---\n    const rate = this.fireRate * (this.overdrive ? 1.8 : 1);\n    for (const id of this.guns) {\n      const g = findGun(id);\n      if (!g) continue;\n      this.gunCd[id] = (this.gunCd[id] || 0) - dt * rate;\n      if (this.gunCd[id] > 0) continue;\n      const range = this.warMachine ? g.range * 2.2 : g.range;\n      const shots = this.warMachine ? 2 : 1;\n      let fired = false;\n      for (let i = 0; i < shots; i++) fired = this._fireGun(g, range, ctx) || fired;\n      if (fired) this.gunCd[id] = g.cd;\n      else this.gunCd[id] = 0.15;\n    }\n\n    // --- orbiting satellites ---\n    if (this.guns.includes('satellites')) {\n      if (this.orbiters.length < 3) this.orbiters.push({ ang: this.orbiters.length * 2.1 });\n      for (const o of this.orbiters) {\n        o.ang += dt * 2.4;\n        o.x = this.x + Math.cos(o.ang) * 46;\n        o.y = this.y + Math.sin(o.ang) * 30;\n        for (const e of ctx.enemiesInRange(o.x, o.y, 10)) {\n          if ((e._satCd || 0) > this.t) continue;\n          e._satCd = this.t + 0.4;\n          ctx.dealDamage(e, 11 * this.dmgMul, { family: 'shadow', small: true, byTrain: true });\n        }\n      }\n    }\n  }\n\n  _fireGun(g, range, ctx) {\n    const targets = ctx.enemiesInRange(this.x, this.y, range);\n    if (ctx.boss?.alive && dist(this.x, this.y, ctx.boss.x, ctx.boss.y) < range) targets.push(ctx.boss);\n    if (!targets.length && g.kind !== 'ram') return false;\n    targets.sort((a, b) => dist(this.x, this.y, a.x, a.y) - dist(this.x, this.y, b.x, b.y));\n    const t = targets[0];\n    const dmg = g.dmg * this.dmgMul;\n    const a = t ? Math.atan2(t.y - this.y, t.x - this.x) : 0;\n    switch (g.kind) {\n      case 'shot':\n        ctx.spawnProjectile({\n          x: this.x + Math.cos(a) * 18, y: this.y - 10 + Math.sin(a) * 8,\n          vx: Math.cos(a + rand(-(g.spread || 0), g.spread || 0)) * 260,\n          vy: Math.sin(a + rand(-(g.spread || 0), g.spread || 0)) * 260,\n          life: 1.4, dmg, pierce: 1, color: g.color, sprite: g.sprite, owner: 'train',\n          size: 4, family: g.family, slow: g.slow, slowDur: g.slow ? 1.4 : 0,\n        });\n        ctx.fx.sparks(this.x + Math.cos(a) * 20, this.y - 10, g.color, 4, a);\n        break;\n      case 'zap':\n        ctx.fx.lightning(this.x, this.y - 20, t.x, t.y, g.color);\n        ctx.dealDamage(t, dmg, { family: g.family, byTrain: true });\n        break;\n      case 'mortar':\n        ctx.spawnMeteor(t.x, t.y, dmg, g.radius);\n        break;\n      case 'flame':\n        ctx.spawnFlame(this.x, this.y - 8, a, g.range, dmg);\n        for (const e of ctx.enemiesInRange(this.x, this.y, g.range)) {\n          const ea = Math.atan2(e.y - this.y, e.x - this.x);\n          if (Math.abs(((ea - a + Math.PI * 3) % TAU) - Math.PI) < 0.6) {\n            ctx.dealDamage(e, dmg, { family: 'fire', small: true, byTrain: true });\n          }\n        }\n        break;\n      case 'beam':\n        ctx.fx.beam(this.x, this.y - 14, t.x, t.y, g.color, 5, 0.22);\n        for (const e of ctx.enemiesInRange(t.x, t.y, 34)) ctx.dealDamage(e, dmg, { family: 'void', byTrain: true });\n        break;\n      case 'rail': {\n        const ex = this.x + Math.cos(a) * g.range, ey = this.y + Math.sin(a) * g.range;\n        ctx.fx.beam(this.x, this.y - 16, ex, ey, g.color, 9, 0.35);\n        ctx.fx.shakeScreen(6, 0.25);\n        for (const e of ctx.enemies) {\n          if (!e.alive) continue;\n          const proj = (e.x - this.x) * Math.cos(a) + (e.y - this.y) * Math.sin(a);\n          if (proj < 0 || proj > g.range) continue;\n          const px = this.x + Math.cos(a) * proj, py = this.y + Math.sin(a) * proj;\n          if (dist(px, py, e.x, e.y) < e.radius + 10) ctx.dealDamage(e, dmg, { family: 'tech', byTrain: true });\n        }\n        break;\n      }\n      case 'orbit': return true;\n      case 'ram': return false;\n    }\n    return true;\n  }\n\n  activateUltimate(ctx, auto = false) {\n    if (this.ultimateCd > 0) return false;\n    if (!this.finalStop && this.energy < this.maxEnergy * 0.5) return false;\n    this.energy = 0;\n    this.ultimateCd = this.finalStop ? 5 : (this.overdrive ? 14 : 24);\n    this.ultimateT = 3.5;\n    const def = TRAIN_ULTIMATES.find(u => u.id === this.ultimateId) || TRAIN_ULTIMATES[0];\n    this.ultDef = def;\n    ctx.fx.banner(this.x, this.y - 48, def.name.toUpperCase(), def.color);\n    ctx.fx.shakeScreen(10, 0.5);\n    ctx.camera?.punch(0.06);\n    ctx.fx.explosion(this.x, this.y, 'explFire', 2.2, { lightColor: def.color });\n    return true;\n  }\n\n  _ultimateTick(dt, ctx) {\n    const def = this.ultDef || TRAIN_ULTIMATES[0];\n    this._ultAcc = (this._ultAcc || 0) + dt;\n    if (this._ultAcc < 0.12) return;\n    this._ultAcc = 0;\n    const dmg = (def.dmg || 8) * this.dmgMul * 2;\n    if (def.beam) {\n      const a = Math.atan2(ctx.player.y - this.y, ctx.player.x - this.x);\n      const ex = this.x + Math.cos(a) * 480, ey = this.y + Math.sin(a) * 480;\n      ctx.fx.beam(this.x, this.y - 16, ex, ey, def.color, 12, 0.2);\n      for (const e of ctx.enemies) {\n        if (!e.alive) continue;\n        const proj = (e.x - this.x) * Math.cos(a) + (e.y - this.y) * Math.sin(a);\n        if (proj < 0 || proj > 480) continue;\n        const px = this.x + Math.cos(a) * proj, py = this.y + Math.sin(a) * proj;\n        if (dist(px, py, e.x, e.y) < e.radius + 18) ctx.dealDamage(e, dmg, { family: 'tech', byTrain: true });\n      }\n    } else if (def.pull) {\n      for (const e of ctx.enemiesInRange(this.x, this.y, 260)) {\n        const a = Math.atan2(this.y - e.y, this.x - e.x);\n        e.x += Math.cos(a) * 130 * 0.12; e.y += Math.sin(a) * 130 * 0.12;\n        ctx.dealDamage(e, dmg * 0.4, { family: 'void', small: true, byTrain: true });\n      }\n    } else if (def.lightning) {\n      const list = ctx.enemiesInRange(this.x, this.y, 260);\n      for (let i = 0; i < Math.min(4, list.length); i++) {\n        const e = list[Math.floor(Math.random() * list.length)];\n        ctx.fx.lightning(this.x, this.y - 30, e.x, e.y, def.color);\n        ctx.dealDamage(e, dmg, { family: 'lightning', byTrain: true });\n      }\n    } else {\n      // hellfire express: burning wake\n      for (const e of ctx.enemiesInRange(this.x, this.y, 130)) {\n        ctx.dealDamage(e, dmg * 0.6, { family: 'fire', small: true, byTrain: true });\n      }\n      ctx.fx.ring(this.x, this.y, 130, def.color, 0.3, 2);\n      ctx.fx.embers(this.x + rand(-40, 40), this.y + rand(-16, 16), def.color, 3);\n    }\n  }\n}\n","js/data/upgradecards.js":"// ============================================================\n// HELL TRAIN — Advanced Upgrade Card System\n// Tier-based cards with synergies and combinations\n// ============================================================\n\nexport const UPGRADE_CARDS = {\n  // Tier 1 - Basic upgrades\n  TIER1: [\n    {\n      id: 'dmg_basic_1',\n      name: 'Power Surge',\n      type: 'damage',\n      value: 0.15,\n      rarity: 'common',\n      tier: 1,\n      desc: '+15% Damage',\n      icon: '⚡',\n      synergies: ['dmg_basic_2', 'crit_basic_1'],\n    },\n    {\n      id: 'dmg_basic_2',\n      name: 'Force Multiplier',\n      type: 'damage',\n      value: 0.20,\n      rarity: 'uncommon',\n      tier: 1,\n      desc: '+20% Damage',\n      icon: '💥',\n      synergies: ['dmg_basic_1', 'spd_basic_1'],\n    },\n    {\n      id: 'spd_basic_1',\n      name: 'Haste',\n      type: 'attackSpeed',\n      value: 0.15,\n      rarity: 'common',\n      tier: 1,\n      desc: '+15% Attack Speed',\n      icon: '⚔',\n      synergies: ['dmg_basic_1', 'crit_basic_1'],\n    },\n    {\n      id: 'spd_basic_2',\n      name: 'Lightning Reflexes',\n      type: 'attackSpeed',\n      value: 0.25,\n      rarity: 'uncommon',\n      tier: 1,\n      desc: '+25% Attack Speed',\n      icon: '⚡',\n      synergies: ['spd_basic_1', 'dodge_basic_1'],\n    },\n    {\n      id: 'hp_basic_1',\n      name: 'Vitality Boost',\n      type: 'maxHP',\n      value: 30,\n      rarity: 'common',\n      tier: 1,\n      desc: '+30 Max HP',\n      icon: '❤',\n      synergies: ['dodge_basic_1', 'armour_basic_1'],\n    },\n    {\n      id: 'hp_basic_2',\n      name: 'Regeneration',\n      type: 'special',\n      value: 0.05,\n      rarity: 'uncommon',\n      tier: 1,\n      desc: 'Passive Heal 5% per second',\n      icon: '🌿',\n      synergies: ['hp_basic_1', 'dodge_basic_1'],\n    },\n    {\n      id: 'crit_basic_1',\n      name: 'Precision Strike',\n      type: 'critChance',\n      value: 0.15,\n      rarity: 'common',\n      tier: 1,\n      desc: '+15% Crit Chance',\n      icon: '🎯',\n      synergies: ['dmg_basic_1', 'spd_basic_1'],\n    },\n    {\n      id: 'dodge_basic_1',\n      name: 'Evasion',\n      type: 'dodge',\n      value: 0.15,\n      rarity: 'common',\n      tier: 1,\n      desc: '+15% Dodge',\n      icon: '🏃',\n      synergies: ['spd_basic_2', 'hp_basic_1'],\n    },\n    {\n      id: 'armour_basic_1',\n      name: 'Iron Skin',\n      type: 'armour',\n      value: 0.15,\n      rarity: 'common',\n      tier: 1,\n      desc: '+15% Armour',\n      icon: '🛡',\n      synergies: ['hp_basic_1', 'dodge_basic_1'],\n    },\n  ],\n\n  // Tier 2 - Intermediate upgrades\n  TIER2: [\n    {\n      id: 'dmg_inter_1',\n      name: 'Crushing Blow',\n      type: 'damage',\n      value: 0.35,\n      rarity: 'rare',\n      tier: 2,\n      desc: '+35% Damage',\n      icon: '💢',\n      synergies: ['dmg_basic_2', 'crit_inter_1'],\n    },\n    {\n      id: 'dmg_inter_2',\n      name: 'Omnistrike',\n      type: 'damage',\n      value: 0.50,\n      rarity: 'epic',\n      tier: 2,\n      desc: '+50% Damage to all weapons',\n      icon: '🔥',\n      synergies: ['dmg_inter_1', 'crit_inter_1'],\n    },\n    {\n      id: 'spd_inter_1',\n      name: 'Velocity Rush',\n      type: 'attackSpeed',\n      value: 0.40,\n      rarity: 'rare',\n      tier: 2,\n      desc: '+40% Attack Speed',\n      icon: '💨',\n      synergies: ['spd_basic_2', 'dmg_inter_1'],\n    },\n    {\n      id: 'crit_inter_1',\n      name: 'Deathblow',\n      type: 'critChance',\n      value: 0.30,\n      rarity: 'rare',\n      tier: 2,\n      desc: '+30% Crit Chance, +50% Crit Damage',\n      icon: '⚔️',\n      synergies: ['crit_basic_1', 'dmg_inter_1'],\n      critDamage: 0.50,\n    },\n    {\n      id: 'special_leech',\n      name: 'Life Drain',\n      type: 'special',\n      value: 0.20,\n      rarity: 'rare',\n      tier: 2,\n      desc: 'Heal 20% of damage dealt',\n      icon: '🧛',\n      synergies: ['dmg_inter_1', 'hp_basic_1'],\n    },\n    {\n      id: 'special_bounce',\n      name: 'Ricochet Master',\n      type: 'special',\n      value: 0.8,\n      rarity: 'rare',\n      tier: 2,\n      desc: 'Projectiles bounce 80% more',\n      icon: '🔄',\n      synergies: ['spd_inter_1', 'crit_inter_1'],\n    },\n    {\n      id: 'special_explosion',\n      name: 'Explosive Rounds',\n      type: 'special',\n      value: 1.5,\n      rarity: 'epic',\n      tier: 2,\n      desc: 'All hits trigger explosions',\n      icon: '💣',\n      synergies: ['dmg_inter_2', 'special_bounce'],\n    },\n    {\n      id: 'special_chain',\n      name: 'Chain Reaction',\n      type: 'special',\n      value: 0.5,\n      rarity: 'epic',\n      tier: 2,\n      desc: 'Attacks chain to 5 nearby enemies',\n      icon: '⛓',\n      synergies: ['spd_inter_1', 'special_leech'],\n    },\n  ],\n\n  // Tier 3 - Advanced upgrades (requires synergy)\n  TIER3: [\n    {\n      id: 'dmg_adv_1',\n      name: 'Titan Strength',\n      type: 'damage',\n      value: 0.70,\n      rarity: 'epic',\n      tier: 3,\n      desc: '+70% Damage',\n      icon: '🗿',\n      requires: ['dmg_inter_2'],\n      synergies: ['crit_adv_1', 'special_inferno'],\n    },\n    {\n      id: 'crit_adv_1',\n      name: 'Assassin Mastery',\n      type: 'critChance',\n      value: 0.50,\n      rarity: 'epic',\n      tier: 3,\n      desc: '+50% Crit Chance, Guaranteed crit every 3rd hit',\n      icon: '🗡',\n      requires: ['crit_inter_1'],\n      synergies: ['dmg_adv_1', 'special_execution'],\n      critDamage: 1.0,\n    },\n    {\n      id: 'special_inferno',\n      name: 'Inferno Wave',\n      type: 'special',\n      value: 2.0,\n      rarity: 'epic',\n      tier: 3,\n      desc: 'Explosions ignite large fire waves',\n      icon: '🔥',\n      requires: ['special_explosion'],\n      synergies: ['dmg_adv_1', 'special_chain'],\n    },\n    {\n      id: 'special_execution',\n      name: 'Execute',\n      type: 'special',\n      value: 0.3,\n      rarity: 'epic',\n      tier: 3,\n      desc: 'Crit hits execute enemies below 30% HP',\n      icon: '⚡',\n      requires: ['crit_inter_1'],\n      synergies: ['crit_adv_1', 'special_leech'],\n    },\n    {\n      id: 'special_vortex',\n      name: 'Void Vortex',\n      type: 'special',\n      value: 150,\n      rarity: 'legendary',\n      tier: 3,\n      desc: 'Create vortex pulling enemies',\n      icon: '🌀',\n      requires: ['special_chain'],\n      synergies: ['special_inferno', 'special_execution'],\n      pullStrength: 150,\n    },\n  ],\n\n  // Tier 4 - Legendary upgrades (final evolution)\n  TIER4: [\n    {\n      id: 'legendary_god',\n      name: 'Divine Wrath',\n      type: 'damage',\n      value: 1.5,\n      rarity: 'legendary',\n      tier: 4,\n      desc: '+150% Damage, all attacks become AOE',\n      icon: '⚡',\n      requires: ['dmg_adv_1', 'crit_adv_1'],\n      synergies: ['special_inferno', 'special_execution', 'special_vortex'],\n      aoeRadius: 50,\n    },\n    {\n      id: 'legendary_infinity',\n      name: 'Infinity Stone',\n      type: 'special',\n      value: 3.0,\n      rarity: 'legendary',\n      tier: 4,\n      desc: 'All effects tripled, cooldowns reduced 80%',\n      icon: '💎',\n      requires: ['special_vortex'],\n      synergies: ['legendary_god', 'special_inferno'],\n      cooldownReduction: 0.80,\n    },\n    {\n      id: 'legendary_transcendence',\n      name: 'Transcendence',\n      type: 'special',\n      value: 5.0,\n      rarity: 'legendary',\n      tier: 4,\n      desc: 'Maximum power: +200% all stats, automatic dodge every 5s',\n      icon: '👑',\n      requires: ['legendary_god', 'legendary_infinity'],\n      synergies: [],\n      allStatsBuff: 2.0,\n      autoDodgeInterval: 5,\n    },\n  ],\n\n  // Tier 5 - Mythic/Ultimate upgrades\n  TIER5: [\n    {\n      id: 'mythic_apocalypse',\n      name: 'Apocalypse',\n      type: 'damage',\n      value: 3.0,\n      rarity: 'mythic',\n      tier: 5,\n      desc: '+300% Damage, destroys everything',\n      icon: '☠',\n      requires: ['legendary_transcendence'],\n      synergies: [],\n      piercingShots: 999,\n      screenWipe: true,\n    },\n    {\n      id: 'mythic_eternal',\n      name: 'Eternal Evolution',\n      type: 'special',\n      value: 10.0,\n      rarity: 'mythic',\n      tier: 5,\n      desc: 'Ultimate: Godlike power, invulnerability phases',\n      icon: '✨',\n      requires: ['legendary_transcendence'],\n      synergies: [],\n      invulnDuration: 2,\n      invulnCooldown: 8,\n    },\n  ],\n};\n\nexport const SYNERGY_BONUSES = {\n  // Damage synergies\n  dmg_synergy_1: {\n    cards: ['dmg_basic_1', 'crit_basic_1'],\n    bonus: { type: 'damage', value: 0.15 },\n    name: 'Precision Power',\n    desc: 'Combining power and precision',\n  },\n  dmg_synergy_2: {\n    cards: ['dmg_inter_2', 'crit_inter_1'],\n    bonus: { type: 'damage', value: 0.35 },\n    name: 'Overwhelming Force',\n    desc: 'Maximum damage synergy',\n  },\n  \n  // Speed synergies\n  spd_synergy_1: {\n    cards: ['spd_basic_2', 'dmg_basic_2'],\n    bonus: { type: 'attackSpeed', value: 0.20 },\n    name: 'Blitzing Strike',\n    desc: 'Combine speed and strength',\n  },\n  \n  // Special synergies\n  special_synergy_1: {\n    cards: ['special_explosion', 'special_chain'],\n    bonus: { type: 'special', explosionChains: 3 },\n    name: 'Chain Explosions',\n    desc: 'Explosions chain between enemies',\n  },\n  special_synergy_2: {\n    cards: ['special_inferno', 'special_execution'],\n    bonus: { type: 'special', executeThreshold: 0.5 },\n    name: 'Infernal Execution',\n    desc: 'Execute at 50% HP when burning',\n  },\n  \n  // Survival synergies\n  surv_synergy_1: {\n    cards: ['hp_basic_1', 'armour_basic_1'],\n    bonus: { type: 'armour', value: 0.20 },\n    name: 'Fortress',\n    desc: 'Combine health and armour',\n  },\n  surv_synergy_2: {\n    cards: ['dodge_basic_1', 'spd_basic_2'],\n    bonus: { type: 'dodge', value: 0.25 },\n    name: 'Shadow Dance',\n    desc: 'Dodge more through speed',\n  },\n};\n\n// Helper function to get all available upgrades for a level\nexport function getUpgradesForLevel(currentLevel, currentCards = []) {\n  const available = [];\n  \n  if (currentLevel < 5) available.push(...UPGRADE_CARDS.TIER1);\n  if (currentLevel >= 3) available.push(...UPGRADE_CARDS.TIER2);\n  if (currentLevel >= 6) available.push(...UPGRADE_CARDS.TIER3);\n  if (currentLevel >= 10) available.push(...UPGRADE_CARDS.TIER4);\n  if (currentLevel >= 15) available.push(...UPGRADE_CARDS.TIER5);\n\n  // Filter by requirements\n  return available.filter(card => {\n    if (!card.requires) return true;\n    return card.requires.some(req => currentCards.includes(req));\n  });\n}\n\n// Helper to calculate synergy bonus\nexport function calculateSynergyBonus(heldCards) {\n  let bonus = { damage: 0, attackSpeed: 0, dodge: 0, armour: 0 };\n  \n  for (const [key, synergy] of Object.entries(SYNERGY_BONUSES)) {\n    if (synergy.cards.every(card => heldCards.includes(card))) {\n      if (synergy.bonus.type === 'damage') bonus.damage += synergy.bonus.value;\n      else if (synergy.bonus.type === 'attackSpeed') bonus.attackSpeed += synergy.bonus.value;\n      else if (synergy.bonus.type === 'dodge') bonus.dodge += synergy.bonus.value;\n      else if (synergy.bonus.type === 'armour') bonus.armour += synergy.bonus.value;\n    }\n  }\n  \n  return bonus;\n}\n\n// Get rarity color for UI\nexport function getRarityColor(rarity) {\n  const colors = {\n    common: '#888888',\n    uncommon: '#22ff22',\n    rare: '#00d4ff',\n    epic: '#ffd700',\n    legendary: '#ff5a33',\n    mythic: '#ff00ff',\n  };\n  return colors[rarity] || '#ffffff';\n}\n\n// Get rarity class for CSS\nexport function getRarityClass(rarity) {\n  return `rarity-${rarity}`;\n}\n","js/data/upgrades_bridge.js":"// ============================================================\n// HELL TRAIN — TIERED UPGRADE-CARD BRIDGE\n// `js/data/upgradecards.js` holds 27 tier-based cards plus synergy\n// definitions, but stores them as inert data (type + value) with no\n// way to touch the player. This module turns each one into a real\n// Ascension the level-up screen can offer and the engine can apply,\n// and evaluates the synergy bonuses when their partner cards are held.\n// ============================================================\nimport { UPGRADE_CARDS, SYNERGY_BONUSES } from './upgradecards.js';\n\nconst TIER_RARITY = { 1: 'common', 2: 'uncommon', 3: 'rare', 4: 'epic', 5: 'legendary' };\nconst TYPE_FAMILY = {\n  damage: 'offence', attackSpeed: 'offence', critChance: 'offence',\n  maxHP: 'defence', armour: 'defence', dodge: 'defence', special: 'utility',\n};\nconst TYPE_ICON = {\n  damage: 'sword', attackSpeed: 'clock', critChance: 'target',\n  maxHP: 'heart', armour: 'shield', dodge: 'boot', special: 'gem',\n};\n\n// Apply one card's payload to the player.\nfunction applyCard(card, p, ctx) {\n  const v = card.value || 0;\n  switch (card.type) {\n    case 'damage': p.modMult('atkDmg', 1 + v); break;\n    case 'attackSpeed': p.modMult('atkSpd', 1 + v); break;\n    case 'critChance': p.crit += v; break;\n    case 'maxHP': p.maxHp += v; p.hp += v; break;\n    case 'armour': p.armour += v < 1 ? Math.max(1, Math.round(v * 20)) : v; break;\n    case 'dodge': p.dodge = Math.min(0.6, (p.dodge || 0) + v); break;\n    default: break;\n  }\n  // Optional extra payloads any card may carry.\n  if (card.critDamage) p.modMult('critDmg', 1 + card.critDamage);\n  if (card.cooldownReduction) p.modMult('cdr', 1 + card.cooldownReduction);\n  if (card.piercingShots) p.pierceBonus += card.piercingShots;\n  if (card.aoeRadius) p.aoeMult = (p.aoeMult || 1) * (1 + card.aoeRadius);\n  if (card.pullStrength) p.modMult('pickupRange', 1 + card.pullStrength / 300);\n  if (card.allStatsBuff) {\n    const a = card.allStatsBuff;\n    p.modMult('atkDmg', 1 + a); p.modMult('atkSpd', 1 + a);\n    p.modMult('moveSpd', 1 + a * 0.5); p.maxHp += Math.round(p.maxHp * a); p.hp = p.maxHp;\n  }\n  if (card.invulnDuration) {\n    p.autoInvuln = { dur: card.invulnDuration, cd: card.invulnCooldown || 10, t: card.invulnCooldown || 10 };\n  }\n  if (card.autoDodgeInterval) {\n    p.autoDodge = { every: card.autoDodgeInterval, t: card.autoDodgeInterval };\n  }\n  if (card.screenWipe) {\n    p.screenWipe = (p.screenWipe || 0) + 1;\n    ctx?.fx?.banner(p.x, p.y - 40, 'ANNIHILATION ARMED', '#ff2a2a');\n  }\n  if (card.explosionChains) p.chain = (p.chain || 0) + card.explosionChains;\n  if (card.executeThreshold) p.headsman = Math.max(p.headsman || 0, card.executeThreshold);\n}\n\nfunction convert(card) {\n  const rarity = card.rarity || TIER_RARITY[card.tier] || 'common';\n  const a = {\n    id: 'uc_' + card.id,\n    name: card.name,\n    icon: TYPE_ICON[card.type] || 'gem',\n    rarity,\n    family: TYPE_FAMILY[card.type] || 'utility',\n    max: 1,\n    tier: card.tier || 1,\n    tagline: card.icon && card.icon.length <= 2 ? undefined : undefined,\n    desc: () => card.desc,\n    tiered: true,\n    synergies: card.synergies || [],\n    apply: (p, lvl, ctx) => applyCard(card, p, ctx),\n  };\n  // Tier gating: higher tiers only show up once you are deep enough.\n  const minLevel = [0, 1, 6, 12, 20, 28][card.tier || 1] || 1;\n  a.cond = (p) => (p?.level || 1) >= minLevel;\n  // Explicit prerequisite chains (\"upgrades for upgrades\").\n  if (card.requires) {\n    const reqId = Array.isArray(card.requires) ? card.requires[0] : card.requires;\n    a.req = { id: 'uc_' + reqId, lvl: 1 };\n  }\n  return a;\n}\n\nexport const TIERED_ASCENSIONS = (() => {\n  const out = [];\n  for (const group of Object.values(UPGRADE_CARDS || {})) {\n    if (!Array.isArray(group)) continue;\n    for (const card of group) {\n      if (!card?.id || !card?.name) continue;\n      try { out.push(convert(card)); } catch { /* skip malformed */ }\n    }\n  }\n  return out;\n})();\n\n// ---- synergies ----\n// Called after every pick: if a synergy's partner cards are all held,\n// its bonus fires once and is announced on screen.\nexport function checkSynergies(owned, player, ctx, fired = {}) {\n  const results = [];\n  for (const [key, syn] of Object.entries(SYNERGY_BONUSES || {})) {\n    if (fired[key]) continue;\n    const have = (syn.cards || []).every(id => owned['uc_' + id]);\n    if (!have || !(syn.cards || []).length) continue;\n    fired[key] = true;\n    const b = syn.bonus || {};\n    switch (b.type) {\n      case 'damage': player.modMult('atkDmg', 1 + (b.value || 0)); break;\n      case 'attackSpeed': player.modMult('atkSpd', 1 + (b.value || 0)); break;\n      case 'armour': player.armour += Math.max(1, Math.round((b.value || 0) * 20)); break;\n      case 'dodge': player.dodge = Math.min(0.6, player.dodge + (b.value || 0)); break;\n      case 'special':\n        if (b.explosionChains) player.chain = (player.chain || 0) + b.explosionChains;\n        if (b.executeThreshold) player.headsman = Math.max(player.headsman || 0, b.executeThreshold);\n        break;\n      default: break;\n    }\n    results.push(syn);\n    ctx?.fx?.banner(player.x, player.y - 46, 'SYNERGY — ' + syn.name.toUpperCase(), '#ffe066');\n    ctx?.fx?.explosion?.(player.x, player.y, 'explHoly', 1.8, { lightColor: '#ffe066' });\n  }\n  return results;\n}\n","js/data/upgrades.js":"// ============================================================\n// HELL TRAIN — THE ASCENSION GRID\n// Level-up upgrade cards (survivor-style). Every card has up to\n// five ranks, and deep ranks unlock EVOLVED cards (\"upgrades for\n// your upgrades\"). Reach the end of the grid and the run offers\n// the APOCALYPSE PROTOCOL — one insane, run-defining transformation.\n// ============================================================\n\nexport const RARITY_COLORS = {\n  common: '#b8b8cc', uncommon: '#74c04a', rare: '#54a8ff',\n  epic: '#c07aff', legendary: '#ffb020', mythic: '#ff4d6a',\n  apocalypse: '#ff2a2a',\n};\nexport const RARITY_WEIGHT = {\n  common: 100, uncommon: 62, rare: 34, epic: 16, legendary: 6, mythic: 2, apocalypse: 0,\n};\nexport const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];\n\nimport { TIERED_ASCENSIONS } from './upgrades_bridge.js';\n\nconst A = (o) => ({ target: 'player', max: 5, family: 'core', ...o });\n\n// ==================================================================\n// TIER 1 — CORE STATS (each has 5 ranks)\n// ==================================================================\nexport const ASCENSIONS = [\n  A({ id: 'fury', name: 'Fury', icon: 'sword', rarity: 'common', family: 'offence',\n    desc: (l) => `+${12 + l * 2}% damage`,\n    apply: (p, l) => p.modMult('atkDmg', 1 + (0.12 + l * 0.02)) }),\n  A({ id: 'alacrity', name: 'Alacrity', icon: 'clock', rarity: 'common', family: 'offence',\n    desc: (l) => `+${10 + l}% attack speed`,\n    apply: (p, l) => p.modMult('atkSpd', 1 + (0.10 + l * 0.01)) }),\n  A({ id: 'swiftness', name: 'Swiftness', icon: 'boot', rarity: 'common', family: 'mobility',\n    desc: (l) => `+${8 + l}% movement speed`,\n    apply: (p, l) => p.modMult('moveSpd', 1 + (0.08 + l * 0.01)) }),\n  A({ id: 'vitality', name: 'Vitality', icon: 'heart', rarity: 'common', family: 'defence',\n    desc: (l) => `+${20 + l * 5} max HP, heal the same`,\n    apply: (p, l) => { const v = 20 + l * 5; p.maxHp += v; p.heal(v); } }),\n  A({ id: 'greed', name: 'Greed', icon: 'coin', rarity: 'common', family: 'utility',\n    desc: (l) => `+${20 + l * 5}% coins and +25% pickup radius`,\n    apply: (p, l) => { p.coinMult = (p.coinMult || 1) * (1 + 0.20 + l * 0.05); p.modMult('pickupRange', 1.25); } }),\n  A({ id: 'insight', name: 'Insight', icon: 'gem', rarity: 'common', family: 'utility',\n    desc: (l) => `+${18 + l * 4}% XP gained`,\n    apply: (p, l) => p.modMult('xpGain', 1 + 0.18 + l * 0.04) }),\n\n  A({ id: 'precision', name: 'Precision', icon: 'target', rarity: 'uncommon', family: 'offence',\n    desc: (l) => `+${5 + l}% critical chance`,\n    apply: (p, l) => { p.crit += (5 + l) / 100; } }),\n  A({ id: 'savagery', name: 'Savagery', icon: 'skull', rarity: 'uncommon', family: train fires its ultimate every 5 seconds, forever`,\n    apply: (p, l, ctx) => { if (ctx?.train) ctx.train.finalStop = true; } }),\n];\n\n// ---- fold in the tier-based card set from js/data/upgradecards.js ----\n// The bridge converts those data-only cards into applicable Ascensions,\n// including their requires-chains, so they appear in the level-up roll.\nfor (const t of TIERED_ASCENSIONS) {\n  if (!ASCENSIONS.some(a => a.id === t.id)) ASCENSIONS.push(t);\n}\n\nexport function apocalypseReady(owned, playerLevel) {\n  if (owned.apocalypse_protocol) return false;\n  let deep = 0, total = 0;\n  for (const [id, lvl] of Object.entries(owned)) { total += lvl; if (lvl >= 3) deep++; }\n  return playerLevel >= 18 && (deep >= 3 || total >= 22);\n}\n\nexport function findAscension(id) {\n  return ASCENSIONS.find(a => a.id === id) || APOCALYPSE_CARDS.find(a => a.id === id) ||\n    (id === APOCALYPSE_PROTOCOL.id ? APOCALYPSE_PROTOCOL : null);\n}\n\n// Build the pool of cards currently offerable to the player.\nexport function offerPool(owned, player, ctx) {\n  const pool = [];\n  const src = player?.apocalypse ? ASCENSIONS.concat(APOCALYPSE_CARDS) : ASCENSIONS;\n  for (const a of src) {\n    const lvl = owned[a.id] || 0;\n    if (lvl >= (a.max || 5)) continue;\n    if (a.req) { const rl = owned[a.req.id] || 0; if (rl < a.req.lvl) continue; }\n    if (a.cond && !a.cond(player, ctx)) continue;\n    pool.push({ card: a, nextLevel: lvl + 1 });\n  }\n  return pool;\n}\n\n// Weighted pick of n distinct cards, biased toward the player's build.\nexport function rollCards(owned, player, ctx, n = 3, rng = Math.random) {\n  const pool = offerPool(owned, player, ctx);\n  const picks = [];\n  const used = new Set();\n  const familyCount = {};\n  for (const [id, lvl] of Object.entries(owned)) {\n    const c = findAscension(id);\n    if (c) familyCount[c.family] = (familyCount[c.family] || 0) + lvl;\n  }\n  let guard = 0;\n  while (picks.length < n && pool.length && guard++ < 400) {\n    let total = 0;\n    for (const p of pool) {\n      if (used.has(p.card.id)) continue;\n      total += weightOf(p, familyCount, owned);\n    }\n    if (total <= 0) break;\n    let r = rng() * total;\n    let chosen = null;\n    for (const p of pool) {\n      if (used.has(p.card.id)) continue;\n      r -= weightOf(p, familyCount, owned);\n      if (r <= 0) { chosen = p; break; }\n    }\n    if (!chosen) break;\n    used.add(chosen.card.id);\n    picks.push(chosen);\n  }\n  return picks;\n}\n\nfunction weightOf(p, familyCount, owned) {\n  let w = RARITY_WEIGHT[p.card.rarity] ?? 10;\n  if (p.card.rarity === 'apocalypse') w = 26;\n  // synergy: cards in families you already invest in show up more\n  w *= 1 + Math.min(1.6, (familyCount[p.card.family] || 0) * 0.14);\n  // finishing an existing chain feels good\n  if ((owned[p.card.id] || 0) > 0) w *= 1.35;\n  if (p.card.req) w *= 1.8;\n  return w;\n}\n","js/data/progression.js":"// ============================================================\n// HELL TRAIN — Complete Progression & Upgrade Systems\n// Coin Shop, Permanent Upgrades, and Progression Trees\n// ============================================================\n\n// ===== COIN SHOP SYSTEM =====\n// Permanent progression with coins earned from defeated enemies\nexport const COIN_SHOP = {\n  CHARACTER: {\n    maxHP: [\n      { level: 1, cost: 50, value: 10, label: 'Vitality I', desc: 'Max HP +10' },\n      { level: 2, cost: 100, value: 15, label: 'Vitality II', desc: 'Max HP +15' },\n      { level: 3, cost: 200, value: 20, label: 'Vitality III', desc: 'Max HP +20' },\n      { level: 4, cost: 350, value: 30, label: 'Legendary Resilience', desc: 'Max HP +30' },\n      { level: 5, cost: 500, value: 50, label: 'Eternal Durability', desc: 'Max HP +50' },\n    ],\n    attackDamage: [\n      { level: 1, cost: 60, value: 0.15, label: 'Power I', desc: 'Damage +15%' },\n      { level: 2, cost: 120, value: 0.20, label: 'Power II', desc: 'Damage +20%' },\n      { level: 3, cost: 250
