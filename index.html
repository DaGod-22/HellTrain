 6; i++) {\n        const a = t * 2 + i;\n        g.line(20 + i * 2, 22 + bob, 24 + sin(a) * 3, 34 + bob, m.glow);\n      }\n      g.rect(21, 13 + bob, 3, 3, m.glow); g.rect(28, 13 + bob, 3, 3, m.glow);\n      // horns\n      g.line(19, 9 + bob, 14, 2 + bob, m.dark, 2);\n      g.line(33, 9 + bob, 38, 2 + bob, m.dark, 2);\n    } },\n  bossBell: { w: 46, h: 50, pal: { body: '#7a5c18', dark: '#3a2a08', glow: '#ffe878', metal: '#e8c848' },\n    draw: (g, m, t) => {\n      const sw = sin(t * TAU) * 3;\n      // giant bell body (domed top, flared skirt)\n      g.ell(23 + sw * 0.3, 16, 11, 11, m.metal);\n      g.poly([[12 + sw * 0.3, 16], [34 + sw * 0.3, 16], [38, 33], [8, 33]], m.metal);\n      g.ell(23 + sw * 0.3, 33, 15, 4, m.metal);\n      g.ell(23 + sw * 0.3, 34, 12, 2.6, m.dark);\n      g.rect(9, 30, 28, 2, m.body);\n      g.ell(23 + sw, 40, 3.4, 3.4, m.dark);  // clapper\n      g.line(23, 34, 23 + sw, 40, m.dark);\n      // face on bell\n      g.rect(17, 22, 4, 4, m.glow); g.rect(25, 22, 4, 4, m.glow);\n      g.rect(19, 29, 8, 2, m.dark);\n      // crown/hook\n      g.ring(23, 5, 3.4, 1.6, m.trim || m.metal);\n      // floating hands\n      g.ell(4, 22 + sw, 3.4, 3.4, m.body);\n      g.ell(42, 22 - sw, 3.4, 3.4, m.body);\n    } },\n  bossRoot: { w: 52, h: 50, pal: { body: '#3a5a24', dark: '#152410', glow: '#c0ff90' },\n    draw: (g, m, t) => {\n      const sw = sin(t * TAU) * 2;\n      g.ell(26, 30, 15, 13, m.body);            // trunk mass\n      g.ell(26, 18, 9, 8, m.body);\n      for (let i = 0; i < 6; i++) {              // roots\n        const a = Math.PI + (i / 5) * Math.PI;\n        g.limb(26 + cos(a) * 12, 38, 26 + cos(a) * 24, 48 + sin(i + t * 4) * 2, 2.4, m.dark);\n      }\n      for (let i = 0; i < 4; i++) {              // branches\n        const a = -0.4 - i * 0.5;\n        g.limb(26, 16, 26 + cos(a) * (16 - i * 2) * (i % 2 ? 1 : -1), 6 + sw, 2, m.dark);\n      }\n      g.rect(20, 16, 4, 4, m.glow); g.rect(29, 16, 4, 4, m.glow);\n      g.rect(22, 24, 9, 3, m.dark);\n      for (let i = 0; i < 5; i++) g.px(18 + i * 4, 27 + (i % 2), m.glow);\n    } },\n  bossFrost: { w: 50, h: 52, pal: { body: '#2b4a70', dark: '#0e1a30', glow: '#8ef0ff', metal: '#a8d4f4' },\n    draw: (g, m, t) => {\n      const bob = Math.round(sin(t * TAU) * 2);\n      g.poly([[25, 14 + bob], [38, 26 + bob], [40, 48], [10, 48], [12, 26 + bob]], m.body);\n      g.ell(25, 12 + bob, 7, 7, m.metal);\n      // ice crown\n      for (let i = -2; i <= 2; i++) g.poly([[25 + i * 4, 6 + bob], [27 + i * 4, 12 + bob], [23 + i * 4, 12 + bob]], m.glow);\n      g.px(22, 12 + bob, m.glow); g.px(28, 12 + bob, m.glow);\n      const sw = sin(t * TAU) * 3;\n      g.limb(12, 24 + bob, 4, 34 + sw, 3, m.body);\n      g.limb(38, 24 + bob, 46, 34 - sw, 3, m.body);\n      // frozen sceptre\n      g.line(46, 34 - sw, 46, 14 - sw, m.metal, 1.6);\n      g.ell(46, 12 - sw, 3.2, 3.6, m.glow);\n      for (let i = 0; i < 4; i++) g.line(16 + i * 6, 30 + bob, 18 + i * 6, 44, m.metal);\n    } },\n  bossSand: { w: 56, h: 52, pal: { body: '#9c8442', dark: '#3a2f14', glow: '#f0e0a0', metal: '#dcc87c' },\n    draw: (g, m, t) => {\n      const bob = Math.round(sin(t * TAU) * 2);\n      g.ell(28, 32, 18, 14, m.body);\n      g.ell(28, 16 + bob, 10, 9, m.body);\n      // headdress\n      g.poly([[18, 14 + bob], [38, 14 + bob], [42, 26 + bob], [14, 26 + bob]], m.metal);\n      g.rect(22, 16 + bob, 4, 3, m.glow); g.rect(31, 16 + bob, 4, 3, m.glow);\n      const sw = sin(t * TAU) * 3;\n      g.limb(11, 28, 3, 40 + sw, 3.4, m.body);\n      g.limb(45, 28, 53, 40 - sw, 3.4, m.body);\n      // sand streams\n      for (let i = 0; i < 8; i++) g.px(10 + i * 5, 44 + ((i + (t * 5 | 0)) % 4), m.metal);\n      g.rect(24, 30, 9, 2, m.dark);\n    } },\n  bossNull: { w: 52, h: 52, pal: { body: '#2a1240', dark: '#0e0418', glow: '#c07aff', metal: '#7a44c0' },\n    draw: (g, m, t) => {\n      // a rotating void polyhedron with eyes\n      const r = 16 + sin(t * TAU) * 1.5;\n      const pts = [];\n      for (let i = 0; i < 6; i++) {\n        const a = t * TAU * 0.4 + i * (TAU / 6);\n        pts.push([26 + cos(a) * r, 26 + sin(a) * r * 0.86]);\n      }\n      g.poly(pts, m.body);\n      for (let i = 0; i < 6; i++) g.line(26, 26, pts[i][0], pts[i][1], m.dark);\n      g.ell(26, 26, 7, 7, m.dark);\n      g.ell(26, 26, 4 + sin(t * TAU * 2) * 1, 4, m.glow);\n      for (let i = 0; i < 3; i++) {\n        const a = -t * TAU + i * (TAU / 3);\n        g.ell(26 + cos(a) * 21, 26 + sin(a) * 18, 2.4, 2.4, m.glow);\n      }\n    } },\n  bossTrain: { w: 76, h: 48, pal: { body: '#3a0d18', dark: '#170408', glow: '#ff3a2a', metal: '#c8c0d8' },\n    draw: (g, m, t) => {\n      const bob = sin(t * TAU * 2) > 0 ? 0 : 1;\n      g.rect(6, 26 + bob, 64, 10, m.dark);\n      g.rect(10, 14 + bob, 48, 14, m.body);\n      g.rect(12, 4 + bob, 22, 12, m.body);\n      g.rect(52, 4 + bob, 10, 14, m.dark);\n      g.rect(52, 4 + bob, 10, 3, m.metal);\n      // demonic face grill\n      g.rect(58, 18 + bob, 12, 12, m.metal);\n      for (let i = 0; i < 5; i++) g.line(60 + i * 2, 18 + bob, 60 + i * 2, 30 + bob, m.dark);\n      g.rect(60, 20 + bob, 3, 3, m.glow); g.rect(66, 20 + bob, 3, 3, m.glow);\n      for (let i = 0; i < 4; i++) {\n        const wx = 16 + i * 14;\n        g.ell(wx, 36 + bob, 6, 6, m.metal);\n        for (let s = 0; s < 4; s++) {\n          const a = t * TAU + s * (TAU / 4);\n          g.line(wx, 36 + bob, wx + cos(a) * 5, 36 + bob + sin(a) * 5, m.dark);\n        }\n      }\n      g.rect(20, 8 + bob, 6, 5, m.glow);\n      g.rect(28, 8 + bob, 6, 5, m.glow);\n    } },\n};\n\n// ==================================================================\n// PROJECTILES / PICKUPS / FX SPRITES\n// ==================================================================\nfunction orbFrames(colA, colB, n = 6, size = 9, style = 'orb') {\n  const out = [];\n  for (let i = 0; i < n; i++) {\n    const t = i / n;\n    const g = new Pix(size, size);\n    const core = M(colB, { kind: 'glow' });\n    const shell = M(colA, { rim: colB });\n    const c = (size - 1) / 2;\n    if (style === 'orb') {\n      g.ell(c, c, size / 2 - 0.5 + sin(t * TAU) * 0.4, size / 2 - 0.5, shell);\n      g.ell(c, c, size / 4, size / 4, core);\n      for (let k = 0; k < 3; k++) {\n        const a = t * TAU + k * (TAU / 3);\n        g.px(c + cos(a) * (size / 2 - 0.5), c + sin(a) * (size / 2 - 0.5), core);\n      }\n    } else if (style === 'bolt') {\n      g.poly([[c, 0], [size - 1, c], [c, size - 1], [0, c]], shell);\n      g.line(c, 1, c, size - 2, core);\n    } else if (style === 'shard') {\n      g.poly([[c, 0], [size - 1, c + 1], [c, size - 1], [0, c - 1]], shell);\n      g.px(c, c, core);\n    } else if (style === 'saw') {\n      g.ell(c, c, size / 2 - 1, size / 2 - 1, shell);\n      for (let k = 0; k < 6; k++) {\n        const a = t * TAU + k * (TAU / 6);\n        g.px(c + cos(a) * (size / 2 - 0.4), c + sin(a) * (size / 2 - 0.4), core);\n      }\n      g.ell(c, c, 1.2, 1.2, core);\n    } else if (style === 'missile') {\n      g.rect(1, c - 1, size - 3, 3, shell);\n      g.poly([[size - 3, c - 2], [size - 1, c], [size - 3, c + 2]], core);\n      g.px(1, c + (i % 2 ? -1 : 1), core);\n    }\n    out.push(g.toCanvas({ lx: -0.5, ly: -0.6 }));\n  }\n  return out;\n}\n\nfunction coinFrames() {\n  const out = [];\n  const gold = M('#e8c848', { kind: 'metal', spec: 1, rim: '#fff0a0' });\n  const edge = M('#a07c24', { kind: 'metal' });\n  for (let i = 0; i < 8; i++) {\n    const t = i / 8;\n    const wq = Math.abs(cos(t * TAU));\n    const g = new Pix(10, 10);\n    const rx = Math.max(0.9, 4 * wq);\n    g.ell(5, 5, rx, 4, gold);\n    if (rx > 2.2) { g.ell(5, 5, rx - 1.4, 2.6, edge); g.px(5, 4, gold); g.px(5, 6, gold); }\n    out.push(g.toCanvas({ lx: -0.5, ly: -0.8 }));\n  }\n  return out;\n}\nfunction gemFrames(col, glowc) {\n  const out = [];\n  const body = M(col, { rim: glowc });\n  const core = M(glowc, { kind: 'glow' });\n  for (let i = 0; i < 6; i++) {\n    const t = i / 6;\n    const g = new Pix(9, 10);\n    const s = 1 + sin(t * TAU) * 0.12;\n    g.poly([[4.5, 0], [8, 4 * s], [4.5, 9], [1, 4 * s]], body);\n    g.px(4, 4, core); g.px(4, 3, core);\n    out.push(g.toCanvas({ lx: -0.6, ly: -0.7 }));\n  }\n  return out;\n}\nfunction heartFrames() {\n  const out = [];\n  const body = M('#d6311a', { rim: '#ff9033' });\n  const hi = M('#ff9a8a', { kind: 'glow' });\n  for (let i = 0; i < 6; i++) {\n    const t = i / 6;\n    const s = 1 + sin(t * TAU) * 0.14;\n    const g = new Pix(11, 10);\n    g.ell(3.5, 3.5 * s + 1, 2.6, 2.4 * s, body);\n    g.ell(7.5, 3.5 * s + 1, 2.6, 2.4 * s, body);\n    g.poly([[1, 4 * s + 1], [10, 4 * s + 1], [5.5, 9]], body);\n    g.px(3, 3, hi);\n    out.push(g.toCanvas({ lx: -0.6, ly: -0.8 }));\n  }\n  return out;\n}\nfunction chestFrames() {\n  const out = [];\n  const wood = M('#7a5224', { rim: '#e0b460' });\n  const gold = M('#e8c848', { kind: 'metal', spec: 1 });\n  for (let i = 0; i < 6; i++) {\n    const t = i / 6;\n    const g = new Pix(16, 14);\n    g.rect(2, 6, 12, 7, wood);\n    g.ell(8, 6, 6, 3.4, wood);\n    g.rect(2, 8, 12, 1, gold);\n    g.rect(7, 7, 2, 4, gold);\n    if (sin(t * TAU) > 0.3) g.px(8, 4, M('#ffe878', { kind: 'glow' }));\n    out.push(g.toCanvas({ lx: -0.6, ly: -0.8 }));\n  }\n  return out;\n}\n\n// Explosion / impact / muzzle sheets (radial, additive-friendly)\nfunction explosionFrames(colors, size = 40, n = 9) {\n  const out = [];\n  for (let i = 0; i < n; i++) {\n    const t = i / (n - 1);\n    const c = makeCanvas(size, size);\n    const ctx = c.getContext('2d');\n    const cx = size / 2, cy = size / 2;\n    const r = (0.25 + t * 0.75) * (size / 2);\n    const alpha = 1 - t * t;\n    // pixel-quantised rings\n    for (let ring = 0; ring < colors.length; ring++) {\n      const rr = Math.max(0, r - ring * (size * 0.09));\n      if (rr <= 0) continue;\n      ctx.fillStyle = colors[ring];\n      ctx.globalAlpha = alpha * (1 - ring * 0.18);\n      for (let a = 0; a < 64; a++) {\n        const ang = (a / 64) * TAU;\n        const jitter = ((a * 7 + i * 13) % 5) * 0.5 - 1;\n        const px = Math.round(cx + cos(ang) * (rr + jitter));\n        const py = Math.round(cy + sin(ang) * (rr + jitter));\n        ctx.fillRect(px - 1, py - 1, 2, 2);\n      }\n      if (ring === colors.length - 1 && t < 0.55) {\n        ctx.beginPath(); ctx.arc(cx, cy, rr * 0.55, 0, TAU); ctx.fill();\n      }\n    }\n    ctx.globalAlpha = 1;\n    out.push(c);\n  }\n  return out;\n}\n\nfunction slashFrames(col, n = 5, size = 34) {\n  const out = [];\n  for (let i = 0; i < n; i++) {\n    const t = i / (n - 1);\n    const c = makeCanvas(size, size);\n    const ctx = c.getContext('2d');\n    ctx.globalAlpha = 1 - t * 0.85;\n    ctx.strokeStyle = col;\n    ctx.lineWidth = Math.max(1, 4 - t * 3);\n    ctx.beginPath();\n    ctx.arc(size / 2, size / 2, size / 2 - 3 - t * 2, -0.9 + t * 0.4, 0.9 + t * 0.4);\n    ctx.stroke();\n    ctx.globalAlpha = 1;\n    out.push(c);\n  }\n  return out;\n}\n\n// ==================================================================\n// REGISTRY\n// ==================================================================\nexport function buildArt() {\n  const S = {};\n  S.anim = {};\n\n  // --- enemies ---\n  for (const [key, rig] of Object.entries(ENEMY_RIGS)) {\n    const frames = bakeCreature(rig, 6);\n    S.anim[key] = frames;\n    S[key] = frames[0];\n    for (const [realm, hue] of Object.entries(REALM_HUE)) {\n      S.anim[key + '_' + realm] = frames.map(f => hueShift(f, hue));\n      S[key + '_' + realm] = S.anim[key + '_' + realm][0];\n    }\n  }\n  // aliases used by enemy data\n  const alias = {\n    houndShadow: 'hound', brute_ash: 'brute', caster_fire: 'caster',\n    knight_void: 'knight', wraith: 'wraith',\n  };\n  for (const [a, base] of Object.entries(alias)) {\n    if (!S.anim[a]) { S.anim[a] = S.anim[base]; S[a] = S[base]; }\n    for (const realm of Object.keys(REALM_HUE)) {\n      S.anim[a + '_' + realm] = S.anim[base + '_' + realm];\n      S[a + '_' + realm] = S[base + '_' + realm];\n    }\n  }\n\n  // --- bosses ---\n  for (const [key, rig] of Object.entries(BOSS_RIGS)) {\n    const frames = bakeCreature(rig, 8);\n    S.anim[key] = frames;\n    S[key] = frames[0];\n  }\n  S.anim.bossPhantom = S.anim.bossConductor.map(f => hueShift(f, 90));\n  S.bossPhantom = S.anim.bossPhantom[0];\n\n  // --- projectiles ---\n  const projSets = {\n    orbFire: ['#ff5a33', '#ffe066', 'orb', 9],\n    orbIce: ['#5788c4', '#d4ecff', 'shard', 9],\n    orbVoid: ['#7a44c0', '#dcb4ff', 'orb', 10],\n    orbShadow: ['#3a3550', '#9c8ab8', 'orb', 8],\n    orbLight: ['#e8c848', '#fff0a0', 'bolt', 9],\n    orbPlasma: ['#2ff0ff', '#e8ffff', 'orb', 9],\n    orbToxic: ['#5a9c33', '#c0ff90', 'orb', 9],\n    orbBlood: ['#a01f12', '#ff6a5a', 'orb', 8],\n    sawBlade: ['#9c9cb8', '#ffffff', 'saw', 13],\n    missile: ['#8a8aa0', '#ff9033', 'missile', 12],\n    bomb: ['#2c2c38', '#ff5a33', 'orb', 11],\n    railSlug: ['#c0c0d8', '#8ef0ff', 'bolt', 11],\n  };\n  for (const [k, [a, b, style, size]] of Object.entries(projSets)) {\n    S.anim[k] = orbFrames(a, b, 6, size, style);\n    S[k] = S.anim[k][0];\n  }\n\n  // --- pickups ---\n  S.anim.coin = coinFrames();\n  S.coin = S.anim.coin[0];\n  S.anim.xp = gemFrames('#2b6ad0', '#8ef0ff');\n  S.xp = S.anim.xp[0];\n  S.anim.xpBig = gemFrames('#7a44c0', '#dcb4ff');\n  S.xpBig = S.anim.xpBig[0];\n  S.anim.shard = gemFrames('#a07c24', '#ffe878');\n  S.shard = S.anim.shard[0];\n  S.anim.heart = heartFrames();\n  S.heart = S.anim.heart[0];\n  S.anim.chest = chestFrames();\n  S.chest = S.anim.chest[0];\n  S.anim.magnet = gemFrames('#b03484', '#f080cc');\n  S.magnet = S.anim.magnet[0];\n\n  // --- fx sheets ---\n  S.fx = {\n    explFire: explosionFrames(['#ffffff', '#ffe066', '#ff9033', '#ff4d26', '#6b1510'], 44),\n    explIce: explosionFrames(['#ffffff', '#d4ecff', '#7ab0e0', '#3d6698'], 40),\n    explVoid: explosionFrames(['#ffffff', '#dcb4ff', '#985ce0', '#341858'], 44),\n    explHoly: explosionFrames(['#ffffff', '#fff0a0', '#ffe066', '#c8a030'], 40),\n    explToxic: explosionFrames(['#ffffff', '#c0ff90', '#5a9c33', '#1f3a14'], 40),\n    impact: explosionFrames(['#ffffff', '#ffd0a0'], 20, 6),\n    slash: slashFrames('#ffffff'),\n    slashFire: slashFrames('#ff9033'),\n  };\n  S.shadow = shadowSprite(18, 8);\n  S.shadowBig = shadowSprite(34, 14);\n  S.shadowHuge = shadowSprite(52, 20);\n\n  // --- character & train default sets ---\n  S.getCharSet = buildCharSet;\n  S.getTrainSet = buildTrainSet;\n\n  // back-compat flat keys\n  const c = buildCharSet('conductor');\n  S.playerDown = c.down.idle[0];\n  S.playerUp = c.up.idle[0];\n  S.playerSide = c.side.idle[0];\n  S.playerDownWalk = c.down.run[2];\n  S.playerUpWalk = c.up.run[2];\n  S.playerAttack = c.down.attack[1];\n  S.playerArmour = c.down.idle[0];\n  const tr = buildTrainSet('iron_horse');\n  S.trainEngine = tr.engine[0];\n  S.trainCar = tr.cargo[0];\n\n  // white-hit silhouette cache\n  const hitCache = new Map();\n  S.hitFlash = (canvas, tint = '#ffffff') => {\n    if (!canvas) return null;\n    let byTint = hitCache.get(canvas);\n    if (!byTint) { byTint = {}; hitCache.set(canvas, byTint); }\n    if (!byTint[tint]) byTint[tint] = whiteSilhouette(canvas, tint, 0.92);\n    return byTint[tint];\n  };\n  return S;\n}\n","js/data/icons.js":"// ============================================================\n// HELL TRAIN — UI icon atlas\n// The chunky menu icons are generated plates baked down by\n// tools/icons.mjs. They are pure decoration: if a file is missing\n// or slow, the UI falls back to the vector glyphs in home.js, so\n// boot can never hang or crash on them.\n// ============================================================\nexport const ICON_NAMES = [\n  'battle', 'train', 'arsenal', 'forge', 'coinshop',\n  'trophy', 'gift', 'daily', 'leaderboard', 'worldmap',\n  'armoury', 'relics', 'settings', 'bag', 'quickplay',\n];\n\nexport const ICONS = {};\n\nexport function loadIcons(base = 'assets/icons/', timeoutMs = 4000) {\n  if (typeof Image === 'undefined') return Promise.resolve(ICONS);\n  // The single-file build inlines the plates as data URIs on\n  // globalThis.__ICON_DATA; otherwise we fetch them from assets/icons/.\n  const inlined = globalThis.__ICON_DATA || null;\n  const one = (name) => new Promise((res) => {\n    try {\n      const im = new Image();\n      im.onload = () => { ICONS[name] = im; res(); };\n      im.onerror = () => res();\n      im.src = (inlined && inlined[name]) || (base + name + '.png');\n    } catch { res(); }\n  });\n  let timer = null;\n  const all = Promise.all(ICON_NAMES.map(one)).then(() => ICONS);\n  const bail = new Promise((res) => { timer = setTimeout(() => res(ICONS), timeoutMs); });\n  return Promise.race([all, bail]).then((r) => { clearTimeout(timer); return r; });\n}\n","js/core/save.js":"// ============================================================\n// HELL TRAIN — local save system with per-user support (AAA)\n// ============================================================\nconst KEY = 'helltrain.save.v2';\nconst OLD_KEY = 'helltrain.save.v1';\n\nfunction getUserKey() {\n  try {\n    const cur = localStorage.getItem('helltrain.auth.current');\n    if (cur) return KEY + '.' + cur;\n  } catch {}\n  return KEY;\n}\n\nexport function loadSave() {\n  try {\n    const userKey = getUserKey();\n    const raw = localStorage.getItem(userKey) || localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY);\n    if (!raw) return null;\n    return JSON.parse(raw);\n  } catch { return null; }\n}\nexport function saveSave(data) {\n  try {\n    const userKey = getUserKey();\n    localStorage.setItem(userKey, JSON.stringify(data));\n    // also keep generic copy for backwards compat\n    if (userKey !== KEY) localStorage.setItem(KEY, JSON.stringify(data));\n  } catch {}\n}\nexport function resetSave() {\n  try {\n    const userKey = getUserKey();\n    localStorage.removeItem(userKey);\n    localStorage.removeItem(KEY);\n    localStorage.removeItem(OLD_KEY);\n  } catch {}\n}\n\nexport function newSave() {\n  return {\n    version: 2,\n    coins: 500,\n    shards: 50,\n    achievements: [],\n    permaLevels: {},\n    ownedCharSkins: ['conductor'],\n    ownedTrainSkins: ['iron_horse'],\n    charSkin: 'conductor',\n    trainSkin: 'iron_horse',\n    perma: { player: {}, train: {} },\n    stats: { totalKills: 0, totalRuns: 0, bestScore: 0, longestRun: 0, highestStage: 0,\n      totalCoins: 0, apocalypses: 0, bestCombo: 0 },\n    discovered: [],\n    characters: ['conductor'],\n    weapons: [],\n    armour: ['guardian'],\n    relics: [],\n    activeRelic: null,\n    trainParts: 0,\n    bossCores: {},\n    unlockedRealms: ['purgatory','infernal'],\n    endings: [],\n    trainCarriages: ['gunsmith', 'medical'],\n    settings: { bloom: 1, lighting: 1, scanlines: 0.35, shake: 1, damageNumbers: 1, sound: 1 },\n    dailyStreak: 0,\n    lastDailyClaim: 0,\n    rewardsClaimed: {},\n    chests: { common: 1, rare: 0, epic: 0 },\n    playerId: 'HT-' + Math.random().toString(36).slice(2,8).toUpperCase(),\n    energy: 100,\n    // v1.4: per-family weapon mastery kills + daily goal tracking\n    familyKills: {},\n    dailyGoals: { date: '', goals: [], p: { kills: 0, coins: 0, elites: 0, boss: 0 }, claimed: [] },\n  };\n}\n\nexport function ensureShape(save) {\n  const s = save || newSave();\n  const d = newSave();\n  for (const k of Object.keys(d)) {\n    if (!(k in s) || s[k] === null || s[k] === undefined) s[k] = d[k];\n  }\n  for (const k of Object.keys(d.stats)) if (!(k in s.stats)) s.stats[k] = d.stats[k];\n  for (const k of Object.keys(d.settings)) if (!(k in s.settings)) s.settings[k] = d.settings[k];\n  if (!Array.isArray(s.ownedCharSkins) || !s.ownedCharSkins.length) s.ownedCharSkins = ['conductor'];\n  if (!Array.isArray(s.ownedTrainSkins) || !s.ownedTrainSkins.length) s.ownedTrainSkins = ['iron_horse'];\n  if (!s.ownedCharSkins.includes(s.charSkin)) s.charSkin = 'conductor';\n  if (!s.ownedTrainSkins.includes(s.trainSkin)) s.trainSkin = 'iron_horse';\n  s.version = 2;\n  if (!s.playerId) s.playerId = 'HT-' + Math.random().toString(36).slice(2,8).toUpperCase();\n  if (!s.chests) s.chests = { common: 1, rare: 0, epic: 0 };\n  if (!Array.isArray(s.trainCarriages)) s.trainCarriages = ['gunsmith', 'medical'];\n  if (!Array.isArray(s.relics)) s.relics = [];\n  if (!s.activeRelic) s.activeRelic = null;\n  if (!Array.isArray(s.endings)) s.endings = [];\n  return s;\n}\n\nexport function addCoins(save, n) {\n  save.coins = Math.max(0, Math.round((save.coins || 0) + n));\n  save.stats.totalCoins = (save.stats.totalCoins || 0) + Math.max(0, n);\n  return save.coins;\n}\nexport function spendCoins(save, n) {\n  if ((save.coins || 0) < n) return false;\n  save.coins -= n;\n  return true;\n}\n","js/systems/auth.js":"// ============================================================\n// HELL TRAIN — AAA AUTH SYSTEM\n// Username/password, no email required, guest support\n// God-level: secure local hash, profiles, avatars, stats\n// ============================================================\nconst AUTH_KEY = 'helltrain.auth.v1';\nconst CURRENT_KEY = 'helltrain.auth.current';\n\nfunction hashPass(s) {\n  // simple deterministic hash for game (not crypto secure, but obfuscated)\n  let h = 5381;\n  const salt = 'ht_salt_2026_aaa';\n  const str = salt + String(s);\n  for (let i = 0; i < str.length; i++) h = ((h << 5) + h) + str.charCodeAt(i);\n  h = h >>> 0;\n  // second round\n  let h2 = 0;\n  for (let i = 0; i < str.length; i++) h2 = (h2 * 31 + str.charCodeAt(i) + h) >>> 0;\n  return (h.toString(36) + '_' + h2.toString(36));\n}\n\nfunction randomGuestName() {\n  const adj = ['Iron','Shadow','Void','Ashen','Crimson','Neon','Ghost','Frost','Ember','Storm'];\n  const noun = ['Conductor','Rider','Drifter','Wraith','Revenant','Specter','Nomad','Vagabond','Outlaw','Phantom'];\n  return adj[Math.floor(Math.random()*adj.length)] + noun[Math.floor(Math.random()*noun.length)] + Math.floor(Math.random()*9000+1000);\n}\n\nfunction loadAuth() {\n  try {\n    const raw = localStorage.getItem(AUTH_KEY);\n    if (!raw) return { users: {} };\n    const data = JSON.parse(raw);\n    if (!data.users) data.users = {};\n    return data;\n  } catch { return { users: {} }; }\n}\nfunction saveAuth(data) {\n  try { localStorage.setItem(AUTH_KEY, JSON.stringify(data)); } catch {}\n}\nfunction getCurrentUsername() {\n  try { return localStorage.getItem(CURRENT_KEY) || null; } catch { return null; }\n}\nfunction setCurrentUsername(name) {\n  try { if (name) localStorage.setItem(CURRENT_KEY, name); else localStorage.removeItem(CURRENT_KEY); } catch {}\n}\n\nexport class AuthSystem {\n  constructor() {\n    this.data = loadAuth();\n    this.current = getCurrentUsername();\n  }\n  _save() { saveAuth(this.data); }\n  listUsers() { return Object.keys(this.data.users); }\n\n  // Register new user\n  register(username, password) {\n    username = String(username||'').trim().slice(0,20);\n    if (!username || username.length < 3) return { ok:false, error:'Username too short (min 3)' };\n    if (!/^[a-zA-Z0-9_]+$/.test(username)) return { ok:false, error:'Only letters, numbers, _ allowed' };\n    if (this.data.users[username]) return { ok:false, error:'Username taken' };\n    if (!password || password.length < 3) return { ok:false, error:'Password too short (min 3)' };\n    const hash = hashPass(password);\n    const now = Date.now();\n    this.data.users[username] = {\n      username,\n      passHash: hash,\n      guest: false,\n      created: now,\n      lastLogin: now,\n      avatar: 'conductor',\n      level: 1,\n      title: 'New Conductor',\n      coins: 0,\n      gems: 0,\n      streak: 0,\n      lastDaily: 0,\n    };\n    this._save();\n    this.current = username;\n    setCurrentUsername(username);\n    return { ok:true, user: this.data.users[username] };\n  }\n\n  login(username, password) {\n    username = String(username||'').trim();\n    const u = this.data.users[username];\n    if (!u) return { ok:false, error:'User not found' };\n    if (u.guest) {\n      // guest has no password, allow any\n      this.current = username;\n      setCurrentUsername(username);\n      u.lastLogin = Date.now();\n      this._save();\n      return { ok:true, user: u };\n    }\n    if (u.passHash !== hashPass(password)) return { ok:false, error:'Wrong password' };\n    this.current = username;\n    setCurrentUsername(username);\n    u.lastLogin = Date.now();\n    this._save();\n    return { ok:true, user: u };\n  }\n\n  guestLogin() {\n    // find existing guest or create new\n    // if current is guest, return it\n    if (this.current && this.data.users[this.current]?.guest) {\n      return { ok:true, user: this.data.users[this.current] };\n    }\n    // create new guest\n    let name;\n    for (let i=0;i<20;i++) {\n      const cand = randomGuestName();\n      if (!this.data.users[cand]) { name = cand; break; }\n    }\n    if (!name) name = 'Guest' + Math.floor(Math.random()*100000);\n    const now = Date.now();\n    this.data.users[name] = {\n      username: name,\n      passHash: '',\n      guest: true,\n      created: now,\n      lastLogin: now,\n      avatar: 'conductor',\n      level: 1,\n      title: 'Guest Conductor',\n      coins: 0,\n      gems: 0,\n      streak: 0,\n      lastDaily: 0,\n    };\n    this._save();\n    this.current = name;\n    setCurrentUsername(name);\n    return { ok:true, user: this.data.users[name] };\n  }\n\n  logout() {\n    this.current = null;\n    setCurrentUsername(null);\n  }\n\n  getCurrentUser() {\n    if (!this.current) return null;\n    return this.data.users[this.current] || null;\n  }\n\n  isGuest() {\n    const u = this.getCurrentUser();\n    return u ? !!u.guest : false;\n  }\n\n  upgradeGuest(newUsername, newPassword) {\n    const cur = this.getCurrentUser();\n    if (!cur || !cur.guest) return { ok:false, error:'Not a guest' };\n    newUsername = String(newUsername||'').trim().slice(0,20);\n    if (!newUsername || newUsername.length < 3) return { ok:false, error:'Username too short' };\n    if (this.data.users[newUsername]) return { ok:false, error:'Username taken' };\n    if (!newPassword || newPassword.length < 3) return { ok:false, error:'Password too short' };\n    // rename\n    const oldName = cur.username;\n    const newUser = { ...cur, username: newUsername, passHash: hashPass(newPassword), guest: false, title: 'Conductor' };\n    delete this.data.users[oldName];\n    this.data.users[newUsername] = newUser;\n    this.current = newUsername;\n    setCurrentUsername(newUsername);\n    this._save();\n    // also migrate save file if exists\n    try {\n      const oldKey = 'helltrain.save.v2.' + oldName;\n      const newKey = 'helltrain.save.v2.' + newUsername;\n      const raw = localStorage.getItem(oldKey) || localStorage.getItem('helltrain.save.v2');\n      if (raw) {\n        localStorage.setItem(newKey, raw);\n        localStorage.removeItem(oldKey);\n      }\n    } catch {}\n    return { ok:true, user: newUser };\n  }\n\n  deleteUser(username) {\n    if (this.data.users[username]) {\n      delete this.data.users[username];\n      if (this.current === username) {\n        this.current = null;\n        setCurrentUsername(null);\n      }\n      this._save();\n      try { localStorage.removeItem('helltrain.save.v2.' + username); } catch {}\n      return true;\n    }\n    return false;\n  }\n\n  updateProfile(updates) {\n    const u = this.getCurrentUser();\n    if (!u) return false;\n    Object.assign(u, updates);\n    this._save();\n    return true;\n  }\n\n  // daily streak\n  claimDaily() {\n    const u = this.getCurrentUser();\n    if (!u) return { ok:false, error:'No user' };\n    const now = Date.now();\n    const last = u.lastDaily || 0;\n    const oneDay = 24*60*60*1000;\n    const twoDays = 2*oneDay;\n    if (now - last < oneDay - 1000) {\n      return { ok:false, error:'Already claimed today', next: last + oneDay };\n    }\n    if (now - last > twoDays) {\n      u.streak = 1;\n    } else {\n      u.streak = (u.streak || 0) + 1;\n    }\n    u.lastDaily = now;\n    this._save();\n    // reward scales with streak\n    const reward = { coins: 100 + u.streak*25, gems: Math.floor(u.streak/3)+1, chest: u.streak % 7 === 0 };\n    return { ok:true, reward, streak: u.streak };\n  }\n\n  getLeaderboard() {\n    const users = Object.values(this.data.users);\n    users.sort((a,b)=> (b.level||0)-(a.level||0) || (b.coins||0)-(a.coins||0));\n    return users.slice(0,20);\n  }\n}\n\nexport const AUTH = new AuthSystem();\n","js/systems/supabase.js":"// ============================================================\n// HELL TRAIN — Supabase client with RLS-aware submit + leaderboards\n// Uses the official @supabase/supabase-js UMD bundle loaded via\n// CDN in index.html. Falls back to local-only mode if absent.\n// ============================================================\n\nconst SUPABASE_URL = (typeof window !== 'undefined' && window.HELLTRAIN_SUPABASE_URL) || '';\nconst SUPABASE_KEY = (typeof window !== 'undefined' && window.HELLTRAIN_SUPABASE_ANON) || '';\n\nexport class SupabaseClient {\n  constructor(url = SUPABASE_URL, key = SUPABASE_KEY) {\n    this.url = url; this.key = key;\n    this.client = null;\n    this.connected = false;\n    this._init();\n  }\n  _init() {\n    if (!this.url || !this.key) {\n      this.connected = false; return;\n    }\n    if (!window.supabase) { this.connected = false; return; }\n    try {\n      this.client = window.supabase.createClient(this.url, this.key, {\n        auth: { persistSession: false },\n        realtime: { params: { eventsPerSecond: 5 } },\n      });\n      this.connected = true;\n    } catch (e) {\n      this.connected = false; this.lastError = e?.message;\n    }\n  }\n  isAvailable() { return this.connected; }\n  async submitScore({ score, time, stage, realm, kills, character, difficulty, challenge, playerId }) {\n    if (!this.connected) return { ok: false, reason: 'offline' };\n    if (typeof score !== 'number' || score < 0 || score > 1e12) return { ok: false, reason: 'invalid' };\n    if (typeof time !== 'number' || time < 0 || time > 60 * 60 * 24) return { ok: false, reason: 'invalid' };\n    if (typeof stage !== 'number' || stage < 1 || stage > 999) return { ok: false, reason: 'invalid' };\n    const row = {\n      player_id: String(playerId || 'anon').slice(0, 64),\n      score: Math.floor(score),\n      time_s: Math.floor(time),\n      stage: Math.floor(stage),\n      realm: String(realm || 'purgatory').slice(0, 32),\n      kills: Math.floor(kills || 0),\n      character: String(character || 'conductor').slice(0, 32),\n      difficulty: String(difficulty || 'normal').slice(0, 16),\n      challenge: challenge ? String(challenge).slice(0, 32) : null,\n      client_hash: hashPlayer(playerId),\n      created_at: new Date().toISOString(),\n    };\n    try {\n      const { error } = await this.client.from('scores').insert(row);\n      if (error) return { ok: false, reason: error.message };\n      return { ok: true };\n    } catch (e) { return { ok: false, reason: e?.message || 'network' }; }\n  }\n  async topScores(limit = 20, filter = {}) {\n    if (!this.connected) return [];\n    try {\n      let q = this.client.from('scores').select('*').order('score', { ascending: false }).limit(limit);\n      if (filter.realm) q = q.eq('realm', filter.realm);\n      if (filter.difficulty) q = q.eq('difficulty', filter.difficulty);\n      if (filter.challenge) q = q.eq('challenge', filter.challenge);\n      const { data, error } = await q;\n      if (error) return [];\n      return data || [];\n    } catch { return []; }\n  }\n  subscribe(callback) {\n    if (!this.connected) return () => {};\n    const sub = this.client.channel('scores_changes')\n      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'scores' }, payload => {\n        callback(payload.new);\n      })\n      .subscribe();\n    return () => { try { this.client.removeChannel(sub); } catch {} };\n  }\n}\n\nfunction hashPlayer(id) {\n  // Anti-cheat: hash of player id used for double-submit detection\n  let h = 5381;\n  const s = 'htrain_' + String(id || 'anon');\n  for (let i = 0; i < s.length; i++) h = ((h << 5) + h) + s.charCodeAt(i);\n  return h >>> 0;\n}\n","js/systems/audio.js":"// ============================================================\n// HELL TRAIN — audio architecture\n// Procedurally-generated music & SFX using WebAudio. The synth\n// architecture is small but expressive enough to deliver the\n// requested per-realm ambience without shipping audio assets.\n// ============================================================\n\nclass SimpleReverb {\n  constructor(ctx, seconds = 1.5, decay = 2) {\n    this.ctx = ctx;\n    this.input = ctx.createGain();\n    this.output = ctx.createGain();\n    const len = Math.floor(ctx.sampleRate * seconds);\n    this.buf = ctx.createBuffer(2, len, ctx.sampleRate);\n    for (let ch = 0; ch < 2; ch++) {\n      const d = this.buf.getChannelData(ch);\n      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);\n    }\n    this.convolver = ctx.createConvolver();\n    this.convolver.buffer = this.buf;\n    this.input.connect(this.convolver);\n    this.convolver.connect(this.output);\n    this.output.gain.value = 0.4;\n  }\n}\n\nexport class AudioEngine {\n  constructor() {\n    this.ctx = null;\n    this.master = null;\n    this.music = null;\n    this.musicGain = null;\n    this.sfxGain = null;\n    this.enabled = true;\n  }\n  ensure() {\n    if (this.ctx) return;\n    const C = window.AudioContext || window.webkitAudioContext;\n    if (!C) return;\n    this.ctx = new C();\n    this.master = this.ctx.createGain();\n    this.master.gain.value = 0.8;\n    this.master.connect(this.ctx.destination);\n    this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.4;\n    this.musicGain.connect(this.master);\n    this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 0.6;\n    this.sfxGain.connect(this.master);\n    this.reverb = new SimpleReverb(this.ctx);\n  }\n  resume() { this.ensure(); if (this.ctx?.state === 'suspended') this.ctx.resume(); }\n  setMusicVolume(v) { this.ensure(); this.musicGain.gain.value = v; }\n  setSfxVolume(v) { this.ensure(); this.sfxGain.gain.value = v; }\n\n  // ====== Generic tone ======\n  tone(freq, dur, type = 'square', gain = 0.2, attack = 0.005, release = 0.1, slideTo = null) {\n    this.ensure(); if (!this.ctx) return;\n    const o = this.ctx.createOscillator();\n    o.type = type;\n    o.frequency.value = freq;\n    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, this.ctx.currentTime + dur);\n    const g = this.ctx.createGain();\n    g.gain.value = 0; g.gain.linearRampToValueAtTime(gain, this.ctx.currentTime + attack);\n    g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + dur - release);\n    o.connect(g); g.connect(this.sfxGain);\n    o.start(); o.stop(this.ctx.currentTime + dur);\n  }\n  noise(dur, gain = 0.1, filterFreq = 1000, attack = 0.005) {\n    this.ensure(); if (!this.ctx) return;\n    const len = Math.floor(this.ctx.sampleRate * dur);\n    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);\n    const d = buf.getChannelData(0);\n    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);\n    const src = this.ctx.createBufferSource(); src.buffer = buf;\n    const filt = this.ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = filterFreq;\n    const g = this.ctx.createGain(); g.gain.value = 0;\n    g.gain.linearRampToValueAtTime(gain, this.ctx.currentTime + attack);\n    g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + dur);\n    src.connect(filt); filt.connect(g); g.connect(this.sfxGain);\n    src.start();\n  }\n\n  // ====== SFX presets ======\n  hit() { this.tone(220, 0.06, 'square', 0.18); this.noise(0.06, 0.12, 1500); }\n  crit() { this.tone(440, 0.1, 'sawtooth', 0.2); this.tone(660, 0.1, 'square', 0.18); }\n  shoot() { this.tone(880, 0.05, 'square', 0.15); }\n  fireball() { this.tone(200, 0.18, 'sawtooth', 0.18, 0.005, 0.05); this.tone(120, 0.2, 'square', 0.15); }\n  lightning() { this.tone(1800, 0.08, 'sawtooth', 0.22); this.tone(2400, 0.06, 'square', 0.2); this.noise(0.08, 0.15, 3000); }\n  explosion() { this.tone(80, 0.3, 'square', 0.3); this.noise(0.4, 0.3, 800); }\n  pickup() { this.tone(660, 0.05, 'square', 0.18); setTimeout(() => this.tone(990, 0.06, 'square', 0.16), 30); }\n  levelup() { this.tone(440, 0.08); this.tone(660, 0.08); this.tone(880, 0.12); }\n  rarePickup() { this.tone(880, 0.1); this.tone(1100, 0.1); this.tone(1320, 0.16); }\n  bossIntro() { this.tone(110, 0.5, 'sawtooth', 0.3); this.tone(82, 0.6, 'square', 0.3); this.noise(0.4, 0.2, 400); }\n  death() { this.tone(220, 0.5, 'sawtooth', 0.25); this.tone(110, 0.8, 'square', 0.25); }\n  victory() { this.tone(660, 0.1); this.tone(880, 0.1); this.tone(1100, 0.2); }\n  dodge() { this.tone(660, 0.04, 'square', 0.15); this.tone(1200, 0.05, 'square', 0.12); }\n  trainWhistle() { this.tone(440, 0.4, 'sawtooth', 0.22); this.tone(660, 0.4, 'sine', 0.2); }\n\n  // ====== Music loop (simple, no assets) ======\n  startMusic(track) {\n    this.ensure(); if (!this.ctx) return;\n    if (this.music) { try { this.music.stop(); } catch {} }\n    this.music = { stop: () => {} };\n    this._musicTrack = track;\n    this._musicT = 0;\n    this._musicStep = 0;\n    this._musicNodes = [];\n    this._scheduleMusic();\n  }\n  _scheduleMusic() {\n    if (!this.ctx) return;\n    const t = this._musicTrack;\n    const bpm = t === 'boss' ? 110 : t === 'terminus' ? 90 : 80;\n    const beat = 60 / bpm;\n    // Sequence notes (pentatonic, mood varies per track)\n    const seqs = {\n      purgatory: [220, 247, 277, 330, 294, 277, 247, 220],\n      infernal:  [110, 110, 147, 110, 165, 110, 196, 110],\n      forgotten: [220, 277, 220, 330, 220, 277, 247, 196],\n      forest:    [247, 294, 330, 370, 330, 294, 247, 220],\n      frozen:    [330, 370, 440, 370, 330, 277, 247, 220],\n      desert:    [147, 175, 196, 220, 196, 175, 147, 110],\n      void:      [110, 138, 110, 165, 110, 196, 110, 220],\n      terminus:  [82, 110, 82, 147, 82, 165, 82, 196],\n      boss:      [110, 110, 165, 110, 220, 110, 247, 110],\n      menu:      [220, 247, 277, 330, 277, 247, 220, 196],\n    };\n    const seq = seqs[t] || seqs.purgatory;\n    const step = beat / 2;\n    const startT = this.ctx.currentTime + 0.05;\n    for (let i = 0; i < 16; i++) {\n      const note = seq[i % seq.length] * (i % 2 === 0 ? 1 : 0.5);\n      const when = startT + i * step;\n      const o = this.ctx.createOscillator();\n      o.type = t === 'void' ? 'sawtooth' : t === 'infernal' ? 'square' : 'triangle';\n      o.frequency.value = note;\n      const g = this.ctx.createGain();\n      g.gain.value = 0;\n      g.gain.linearRampToValueAtTime(0.12, when + 0.01);\n      g.gain.linearRampToValueAtTime(0, when + step * 0.9);\n      o.connect(g); g.connect(this.musicGain);\n      o.start(when); o.stop(when + step);\n      this._musicNodes.push(o);\n    }\n    // Drums: noise on every other beat\n    for (let i = 0; i < 8; i++) {\n      const when = startT + i * beat;\n      const src = this.ctx.createBufferSource();\n      const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.06, this.ctx.sampleRate);\n      const d = buf.getChannelData(0);\n      for (let j = 0; j < d.length; j++) d[j] = (Math.random() * 2 - 1) * (1 - j / d.length);\n      src.buffer = buf;\n      const filt = this.ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 220;\n      const g = this.ctx.createGain(); g.gain.value = 0.18;\n      src.connect(filt); filt.connect(g); g.connect(this.musicGain);\n      src.start(when);\n    }\n    // Schedule the next loop\n    setTimeout(() => {\n      if (this._musicTrack === t) this._scheduleMusic();\n    }, beat * 16 * 1000 - 200);\n  }\n  stopMusic() { this._musicTrack = null; if (this.music) { try { this.music.stop(); } catch {} } }\n}\n","js/core/sound.js":"// ============================================================\n// HELL TRAIN — AAA SOUND SYSTEM\n// Procedural WebAudio synth for SFX + ambient\n// ============================================================\nexport class SoundSystem {\n  constructor() {\n    this.ctx = null;\n    this.enabled = true;\n    this.master = 0.6;\n    this.sfxVol = 0.8;\n    this.musicVol = 0.4;\n    this._init();\n  }\n  _init() {\n    try {\n      const AC = window.AudioContext || window.webkitAudioContext;\n      if (!AC) return;\n      this.ctx = new AC();\n    } catch {}\n  }\n  _ensure() {\n    if (!this.ctx) this._init();\n    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();\n  }\n  playTone(freq, dur, type='sine', vol=0.3, slide=0) {\n    if (!this.enabled || !this.ctx) return;\n    this._ensure();\n    const t = this.ctx.currentTime;\n    const o = this.ctx.createOscillator();\n    const g = this.ctx.createGain();\n    o.type = type;\n    o.frequency.setValueAtTime(freq, t);\n    if (slide) o.frequency.linearRampToValueAtTime(freq*slide, t+dur);\n    g.gain.setValueAtTime(0, t);\n    g.gain.linearRampToValueAtTime(vol*this.master*this.sfxVol, t+0.01);\n    g.gain.exponentialRampToValueAtTime(0.001, t+dur);\n    o.connect(g); g.connect(this.ctx.destination);\n    o.start(t); o.stop(t+dur+0.05);\n  }\n  playNoise(dur, vol=0.2, filterFreq=1000) {\n    if (!this.enabled || !this.ctx) return;\n    this._ensure();\n    const t = this.ctx.currentTime;\n    const bufferSize = this.ctx.sampleRate * dur;\n    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);\n    const data = buffer.getChannelData(0);\n    for (let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1)*0.5;\n    const src = this.ctx.createBufferSource();\n    src.buffer = buffer;\n    const filter = this.ctx.createBiquadFilter();\n    filter.type='lowpass'; filter.frequency.value=filterFreq;\n    const g = this.ctx.createGain();\n    g.gain.setValueAtTime(vol*this.master*this.sfxVol, t);\n    g.gain.exponentialRampToValueAtTime(0.001, t+dur);\n    src.connect(filter); filter.connect(g); g.connect(this.ctx.destination);\n    src.start(t);\n  }\n  // SFX presets\n  hit(dmg=10, crit=false) {\n    this.playTone(crit? 800:400, crit?0.25:0.12, crit?'square':'sine', crit?0.35:0.18, crit?0.5:1.2);\n    if (crit) setTimeout(()=>this.playTone(1200,0.15,'sawtooth',0.2,0.6), 40);\n  }\n  shoot(kind='fire') {\n    const map = { fire: [600,0.12,'square'], ice:[900,0.1,'sine'], lightning:[1200,0.08,'sawtooth'], orbital:[300,0.2,'triangle'] };\n    const [f,d,ty] = map[kind]||[500,0.1,'sine'];\n    this.playTone(f,d,ty,0.15,1.5);\n  }\n  pickup() { this.playTone(600,0.2,'sine',0.25,2); setTimeout(()=>this.playTone(900,0.2,'sine',0.2,1.5),80); }\n  levelup() {\n    this.playTone(400,0.3,'sine',0.3,2);\n    setTimeout(()=>this.playTone(600,0.3,'sine',0.3,2),100);\n    setTimeout(()=>this.playTone(900,0.5,'sine',0.35,1.5),200);\n  }\n  explosion(size=1) {\n    this.playNoise(0.3*size, 0.25*size, 800);\n    this.playTone(120,0.4*size,'sawtooth',0.4*size,0.3);\n  }\n  dash() { this.playTone(200,0.2,'sawtooth',0.2,3); }\n  chest() {\n    this.playTone(500,0.2,'triangle',0.3,1.5);\n    setTimeout(()=>this.playTone(700,0.3,'triangle',0.3,1.8),120);\n    setTimeout(()=>this.playTone(1000,0.4,'sine',0.35,1.2),250);\n  }\n  boss() {\n    this.playTone(80,1.2,'sawtooth',0.5,0.5);\n    this.playTone(120,0.8,'square',0.3,0.7);\n  }\n  death() {\n    this.playTone(400,0.6,'sawtooth',0.35,0.3);\n    setTimeout(()=>this.playNoise(0.5,0.2,400),100);\n  }\n  // Music drone\n  playAmbient(realm='purgatory') {\n    if (!this.ctx || !this.enabled) return;\n    // simple ambient pad could be added\n  }\n}\nexport const SOUNDS = new SoundSystem();\n","js/core/utils.js":"// ============================================================\n// HELL TRAIN — math / random / helpers\n// ============================================================\nexport function mulberry32(seed) {\n  let a = seed >>> 0;\n  return function () {\n    a |= 0; a = (a + 0x6D2B79F5) | 0;\n    let t = Math.imul(a ^ (a >>> 15), 1 | a);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\nexport class RNG {\n  constructor(seed) { this.rng = mulberry32(seed || (Math.random() * 4294967295) >>> 0); }\n  next() { return this.rng(); }\n  range(a, b) { return a + this.rng() * (b - a); }\n  int(a, b) { return Math.floor(this.range(a, b + 1)); }\n  pick(arr) { return arr[Math.floor(this.rng() * arr.length)]; }\n  chance(p) { return this.rng() < p; }\n  shuffle(arr) {\n    const a = arr.slice();\n    for (let i = a.length - 1; i > 0; i--) {\n      const j = Math.floor(this.rng() * (i + 1));\n      [a[i], a[j]] = [a[j], a[i]];\n    }\n    return a;\n  }\n  weighted(items, getWeight) {\n    let total = 0;\n    for (const it of items) total += getWeight(it);\n    let r = this.rng() * total;\n    for (const it of items) { r -= getWeight(it); if (r <= 0) return it; }\n    return items[items.length - 1];\n  }\n}\n\nexport const clamp = (v, a, b) => v < a ? a : v > b ? b : v;\nexport const lerp = (a, b, t) => a + (b - a) * t;\nexport const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);\nexport const dist2 = (x1, y1, x2, y2) => { const dx = x2 - x1, dy = y2 - y1; return dx * dx + dy * dy; };\nexport const angleTo = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);\nexport const TAU = Math.PI * 2;\nexport const rand = (a, b) => a + Math.random() * (b - a);\nexport const randInt = (a, b) => Math.floor(rand(a, b + 1));\nexport const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];\nexport const chance = (p) => Math.random() < p;\n\nexport function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }\nexport function easeInCubic(t) { return t * t * t; }\nexport function easeOutBack(t) {\n  const c1 = 1.70158, c3 = c1 + 1;\n  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);\n}\n\n// Deterministic hash for names/ids\nexport function hashStr(str) {\n  let h = 2166136261;\n  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }\n  return h >>> 0;\n}\n\n// Format time m:ss\nexport function fmtTime(sec) {\n  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);\n  return `${m}:${s.toString().padStart(2, '0')}`;\n}\n\nexport function fmtNum(n) {\n  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';\n  if (n >= 1e4) return (n / 1e3).toFixed(1) + 'K';\n  return Math.floor(n).toString();\n}\n\n// ID generator\nlet uidCounter = 1;\nexport function uid() { return uidCounter++; }\n\n// Circle collision\nexport function circleHit(ax, ay, ar, bx, by, br) {\n  const dx = bx - ax, dy = by - ay, r = ar + br;\n  return dx * dx + dy * dy <= r * r;\n}\n\n// AABB overlap\nexport function aabbHit(ax, ay, aw, ah, bx, by, bw, bh) {\n  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;\n}\n\n// Rect-point\nexport function pointInRect(px, py, rx, ry, rw, rh) {\n  return px >= rx && px <= rx + rw && py >= ry && py <= ry + rh;\n}\n\n// Move with per-axis collision against a list of AABBs\nexport function moveWithCollision(x, y, dx, dy, w, h, solids) {\n  let nx = x + dx, ny = y + dy;\n  // X axis\n  let okX = true;\n  for (const s of solids) {\n    if (nx + w > s.x && nx < s.x + s.w && y + h > s.y && y < s.y + s.h) { okX = false; break; }\n  }\n  if (!okX) nx = x;\n  for (const s of solids) {\n    if (x + w > s.x && x < s.x + s.w && ny + h > s.y && ny < s.y + s.h) { okX = false; break; }\n  }\n  if (!okX) ny = y;\n  return [nx, ny];\n}\n","js/data/enemies.js":"// ============================================================\n// HELL TRAIN — enemy archetypes\n// ============================================================\nexport const ENEMIES = [\n  // chasers\n  { id: 'lost_soul', name: 'Lost Soul', hp: 14, dmg: 6, spd: 60, radius: 6, ai: 'chase', xp: 4, sprite: 'ghost',\n    behavior: 'floats', desc: 'A wandering spirit.' },\n  { id: 'wraithling', name: 'Wraithling', hp: 22, dmg: 9, spd: 80, radius: 6, ai: 'chase', xp: 6, sprite: 'wraith',\n    desc: 'A faster, more dangerous wraith.' },\n  { id: 'crawler', name: 'Crawler', hp: 18, dmg: 7, spd: 70, radius: 7, ai: 'chase', xp: 5, sprite: 'crawler',\n    desc: 'Skitters quickly.' },\n  { id: 'shadow_hound', name: 'Shadow Hound', hp: 28, dmg: 12, spd: 120, radius: 7, ai: 'chase', xp: 9, sprite: 'houndShadow',\n    desc: 'Fast predator.' },\n  // tanks\n  { id: 'station_keeper', name: 'Station Keeper', hp: 90, dmg: 14, spd: 38, radius: 10, ai: 'tank', xp: 14, sprite: 'knight',\n    desc: 'Armoured guardian.' },\n  { id: 'ash_brute', name: 'Ash Brute', hp: 110, dmg: 18, spd: 36, radius: 11, ai: 'tank', xp: 16, sprite: 'brute_ash',\n    desc: 'A smouldering giant.' },\n  // ranged\n  { id: 'station_caster', name: 'Station Caster', hp: 24, dmg: 12, spd: 50, radius: 7, ai: 'ranged', xp: 8, sprite: 'caster',\n    desc: 'Hurls bolts from afar.', proj: { id: 'shadow_bolt', dmg: 10, spd: 160, range: 220, cd: 1.6 } },\n  { id: 'fire_caster', name: 'Fire Caster', hp: 26, dmg: 14, spd: 50, radius: 7, ai: 'ranged', xp: 9, sprite: 'caster_fire',\n    desc: 'Hurls fire.', proj: { id: 'fire_bolt', dmg: 12, spd: 170, range: 220, cd: 1.7 } },\n  // swarm\n  { id: 'firefly_swarm', name: 'Firefly Swarm', hp: 6, dmg: 4, spd: 75, radius: 5, ai: 'swarm', xp: 2, sprite: 'flyer',\n    desc: 'Weak but plentiful.' },\n  // summoners\n  { id: 'wraith_summoner', name: 'Wraith Summoner', hp: 50, dmg: 8, spd: 44, radius: 8, ai: 'summoner', xp: 18, sprite: 'summoner',\n    desc: 'Spawns wraithlings.', summon: { id: 'wraithling', cd: 5, count: 2, max: 6 } },\n  // burrower\n  { id: 'ash_burrower', name: 'Ash Burrower', hp: 32, dmg: 11, spd: 60, radius: 7, ai: 'burrower', xp: 11, sprite: 'egg',\n    desc: 'Emerges from the ground.' },\n  // split\n  { id: 'slime', name: 'Slime', hp: 40, dmg: 7, spd: 50, radius: 9, ai: 's le, dodgeable, family-friendly ----\n  { id: 'ember_herald', name: 'Ember Herald', hp: 30, dmg: 14, spd: 42, radius: 8, ai: 'sweep', xp: 12, sprite: 'caster_fire',\n    desc: 'Marks a burning line — step off it before it blazes.' },\n  { id: 'slag_gobbler', name: 'Slag Gobbler', hp: 55, dmg: 8, spd: 30, radius: 9, ai: 'eater', xp: 16, sprite: 'blob',\n    desc: 'Eats your shots and grows. Deal with it first.' },\n  { id: 'mirror_wisp', name: 'Mirror Wisp', hp: 24, dmg: 6, spd: 85, radius: 6, ai: 'mirror', xp: 14, sprite: 'ghost',\n    desc: 'Bounces your shots back. Don\\'t just hold the trigger.' },\n];\n\n// Realm-specific roster overrides\nexport const REALM_ROSTERS = {\n  purgatory: ['lost_soul','crawler','wraithling','shadow_hound','station_caster','station_keeper','wraith_summoner','shadow_bat'],\n  infernal:  ['ash_brute','fire_caster','slime','ash_burrower','shadow_hound','firefly_swarm','wraith_summoner','station_keeper','ember_herald'],\n  forgotten: ['lost_soul','station_caster','station_keeper','shadow_bat','void_sentinel','wraith_summoner','wraithling'],\n  forest:    ['crawler','shadow_hound','slime','lost_soul','wraithling','wraith_summoner','firefly_swarm','slag_gobbler'],\n  frozen:    ['slime','station_keeper','wraithling','crawler','void_sentinel','shadow_bat','firefly_swarm'],\n  desert:    ['ash_brute','fire_caster','slime','ash_burrower','shadow_hound','wraith_summoner','ember_herald'],\n  void:      ['void_sentinel','lost_soul','wraith_summoner','shadow_bat','station_caster','slime','wraithling','mirror_wisp'],\n  terminus:  ['ash_brute','void_sentinel','wraith_summoner','station_keeper','shadow_hound','fire_caster','wraithling','shadow_bat'],\n  dreadmarsh: ['marsh_lurker','vine_tangler','slime','crawler','lost_soul','wraith_summoner','shadow_bat','firefly_swarm','slag_gobbler'],\n  foundry: ['foundry_hammer','molten_slinger','ash_brute','fire_caster','ash_burrower','void_sentinel','station_keeper','ember_herald'],\n  starlight: ['star_wisp','void_reaver','comet_crawler','void_sentinel','necro_conductor','shadow_bat','wraithling','lost_soul','mirror_wisp'],\n};\n\n// Elite modifiers\nexport const ELITE_MODS = [\n  { id: 'armoured', name: 'Armoured', apply: e => { e.hp *= 2.2; e.radius += 1; e.colorMod = 0.7; } },\n  { id: 'fast', name: 'Fast', apply: e => { e.spd *= 1.6; e.dmg *= 0.9; e.colorMod = 1.3; } },\n  { id: 'giant', name: 'Giant', apply: e => { e.hp *= 4; e.spd *= 0.85; e.radius *= 1.6; e.scale = 2; e.dmg *= 1.5; e.giant = true; } },\n  { id: 'regenerating', name: 'Regenerating', apply: e => { e.regen = Math.max(2, e.hp * 0.04); e.colorMod = 1.6; } },\n  { id: 'teleporting', name: 'Teleporting', apply: e => { e.teleportCd = 4; e.teleportRange = 80; e.colorMod = 0.4; } },\n  { id: 'summoner', name: 'Summoner', apply: e => { e.ai = 'summoner'; e.summon = { id: 'firefly_swarm', cd: 3.5, count: 2, max: 4 }; e.hp *= 1.4; e.colorMod = 0.2; } },\n  { id: 'enraged', name: 'Enraged', apply: e => { e.dmg *= 1.7; e.spd *= 1.15; e.colorMod = -0.15; } },\n  { id: 'void_touched', name: 'Void-Touched', apply: e => { e.voidTouched = true; e.hp *= 1.7; e.dmg *= 1.2; e.colorMod = -0.5; } },\n];\n\nexport function findEnemy(id) { return ENEMIES.find(e => e.id === id); }\n","js/core/world.js":"// ============================================================\n// HELL TRAIN — INFINITE procedural map generation\n// AAA scale: truly infinite, chunk-based, with biomes, POIs, tracks\n// ============================================================\nimport { RNG, randInt } from './utils.js';\nimport { REALM_ROSTERS } from '../data/enemies.js';\n\nconst TILE = 16;\nexport const TILE_SIZE = TILE;\n\nexport const T = {\n  EMPTY: 0, FLOOR: 1, WALL: 2, TREE: 3, ROCK: 4,\n  WATER: 5, LAVA: 6, ICE: 7, SAND: 8, VOID: 9,\n  ASH: 10, SNOW: 11, TRACK: 12, PLATFORM: 13,\n};\n\nconst BIOMES = {\n  purgatory: { ground: T.FLOOR, decor: [T.TREE, T.ROCK], hazard: T.WATER, fog: 0.5, color: '#2a1f3c' },\n  infernal:  { ground: T.ASH, decor: [T.ROCK, T.LAVA], hazard: T.LAVA, fog: 0.0, color: '#3a1710' },\n  forgotten: { ground: T.FLOOR, decor: [T.ROCK, T.WALL], hazard: T.WATER, fog: 0.2, color: '#222234' },\n  forest:    { ground: T.FLOOR, decor: [T.TREE, T.TREE], hazard: T.WATER, fog: 0.3, color: '#182e1c' },\n  frozen:    { ground: T.ICE, decor: [T.ROCK, T.SNOW], hazard: T.ICE, fog: 0.4, color: '#1e3450' },\n  desert:    { ground: T.SAND, decor: [T.ROCK, T.ROCK], hazard: T.SAND, fog: 0.1, color: '#4c391f' },\n  void:      { ground: T.VOID, decor: [T.VOID, T.VOID], hazard: T.VOID, fog: 0.0, color: '#140c2c' },\n  terminus:  { ground: T.PLATFORM, decor: [T.WALL], hazard: T.VOID, fog: 0.0, color: '#222226' },\n  phantom:   { ground: T.VOID, decor: [T.VOID, T.VOID], hazard: T.VOID, fog: 0.6, color: '#1c1034' },\n  // NEW SECTORS\n  dreadmarsh: { ground: T.FLOOR, decor: [T.TREE, T.ROCK], hazard: T.WATER, fog: 0.6, color: '#1a2a1a' },\n  foundry: { ground: T.ASH, decor: [T.WALL, T.ROCK], hazard: T.LAVA, fog: 0.1, color: '#2a1a10' },\n  starlight: { ground: T.VOID, decor: [T.PLATFORM, T.VOID], hazard: T.VOID, fog: 0.0, color: '#0e102a' },\n};\n\nconst CHUNK = 32; // tiles per chunk\nconst CHUNK_WORLD = CHUNK * TILE;\n\n// Simple hash for deterministic random\nfunction hash2(x, y, seed) {\n  let h = seed ^ (x * 374761393) ^ (y * 668265263);\n  h = Math.imul(h ^ (h >>> 13), 1274126177);\n  return (h ^ (h >>> 16)) >>> 0;\n}\nfunction hash3(x, y, z) {\n  let h = (x * 73856093) ^ (y * 19349663) ^ (z * 83492791);\n  h = Math.imul(h ^ (h >>> 13), 1274126177);\n  return (h ^ (h >>> 16)) >>> 0;\n}\n\nexport class World {\n  constructor(seed, realmId, difficulty) {\n    this.seed = seed >>> 0;\n    this.rng = new RNG(this.seed);\n    this.realmId = realmId;\n    this.difficulty = difficulty;\n    this.biome = BIOMES[realmId] || BIOMES.purgatory;\n    this.chunks = new Map(); // key -> {tiles, solid, doodad, lights}\n    this.lights = []; // global lights (accumulated from chunks)\n    this.rooms = []; // pseudo rooms for compatibility\n    this.specials = {};\n    this.W = 100000; // fake large for old code that checks W/H, but infinite logic ignores it\n    this.H = 100000;\n    this.tiles = null; // not used in infinite mode, but keep for compat\n    this.solid = null;\n    // Infinite: player spawn at 0,0\n    this.playerSpawn = { x: 0, y: 0 };\n    this.bossSpawn = { x: 0, y: 0 };\n    this.bossRoomId = 'infinite_boss';\n    // Pre-generate spawn area\n    this._ensureArea(0, 0, 5);\n    // Clear spawn\n    this._clearSpawn();\n    // Generate some fake rooms for minimap / legacy\n    this._generateLegacyRooms();\n  }\n\n  _key(cx, cy) { return cx + ',' + cy; }\n\n  _ensureArea(wx, wy, radiusChunks = 3) {\n    const ccx = Math.floor(wx / CHUNK_WORLD);\n    const ccy = Math.floor(wy / CHUNK_WORLD);\n    for (let dy = -radiusChunks; dy <= radiusChunks; dy++) {\n      for (let dx = -radiusChunks; dx <= radiusChunks; dx++) {\n        this._getOrGenChunk(ccx + dx, ccy + dy);\n      }\n    }\n  }\n\n  _getOrGenChunk(cx, cy) {\n    const k = this._key(cx, cy);\n    if (this.chunks.has(k)) return this.chunks.get(k);\n    const chunk = this._genChunk(cx, cy);\n    this.chunks.set(k, chunk);\n    // add its lights to global\n    for (const l of chunk.lights) this.lights.push(l);\n    // prune old chunks if too many (keep last 100)\n    if (this.chunks.size > 120) {\n      const first = this.chunks.keys().next().value;\n      const old = this.chunks.get(first);\n      // remove its lights\n      if (old) {\n        for (const l of old.lights) {\n          const idx = this.lights.indexOf(l);\n          if (idx >= 0) this.lights.splice(idx, 1);\n        }\n      }\n      this.chunks.delete(first);\n    }\n    return chunk;\n  }\n\n  _genChunk(cx, cy) {\n    const seed = this.seed;\n    const h = hash2(cx, cy, seed);\n    const rng = new RNG(h);\n    const tiles = new Uint8Array(CHUNK * CHUNK);\n    const solid = new Uint8Array(CHUNK * CHUNK);\n    const doodad = new Uint8Array(CHUNK * CHUNK);\n    const lights = [];\n    const biome = this.biome;\n\n    // Base ground\n    for (let i = 0; i < CHUNK * CHUNK; i++) tiles[i] = biome.ground;\n\n    // Distance from spawn for difficulty scaling\n    const distFromSpawn = Math.sqrt(cx * cx + cy * cy);\n\n    // Generate terrain features using noise-like patterns\n    for (let ly = 0; ly < CHUNK; ly++) {\n      for (let lx = 0; lx < CHUNK; lx++) {\n        const wx = cx * CHUNK + lx;\n        const wy = cy * CHUNK + ly;\n        const idx = ly * CHUNK + lx;\n        const worldX = wx * TILE;\n        const worldY = wy * TILE;\n\n        // Hash for this tile\n        const th = hash3(wx, wy, seed);\n        const r = (th & 0xFF) / 255;\n\n        // Spawn safe zone: 12 tile radius clear\n        const dSpawn = Math.sqrt(wx * wx + wy * wy);\n        if (dSpawn < 12) {\n          tiles[idx] = biome.ground;\n          solid[idx] = 0;\n          continue;\n        }\n\n        // Large scale noise for walls / forests\n        const noise = Math.sin(wx * 0.1) * Math.cos(wy * 0.1) + Math.sin(wx * 0.05 + wy * 0.07) * 0.5;\n        const noise2 = Math.sin(wx * 0.23) * Math.cos(wy * 0.19);\n\n        // Chance of obstacle increases with distance\n        let obstacleChance = 0.06 + distFromSpawn * 0.0015;\n        if (this.realmId === 'forest' || this.realmId === 'dreadmarsh') obstacleChance = 0.12;\n        if (this.realmId === 'foundry') obstacleChance = 0.10;\n        if (this.realmId === 'void' || this.realmId === 'starlight') obstacleChance = 0.04;\n\n        if (r < obstacleChance) {\n          // pick decor\n          const decor = rng.pick(biome.decor);\n          tiles[idx] = decor;\n          if (decor === T.TREE || decor === T.ROCK || decor === T.WALL) solid[idx] = 1;\n          else solid[idx] = 0;\n          doodad[idx] = rng.int(0, 3);\n          // occasional light\n          if (r < 0.01 && (decor === T.LAVA || this.realmId === 'infernal' || this.realmId === 'foundry')) {\n            lights.push({ x: worldX + 8, y: worldY + 8, radius: 80, color: '#ff7a33' });\n          }\n        } else if (r < obstacleChance + 0.03) {\n          // hazard\n          if (biome.hazard !== biome.ground && rng.chance(0.5)) {\n            tiles[idx] = biome.hazard;\n            solid[idx] = (biome.hazard === T.WALL) ? 1 : 0;\n          }\n        } else {\n          // occasional track remnants for hell-train vibe\n          if (rng.chance(0.008) && Math.abs(noise) > 0.7) {\n            tiles[idx] = T.TRACK;\n          }\n        }\n\n        // Add some procedural walls forming ruins\n        if (Math.abs(noise) > 0.85 && rng.chance(0.3)) {\n          tiles[idx] = T.WALL;\n          solid[idx] = 1;\n        }\n        // Void sparkles\n        if (biome.ground === T.VOID && r < 0.02) {\n          doodad[idx] = 1;\n        }\n      }\n    }\n\n    // Add POIs: small ruined rooms / treasure spots\n    if (rng.chance(0.25)) {\n      const rx = rng.int(4, CHUNK - 12);\n      const ry = rng.int(4, CHUNK - 12);\n      const rw = rng.int(6, 12);\n      const rh = rng.int(5, 9);\n      for (let y = ry; y < ry + rh; y++) {\n        for (let x = rx; x < rx + rw; x++) {\n          const idx = y * CHUNK + x;\n          if (x === rx || y === ry || x === rx + rw - 1 || y === ry + rh - 1) {\n            if (rng.chance(0.7)) { tiles[idx] = T.WALL; solid[idx] = 1; }\n          } else {\n            tiles[idx] = biome.ground;\n            solid[idx] = 0;\n          }\n        }\n      }\n      // door gap\n      const side = rng.int(0, 3);\n      if (side === 0) { const idx = ry * CHUNK + rx + Math.floor(rw / 2); tiles[idx] = biome.ground; solid[idx] = 0; }\n      if (side === 1) { const idx = (ry + rh - 1) * CHUNK + rx + Math.floor(rw / 2); tiles[idx] = biome.ground; solid[idx] = 0; }\n      if (side === 2) { const idx = (ry + Math.floor(rh / 2)) * CHUNK + rx; tiles[idx] = biome.ground; solid[idx] = 0; }\n      if (side === 3) { const idx = (ry + Math.floor(rh / 2)) * CHUNK + rx + rw - 1; tiles[idx] = biome.ground; solid[idx] = 0; }\n      lights.push({ x: (cx * CHUNK + rx + rw / 2) * TILE, y: (cy * CHUNK + ry + rh / 2) * TILE, radius: 120, color: '#fff0a0' });\n    }\n\n    return { tiles, solid, doodad, lights, cx, cy };\n  }\n\n  _clearSpawn() {\n    const radius = 14;\n    for (let dy = -radius; dy <= radius; dy++) {\n      for (let dx = -radius; dx <= radius; dx++) {\n        if (dx * dx + dy * dy > radius * radius) continue;\n        const wx = dx, wy = dy;\n        const cx = Math.floor(wx / CHUNK);\n        const cy = Math.floor(wy / CHUNK);\n        const chunk = this._getOrGenChunk(cx, cy);\n        const lx = ((wx % CHUNK) + CHUNK) % CHUNK;\n        const ly = ((wy % CHUNK) + CHUNK) % CHUNK;\n        const idx = ly * CHUNK + lx;\n        chunk.tiles[idx] = this.biome.ground;\n        chunk.solid[idx] = 0;\n      }\n    }\n  }\n\n  _generateLegacyRooms() {\n    // For minimap / compatibility, create virtual rooms spread infinitely\n    // Player can discover them as they explore\n    this.rooms = [\n      { x: -7, y: -5, w: 14, h: 10, id: 'start', kind: 'start' },\n    ];\n    for (let i = 0; i < 8; i++) {\n      const ang = (i / 8) * Math.PI * 2;\n      const dist = 40 + i * 18;\n      this.rooms.push({\n        x: Math.cos(ang) * dist,\n        y: Math.sin(ang) * dist,\n        w: 12 + (i % 3) * 3,\n        h: 9 + (i % 2) * 3,\n        id: 'poi_' + i,\n        kind: i % 3 === 0 ? 'treasure' : i % 3 === 1 ? 'elite' : 'shop',\n      });\n    }\n    this.specials = {};\n    for (const r of this.rooms) {\n      this.specials[r.id] = {\n        x: (r.x + r.w / 2) * TILE,\n        y: (r.y + r.h / 2) * TILE,\n        w: r.w * TILE, h: r.h * TILE, kind: r.kind, room: r,\n      };\n    }\n  }\n\n  // Compatibility: old code expects tiles array, but we now use chunks\n  _worldToChunk(wx, wy) {\n    const tx = Math.floor(wx / TILE);\n    const ty = Math.floor(wy / TILE);\n    const cx = Math.floor(tx / CHUNK);\n    const cy = Math.floor(ty / CHUNK);\n    const lx = ((tx % CHUNK) + CHUNK) % CHUNK;\n    const ly = ((ty % CHUNK) + CHUNK) % CHUNK;\n    return { cx, cy, lx, ly, tx, ty };\n  }\n\n  isSolidWorld(x, y) {\n    const { cx, cy, lx, ly } = this._worldToChunk(x, y);\n    const chunk = this._getOrGenChunk(cx, cy);\n    if (!chunk) return true;\n    return !!chunk.solid[ly * CHUNK + lx];\n  }\n\n  tileAtWorld(x, y) {\n    const { cx, cy, lx, ly } = this._worldToChunk(x, y);\n    const chunk = this._getOrGenChunk(cx, cy);\n    if (!chunk) return T.WALL;\n    return chunk.tiles[ly * CHUNK + lx];\n  }\n\n  // For renderer that wants doodad variant\n  doodadAtWorld(x, y) {\n    const { cx, cy, lx, ly } = this._worldToChunk(x, y);\n    const chunk = this._getOrGenChunk(cx, cy);\n    if (!chunk) return 0;\n    return chunk.doodad ? chunk.doodad[ly * CHUNK + lx] : 0;\n  }\n\n  roomAtWorld(x, y) {\n    // Return nearest POI if within\n    const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);\n    for (const r of this.rooms) {\n      if (tx >= r.x && tx < r.x + r.w && ty >= r.y && ty < r.y + r.h) return r;\n    }\n    return null;\n  }\n\n  pickEnemyRoster(stage) {\n    const roster = REALM_ROSTERS[this.realmId] || REALM_ROSTERS.purgatory;\n    return roster.slice();\n  }\n\n  // Infinite: ensure chunks around a point are loaded (call each frame from gameplay)\n  ensureAround(x, y, radius = 4) {\n    this._ensureArea(x, y, radius);\n  }\n}\n","js/core/render.js":"// ============================================================\n// HELL TRAIN — RENDER PIPELINE\n// Deferred-ish 2D lighting + bloom + colour grading + CRT juice,\n// all at the native low internal resolution so every effect\n// stays perfectly pixel-locked.\n//\n//   scene  -> light buffer (multiply) -> bloom (screen)\n//          -> grade -> vignette -> aberration -> scanlines -> flash\n// ============================================================\nimport { makeCanvas } from './pixel.js';\n\nconst TAU = Math.PI * 2;\n\nexport class Renderer {\n  constructor(w, h) {\n    this.w = w; this.h = h;\n    this.scene = makeCanvas(w, h);\n    this.sctx = this.scene.getContext('2d');\n    this.light = makeCanvas(w, h);\n    this.lctx = this.light.getContext('2d');\n    this.bloomA = makeCanvas(Math.ceil(w / 2), Math.ceil(h / 2));\n    this.bactx = this.bloomA.getContext('2d');\n    this.bloomB = makeCanvas(Math.ceil(w / 2), Math.ceil(h / 2));\n    this.bbctx = this.bloomB.getContext('2d');\n    this.tmp = makeCanvas(w, h);\n    this.tctx = this.tmp.getContext('2d');\n    for (const c of [this.sctx, this.lctx, this.bactx, this.bbctx, this.tctx]) c.imageSmoothingEnabled = false;\n    this.lights = [];\n    this.quality = 'high';       // high | medium | low\n    this.settings = {\n      bloom: 0.55, lighting: 1, grade: 1, vignette: 0.5, scanlines: 0, aberration: 0.5, grain: 0,\n    };\n    this._gradCache = new Map();\n  }\n\n  resize(w, h) {\n    if (this.w === w && this.h === h) return;\n    this.w = w; this.h = h;\n    this.scene = makeCanvas(w, h); this.sctx = this.scene.getContext('2d');\n    this.light = makeCanvas(w, h); this.lctx = this.light.getContext('2d');\n    this.bloomA = makeCanvas(Math.ceil(w / 2), Math.ceil(h / 2)); this.bactx = this.bloomA.getContext('2d');\n    this.bloomB = makeCanvas(Math.ceil(w / 2), Math.ceil(h / 2)); this.bbctx = this.bloomB.getContext('2d');\n    this.tmp = makeCanvas(w, h); this.tctx = this.tmp.getContext('2d');\n  }\n\n  // ---- frame lifecycle ----\n  begin() {\n    this.lights.length = 0;\n    this.sctx.setTransform(1, 0, 0, 1, 0, 0);\n    this.sctx.clearRect(0, 0, this.w, this.h);\n    return this.sctx;\n  }\n\n  // Screen-space light. r in screen px.\n  addLight(x, y, r, color = '#ffffff', intensity = 1, flicker = 0) {\n    this.lights.push({ x, y, r, color, intensity, flicker });\n  }\n\n  _radial(ctx, x, y, r, color, intensity) {\n    const g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(1, r));\n    g.addColorStop(0, color);\n    g.addColorStop(0.45, hexA(color, 0.55 * intensity));\n    g.addColorStop(1, hexA(color, 0));\n    ctx.fillStyle = g;\n    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();\n  }\n\n  // ---- composite everything onto the visible context ----\n  composite(out, opts = {}) {\n    const { w, h } = this;\n    const S = this.settings;\n    const ambient = opts.ambient || '#ffffff';\n    const gradeCol = opts.grade || null;\n    const gradeAmt = (opts.gradeAmount ?? 0.18) * S.grade;\n    const flash = opts.flash || null;\n    const time = opts.time || 0;\n    const aberration = (opts.aberration || 0) * S.aberration;\n\n    // 1) lighting pass -------------------------------------------------\n    if (S.lighting && ambient !== '#ffffff' && this.lights.length >= 0) {\n      const l = this.lctx;\n      l.globalCompositeOperation = 'source-over';\n      l.fillStyle = ambient;\n      l.fillRect(0, 0, w, h);\n      l.globalCompositeOperation = 'lighter';\n      for (const li of this.lights) {\n        let inten = li.intensity;\n        if (li.flicker) inten *= 1 - li.flicker * 0.5 * (0.5 + 0.5 * Math.sin(time * 37 + li.x));\n        this._radial(l, li.x, li.y, li.r, li.color, inten);\n      }\n      l.globalCompositeOperation = 'source-over';\n      this.sctx.globalCompositeOperation = 'multiply';\n      this.sctx.drawImage(this.light, 0, 0);\n      this.sctx.globalCompositeOperation = 'source-over';\n    }\n\n    // 2) AAA bloom — multi-pass, brighter, more glow ---------------------------------\n    if (S.bloom > 0 && this.quality !== 'low') {\n      const bw = this.bloomA.width, bh = this.bloomA.height;\n      const a = this.bactx, b = this.bbctx;\n      a.setTransform(1, 0, 0, 1, 0, 0);\n      a.globalCompositeOperation = 'source-over';\n      a.clearRect(0, 0, bw, bh);\n      // bright-pass: scene * scene * scene for stronger bloom\n      a.drawImage(this.scene, 0, 0, bw, bh);\n      a.globalCompositeOperation = 'multiply';\n      a.drawImage(this.bloomA, 0, 0);\n      a.drawImage(this.bloomA, 0, 0);\n      a.drawImage(this.bloomA, 0, 0);\n      a.globalCompositeOperation = 'source-over';\n      // blur — 2 iterations box blur for AAA soft glow\n      b.clearRect(0, 0, bw, bh);\n      b.globalAlpha = 0.28;\n      for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) b.drawImage(this.bloomA, dx, dy);\n      b.globalAlpha = 0.24;\n      for (const [dx, dy] of [[-2, -2], [2, -2], [-2, 2], [2, 2], [-2,0],[2,0],[0,-2],[0,2]]) b.drawImage(this.bloomA, dx, dy);\n      // second blur pass for extra softness\n      a.clearRect(0,0,bw,bh);\n      a.globalAlpha=0.5; a.drawImage(this.bloomB,0,0);\n      a.globalAlpha=0.25;\n      for(const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]) a.drawImage(this.bloomB,dx,dy);\n      a.globalAlpha=1;\n      // composite with additive + screen for AAA look\n      this.sctx.globalCompositeOperation = 'lighter';\n      this.sctx.globalAlpha = 0.55 * S.bloom * (opts.bloomBoost || 1);\n      this.sctx.drawImage(this.bloomA, 0, 0, w, h);\n      this.sctx.globalAlpha = 0.35 * S.bloom * (opts.bloomBoost || 1);\n      this.sctx.drawImage(this.bloomB, 0, 0, w, h);\n      this.sctx.globalAlpha = 1;\n      this.sctx.globalCompositeOperation = 'source-over';\n    }\n\n    // 3) blit to output with optional chromatic aberration ---------------\n    out.setTransform(1, 0, 0, 1, 0, 0);\n    out.imageSmoothingEnabled = false;\n    out.clearRect(0, 0, w, h);\n    if (aberration > 0.05) {\n      out.globalCompositeOperation = 'source-over';\n      out.drawImage(this.scene, 0, 0);\n      out.globalCompositeOperation = 'lighter';\n      out.globalAlpha = 0.35 * Math.min(1, aberration);\n      out.drawImage(this.scene, -Math.round(aberration), 0);\n      out.drawImage(this.scene, Math.round(aberration), 0);\n      out.globalAlpha = 1;\n      out.globalCompositeOperation = 'source-over';\n    } else {\n      out.drawImage(this.scene, 0, 0);\n    }\n\n    // 4) colour grade ----------------------------------------------------\n    if (gradeCol && gradeAmt > 0.01) {\n      out.globalCompositeOperation = 'soft-light';\n      out.globalAlpha = Math.min(1, gradeAmt * 3);\n      out.fillStyle = gradeCol;\n      out.fillRect(0, 0, w, h);\n      out.globalAlpha = 1;\n      out.globalCompositeOperation = 'source-over';\n    }\n\n    // 5) AAA vignette + subtle film grain ----------------------------------------\n    if (S.vignette > 0) {\n      const key = 'vig' + w + 'x' + h;\n      let g = this._gradCache.get(key);\n      if (!g) {\n        g = out.createRadialGradient(w / 2, h / 2, h * 0.22, w / 2, h / 2, h * 0.88);\n        g.addColorStop(0, 'rgba(0,0,0,0)');\n        g.addColorStop(0.6, 'rgba(0,0,0,0.15)');\n        g.addColorStop(1, 'rgba(0,0,0,0.55)');\n        this._gradCache.set(key, g);\n      }\n      out.globalAlpha = S.vignette;\n      out.fillStyle = g;\n      out.fillRect(0, 0, w, h);\n      out.globalAlpha = 1;\n      // film grain\n      if (S.grain !== 0 || true) {\n        out.globalAlpha = 0.04;\n        for (let i=0;i<120;i++) {\n          const gx = (Math.random()*w)|0, gy=(Math.random()*h)|0;\n          out.fillStyle = Math.random()>0.5 ? '#ffffff' : '#000000';\n          out.fillRect(gx,gy,1,1);\n        }\n        out.globalAlpha = 1;\n      }\n    }\n\n    // 6) scanlines + grain -------------------------------------------------\n    if (S.scanlines > 0 && this.quality === 'high') {\n      out.globalAlpha = 0.09 * S.scanlines;\n      out.fillStyle = '#000000';\n      for (let y = 0; y < h; y += 2) out.fillRect(0, y, w, 1);\n      out.globalAlpha = 1;\n    }\n\n    // 7) full-screen flash --------------------------------------------------\n    if (flash && flash.a > 0.01) {\n      out.globalCompositeOperation = flash.additive === false ? 'source-over' : 'lighter';\n      out.globalAlpha = Math.min(1, flash.a);\n      out.fillStyle = flash.color || '#ffffff';\n      out.fillRect(0, 0, w, h);\n      out.globalAlpha = 1;\n      out.globalCompositeOperation = 'source-over';\n    }\n  }\n}\n\nexport function hexA(hex, a) {\n  if (hex.startsWith('rgba')) return hex;\n  let h = hex.replace('#', '');\n  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];\n  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);\n  return `rgba(${r},${g},${b},${a})`;\n}\n\n// ============================================================\n// CAMERA — trauma shake, zoom punch, velocity lookahead\n// ============================================================\nexport class GameCamera {\n  // NOTE: zoom is deliberately kept to whole numbers. A fractional zoom\n  // (the old 1.55) resamples every sprite onto a non-integer grid, so one\n  // source pixel becomes 1 screen pixel here and 2 there — that uneven\n  // sampling is exactly what reads as \"blurry\" in pixel art.\n  constructor(w, h, zoom = 2) {\n    this.w = w; this.h = h;\n    this.x = 0; this.y = 0;\n    this.zoom = Math.max(1, Math.round(zoom)); this.baseZoom = this.zoom; this.zoomPunch = 0;\n    this.trauma = 0; this.traumaDecay = 1.6;\n    this.rot = 0;\n    this.t = 0;\n    this.offX = 0; this.offY = 0;\n    this.lookX = 0; this.lookY = 0;\n  }\n  shake(amount) { this.trauma = Math.min(1, this.trauma + amount); }\n  punch(amount) { this.zoomPunch = Math.min(0.35, this.zoomPunch + amount); }\n  follow(x, y, dt, vx = 0, vy = 0) {\n    this.lookX += ((vx * 0.12) - this.lookX) * Math.min(1, dt * 3);\n    this.lookY += ((vy * 0.12) - this.lookY) * Math.min(1, dt * 3);\n    const tx = x + this.lookX, ty = y + this.lookY;\n    const k = Math.min(1, dt * 7.5);\n    this.x += (tx - this.x) * k;\n    this.y += (ty - this.y) * k;\n  }\n  update(dt) {\n    this.t += dt;\n    this.trauma = Math.max(0, this.trauma - this.traumaDecay * dt);\n    this.zoomPunch *= Math.pow(0.0025, dt);\n    const s = this.trauma * this.trauma;\n    const n = (a, b) => Math.sin(this.t * a) * Math.sin(this.t * b);\n    // shake offsets are snapped to whole screen pixels too\n    this.offX = Math.round(s * 7 * n(51.3, 13.7));\n    this.offY = Math.round(s * 7 * n(43.1, 17.3));\n    this.rot = s * 0.02 * n(31.7, 11.3);\n    // punch stays on the integer grid: it steps 2x -> 3x, never 2.14x\n    this.zoom = this.baseZoom + (this.zoomPunch > 0.16 ? 1 : 0);\n  }\n  apply(ctx) {\n    // Snap the camera to whole world pixels before scaling, so sprite edges\n    // always land exactly on the pixel grid.\n    const cx = Math.round(this.x), cy = Math.round(this.y);\n    ctx.translate(Math.round(this.w / 2), Math.round(this.h / 2));\n    if (this.rot) ctx.rotate(this.rot);\n    ctx.scale(this.zoom, this.zoom);\n    ctx.translate(-cx + Math.round(this.offX / this.zoom), -cy + Math.round(this.offY / this.zoom));\n  }\n  worldToScreen(x, y) {\n    const cx = Math.round(this.x), cy = Math.round(this.y);\n    return {\n      x: (x - cx) * this.zoom + Math.round(this.w / 2) + this.offX,\n      y: (y - cy) * this.zoom + Math.round(this.h / 2) + this.offY,\n    };\n  }\n  screenToWorld(x, y) {\n    return {\n      x: (x - this.w / 2 - this.offX) / this.zoom + this.x,\n      y: (y - this.h / 2 - this.offY) / this.zoom + this.y,\n    };\n  }\n  get shakeAmount() { return this.trauma; }\n}\n\n// ============================================================\n// HITSTOP — global time dilation on impact (the single biggest\n// \"AAA feel\" upgrade a 2D action game can get)\n// ============================================================\nexport class TimeFlow {\n  constructor() { this.stop = 0; this.slow = 0; this.slowFactor = 0.35; }\n  hit(amount = 0.045) { this.stop = Math.max(this.stop, amount); }\n  slowmo(dur, factor = 0.35) { this.slow = Math.max(this.slow, dur); this.slowFactor = factor; }\n  scale(dt) {\n    if (this.stop > 0) { this.stop -= dt; return 0; }\n    if (this.slow > 0) { this.slow -= dt; return dt * this.slowFactor; }\n    return dt;\n  }\n}\n","js/systems/fx.js":"// ============================================================\n// HELL TRAIN — FX SYSTEM\n// Particles, sprite explosions, shockwaves, decals, afterimages,\n// arcs, floating combat text. Every emitter can push a dynamic\n// light into the renderer for that expensive-looking glow.\n// ============================================================\nimport { rand, randInt, TAU } from '../core/utils.js';\nimport { hexA } from '../core/render.js';\nexport { GameCamera as Camera } from '../core/render.js';\n\nconst P_SPARK = 0, P_SMOKE = 1, P_EMBER = 2, P_SHARD = 3, P_BLOOD = 4, P_GLOW = 5;\n\nexport class FXSystem {\n  constructor(max = 3000, sprites = null) {\n    this.max = max;\n    this.list = [];\n    this.decals = [];\n    this.anims = [];      // sprite-sheet effects\n    this.rings = [];      // shockwaves\n    this.arcs = [];       // lightning\n    this.texts = [];\n    this.afterimages = [];\n    this.beams = [];\n    this.sprites = sprites;\n    this.shake = 0; this.shakeT = 0;\n    this.flashes = [];\n    this.screenFlash = { a: 0, color: '#ffffff' };\n    this.lights = [];     // per-frame collected lights (world space)\n    this.aberration = 0;\n    this.damageNumbers = true; // gated by save.settings.damageNumbers\n    this._bannerCount = 0;\n  }\n  setSprites(s) { this.sprites = s; }\n\n  // ---------- emitters ----------\n  spawn(o) {\n    if (this.list.length >= this.max) this.list.shift();\n    this.list.push({\n      x: o.x, y: o.y, vx: o.vx || 0, vy: o.vy || 0,\n      life: o.life || 0.5, t: o.life || 0.5,\n      color: o.color || '#ffffff', color2: o.color2 || null,\n      size: o.size || 1.5, endSize: o.endSize ?? null,\n      gravity: o.gravity || 0, drag: o.drag ?? 0.94,\n      kind: o.kind ?? P_SPARK, additive: o.additive ?? true,\n      light: o.light || 0, spin: o.spin || 0, ang: o.ang || 0,\n      alpha: 1, fade: o.fade ?? true, trail: o.trail || 0,\n    });\n  }\n\n  burst(x, y, color, n = 12, opts = {}) {\n    const spd = opts.spd || 120;\n    for (let i = 0; i < n; i++) {\n      const a = opts.ang !== undefined ? opts.ang + rand(-0.5, 0.5) * (opts.
