.x) : rand(0, TAU);\n    const len = 420;\n    const ex = this.x + Math.cos(ang) * len, ey = this.y + Math.sin(ang) * len;\n    ctx.fx.beam(this.x, this.y - 4, ex, ey, w.color, 7, 0.28);\n    ctx.fx.shakeScreen(4, 0.15);\n    ctx.camera?.punch(0.03);\n    const hits = [];\n    for (const e of ctx.enemies) {\n      if (!e.alive) continue;\n      const t = ((e.x - this.x) * Math.cos(ang) + (e.y - this.y) * Math.sin(ang));\n      if (t < 0 || t > len) continue;\n      const px = this.x + Math.cos(ang) * t, py = this.y + Math.sin(ang) * t;\n      if (dist(px, py, e.x, e.y) < e.radius + 8) hits.push(e);\n    }\n    for (const e of hits) ctx.dealDamage(e, w.dmg * this.atkDmg, { family: 'tech' });\n    ctx.fx.burst(this.x, this.y - 4, '#ffffff', 10, { spd: 90, life: 0.25, ang, cone: 0.4 });\n  }\n\n  _bomber(ctx, w) {\n    const n = w.projCount || 2;\n    for (let i = 0; i < n; i++) {\n      const a = rand(0, TAU), r = rand(20, 70);\n      ctx.spawnBomb(this.x + Math.cos(a) * r, this.y + Math.sin(a) * r, {\n        dmg: w.dmg * this.atkDmg, radius: w.explodeRadius, fuse: 0.8 + Math.random() * 0.4,\n        cluster: w.cluster || 0, color: w.color, family: 'explosive',\n      });\n    }\n  }\n\n  _chain(ctx, w, enemy) {\n    const start = enemy || ctx.findNearestEnemy(this.x, this.y, 320);\n    if (!start) return;\n    let jumps = (w.jumps || 3) + (this.chainMaster ? 2 : 0);\n    const range = this.chainMaster ? 260 : 150;\n    let last = { x: this.x, y: this.y - 6 };\n    const hit = new Set();\n    for (let j = 0; j < jumps; j++) {\n      const targets = ctx.enemiesInRange(last.x, last.y, range).filter(e => !hit.has(e._id));\n      if (!targets.length) break;\n      targets.sort((a, b) => dist(last.x, last.y, a.x, a.y) - dist(last.x, last.y, b.x, b.y));\n      const t = targets[0];\n      hit.add(t._id);\n      ctx.fx.lightning(last.x, last.y, t.x, t.y, w.color);\n      ctx.dealDamage(t, w.dmg * this.atkDmg * (1 - j * 0.05), { family: 'lightning' });\n      last = { x: t.x, y: t.y };\n    }\n  }\n\n  _cone(ctx, w, enemy) {\n    const ang = enemy ? Math.atan2(enemy.y - this.y, enemy.x - this.x) : rand(0, TAU);\n    const arc = w.arc || 0.7, range = w.range || 80;\n    ctx.spawnFlame(this.x, this.y - 4, ang, range, w.dmg * this.atkDmg);\n    for (const e of ctx.enemiesInRange(this.x, this.y, range)) {\n      const a = Math.atan2(e.y - this.y, e.x - this.x);\n      let d = Math.abs(((a - ang + Math.PI * 3) % TAU) - Math.PI);\n      if (d < arc) ctx.dealDamage(e, w.dmg * this.atkDmg, { family: 'fire', small: true, burn: w.burn });\n    }\n  }\n\n  _aura(ctx, w) {\n    const r = w.radius || 60;\n    ctx.fx.ring(this.x, this.y, r, w.color, 0.25, 2);\n    for (const e of ctx.enemiesInRange(this.x, this.y, r)) {\n      ctx.dealDamage(e, w.dmg * this.atkDmg, { family: 'lightning', small: true });\n      if (Math.random() < 0.4) ctx.fx.lightning(this.x, this.y, e.x, e.y, w.color, 4, 0.1);\n    }\n  }\n\n  _nova(ctx, w) {\n    const r = w.radius || 80;\n    ctx.fx.shockwave(this.x, this.y, r, w.color);\n    ctx.fx.explosion(this.x, this.y, 'explHoly', r / 34, { light: 1, lightColor: w.color });\n    ctx.camera?.punch(0.02);\n    for (const e of ctx.enemiesInRange(this.x, this.y, r)) {\n      ctx.dealDamage(e, w.dmg * this.atkDmg, { family: 'holy' });\n    }\n    if (w.heal) this.heal(w.heal);\n  }\n\n  _pool(ctx, w, enemy) {\n    const tx = enemy ? enemy.x : this.x, ty = enemy ? enemy.y : this.y;\n    ctx.spawnPool(tx, ty, {\n      radius: w.poolRadius || 26, dmg: w.dmg * this.atkDmg, life: w.projLife || 4,\n      color: w.color, family: 'toxic',\n    });\n  }\n\n  _blackhole(ctx, w, enemy) {\n    const tx = enemy ? enemy.x : this.x + rand(-40, 40);\n    const ty = enemy ? enemy.y : this.y + rand(-40, 40);\n    ctx.spawnBlackhole(tx, ty, { radius: w.radius, dmg: w.dmg * this.atkDmg, life: w.projLife || 3, color: w.color });\n  }\n\n  _blink(ctx, w) {\n    const ang = rand(0, TAU), d = rand(80, 150);\n    const nx = this.x + Math.cos(ang) * d, ny = this.y + Math.sin(ang) * d;\n    ctx.fx.afterimage(this.currentFrame(), this.x, this.y, 1, this.flip, w.color, 0.4);\n    ctx.fx.explosion(this.x, this.y, 'explVoid', 0.7, { lightColor: w.color });\n    for (const e of ctx.enemiesInRange(this.x, this.y, w.explodeRadius)) ctx.dealDamage(e, w.dmg * this.atkDmg, { family: 'void' });\n    if (!ctx.world.isSolidWorld(nx, ny)) { this.x = nx; this.y = ny; }\n    ctx.fx.explosion(this.x, this.y, 'explVoid', 0.7, { lightColor: w.color });\n    for (const e of ctx.enemiesInRange(this.x, this.y, w.explodeRadius)) ctx.dealDamage(e, w.dmg * this.atkDmg, { family: 'void' });\n  }\n}\n","js/entities/enemy.js":"// ============================================================\n// HELL TRAIN — Enemy entities\n// ============================================================\nimport { uid, rand, randInt, clamp, dist, TAU } from '../core/utils.js';\nimport { findEnemy } from '../data/enemies.js';\n\nexport class Enemy {\n  constructor(def, x, y, realmId, difficulty) {\n    Object.assign(this, JSON.parse(JSON.stringify(def)));\n    this.x = x; this.y = y; this.vx = 0; this.vy = 0;\n    this.maxHp = this.hp * (difficulty.enemyHp || 1);\n    this.hp = this.maxHp;\n    this.dmg = this.dmg * (difficulty.enemyDmg || 1);\n    this.radius = this.radius || 7;\n    this.alive = true;\n    this.realmId = realmId;\n    this.colorMod = 0;\n    this.scale = 1;\n    this.giant = false;\n    this.regen = 0;\n    this.animT = Math.random() * 3; this.frame = 0;\n    this.kbx = 0; this.kby = 0;\n    this.freezeT = 0; this.chill = 0; this.chillT = 0;\n    this.touchCd = 0; this.spawnT = 0.25;\n    this.attackCd = 0;\n    this.summonCd = this.summon?.cd || 0;\n    this.summonedCount = 0;\n    this.teleportCd = 0;\n    this.aiT = Math.random() * 2;\n    this.burnDmg = 0; this.burnT = 0; this.slow = 0; this.slowT = 0;\n    this.shield = 0;\n    this.voidTouched = false;\n    this.flashT = 0;\n    this.deathT = 0;\n    // Realm tint of sprite\n    this.tint = realmId;\n  }\n\n  applyMod(mod) {\n    mod.apply(this);\n  }\n\n  // BULLET-EATER: swallow a player shot, grow stronger instead of dying\n  absorb(dmg, ctx) {\n    this.growCount = (this.growCount || 0) + 1;\n    const heal = dmg * 0.8;\n    this.maxHp += heal * 0.4;\n    this.hp = Math.min(this.maxHp, this.hp + heal);\n    this.radius = Math.min(18, this.radius + 0.18);\n    this.scale = Math.min(2.2, (this.scale || 1) + 0.02);\n    this.dmg = Math.min(26, this.dmg + 0.35);\n    this.xp = (this.xp || 12) + 1;\n    if (ctx?.fx) {\n      ctx.fx.spawn({ x: this.x, y: this.y - 6, vx: 0, vy: -20, color: '#98e066',\n        life: 0.5, size: 2.5, endSize: 0.3 });\n      ctx.fx.damageText(this.x, this.y - this.radius - 6, 'ABSORB', '#98e066', { size: 6 });\n    }\n  }\n\n  // MIRROR WISP: bounce a player shot back at the shooter, weaker\n  reflect(proj, ctx) {\n    if (!ctx) return;\n    const p = ctx.player;\n    const ang = Math.atan2(p.y - this.y, p.x - this.x);\n    ctx.spawnProjectile({\n      x: this.x, y: this.y,\n      vx: Math.cos(ang) * 200, vy: Math.sin(ang) * 200,\n      life: 1.4, dmg: Math.min(14, Math.max(4, proj.dmg * 0.3)),\n      color: '#ffffff', sprite: proj.sprite, owner: 'enemy', size: 4,\n      family: 'mirror',\n    });\n    if (ctx.fx) {\n      ctx.fx.ring(this.x, this.y, 14, '#ffffff', 0.3, 2);\n      ctx.fx.damageText(this.x, this.y - this.radius - 6, 'REFLECT', '#ffffff', { size: 6 });\n    }\n  }\n\n  update(dt, ctx) {\n    if (!this.alive) {\n      this.deathT -= dt;\n      return;\n    }\n    this.animT += dt * (6 + this.spd * 0.04);\n    this.frame = Math.floor(this.animT) % 6;\n    if (this.flashT > 0) this.flashT -= dt;\n    if (this.spawnT > 0) this.spawnT -= dt;\n    if (this.touchCd > 0) this.touchCd -= dt;\n    if (this.chillT > 0) { this.chillT -= dt; if (this.chillT <= 0) this.chill = 0; }\n    // knockback impulse\n    if (this.kbx || this.kby) {\n      this.x += this.kbx * dt; this.y += this.kby * dt;\n      const damp = Math.pow(0.0009, dt);\n      this.kbx *= damp; this.kby *= damp;\n      if (Math.abs(this.kbx) < 2) this.kbx = 0;\n      if (Math.abs(this.kby) < 2) this.kby = 0;\n    }\n    // frozen solid: no acting at all\n    if (this.freezeT > 0) {\n      this.freezeT -= dt;\n      this.vx = 0; this.vy = 0;\n      if (Math.random() < 0.15) ctx.fx.spawn({ x: this.x + (Math.random() - 0.5) * 10, y: this.y - 6,\n        vx: 0, vy: 12, color: '#a8d4f4', life: 0.4, size: 1.2 });\n      return;\n    }\n    if (this.burnT > 0) {\n      this.burnT -= dt;\n      this.hp -= this.burnDmg * dt;\n      if (Math.random() < 0.22) ctx.fx.fire(this.x + (Math.random() - 0.5) * 6, this.y - 4, '#ff7a33');\n      if (this.hp <= 0) {\n        this.hp = 0; this.alive = false; this.deathT = 0.55;\n        ctx.onEnemyDeath?.(this);\n      }\n    }\n    if (this.slowT > 0) this.slowT -= dt;\n    if (this.regen) this.hp = Math.min(this.maxHp, this.hp + this.regen * dt);\n    if (this.teleportCd !== undefined) {\n      this.teleportCd -= dt;\n      if (this.teleportCd <= 0) {\n        this.teleportCd = 4 + Math.random() * 2;\n        const ang = Math.random() * TAU;\n        const r = 30 + Math.random() * 50;\n        this.x += Math.cos(ang) * r;\n        this.y += Math.sin(ang) * r;\n        ctx.fx.flash(this.x, this.y, '#985ce0', 0.15);\n      }\n    }\n\n    const player = ctx.player;\n    const px = player.x, py = player.y;\n    const d = dist(this.x, this.y, px, py);\n    const spdMul = (this.slowT > 0 ? (1 - this.slow) : 1) * (1 - (this.chill || 0));\n    const speed = this.spd * spdMul;\n\n    // AI behaviors\n    if (this.ai === 'chase' || this.ai === 'tank' || this.ai === 'swarm' || this.ai === 'split') {\n      if (d > 1) {\n        const ang = Math.atan2(py - this.y, px - this.x);\n        this.vx = Math.cos(ang) * speed;\n        this.vy = Math.sin(ang) * speed;\n      } else {\n        this.vx = 0; this.vy = 0;\n      }\n    } else if (this.ai === 'ranged') {\n      if (d > 130) {\n        const ang = Math.atan2(py - this.y, px - this.x);\n        this.vx = Math.cos(ang) * speed;\n        this.vy = Math.sin(ang) * speed;\n      } else if (d < 70) {\n        const ang = Math.atan2(py - this.y, px - this.x);\n        this.vx = -Math.cos(ang) * speed * 0.5;\n        this.vy = -Math.sin(ang) * speed * 0.5;\n      } else { this.vx = 0; this.vy = 0; }\n      // attack\n      this.attackCd -= dt;\n      if (this.attackCd <= 0 && d < 220) {\n        // clarity governor: under heavy crowds, ranged enemies fire a touch slower\n        this.attackCd = (this.proj?.cd || 1.5) * (ctx.enemyFireMult || 1);\n        const ang = Math.atan2(py - this.y, px - this.x);\n        ctx.spawnProjectile({\n          x: this.x, y: this.y, vx: Math.cos(ang) * (this.proj?.spd || 160),\n          vy: Math.sin(ang) * (this.proj?.spd || 160), life: 1.6, dmg: this.proj?.dmg || 8,\n          color: this.proj?.id === 'fire_bolt' ? '#ff5a33' : '#9b6dff', owner: 'enemy',\n          size: 4, family: this.proj?.id === 'fire_bolt' ? 'fire' : 'void',\n        });\n      }\n    } else if (this.ai === 'summoner') {\n      if (d > 160) {\n        const ang = Math.atan2(py - this.y, px - this.x);\n        this.vx = Math.cos(ang) * speed;\n        this.vy = Math.sin(ang) * speed;\n      } else { this.vx = 0; this.vy = 0; }\n      this.summonCd -= dt;\n      if (this.summonCd <= 0 && this.summonedCount < (this.summon?.max || 4)) {\n        this.summonCd = this.summon?.cd || 4;\n        this.summonedCount += this.summon?.count || 2;\n        for (let i = 0; i < (this.summon?.count || 2); i++) {\n          const ang = Math.random() * TAU;\n          ctx.spawnEnemy(this.summon.id, this.x + Math.cos(ang) * 18, this.y + Math.sin(ang) * 18);\n        }\n      }\n    } else if (this.ai === 'burrower') {\n      // stand still and emerge for a while, then burrow\n      if (this.aiT > 0) { this.aiT -= dt; if (this.aiT <= 0) this.aiT = -3 - Math.random() * 2; }\n      else { this.aiT += dt; if (this.aiT >= 0) this.aiT = 3 + Math.random() * 2; }\n      if (this.aiT > 0) {\n        if (d > 1) {\n          const ang = Math.atan2(py - this.y, px - this.x);\n          this.vx = Math.cos(ang) * speed;\n          this.vy = Math.sin(ang) * speed;\n        } else { this.vx = 0; this.vy = 0; }\n      } else {\n        this.vx = 0; this.vy = 0;\n      }\n    } else if (this.ai === 'shield') {\n      // Move and block projectiles\n      if (d > 1) {\n        const ang = Math.atan2(py - this.y, px - this.x);\n        this.vx = Math.cos(ang) * speed * 0.5;\n        this.vy = Math.sin(ang) * speed * 0.5;\n      } else { this.vx = 0; this.vy = 0; }\n    } else if (this.ai === 'fly') {\n      // tries to fly above obstacles; ignore walls slightly\n      if (d > 1) {\n        const ang = Math.atan2(py - this.y, px - this.x);\n        this.vx = Math.cos(ang) * speed;\n        this.vy = Math.sin(ang) * speed;\n      } else { this.vx = 0; this.vy = 0; }\n    } else if (this.ai === 'sweep') {\n      // MARKER ENEMY: telegraphs a long burning line, then blazes down it\n      this.sweepT = (this.sweepT === undefined) ? 2 + Math.random() * 1.5 : this.sweepT - dt;\n      if (this.sweepState === 'dash') {\n        // hold the dash heading; contact damage does the rest\n        if (this.aiT2 > 0) { this.aiT2 -= dt; }\n        else { this.sweepState = 'cool'; this.sweepT = 2.4 + Math.random(); this.vx = 0; this.vy = 0; }\n      } else if (this.sweepState === 'tele') {\n        this.vx = 0; this.vy = 0;\n        this.aiT2 -= dt;\n        if (this.aiT2 <= 0) {\n          // launch along the telegraphed line\n          const a = this.sweepAng;\n          this.sweepState = 'dash';\n          this.aiT2 = 0.55;\n          this.vx = Math.cos(a) * 340;\n          this.vy = Math.sin(a) * 340;\n          if (Math.random() < 0.6) ctx.fx.fire(this.x + Math.cos(a) * 10, this.y + Math.sin(a) * 10, '#ff7a33');\n        }\n      } else {\n        // cool/reposition: shuffle toward a firing solution\n        if (d > 120) {\n          const ang = Math.atan2(py - this.y, px - this.x);\n          this.vx = Math.cos(ang) * speed; this.vy = Math.sin(ang) * speed;\n        } else { this.vx = 0; this.vy = 0; }\n        if (this.sweepT <= 0 && d < 240) {\n          const ang = Math.atan2(py - this.y, px - this.x);\n          const L = 210;\n          this.sweepAng = ang;\n          this.sweepState = 'tele';\n          this.aiT2 = 0.85; // readable wind-up\n          ctx.telegraphs.push({ type: 'line', x: this.x, y: this.y,\n            x2: this.x + Math.cos(ang) * L, y2: this.y + Math.sin(ang) * L,\n            t: 0.85, dur: 0.85, color: '#ff5a33', w: 22 });\n        }\n      }\n    } else if (this.ai === 'eater') {\n      // BULLET-EATER: slow, relentless, grows with every shot it swallows\n      if (d > 1) {\n        const ang = Math.atan2(py - this.y, px - this.x);\n        this.vx = Math.cos(ang) * speed;\n        this.vy = Math.sin(ang) * speed;\n      } else { this.vx = 0; this.vy = 0; }\n      if (this.growCount > 0 && Math.random() < 0.3) {\n        ctx.fx.spawn({ x: this.x + rand(-6, 6), y: this.y - 4, vx: 0, vy: -14,\n          color: '#98e066', life: 0.4, size: 2, endSize: 0.2 });\n      }\n    } else if (this.ai === 'mirror') {\n      // MIRROR WISP: keeps its distance and bounces shots back\n      if (d < 110) {\n        const ang = Math.atan2(py - this.y, px - this.x);\n        this.vx = -Math.cos(ang) * speed;\n        this.vy = -Math.sin(ang) * speed;\n      } else if (d > 170) {\n        const ang = Math.atan2(py - this.y, px - this.x);\n        this.vx = Math.cos(ang) * speed * 0.7;\n        this.vy = Math.sin(ang) * speed * 0.7;\n      } else {\n        this.vx = Math.cos(this.animT * 0.7) * speed * 0.4;\n        this.vy = Math.sin(this.animT * 0.9) * speed * 0.4;\n      }\n    } else { // fallback\n      if (d > 1) {\n        const ang = Math.atan2(py - this.y, px - this.x);\n        this.vx = Math.cos(ang) * speed;\n        this.vy = Math.sin(ang) * speed;\n      }\n    }\n\n    // Move with collision (skip walls if flying)\n    if (this.ai !== 'fly') {\n      const ax = this.x + this.vx * dt;\n      const ay = this.y + this.vy * dt;\n      if (!ctx.world.isSolidWorld(ax + Math.sign(this.vx) * this.radius, this.y)) this.x = ax;\n      if (!ctx.world.isSolidWorld(this.x, ay + Math.sign(this.vy) * this.radius)) this.y = ay;\n    } else {\n      this.x += this.vx * dt;\n      this.y += this.vy * dt;\n    }\n\n    // Contact damage (burst on touch, then a short cooldown — much better feel\n    // than continuous chip damage)\n    if (d < this.radius + player.radius && this.touchCd <= 0) {\n      this.touchCd = 0.6;\n      const t = player.takeDamage(this.dmg, ctx, this);\n      if (t > 0) ctx.onPlayerHit(t, '#ff3a3a', this.name || this.id);\n      const a = Math.atan2(player.y - this.y, player.x - this.x);\n      this.kbx = -Math.cos(a) * 90; this.kby = -Math.sin(a) * 90;\n    }\n  }\n\n  takeDamage(amount, opts = {}) {\n    if (!this.alive) return 0;\n    let dmg = amount;\n    if (this.shield > 0) {\n      const absorbed = Math.min(this.shield, dmg);\n      this.shield -= absorbed; dmg -= absorbed;\n    }\n    if (opts.burn && !this.voidTouched) {\n      this.burnDmg = Math.max(this.burnDmg || 0, opts.burn);\n      this.burnT = Math.max(this.burnT || 0, opts.burnDur || 3);\n    }\n    if (opts.slow) {\n      this.slow = Math.max(this.slow || 0, opts.slow);\n      this.slowT = Math.max(this.slowT || 0, opts.slowDur || 2);\n    }\n    if (opts.chill) { this.chill = Math.max(this.chill, opts.chill); this.chillT = 2.5; }\n    if (opts.freeze) this.freezeT = Math.max(this.freezeT, opts.freeze);\n    if (opts.knockback) {\n      const a = opts.angle ?? Math.atan2(this.y - (opts.y ?? this.y), this.x - (opts.x ?? this.x));\n      const scale = this.giant ? 0.35 : 1;\n      this.kbx += Math.cos(a) * opts.knockback * scale;\n      this.kby += Math.sin(a) * opts.knockback * scale;\n    }\n    this.hp -= dmg;\n    this.flashT = 0.1;\n    this.hitScale = 1;\n    if (this.hp <= 0) { this.alive = false; this.deathT = 0.55; }\n    return dmg;\n  }\n\n  spriteName(sprites) {\n    const base = this.sprite || 'ghost';\n    // Realm tint\n    const tintMap = {\n      infernal: 'infernal', frozen: 'ice', forest: 'forest',\n      desert: 'ash', void: 'void', forgotten: 'purple',\n      purgatory: 'blue', terminus: 'pink', phantom: 'void',\n    };\n    const realm = tintMap[this.realmId] || 'blue';\n    let name = base + '_' + realm;\n    if (!sprites[name]) name = base;\n    if (this.giant) {\n      const gname = base + 'Giant';\n      if (sprites[gname]) name = gname;\n    }\n    return name;\n  }\n}\n\n// Factory\nexport function makeEnemy(id, x, y, realmId, difficulty) {\n  const def = findEnemy(id);\n  if (!def) return null;\n  return new Enemy(def, x, y, realmId, difficulty);\n}\n","js/entities/projectile.js":"// ============================================================\n// HELL TRAIN — projectiles, bombs, pools, singularities, meteors\n// ============================================================\nimport { uid, TAU, dist, rand } from '../core/utils.js';\n\nexport class Projectile {\n  constructor(o) {\n    Object.assign(this, o);\n    this.alive = true;\n    this.t = 0;\n    this.size = o.size || 4;\n    this.pierceLeft = o.pierce || 0;\n    this.bouncesLeft = o.bounces || 0;\n    this.hitIds = new Set();\n    this.spin = o.spin || 0;\n    this.rot = 0;\n    this.vy0 = this.vy;\n    this._id = uid();\n  }\n  update(dt, ctx) {\n    if (!this.alive) return;\n    this.t += dt;\n    const life = this.life || 1.6;\n    if (this.t > life) { this._expire(ctx); return; }\n    this.rot += this.spin * dt;\n\n    // --- steering ---\n    if (this.homing) {\n      const target = ctx.findNearestEnemy(this.x, this.y, 220);\n      if (target) {\n        const want = Math.atan2(target.y - this.y, target.x - this.x);\n        const cur = Math.atan2(this.vy, this.vx);\n        let d = ((want - cur + Math.PI * 3) % TAU) - Math.PI;\n        const na = cur + Math.max(-this.homing * dt, Math.min(this.homing * dt, d));\n        const sp = Math.hypot(this.vx, this.vy);\n        this.vx = Math.cos(na) * sp; this.vy = Math.sin(na) * sp;\n        this.angle = na;\n      }\n    }\n    if (this.boomerang) {\n      const k = this.t / life;\n      if (k > 0.45) {\n        const owner = ctx.player;\n        const a = Math.atan2(owner.y - this.y, owner.x - this.x);\n        const sp = Math.hypot(this.vx, this.vy) || 200;\n        this.vx += Math.cos(a) * sp * dt * 4;\n        this.vy += Math.sin(a) * sp * dt * 4;\n        const s2 = Math.hypot(this.vx, this.vy);\n        if (s2 > sp * 1.4) { this.vx *= sp * 1.4 / s2; this.vy *= sp * 1.4 / s2; }\n        if (dist(this.x, this.y, owner.x, owner.y) < 12 && k > 0.6) { this.alive = false; return; }\n        this.hitIds.clear();\n      }\n    }\n    if (this.behavior === 'lob') this.vy += 90 * dt;\n\n    this.x += this.vx * dt;\n    this.y += this.vy * dt;\n\n    // --- trail ---\n    if (Math.random() < 0.75) {\n      ctx.fx.spawn({\n        x: this.x + rand(-1, 1), y: this.y + rand(-1, 1),\n        vx: -this.vx * 0.08, vy: -this.vy * 0.08,\n        color: this.color, life: this.omega ? 0.45 : 0.22, size: this.omega ? 3 : 1.6,\n        endSize: 0.3, drag: 0.85, light: this.omega ? 0.5 : 0.12,\n      });\n    }\n\n    // --- collisions ---\n    if (this.owner === 'enemy') {\n      const p = ctx.player;\n      if (p.alive && dist(this.x, this.y, p.x, p.y) < this.size + p.radius) {\n        const dealt = p.takeDamage(this.dmg, ctx, null);\n        if (dealt > 0) ctx.onPlayerHit(dealt, this.color);\n        this.alive = false;\n        ctx.fx.burst(this.x, this.y, this.color, 6, { spd: 70, life: 0.25 });\n      }\n      if (ctx.train && dist(this.x, this.y, ctx.train.x, ctx.train.y) < this.size + ctx.train.radius) {\n        ctx.train.takeDamage(this.dmg, ctx);\n        this.alive = false;\n      }\n    } else {\n      for (const e of ctx.enemies) {\n        if (!e.alive || this.hitIds.has(e._id)) continue;\n        if (dist(this.x, this.y, e.x, e.y) > this.size + e.radius) continue;\n        this.hitIds.add(e._id);\n        // bullet-eater: absorbs shots instead of taking damage — deal with it first\n        if (e.ai === 'eater') {\n          e.absorb(this.dmg, ctx);\n          this.alive = false;\n          return;\n        }\n        // mirror wisp: reflects the shot back at the shooter\n        if (e.ai === 'mirror' && !this.reflected && Math.random() < 0.5) {\n          this.alive = false;\n          e.reflect(this, ctx);\n          return;\n        }\n        ctx.dealDamage(e, this.dmg, {\n          family: this.family, x: this.x, y: this.y, knockback: this.knockback,\n          slow: this.slow, slowDur: this.slowDur, burn: this.burn,\n          angle: Math.atan2(this.vy, this.vx), lifesteal: this.lifesteal,\n          weaponId: this.weaponId,\n        });\n        if (this.explode) {\n          ctx.spawnExplosion(this.x, this.y, this.explodeRadius, this.dmg * 0.7, this.family);\n          this.alive = false; return;\n        }\n        if (ctx.player.hellsplit && !this.isSplit) this._split(ctx);\n        if (this.pierceLeft <= 0) { this.alive = false; return; }\n        this.pierceLeft -= 1;\n      }\n      if (ctx.boss && ctx.boss.alive && !this.hitIds.has('boss') &&\n          dist(this.x, this.y, ctx.boss.x, ctx.boss.y) < this.size + ctx.boss.radius) {\n        this.hitIds.add('boss');\n        ctx.dealDamage(ctx.boss, this.dmg, { family: this.family, x: this.x, y: this.y, boss: true, weaponId: this.weaponId });\n        if (this.explode) { ctx.spawnExplosion(this.x, this.y, this.explodeRadius, this.dmg * 0.7, this.family); this.alive = false; return; }\n        if (this.pierceLeft <= 0) { this.alive = false; return; }\n        this.pierceLeft -= 1;\n      }\n    }\n\n    // --- walls ---\n    if (ctx.world.isSolidWorld(this.x, this.y)) {\n      if (this.bouncesLeft > 0) {\n        this.bouncesLeft -= 1;\n        // reflect on whichever axis is blocked\n        if (ctx.world.isSolidWorld(this.x + Math.sign(this.vx) * 4, this.y)) this.vx *= -1;\n        else this.vy *= -1;\n        this.hitIds.clear();\n        ctx.fx.sparks(this.x, this.y, this.color, 4, Math.atan2(this.vy, this.vx));\n      } else {\n        this._expire(ctx);\n      }\n    }\n  }\n  _split(ctx) {\n    const n = ctx.player.hellsplit;\n    for (let i = 0; i < n; i++) {\n      const a = rand(0, TAU);\n      ctx.spawnProjectile({\n        x: this.x, y: this.y, vx: Math.cos(a) * 190, vy: Math.sin(a) * 190,\n        life: 0.7, dmg: this.dmg * 0.5, pierce: 0, color: this.color, sprite: this.sprite,\n        owner: 'player', size: Math.max(2, this.size * 0.6), family: this.family, isSplit: true,\n      });\n    }\n  }\n  _expire(ctx) {\n    this.alive = false;\n    if (this.explode) ctx.spawnExplosion(this.x, this.y, this.explodeRadius, this.dmg * 0.7, this.family);\n  }\n}\n\nexport class Bomb {\n  constructor(x, y, o) {\n    this.x = x; this.y = y; Object.assign(this, o);\n    this.t = 0; this.alive = true; this._id = uid();\n    this.fuse = o.fuse || 1.0;\n    this.vy = -60; this.vx = rand(-20, 20);\n  }\n  update(dt, ctx) {\n    this.t += dt;\n    this.vy += 260 * dt;\n    this.x += this.vx * dt; this.y += this.vy * dt;\n    if (this.y > this._ground || this.t > 0.35) { this.vy *= this.vy > 0 ? -0.25 : 1; this._ground = this.y; }\n    if (Math.random() < 0.3) ctx.fx.spawn({ x: this.x, y: this.y - 3, vx: 0, vy: -18, color: '#ffb040', life: 0.3, size: 1.4, light: 0.2 });\n    if (this.t >= this.fuse) {\n      this.alive = false;\n      ctx.spawnExplosion(this.x, this.y, this.radius, this.dmg, this.family || 'explosive');\n      for (let i = 0; i < (this.cluster || 0); i++) {\n        const a = (i / this.cluster) * TAU;\n        ctx.spawnBomb(this.x + Math.cos(a) * 22, this.y + Math.sin(a) * 22, {\n          dmg: this.dmg * 0.45, radius: this.radius * 0.6, fuse: 0.45, cluster: 0,\n          color: this.color, family: this.family,\n        });\n      }\n    }\n  }\n}\n\nexport class Pool {\n  constructor(x, y, o) {\n    this.x = x; this.y = y; Object.assign(this, o);\n    this.t = 0; this.alive = true; this.tick = 0; this._id = uid();\n  }\n  update(dt, ctx) {\n    this.t += dt;\n    if (this.t > this.life) { this.alive = false; return; }\n    this.tick -= dt;\n    if (this.tick <= 0) {\n      this.tick = 0.4;\n      for (const e of ctx.enemiesInRange(this.x, this.y, this.radius)) {\n        ctx.dealDamage(e, this.dmg, { family: this.family, small: true });\n      }\n    }\n    if (Math.random() < 0.5) {\n      const a = rand(0, TAU), r = Math.random() * this.radius;\n      ctx.fx.spawn({ x: this.x + Math.cos(a) * r, y: this.y + Math.sin(a) * r, vx: 0, vy: -12,\n        color: this.color, life: 0.6, size: 1.6, light: 0.1 });\n    }\n  }\n}\n\nexport class BlackHole {\n  constructor(x, y, o) {\n    this.x = x; this.y = y; Object.assign(this, o);\n    this.t = 0; this.alive = true; this.tick = 0; this._id = uid();\n  }\n  update(dt, ctx) {\n    this.t += dt;\n    if (this.t > this.life) {\n      this.alive = false;\n      ctx.spawnExplosion(this.x, this.y, this.radius * 0.8, this.dmg * 4, 'void');\n      return;\n    }\n    for (const e of ctx.enemiesInRange(this.x, this.y, this.radius)) {\n      const a = Math.atan2(this.y - e.y, this.x - e.x);\n      const d = dist(this.x, this.y, e.x, e.y);\n      const pull = (1 - d / this.radius) * 160;\n      e.x += Math.cos(a) * pull * dt; e.y += Math.sin(a) * pull * dt;\n    }\n    this.tick -= dt;\n    if (this.tick <= 0) {\n      this.tick = 0.25;\n      for (const e of ctx.enemiesInRange(this.x, this.y, this.radius * 0.55)) {\n        ctx.dealDamage(e, this.dmg, { family: 'void', small: true });\n      }\n    }\n    for (let i = 0; i < 2; i++) {\n      const a = rand(0, TAU), r = this.radius * rand(0.5, 1);\n      ctx.fx.spawn({ x: this.x + Math.cos(a) * r, y: this.y + Math.sin(a) * r,\n        vx: -Math.cos(a) * 90, vy: -Math.sin(a) * 90, color: this.color, life: 0.5, size: 1.6, light: 0.2 });\n    }\n  }\n}\n\nexport class Meteor {\n  constructor(x, y, target, dmg, radius) {\n    this.tx = target.x; this.ty = target.y;\n    this.startX = this.tx - 40; this.startY = this.ty - 260;\n    this.x = this.startX; this.y = this.startY;\n    this.dmg = dmg; this.radius = radius;\n    this.t = 0; this.dur = 0.55; this.alive = true; this.landed = false;\n    this._id = uid();\n  }\n  update(dt, ctx) {\n    this.t += dt;\n    const k = Math.min(1, this.t / this.dur);\n    this.x = this.startX + (this.tx - this.startX) * k;\n    this.y = this.startY + (this.ty - this.startY) * k;\n    ctx.fx.fire(this.x, this.y + 4, '#ff7a33');\n    ctx.fx.embers(this.x + rand(-3, 3), this.y + 4, '#ffd260', 1);\n    if (k >= 1 && !this.landed) {\n      this.landed = true; this.alive = false;\n      ctx.spawnExplosion(this.tx, this.ty, this.radius, this.dmg, 'fire');\n      ctx.fx.shakeScreen(9, 0.35);\n      ctx.camera?.punch(0.05);\n      ctx.fx.decal(this.tx, this.ty, this.radius * 0.5, '#1a0d08', 14);\n    }\n  }\n}\n\nexport class Flame {\n  constructor(x, y, ang, range, dmg) {\n    this.x = x; this.y = y; this.ang = ang; this.range = range; this.dmg = dmg;\n    this.t = 0; this.dur = 0.22; this.alive = true; this._id = uid();\n  }\n  update(dt, ctx) {\n    this.t += dt;\n    if (this.t >= this.dur) { this.alive = false; return; }\n    for (let i = 0; i < 5; i++) {\n      const r = Math.random() * this.range;\n      const spread = (r / this.range) * 0.5;\n      const a = this.ang + rand(-spread, spread);\n      ctx.fx.spawn({\n        x: this.x + Math.cos(a) * r, y: this.y + Math.sin(a) * r,\n        vx: Math.cos(a) * 60, vy: Math.sin(a) * 60 - 10,\n        color: r / this.range > 0.6 ? '#ff5a33' : '#ffe066', life: 0.3, size: 2 + r / 16,\n        endSize: 0.5, light: 0.25,\n      });\n    }\n  }\n}\n","js/entities/pickup.js":"// ============================================================\n// HELL TRAIN — Pickups: XP, coins, hearts, shards, chests, magnets\n// ============================================================\nimport { uid, dist, rand } from '../core/utils.js';\n\nconst CONF = {\n  xp:     { sprite: 'xp',     color: '#8ef0ff', score: 1 },\n  xpBig:  { sprite: 'xpBig',  color: '#dcb4ff', score: 4 },\n  coin:   { sprite: 'coin',   color: '#ffe878', score: 2 },\n  shard:  { sprite: 'shard',  color: '#ffc040', score: 25 },\n  heart:  { sprite: 'heart',  color: '#ff5a5a', score: 5 },\n  chest:  { sprite: 'chest',  color: '#ffe066', score: 50 },\n  magnet: { sprite: 'magnet', color: '#f080cc', score: 5 },\n};\n\nexport class Pickup {\n  constructor(type, x, y, amount = 1) {\n    this.type = type; this.x = x; this.y = y; this.amount = amount;\n    this.vx = rand(-45, 45); this.vy = rand(-120, -55);\n    this.z = 0; this.vz = rand(30, 70);\n    this.t = 0; this.alive = true; this.magnetized = false;\n    this.frame = Math.floor(Math.random() * 6);\n    this._id = uid();\n    this.conf = CONF[type] || CONF.xp;\n  }\n  color() { return this.conf.color; }\n  spriteKey() { return this.conf.sprite; }\n\n  update(dt, ctx) {\n    if (!this.alive) return;\n    this.t += dt;\n    this.frame += dt * 10;\n    const p = ctx.player;\n    const d = dist(this.x, this.y, p.x, p.y);\n\n    if (!this.magnetized) {\n      // little hop + settle\n      this.vy += 320 * dt;\n      this.x += this.vx * dt; this.y += this.vy * dt;\n      this.vx *= Math.pow(0.9, dt * 60);\n      if (this.t > 0.35) { this.vy *= Math.pow(0.75, dt * 60); }\n      if (ctx.world.isSolidWorld(this.x, this.y)) { this.x -= this.vx * dt; this.y -= this.vy * dt; this.vx *= -0.4; this.vy *= -0.4; }\n      const range = p.pickupRange * (ctx.magnetAll ? 12 : 1);\n      if (d < range) this.magnetized = true;\n    } else {\n      const dx = p.x - this.x, dy = p.y - this.y;\n      const dd = Math.hypot(dx, dy) + 0.01;\n      const speed = 120 + (1 - Math.min(1, dd / 120)) * 420;\n      this.x += (dx / dd) * speed * dt;\n      this.y += (dy / dd) * speed * dt;\n      if (this.type === 'coin' && Math.random() < 0.25) ctx.fx.trailPuff(this.x, this.y, '#ffe878', 1.2);\n    }\n\n    if (d < p.radius + 7) {\n      this.onPickup(ctx);\n      this.alive = false;\n    }\n    if (this.t > 45) this.alive = false;\n  }\n\n  onPickup(ctx) {\n    const p = ctx.player;\n    const c = this.conf;\n    ctx.fx.sparkle(this.x, this.y, c.color);\n    switch (this.type) {\n      case 'xp': case 'xpBig':\n        p.gainXp(this.amount); p.score += c.score; break;\n      case 'coin': {\n        const n = Math.max(1, Math.round(this.amount * (p.coinMult || 1)));\n        ctx.addRunCoins(n);\n        p.score += c.score;\n        if (n >= 5) ctx.fx.damageText(this.x, this.y - 8, '+' + n, '#ffe878', { size: 7, life: 0.6 });\n        break;\n      }\n      case 'shard':\n        ctx.gameStats.shards += this.amount; p.score += c.score; break;\n      case 'heart':\n        p.heal(this.amount);\n        ctx.fx.damageText(this.x, this.y - 8, '+' + Math.round(this.amount), '#7eff9e', { size: 7 });\n        p.score += c.score; break;\n      case 'magnet':\n        ctx.magnetPulse(); p.score += c.score; break;\n      case 'chest':\n        ctx.openChest(this); p.score += c.score; break;\n    }\n  }\n}\n","js/data/realms.js":"// ============================================================\n// HELL TRAIN — realms, bosses, difficulty, challenges\n// ============================================================\nexport const REALMS = [\n  { id: 'purgatory', name: 'Purgatory', idx: 1, sky: '#1d1326', ground: '#1a1322', accent: '#3d2a4f',\n    desc: 'Foggy abandoned railway environment.', music: 'wind_chimes', mechanic: 'Fog reduces visibility.',\n    boss: { id: 'boss_conductor', name: 'The Conductor' }, tier: 1 },\n  { id: 'infernal', name: 'The Infernal Fields', idx: 2, sky: '#2a0c08', ground: '#1f0a0a', accent: '#a0321a',\n    desc: 'Lava and ash.', music: 'low_drums', mechanic: 'Heat pulses damage if you stop moving.',\n    boss: { id: 'boss_ashen', name: 'The Ashen Giant' }, tier: 2 },\n  { id: 'forgotten', name: 'The Forgotten City', idx: 3, sky: '#0d0d1d', ground: '#11111f', accent: '#5a5a78',\n    desc: 'Abandoned supernatural city.', music: 'bells', mechanic: 'The map changes when bells ring.',\n    boss: { id: 'boss_bell', name: 'The Bellmaster' }, tier: 3 },\n  { id: 'forest', name: 'The Haunted Forest', idx: 4, sky: '#09160e', ground: '#0a1410', accent: '#1f3a1a',\n    desc: 'Supernatural forest.', music: 'forest', mechanic: 'Vines trap you in place briefly.',\n    boss: { id: 'boss_root', name: 'The Ancient Root' }, tier: 4 },\n  { id: 'frozen', name: 'The Frozen Realm', idx: 5, sky: '#0c142a', ground: '#0e1428', accent: '#2a4a70',\n    desc: 'Frozen railway.', music: 'ice', mechanic: 'Cold slows you down.',\n    boss: { id: 'boss_frost', name: 'The Frost King' }, tier: 5 },\n  { id: 'desert', name: 'The Sunken Desert', idx: 6, sky: '#2a1c0a', ground: '#23190a', accent: '#9a6c30',\n    desc: 'Ancient ruins buried in sand.', music: 'desert', mechanic: 'Sandstorms reduce visibility.',\n    boss: { id: 'boss_sand', name: 'The Sand Titan' }, tier: 6 },\n  { id: 'void', name: 'The Void', idx: 7, sky: '#080418', ground: '#0a0420', accent: '#482278',\n    desc: 'Reality-breaking cosmic realm.', music: 'void', mechanic: 'Reality shifts every 20 seconds.',\n    boss: { id: 'boss_null', name: 'The Null' }, tier: 7 },\n  { id: 'terminus', name: 'The Terminus', idx: 8, sky: '#0a0a0a', ground: '#101010', accent: '#c8a030',\n    desc: 'Final mysterious realm.', music: 'terminus', mechanic: 'The train itself becomes your opponent.',\n    boss: { id: 'boss_train', name: 'The Train' }, tier: 8 },\n  // NEW AAA SECTORS\n  { id: 'dreadmarsh', name: 'The Dread Marsh', idx: 9, sky: '#0a1a14', ground: '#0e1a14', accent: '#2a6a3a',\n    desc: 'Endless toxic swamp with sinking ruins. Vines trap, fog chokes.', music: 'marsh', mechanic: 'Toxic pools drain HP, vines root you.',\n    boss: { id: 'boss_m
