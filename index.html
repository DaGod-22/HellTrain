es(['#ffffff', '#fff0a0', '#ffe066', '#c8a030'], 40),\n    explToxic: explosionFrames(['#ffffff', '#c0ff90', '#5a9c33', '#1f3a14'], 40),\n    impact: explosionFrames(['#ffffff', '#ffd0a0'], 20, 6),\n    slash: slashFrames('#ffffff'),\n    slashFire: slashFrames('#ff9033'),\n  };\n  S.shadow = shadowSprite(18, 8);\n  S.shadowBig = shadowSprite(34, 14);\n  S.shadowHuge = shadowSprite(52, 20);\n\n  // --- character & train default sets ---\n  S.getCharSet = buildCharSet;\n  S.getTrainSet = buildTrainSet;\n\n  // back-compat flat keys\n  const c = buildCharSet('conductor');\n  S.playerDown = c.down.idle[0];\n  S.playerUp = c.up.idle[0];\n  S.playerSide = c.side.idle[0];\n  S.playerDownWalk = c.down.run[2];\n  S.playerUpWalk = c.up.run[2];\n  S.playerAttack = c.down.attack[1];\n  S.playerArmour = c.down.idle[0];\n  const tr = buildTrainSet('iron_horse');\n  S.trainEngine = tr.engine[0];\n  S.trainCar = tr.cargo[0];\n\n  // white-hit silhouette cache\n  const hitCache = new Map();\n  S.hitFlash = (canvas, tint = '#ffffff') => {\n    if (!canvas) return null;\n    let byTint = hitCache.get(canvas);\n    if (!byTint) { byTint = {}; hitCache.set(canvas, byTint); }\n    if (!byTint[tint]) byTint[tint] = whiteSilhouette(canvas, tint, 0.92);\n    return byTint[tint];\n  };\n  return S;\n}\n","js/data/icons.js":"// ============================================================\n// HELL TRAIN — UI icon atlas\n// The chunky menu icons are generated plates baked down by\n// tools/icons.mjs. They are pure decoration: if a file is missing\n// or slow, the UI falls back to the vector glyphs in home.js, so\n// boot can never hang or crash on them.\n// ============================================================\nexport const ICON_NAMES = [\n  'battle', 'train', 'arsenal', 'forge', 'coinshop',\n  'trophy', 'gift', 'daily', 'leaderboard', 'worldmap',\n  'armoury', 'relics', 'settings', 'bag', 'quickplay',\n];\n\nexport const ICONS = {};\n\nexport function loadIcons(base = 'assets/icons/', timeoutMs = 4000) {\n  if (typeof Image === 'undefined') return Promise.resolve(ICONS);\n  // The single-file build inlines the plates as data URIs on\n  // globalThis.__ICON_DATA; otherwise we fetch them from assets/icons/.\n  const inlined = globalThis.__ICON_DATA || null;\n  const one = (name) => new Promise((res) => {\n    try {\n      const im = new Image();\n      im.onload = () => { ICONS[name] = im; res(); };\n      im.onerror = () => res();\n      im.src = (inlined && inlined[name]) || (base + name + '.png');\n    } catch { res(); }\n  });\n  let timer = null;\n  const all = Promise.all(ICON_NAMES.map(one)).then(() => ICONS);\n  const bail = new Promise((res) => { timer = setTimeout(() => res(ICONS), timeoutMs); });\n  return Promise.race([all, bail]).then((r) => { clearTimeout(timer); return r; });\n}\n","js/core/save.js":"// ============================================================\n// HELL TRAIN — local save system\n// ============================================================\nconst KEY = 'helltrain.save.v2';\nconst OLD_KEY = 'helltrain.save.v1';\n\nexport function loadSave() {\n  try {\n    const raw = localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY);\n    if (!raw) return null;\n    return JSON.parse(raw);\n  } catch { return null; }\n}\nexport function saveSave(data) {\n  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {}\n}\nexport function resetSave() { try { localStorage.removeItem(KEY); localStorage.removeItem(OLD_KEY); } catch {} }\n\nexport function newSave() {\n  return {\n    version: 2,\n    coins: 0,\n    shards: 0,\n    achievements: [],\n    permaLevels: {},              // shop track id -> level\n    ownedCharSkins: ['conductor'],\n    ownedTrainSkins: ['iron_horse'],\n    charSkin: 'conductor',\n    trainSkin: 'iron_horse',\n    perma: { player: {}, train: {} },\n    stats: { totalKills: 0, totalRuns: 0, bestScore: 0, longestRun: 0, highestStage: 0,\n      totalCoins: 0, apocalypses: 0, bestCombo: 0 },\n    discovered: [],\n    characters: ['conductor'],\n    weapons: [],\n    armour: ['guardian'],\n    relics: [],\n    trainParts: 0,\n    bossCores: {},\n    unlockedRealms: ['purgatory'],\n    endings: [],\n    settings: { bloom: 1, lighting: 1, scanlines: 0.35, shake: 1, damageNumbers: 1 },\n  };\n}\n\nexport function ensureShape(save) {\n  const s = save || newSave();\n  const d = newSave();\n  for (const k of Object.keys(d)) {\n    if (!(k in s) || s[k] === null || s[k] === undefined) s[k] = d[k];\n  }\n  // nested defaults\n  for (const k of Object.keys(d.stats)) if (!(k in s.stats)) s.stats[k] = d.stats[k];\n  for (const k of Object.keys(d.settings)) if (!(k in s.settings)) s.settings[k] = d.settings[k];\n  if (!Array.isArray(s.ownedCharSkins) || !s.ownedCharSkins.length) s.ownedCharSkins = ['conductor'];\n  if (!Array.isArray(s.ownedTrainSkins) || !s.ownedTrainSkins.length) s.ownedTrainSkins = ['iron_horse'];\n  if (!s.ownedCharSkins.includes(s.charSkin)) s.charSkin = 'conductor';\n  if (!s.ownedTrainSkins.includes(s.trainSkin)) s.trainSkin = 'iron_horse';\n  s.version = 2;\n  return s;\n}\n\nexport function addCoins(save, n) {\n  save.coins = Math.max(0, Math.round((save.coins || 0) + n));\n  save.stats.totalCoins = (save.stats.totalCoins || 0) + Math.max(0, n);\n  return save.coins;\n}\nexport function spendCoins(save, n) {\n  if ((save.coins || 0) < n) return false;\n  save.coins -= n;\n  return true;\n}\n","js/systems/supabase.js":"// ============================================================\n// HELL TRAIN — Supabase client with RLS-aware submit + leaderboards\n// Uses the official @supabase/supabase-js UMD bundle loaded via\n// CDN in index.html. Falls back to local-only mode if absent.\n// ============================================================\n\nconst SUPABASE_URL = (typeof window !== 'undefined' && window.HELLTRAIN_SUPABASE_URL) || '';\nconst SUPABASE_KEY = (typeof window !== 'undefined' && window.HELLTRAIN_SUPABASE_ANON) || '';\n\nexport class SupabaseClient {\n  constructor(url = SUPABASE_URL, key = SUPABASE_KEY) {\n    this.url = url; this.key = key;\n    this.client = null;\n    this.connected = false;\n    this._init();\n  }\n  _init() {\n    if (!this.url || !this.key) {\n      this.connected = false; return;\n    }\n    if (!window.supabase) { this.connected = false; return; }\n    try {\n      this.client = window.supabase.createClient(this.url, this.key, {\n        auth: { persistSession: false },\n        realtime: { params: { eventsPerSecond: 5 } },\n      });\n      this.connected = true;\n    } catch (e) {\n      this.connected = false; this.lastError = e?.message;\n    }\n  }\n  isAvailable() { return this.connected; }\n  async submitScore({ score, time, stage, realm, kills, character, difficulty, challenge, playerId }) {\n    if (!this.connected) return { ok: false, reason: 'offline' };\n    if (typeof score !== 'number' || score < 0 || score > 1e12) return { ok: false, reason: 'invalid' };\n    if (typeof time !== 'number' || time < 0 || time > 60 * 60 * 24) return { ok: false, reason: 'invalid' };\n    if (typeof stage !== 'number' || stage < 1 || stage > 999) return { ok: false, reason: 'invalid' };\n    const row = {\n      player_id: String(playerId || 'anon').slice(0, 64),\n      score: Math.floor(score),\n      time_s: Math.floor(time),\n      stage: Math.floor(stage),\n      realm: String(realm || 'purgatory').slice(0, 32),\n      kills: Math.floor(kills || 0),\n      character: String(character || 'conductor').slice(0, 32),\n      difficulty: String(difficulty || 'normal').slice(0, 16),\n      challenge: challenge ? String(challenge).slice(0, 32) : null,\n      client_hash: hashPlayer(playerId),\n      created_at: new Date().toISOString(),\n    };\n    try {\n      const { error } = await this.client.from('scores').insert(row);\n      if (error) return { ok: false, reason: error.message };\n      return { ok: true };\n    } catch (e) { return { ok: false, reason: e?.message || 'network' }; }\n  }\n  async topScores(limit = 20, filter = {}) {\n    if (!this.connected) return [];\n    try {\n      let q = this.client.from('scores').select('*').order('score', { ascending: false }).limit(limit);\n      if (filter.realm) q = q.eq('realm', filter.realm);\n      if (filter.difficulty) q = q.eq('difficulty', filter.difficulty);\n      if (filter.challenge) q = q.eq('challenge', filter.challenge);\n      const { data, error } = await q;\n      if (error) return [];\n      return data || [];\n    } catch { return []; }\n  }\n  subscribe(callback) {\n    if (!this.connected) return () => {};\n    const sub = this.client.channel('scores_changes')\n      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'scores' }, payload => {\n        callback(payload.new);\n      })\n      .subscribe();\n    return () => { try { this.client.removeChannel(sub); } catch {} };\n  }\n}\n\nfunction hashPlayer(id) {\n  // Anti-cheat: hash of player id used for double-submit detection\n  let h = 5381;\n  const s = 'htrain_' + String(id || 'anon');\n  for (let i = 0; i < s.length; i++) h = ((h << 5) + h) + s.charCodeAt(i);\n  return h >>> 0;\n}\n","js/systems/audio.js":"// ============================================================\n// HELL TRAIN — audio architecture\n// Procedurally-generated music & SFX using WebAudio. The synth\n// architecture is small but expressive enough to deliver the\n// requested per-realm ambience without shipping audio assets.\n// ============================================================\n\nclass SimpleReverb {\n  constructor(ctx, seconds = 1.5, decay = 2) {\n    this.ctx = ctx;\n    this.input = ctx.createGain();\n    this.output = ctx.createGain();\n    const len = Math.floor(ctx.sampleRate * seconds);\n    this.buf = ctx.createBuffer(2, len, ctx.sampleRate);\n    for (let ch = 0; ch < 2; ch++) {\n      const d = this.buf.getChannelData(ch);\n      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);\n    }\n    this.convolver = ctx.createConvolver();\n    this.convolver.buffer = this.buf;\n    this.input.connect(this.convolver);\n    this.convolver.connect(this.output);\n    this.output.gain.value = 0.4;\n  }\n}\n\nexport class AudioEngine {\n  constructor() {\n    this.ctx = null;\n    this.master = null;\n    this.music = null;\n    this.musicGain = null;\n    this.sfxGain = null;\n    this.enabled = true;\n  }\n  ensure() {\n    if (this.ctx) return;\n    const C = window.AudioContext || window.webkitAudioContext;\n    if (!C) return;\n    this.ctx = new C();\n    this.master = this.ctx.createGain();\n    this.master.gain.value = 0.8;\n    this.master.connect(this.ctx.destination);\n    this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.4;\n    this.musicGain.connect(this.master);\n    this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 0.6;\n    this.sfxGain.connect(this.master);\n    this.reverb = new SimpleReverb(this.ctx);\n  }\n  resume() { this.ensure(); if (this.ctx?.state === 'suspended') this.ctx.resume(); }\n  setMusicVolume(v) { this.ensure(); this.musicGain.gain.value = v; }\n  setSfxVolume(v) { this.ensure(); this.sfxGain.gain.value = v; }\n\n  // ====== Generic tone ======\n  tone(freq, dur, type = 'square', gain = 0.2, attack = 0.005, release = 0.1, slideTo = null) {\n    this.ensure(); if (!this.ctx) return;\n    const o = this.ctx.createOscillator();\n    o.type = type;\n    o.frequency.value = freq;\n    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, this.ctx.currentTime + dur);\n    const g = this.ctx.createGain();\n    g.gain.value = 0; g.gain.linearRampToValueAtTime(gain, this.ctx.currentTime + attack);\n    g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + dur - release);\n    o.connect(g); g.connect(this.sfxGain);\n    o.start(); o.stop(this.ctx.currentTime + dur);\n  }\n  noise(dur, gain = 0.1, filterFreq = 1000, attack = 0.005) {\n    this.ensure(); if (!this.ctx) return;\n    const len = Math.floor(this.ctx.sampleRate * dur);\n    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);\n    const d = buf.getChannelData(0);\n    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);\n    const src = this.ctx.createBufferSource(); src.buffer = buf;\n    const filt = this.ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = filterFreq;\n    const g = this.ctx.createGain(); g.gain.value = 0;\n    g.gain.linearRampToValueAtTime(gain, this.ctx.currentTime + attack);\n    g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + dur);\n    src.connect(filt); filt.connect(g); g.connect(this.sfxGain);\n    src.start();\n  }\n\n  // ====== SFX presets ======\n  hit() { this.tone(220, 0.06, 'square', 0.18); this.noise(0.06, 0.12, 1500); }\n  crit() { this.tone(440, 0.1, 'sawtooth', 0.2); this.tone(660, 0.1, 'square', 0.18); }\n  shoot() { this.tone(880, 0.05, 'square', 0.15); }\n  fireball() { this.tone(200, 0.18, 'sawtooth', 0.18, 0.005, 0.05); this.tone(120, 0.2, 'square', 0.15); }\n  lightning() { this.tone(1800, 0.08, 'sawtooth', 0.22); this.tone(2400, 0.06, 'square', 0.2); this.noise(0.08, 0.15, 3000); }\n  explosion() { this.tone(80, 0.3, 'square', 0.3); this.noise(0.4, 0.3, 800); }\n  pickup() { this.tone(660, 0.05, 'square', 0.18); setTimeout(() => this.tone(990, 0.06, 'square', 0.16), 30); }\n  levelup() { this.tone(440, 0.08); this.tone(660, 0.08); this.tone(880, 0.12); }\n  rarePickup() { this.tone(880, 0.1); this.tone(1100, 0.1); this.tone(1320, 0.16); }\n  bossIntro() { this.tone(110, 0.5, 'sawtooth', 0.3); this.tone(82, 0.6, 'square', 0.3); this.noise(0.4, 0.2, 400); }\n  death() { this.tone(220, 0.5, 'sawtooth', 0.25); this.tone(110, 0.8, 'square', 0.25); }\n  victory() { this.tone(660, 0.1); this.tone(880, 0.1); this.tone(1100, 0.2); }\n  dodge() { this.tone(660, 0.04, 'square', 0.15); this.tone(1200, 0.05, 'square', 0.12); }\n  trainWhistle() { this.tone(440, 0.4, 'sawtooth', 0.22); this.tone(660, 0.4, 'sine', 0.2); }\n\n  // ====== Music loop (simple, no assets) ======\n  startMusic(track) {\n    this.ensure(); if (!this.ctx) return;\n    if (this.music) { try { this.music.stop(); } catch {} }\n    this.music = { stop: () => {} };\n    this._musicTrack = track;\n    this._musicT = 0;\n    this._musicStep = 0;\n    this._musicNodes = [];\n    this._scheduleMusic();\n  }\n  _scheduleMusic() {\n    if (!this.ctx) return;\n    const t = this._musicTrack;\n    const bpm = t === 'boss' ? 110 : t === 'terminus' ? 90 : 80;\n    const beat = 60 / bpm;\n    // Sequence notes (pentatonic, mood varies per track)\n    const seqs = {\n      purgatory: [220, 247, 277, 330, 294, 277, 247, 220],\n      infernal:  [110, 110, 147, 110, 165, 110, 196, 110],\n      forgotten: [220, 277, 220, 330, 220, 277, 247, 196],\n      forest:    [247, 294, 330, 370, 330, 294, 247, 220],\n      frozen:    [330, 370, 440, 370, 330, 277, 247, 220],\n      desert:    [147, 175, 196, 220, 196, 175, 147, 110],\n      void:      [110, 138, 110, 165, 110, 196, 110, 220],\n      terminus:  [82, 110, 82, 147, 82, 165, 82, 196],\n      boss:      [110, 110, 165, 110, 220, 110, 247, 110],\n      menu:      [220, 247, 277, 330, 277, 247, 220, 196],\n    };\n    const seq = seqs[t] || seqs.purgatory;\n    const step = beat / 2;\n    const startT = this.ctx.currentTime + 0.05;\n    for (let i = 0; i < 16; i++) {\n      const note = seq[i % seq.length] * (i % 2 === 0 ? 1 : 0.5);\n      const when = startT + i * step;\n      const o = this.ctx.createOscillator();\n      o.type = t === 'void' ? 'sawtooth' : t === 'infernal' ? 'square' : 'triangle';\n      o.frequency.value = note;\n      const g = this.ctx.createGain();\n      g.gain.value = 0;\n      g.gain.linearRampToValueAtTime(0.12, when + 0.01);\n      g.gain.linearRampToValueAtTime(0, when + step * 0.9);\n      o.connect(g); g.connect(this.musicGain);\n      o.start(when); o.stop(when + step);\n      this._musicNodes.push(o);\n    }\n    // Drums: noise on every other beat\n    for (let i = 0; i < 8; i++) {\n      const when = startT + i * beat;\n      const src = this.ctx.createBufferSource();\n      const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.06, this.ctx.sampleRate);\n      const d = buf.getChannelData(0);\n      for (let j = 0; j < d.length; j++) d[j] = (Math.random() * 2 - 1) * (1 - j / d.length);\n      src.buffer = buf;\n      const filt = this.ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 220;\n      const g = this.ctx.createGain(); g.gain.value = 0.18;\n      src.connect(filt); filt.connect(g); g.connect(this.musicGain);\n      src.start(when);\n    }\n    // Schedule the next loop\n    setTimeout(() => {\n      if (this._musicTrack === t) this._scheduleMusic();\n    }, beat * 16 * 1000 - 200);\n  }\n  stopMusic() { this._musicTrack = null; if (this.music) { try { this.music.stop(); } catch {} } }\n}\n","js/core/utils.js":"// ============================================================\n// HELL TRAIN — math / random / helpers\n// ============================================================\nexport function mulberry32(seed) {\n  let a = seed >>> 0;\n  return function () {\n    a |= 0; a = (a + 0x6D2B79F5) | 0;\n    let t = Math.imul(a ^ (a >>> 15), 1 | a);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\nexport class RNG {\n  constructor(seed) { this.rng = mulberry32(seed || (Math.random() * 4294967295) >>> 0); }\n  next() { return this.rng(); }\n  range(a, b) { return a + this.rng() * (b - a); }\n  int(a, b) { return Math.floor(this.range(a, b + 1)); }\n  pick(arr) { return arr[Math.floor(this.rng() * arr.length)]; }\n  chance(p) { return this.rng() < p; }\n  shuffle(arr) {\n    const a = arr.slice();\n    for (let i = a.length - 1; i > 0; i--) {\n      const j = Math.floor(this.rng() * (i + 1));\n      [a[i], a[j]] = [a[j], a[i]];\n    }\n    return a;\n  }\n  weighted(items, getWeight) {\n    let total = 0;\n    for (const it of items) total += getWeight(it);\n    let r = this.rng() * total;\n    for (const it of items) { r -= getWeight(it); if (r <= 0) return it; }\n    return items[items.length - 1];\n  }\n}\n\nexport const clamp = (v, a, b) => v < a ? a : v > b ? b : v;\nexport const lerp = (a, b, t) => a + (b - a) * t;\nexport const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);\nexport const dist2 = (x1, y1, x2, y2) => { const dx = x2 - x1, dy = y2 - y1; return dx * dx + dy * dy; };\nexport const angleTo = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);\nexport const TAU = Math.PI * 2;\nexport const rand = (a, b) => a + Math.random() * (b - a);\nexport const randInt = (a, b) => Math.floor(rand(a, b + 1));\nexport const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];\nexport const chance = (p) => Math.random() < p;\n\nexport function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }\nexport function easeInCubic(t) { return t * t * t; }\nexport function easeOutBack(t) {\n  const c1 = 1.70158, c3 = c1 + 1;\n  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);\n}\n\n// Deterministic hash for names/ids\nexport function hashStr(str) {\n  let h = 2166136261;\n  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }\n  return h >>> 0;\n}\n\n// Format time m:ss\nexport function fmtTime(sec) {\n  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);\n  return `${m}:${s.toString().padStart(2, '0')}`;\n}\n\nexport function fmtNum(n) {\n  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';\n  if (n >= 1e4) return (n / 1e3).toFixed(1) + 'K';\n  return Math.floor(n).toString();\n}\n\n// ID generator\nlet uidCounter = 1;\nexport function uid() { return uidCounter++; }\n\n// Circle collision\nexport function circleHit(ax, ay, ar, bx, by, br) {\n  const dx = bx - ax, dy = by - ay, r = ar + br;\n  return dx * dx + dy * dy <= r * r;\n}\n\n// AABB overlap\nexport function aabbHit(ax, ay, aw, ah, bx, by, bw, bh) {\n  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;\n}\n\n// Rect-point\nexport function pointInRect(px, py, rx, ry, rw, rh) {\n  return px >= rx && px <= rx + rw && py >= ry && py <= ry + rh;\n}\n\n// Move with per-axis collision against a list of AABBs\nexport function moveWithCollision(x, y, dx, dy, w, h, solids) {\n  let nx = x + dx, ny = y + dy;\n  // X axis\n  let okX = true;\n  for (const s of solids) {\n    if (nx + w > s.x && nx < s.x + s.w && y + h > s.y && y < s.y + s.h) { okX = false; break; }\n  }\n  if (!okX) nx = x;\n  for (const s of solids) {\n    if (x + w > s.x && x < s.x + s.w && ny + h > s.y && ny < s.y + s.h) { okX = false; break; }\n  }\n  if (!okX) ny = y;\n  return [nx, ny];\n}\n","js/data/enemies.js":"// ============================================================\n// HELL TRAIN — enemy archetypes\n// ============================================================\nexport const ENEMIES = [\n  // chasers\n  { id: 'lost_soul', name: 'Lost Soul', hp: 14, dmg: 6, spd: 60, radius: 6, ai: 'chase', xp: 4, sprite: 'ghost',\n    behavior: 'floats', desc: 'A wandering spirit.' },\n  { id: 'wraithling', name: 'Wraithling', hp: 22, dmg: 9, spd: 80, radius: 6, ai: 'chase', xp: 6, sprite: 'wraith',\n    desc: 'A faster, more dangerous wraith.' },\n  { id: 'crawler', name: 'Crawler', hp: 18, dmg: 7, spd: 70, radius: 7, ai: 'chase', xp: 5, sprite: 'crawler',\n    desc: 'Skitters quickly.' },\n  { id: 'shadow_hound', name: 'Shadow Hound', hp: 28, dmg: 12, spd: 120, radius: 7, ai: 'chase', xp: 9, sprite: 'houndShadow',\n    desc: 'Fast predator.' },\n  // tanks\n  { id: 'station_keeper', name: 'Station Keeper', hp: 90, dmg: 14, spd: 38, radius: 10, ai: 'tank', xp: 14, sprite: 'knight',\n    desc: 'Armoured guardian.' },\n  { id: 'ash_brute', name: 'Ash Brute', hp: 110, dmg: 18, spd: 36, radius: 11, ai: 'tank', xp: 16, sprite: 'brute_ash',\n    desc: 'A smouldering giant.' },\n  // ranged\n  { id: 'station_caster', name: 'Station Caster', hp: 24, dmg: 12, spd: 50, radius: 7, ai: 'ranged', xp: 8, sprite: 'caster',\n    desc: 'Hurls bolts from afar.', proj: { id: 'shadow_bolt', dmg: 10, spd: 160, range: 220, cd: 1.6 } },\n  { id: 'fire_caster', name: 'Fire Caster', hp: 26, dmg: 14, spd: 50, radius: 7, ai: 'ranged', xp: 9, sprite: 'caster_fire',\n    desc: 'Hurls fire.', proj: { id: 'fire_bolt', dmg: 12, spd: 170, range: 220, cd: 1.7 } },\n  // swarm\n  { id: 'firefly_swarm', name: 'Firefly Swarm', hp: 6, dmg: 4, spd: 75, radius: 5, ai: 'swarm', xp: 2, sprite: 'flyer',\n    desc: 'Weak but plentiful.' },\n  // summoners\n  { id: 'wraith_summoner', name: 'Wraith Summoner', hp: 50, dmg: 8, spd: 44, radius: 8, ai: 'summoner', xp: 18, sprite: 'summoner',\n    desc: 'Spawns wraithlings.', summon: { id: 'wraithling', cd: 5, count: 2, max: 6 } },\n  // burrower\n  { id: 'ash_burrower', name: 'Ash Burrower', hp: 32, dmg: 11, spd: 60, radius: 7, ai: 'burrower', xp: 11, sprite: 'egg',\n    desc: 'Emerges from the ground.' },\n  // split\n  { id: 'slime', name: 'Slime', hp: 40, dmg: 7, spd: 50, radius: 9, ai: 'split', xp: 12, sprite: 'blob',\n    desc: 'Splits on death.', splitInto: 'firefly_swarm', splits: 3 },\n  // shield\n  { id: 'void_sentinel', name: 'Void Sentinel', hp: 70, dmg: 10, spd: 38, radius: 9, ai: 'shield', xp: 18, sprite: 'knight_void',\n    desc: 'Block projectiles.' },\n  // flyers\n  { id: 'shadow_bat', name: 'Shadow Bat', hp: 16, dmg: 6, spd: 90, radius: 6, ai: 'fly', xp: 4, sprite: 'flyer',\n    desc: 'Flies over obstacles.' },\n];\n\n// Realm-specific roster overrides\nexport const REALM_ROSTERS = {\n  purgatory: ['lost_soul','crawler','wraithling','shadow_hound','station_caster','station_keeper','wraith_summoner','shadow_bat'],\n  infernal:  ['ash_brute','fire_caster','slime','ash_burrower','shadow_hound','firefly_swarm','wraith_summoner','station_keeper'],\n  forgotten: ['lost_soul','station_caster','station_keeper','shadow_bat','void_sentinel','wraith_summoner','wraithling'],\n  forest:    ['crawler','shadow_hound','slime','lost_soul','wraithling','wraith_summoner','firefly_swarm'],\n  frozen:    ['slime','station_keeper','wraithling','crawler','void_sentinel','shadow_bat','firefly_swarm'],\n  desert:    ['ash_brute','fire_caster','slime','ash_burrower','shadow_hound','wraith_summoner'],\n  void:      ['void_sentinel','lost_soul','wraith_summoner','shadow_bat','station_caster','slime','wraithling'],\n  terminus:  ['ash_brute','void_sentinel','wraith_summoner','station_keeper','shadow_hound','fire_caster','wraithling','shadow_bat'],\n};\n\n// Elite modifiers\nexport const ELITE_MODS = [\n  { id: 'armoured', name: 'Armoured', apply: e => { e.hp *= 2.2; e.radius += 1; e.colorMod = 0.7; } },\n  { id: 'fast', name: 'Fast', apply: e => { e.spd *= 1.6; e.dmg *= 0.9; e.colorMod = 1.3; } },\n  { id: 'giant', name: 'Giant', apply: e => { e.hp *= 4; e.spd *= 0.85; e.radius *= 1.6; e.scale = 2; e.dmg *= 1.5; e.giant = true; } },\n  { id: 'regenerating', name: 'Regenerating', apply: e => { e.regen = Math.max(2, e.hp * 0.04); e.colorMod = 1.6; } },\n  { id: 'teleporting', name: 'Teleporting', apply: e => { e.teleportCd = 4; e.teleportRange = 80; e.colorMod = 0.4; } },\n  { id: 'summoner', name: 'Summoner', apply: e => { e.ai = 'summoner'; e.summon = { id: 'firefly_swarm', cd: 3.5, count: 2, max: 4 }; e.hp *= 1.4; e.colorMod = 0.2; } },\n  { id: 'enraged', name: 'Enraged', apply: e => { e.dmg *= 1.7; e.spd *= 1.15; e.colorMod = -0.15; } },\n  { id: 'void_touched', name: 'Void-Touched', apply: e => { e.voidTouched = true; e.hp *= 1.7; e.dmg *= 1.2; e.colorMod = -0.5; } },\n];\n\nexport function findEnemy(id) { return ENEMIES.find(e => e.id === id); }\n","js/core/world.js":"// ============================================================\n// HELL TRAIN — procedural map generation\n// Builds a chunk-based world for each realm/stage\n// ============================================================\nimport { RNG, randInt } from './utils.js';\nimport { REALM_ROSTERS } from '../data/enemies.js';\n\nconst TILE = 16;\nexport const TILE_SIZE = TILE;\n\n// Tile kinds\nexport const T = {\n  EMPTY: 0, FLOOR: 1, WALL: 2, TREE: 3, ROCK: 4,\n  WATER: 5, LAVA: 6, ICE: 7, SAND: 8, VOID: 9,\n  ASH: 10, SNOW: 11, TRACK: 12, PLATFORM: 13,\n};\n\n// Biomes -> default tile weights for floor/wall/doodad\nconst BIOMES = {\n  purgatory: { ground: T.FLOOR, decor: [T.TREE, T.ROCK], hazard: T.WATER, fog: 0.5 },\n  infernal:  { ground: T.ASH, decor: [T.ROCK, T.LAVA], hazard: T.LAVA, fog: 0.0 },\n  forgotten: { ground: T.FLOOR, decor: [T.ROCK, T.WALL], hazard: T.WATER, fog: 0.2 },\n  forest:    { ground: T.FLOOR, decor: [T.TREE, T.TREE], hazard: T.WATER, fog: 0.3 },\n  frozen:    { ground: T.ICE, decor: [T.ROCK, T.SNOW], hazard: T.ICE, fog: 0.4 },\n  desert:    { ground: T.SAND, decor: [T.ROCK, T.ROCK], hazard: T.SAND, fog: 0.1 },\n  void:      { ground: T.VOID, decor: [T.VOID, T.VOID], hazard: T.VOID, fog: 0.0 },\n  terminus:  { ground: T.PLATFORM, decor: [T.WALL], hazard: T.VOID, fog: 0.0 },\n  phantom:   { ground: T.VOID, decor: [T.VOID, T.VOID], hazard: T.VOID, fog: 0.6 },\n};\n\nexport class World {\n  constructor(seed, realmId, difficulty) {\n    this.seed = seed >>> 0;\n    this.rng = new RNG(this.seed);\n    this.realmId = realmId;\n    this.difficulty = difficulty;\n    this.biome = BIOMES[realmId] || BIOMES.purgatory;\n    // Multiple rooms stitched together\n    this.rooms = [];\n    this.connections = [];\n    this.specials = {}; // boss room, elite room, shop, treasure, event\n    this._generate();\n  }\n\n  _generate() {\n    const numRooms = 10 + Math.floor(this.rng.next() * 4);\n    const W = 60, H = 60;\n    // Layout rooms in a non-linear chain; one path always leads to a boss room.\n    let cx = Math.floor(W / 2), cy = Math.floor(H / 2);\n    const startRoom = { x: cx, y: cy, w: 14, h: 10, id: 'start', kind: 'start', visited: true };\n    this.rooms.push(startRoom);\n    let lastRoom = startRoom;\n    for (let i = 0; i < numRooms; i++) {\n      // pick a random adjacent position\n      const dir = this.rng.int(0, 3);\n      const offset = 18 + this.rng.int(0, 6);\n      let nx = lastRoom.x, ny = lastRoom.y;\n      if (dir === 0) nx += lastRoom.w / 2 + offset;\n      if (dir === 1) nx -= lastRoom.w / 2 + offset;\n      if (dir === 2) ny += lastRoom.h / 2 + offset;\n      if (dir === 3) ny -= lastRoom.h / 2 + offset;\n      nx = Math.max(2, Math.min(W - 16, nx - 7));\n      ny = Math.max(2, Math.min(H - 14, ny - 5));\n      const w = 12 + this.rng.int(0, 6);\n      const h = 9 + this.rng.int(0, 4);\n      const room = {\n        x: nx, y: ny, w, h, id: 'r' + i, kind: this._pickKind(i, numRooms),\n      };\n      this.rooms.push(room);\n      this.connections.push({ from: lastRoom, to: room });\n      lastRoom = room;\n    }\n    // Boss room at the end\n    const bossRoom = { x: lastRoom.x + lastRoom.w / 2 + 14, y: lastRoom.y, w: 18, h: 14,\n      id: 'boss', kind: 'boss' };\n    this.rooms.push(bossRoom);\n    this.connections.push({ from: lastRoom, to: bossRoom });\n\n    // Tile grid (W*H tiles)\n    this.W = W; this.H = H;\n    this.tiles = new Uint8Array(W * H);\n    this.solid = new Uint8Array(W * H); // 1 if blocking\n    this.doodad = new Uint8Array(W * H); // 0..3 variants\n    this.lights = []; // (x,y,radius,color)\n    this._stampRooms();\n    this._stampPaths();\n    this._addSpecials();\n  }\n\n  _pickKind(i, total) {\n    const r = this.rng.next();\n    if (i === 0) return 'combat';\n    if (i === total - 1) return 'elite';\n    if (r < 0.55) return 'combat';\n    if (r < 0.7) return 'elite';\n    if (r < 0.8) return 'treasure';\n    if (r < 0.88) return 'shop';\n    return 'event';\n  }\n\n  _stampRooms() {\n    for (const r of this.rooms) {\n      const x0 = Math.floor(r.x), y0 = Math.floor(r.y);\n      const x1 = Math.floor(r.x + r.w), y1 = Math.floor(r.y + r.h);\n      for (let y = y0; y < y1; y++) {\n        for (let x = x0; x < x1; x++) {\n          if (x < 0 || y < 0 || x >= this.W || y >= this.H) continue;\n          const idx = y * this.W + x;\n          this.tiles[idx] = this.biome.ground;\n          this.solid[idx] = 0;\n          // walls on perimeter for certain kinds\n          const onEdge = x === x0 || y === y0 || x === x1 - 1 || y === y1 - 1;\n          if (onEdge && r.kind !== 'start' && r.kind !== 'boss') {\n            // leave some gaps\n            const seed = (x * 31 + y * 17 + this.seed) % 7;\n            if (seed !== 0) {\n              this.tiles[idx] = T.WALL;\n              this.solid[idx] = 1;\n            }\n          }\n        }\n      }\n      // Decorations\n      for (let i = 0; i < (r.w * r.h) / 14; i++) {\n        const dx = x0 + this.rng.int(1, r.w - 2);\n        const dy = y0 + this.rng.int(1, r.h - 2);\n        const idx = dy * this.W + dx;\n        if (this.tiles[idx] !== this.biome.ground) continue;\n        const choice = this.rng.pick(this.biome.decor);\n        this.tiles[idx] = choice;\n        if (choice === T.TREE || choice === T.ROCK) this.solid[idx] = 1;\n        // hazard placement in some rooms\n        if (this.rng.next() < 0.04) {\n          this.tiles[idx] = this.biome.hazard;\n          if (this.biome.hazard === T.LAVA) this.solid[idx] = 0;\n        }\n        this.doodad[idx] = this.rng.int(0, 3);\n      }\n      // Light source at room center for visibility\n      this.lights.push({\n        x: (x0 + r.w / 2) * TILE,\n        y: (y0 + r.h / 2) * TILE,\n        radius: 110 + Math.max(r.w, r.h) * 4,\n        color: this.realmId === 'infernal' ? '#ff7a33' :\n               this.realmId === 'frozen' ? '#a8d4f4' :\n               this.realmId === 'void' ? '#985ce0' : '#fff0a0',\n      });\n    }\n  }\n\n  _stampPaths() {\n    // Carve corridors between consecutive rooms (L-shaped)\n    for (const c of this.connections) {\n      const ax = Math.floor(c.from.x + c.from.w / 2);\n      const ay = Math.floor(c.from.y + c.from.h / 2);\n      const bx = Math.floor(c.to.x + c.to.w / 2);\n      const by = Math.floor(c.to.y + c.to.h / 2);\n      const horizFirst = this.rng.chance(0.5);\n      if (horizFirst) {\n        this._carveCorridor(ax, ay, bx, ay, 3);\n        this._carveCorridor(bx, ay, bx, by, 3);\n      } else {\n        this._carveCorridor(ax, ay, ax, by, 3);\n        this._carveCorridor(ax, by, bx, by, 3);\n      }\n    }\n  }\n\n  _carveCorridor(x1, y1, x2, y2, halfW) {\n    const xa = Math.min(x1, x2), xb = Math.max(x1, x2);\n    const ya = Math.min(y1, y2), yb = Math.max(y1, y2);\n    for (let y = ya - halfW; y <= yb + halfW; y++) {\n      for (let x = xa - halfW; x <= xb + halfW; x++) {\n        if (x < 0 || y < 0 || x >= this.W || y >= this.H) continue;\n        const idx = y * this.W + x;\n        this.tiles[idx] = this.biome.ground;\n        this.solid[idx] = 0;\n      }\n    }\n  }\n\n  _addSpecials() {\n    for (const r of this.rooms) {\n      this.specials[r.id] = {\n        x: (r.x + r.w / 2) * TILE,\n        y: (r.y + r.h / 2) * TILE,\n        w: r.w * TILE, h: r.h * TILE, kind: r.kind, room: r,\n      };\n    }\n    // Find player spawn = first room center\n    const start = this.rooms[0];\n    this.playerSpawn = { x: (start.x + start.w / 2) * TILE, y: (start.y + start.h / 2) * TILE };\n    const boss = this.rooms[this.rooms.length - 1];\n    this.bossSpawn = { x: (boss.x + boss.w / 2) * TILE, y: (boss.y + boss.h / 2) * TILE };\n    this.bossRoomId = boss.id;\n  }\n\n  // Returns the room at world coords (or null)\n  roomAtWorld(x, y) {\n    const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);\n    for (const r of this.rooms) {\n      if (tx >= r.x && tx < r.x + r.w && ty >= r.y && ty < r.y + r.h) return r;\n    }\n    return null;\n  }\n  isSolidWorld(x, y) {\n    const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);\n    if (tx < 0 || ty < 0 || tx >= this.W || ty >= this.H) return true;\n    return !!this.solid[ty * this.W + tx];\n  }\n  tileAtWorld(x, y) {\n    const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);\n    if (tx < 0 || ty < 0 || tx >= this.W || ty >= this.H) return T.WALL;\n    return this.tiles[ty * this.W + tx];\n  }\n\n  pickEnemyRoster(stage) {\n    const roster = REALM_ROSTERS[this.realmId] || REALM_ROSTERS.purgatory;\n    // Late stages use tougher mix\n    const tier = Math.min(2, Math.floor(stage / 2));\n    const pool = roster.slice();\n    return pool;\n  }\n}\n","js/core/render.js":"// ============================================================\n// HELL TRAIN — RENDER PIPELINE\n// Deferred-ish 2D lighting + bloom + colour grading + CRT juice,\n// all at the native low internal resolution so every effect\n// stays perfectly pixel-locked.\n//\n//   scene  -> light buffer (multiply) -> bloom (screen)\n//          -> grade -> vignette -> aberration -> scanlines -> flash\n// ============================================================\nimport { makeCanvas } from './pixel.js';\n\nconst TAU = Math.PI * 2;\n\nexport class Renderer {\n  constructor(w, h) {\n    this.w = w; this.h = h;\n    this.scene = makeCanvas(w, h);\n    this.sctx = this.scene.getContext('2d');\n    this.light = makeCanvas(w, h);\n    this.lctx = this.light.getContext('2d');\n    this.bloomA = makeCanvas(Math.ceil(w / 2), Math.ceil(h / 2));\n    this.bactx = this.bloomA.getContext('2d');\n    this.bloomB = makeCanvas(Math.ceil(w / 2), Math.ceil(h / 2));\n    this.bbctx = this.bloomB.getContext('2d');\n    this.tmp = makeCanvas(w, h);\n    this.tctx = this.tmp.getContext('2d');\n    for (const c of [this.sctx, this.lctx, this.bactx, this.bbctx, this.tctx]) c.imageSmoothingEnabled = false;\n    this.lights = [];\n    this.quality = 'high';       // high | medium | low\n    this.settings = {\n      bloom: 0.55, lighting: 1, grade: 1, vignette: 0.5, scanlines: 0, aberration: 0.5, grain: 0,\n    };\n    this._gradCache = new Map();\n  }\n\n  resize(w, h) {\n    if (this.w === w && this.h === h) return;\n    this.w = w; this.h = h;\n    this.scene = makeCanvas(w, h); this.sctx = this.scene.getContext('2d');\n    this.light = makeCanvas(w, h); this.lctx = this.light.getContext('2d');\n    this.bloomA = makeCanvas(Math.ceil(w / 2), Math.ceil(h / 2)); this.bactx = this.bloomA.getContext('2d');\n    this.bloomB = makeCanvas(Math.ceil(w / 2), Math.ceil(h / 2)); this.bbctx = this.bloomB.getContext('2d');\n    this.tmp = makeCanvas(w, h); this.tctx = this.tmp.getContext('2d');\n  }\n\n  // ---- frame lifecycle ----\n  begin() {\n    this.lights.length = 0;\n    this.sctx.setTransform(1, 0, 0, 1, 0, 0);\n    this.sctx.clearRect(0, 0, this.w, this.h);\n    return this.sctx;\n  }\n\n  // Screen-space light. r in screen px.\n  addLight(x, y, r, color = '#ffffff', intensity = 1, flicker = 0) {\n    this.lights.push({ x, y, r, color, intensity, flicker });\n  }\n\n  _radial(ctx, x, y, r, color, intensity) {\n    const g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(1, r));\n    g.addColorStop(0, color);\n    g.addColorStop(0.45, hexA(color, 0.55 * intensity));\n    g.addColorStop(1, hexA(color, 0));\n    ctx.fillStyle = g;\n    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();\n  }\n\n  // ---- composite everything onto the visible context ----\n  composite(out, opts = {}) {\n    const { w, h } = this;\n    const S = this.settings;\n    const ambient = opts.ambient || '#ffffff';\n    const gradeCol = opts.grade || null;\n    const gradeAmt = (opts.gradeAmount ?? 0.18) * S.grade;\n    const flash = opts.flash || null;\n    const time = opts.time || 0;\n    const aberration = (opts.aberration || 0) * S.aberration;\n\n    // 1) lighting pass -------------------------------------------------\n    if (S.lighting && ambient !== '#ffffff' && this.lights.length >= 0) {\n      const l = this.lctx;\n      l.globalCompositeOperation = 'source-over';\n      l.fillStyle = ambient;\n      l.fillRect(0, 0, w, h);\n      l.globalCompositeOperation = 'lighter';\n      for (const li of this.lights) {\n        let inten = li.intensity;\n        if (li.flicker) inten *= 1 - li.flicker * 0.5 * (0.5 + 0.5 * Math.sin(time * 37 + li.x));\n        this._radial(l, li.x, li.y, li.r, li.color, inten);\n      }\n      l.globalCompositeOperation = 'source-over';\n      this.sctx.globalCompositeOperation = 'multiply';\n      this.sctx.drawImage(this.light, 0, 0);\n      this.sctx.globalCompositeOperation = 'source-over';\n    }\n\n    // 2) bloom ---------------------------------------------------------\n    if (S.bloom > 0 && this.quality !== 'low') {\n      const bw = this.bloomA.width, bh = this.bloomA.height;\n      const a = this.bactx, b = this.bbctx;\n      a.setTransform(1, 0, 0, 1, 0, 0);\n      a.globalCompositeOperation = 'source-over';\n      a.clearRect(0, 0, bw, bh);\n      // crude bright-pass: draw scene, then multiply it by itself twice\n      a.drawImage(this.scene, 0, 0, bw, bh);\n      a.globalCompositeOperation = 'multiply';\n      a.drawImage(this.bloomA, 0, 0);\n      a.drawImage(this.bloomA, 0, 0);\n      a.globalCompositeOperation = 'source-over';\n      // blur (box, 2 passes via offset draws)\n      b.clearRect(0, 0, bw, bh);\n      b.globalAlpha = 0.25;\n      for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) b.drawImage(this.bloomA, dx, dy);\n      b.globalAlpha = 0.22;\n      for (const [dx, dy] of [[-2, -2], [2, -2], [-2, 2], [2, 2]]) b.drawImage(this.bloomA, dx, dy);\n      b.globalAlpha = 1;\n      this.sctx.globalCompositeOperation = 'lighter';\n      this.sctx.globalAlpha = 0.42 * S.bloom * (opts.bloomBoost || 1);\n      this.sctx.drawImage(this.bloomB, 0, 0, w, h);\n      this.sctx.globalAlpha = 1;\n      this.sctx.globalCompositeOperation = 'source-over';\n    }\n\n    // 3) blit to output with optional chromatic aberration ---------------\n    out.setTransform(1, 0, 0, 1, 0, 0);\n    out.imageSmoothingEnabled = false;\n    out.clearRect(0, 0, w, h);\n    if (aberration > 0.05) {\n      out.globalCompositeOperation = 'source-over';\n      out.drawImage(this.scene, 0, 0);\n      out.globalCompositeOperation = 'lighter';\n      out.globalAlpha = 0.35 * Math.min(1, aberration);\n      out.drawImage(this.scene, -Math.round(aberration), 0);\n      out.drawImage(this.scene, Math.round(aberration), 0);\n      out.globalAlpha = 1;\n      out.globalCompositeOperation = 'source-over';\n    } else {\n      out.drawImage(this.scene, 0, 0);\n    }\n\n    // 4) colour grade ----------------------------------------------------\n    if (gradeCol && gradeAmt > 0.01) {\n      out.globalCompositeOperation = 'soft-light';\n      out.globalAlpha = Math.min(1, gradeAmt * 3);\n      out.fillStyle = gradeCol;\n      out.fillRect(0, 0, w, h);\n      out.globalAlpha = 1;\n      out.globalCompositeOperation = 'source-over';\n    }\n\n    // 5) vignette ---------------------------------------------------------\n    if (S.vignette > 0) {\n      const key = 'vig' + w + 'x' + h;\n      let g = this._gradCache.get(key);\n      if (!g) {\n        g = out.createRadialGradient(w / 2, h / 2, h * 0.28, w / 2, h / 2, h * 0.82);\n        g.addColorStop(0, 'rgba(0,0,0,0)');\n        g.addColorStop(1, 'rgba(0,0,0,0.42)');\n        this._gradCache.set(key, g);\n      }\n      out.globalAlpha = S.vignette;\n      out.fillStyle = g;\n      out.fillRect(0, 0, w, h);\n      out.globalAlpha = 1;\n    }\n\n    // 6) scanlines + grain -------------------------------------------------\n    if (S.scanlines > 0 && this.quality === 'high') {\n      out.globalAlpha = 0.09 * S.scanlines;\n      out.fillStyle = '#000000';\n      for (let y = 0; y < h; y += 2) out.fillRect(0, y, w, 1);\n      out.globalAlpha = 1;\n    }\n\n    // 7) full-screen flash --------------------------------------------------\n    if (flash && flash.a > 0.01) {\n      out.globalCompositeOperation = flash.additive === false ? 'source-over' : 'lighter';\n      out.globalAlpha = Math.min(1, flash.a);\n      out.fillStyle = flash.color || '#ffffff';\n      out.fillRect(0, 0, w, h);\n      out.globalAlpha = 1;\n      out.globalCompositeOperation = 'source-over';\n    }\n  }\n}\n\nexport function hexA(hex, a) {\n  if (hex.startsWith('rgba')) return hex;\n  let h = hex.replace('#', '');\n  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];\n  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);\n  return `rgba(${r},${g},${b},${a})`;\n}\n\n// ============================================================\n// CAMERA — trauma shake, zoom punch, velocity lookahead\n// ============================================================\nexport class GameCamera {\n  // NOTE: zoom is deliberately kept to whole numbers. A fractional zoom\n  // (the old 1.55) resamples every sprite onto a non-integer grid, so one\n  // source pixel becomes 1 screen pixel here and 2 there — that uneven\n  // sampling is exactly what reads as \"blurry\" in pixel art.\n  constructor(w, h, zoom = 2) {\n    this.w = w; this.h = h;\n    this.x = 0; this.y = 0;\n    this.zoom = Math.max(1, Math.round(zoom)); this.baseZoom = this.zoom; this.zoomPunch = 0;\n    this.trauma = 0; this.traumaDecay = 1.6;\n    this.rot = 0;\n    this.t = 0;\n    this.offX = 0; this.offY = 0;\n    this.lookX = 0; this.lookY = 0;\n  }\n  shake(amount) { this.trauma = Math.min(1, this.trauma + amount); }\n  punch(amount) { this.zoomPunch = Math.min(0.35, this.zoomPunch + amount); }\n  follow(x, y, dt, vx = 0, vy = 0) {\n    this.lookX += ((vx * 0.12) - this.lookX) * Math.min(1, dt * 3);\n    this.lookY += ((vy * 0.12) - this.lookY) * Math.min(1, dt * 3);\n    const tx = x + this.lookX, ty = y + this.lookY;\n    const k = Math.min(1, dt * 7.5);\n    this.x += (tx - this.x) * k;\n    this.y += (ty - this.y) * k;\n  }\n  update(dt) {\n    this.t += dt;\n    this.trauma = Math.max(0, this.trauma - this.traumaDecay * dt);\n    this.zoomPunch *= Math.pow(0.0025, dt);\n    const s = this.trauma * this.trauma;\n    const n = (a, b) => Math.sin(this.t * a) * Math.sin(this.t * b);\n    // shake offsets are snapped to whole screen pixels too\n    this.offX = Math.round(s * 7 * n(51.3, 13.7));\n    this.offY = Math.round(s * 7 * n(43.1, 17.3));\n    this.rot = s * 0.02 * n(31.7, 11.3);\n    // punch stays on the integer grid: it steps 2x -> 3x, never 2.14x\n    this.zoom = this.baseZoom + (this.zoomPunch > 0.16 ? 1 : 0);\n  }\n  apply(ctx) {\n    // Snap the camera to whole world pixels before scaling, so sprite edges\n    // always land exactly on the pixel grid.\n    const cx = Math.round(this.x), cy = Math.round(this.y);\n    ctx.translate(Math.round(this.w / 2), Math.round(this.h / 2));\n    if (this.rot) ctx.rotate(this.rot);\n    ctx.scale(this.zoom, this.zoom);\n    ctx.translate(-cx + Math.round(this.offX / this.zoom), -cy + Math.round(this.offY / this.zoom));\n  }\n  worldToScreen(x, y) {\n    const cx = Math.round(this.x), cy = Math.round(this.y);\n    return {\n      x: (x - cx) * this.zoom + Math.round(this.w / 2) + this.offX,\n      y: (y - cy) * this.zoom + Math.round(this.h / 2) + this.offY,\n    };\n  }\n  screenToWorld(x, y) {\n    return {\n      x: (x - this.w / 2 - this.offX) / this.zoom + this.x,\n      y: (y - this.h / 2 - this.offY) / this.zoom + this.y,\n    };\n  }\n  get shakeAmount() { return this.trauma; }\n}\n\n// ============================================================\n// HITSTOP — global time dilation on impact (the single biggest\n// \"AAA feel\" upgrade a 2D action game can get)\n// ============================================================\nexport class TimeFlow {\n  constructor() { this.stop = 0; this.slow = 0; this.slowFactor = 0.35; }\n  hit(amount = 0.045) { this.stop = Math.max(this.stop, amount); }\n  slowmo(dur, factor = 0.35) { this.slow = Math.max(this.slow, dur); this.slowFactor = factor; }\n  scale(dt) {\n    if (this.stop > 0) { this.stop -= dt; return 0; }\n    if (this.slow > 0) { this.slow -= dt; return dt * this.slowFactor; }\n    return dt;\n  }\n}\n","js/systems/fx.js":"// ============================================================\n// HELL TRAIN — FX SYSTEM\n// Particles, sprite explosions, shockwaves, decals, afterimages,\n// arcs, floating combat text. Every emitter can push a dynamic\n// light into the renderer for that expensive-looking glow.\n// ============================================================\nimport { rand, randInt, TAU } from '../core/utils.js';\nimport { hexA } from '../core/render.js';\nexport { GameCamera as Camera } from '../core/render.js';\n\nconst P_SPARK = 0, P_SMOKE = 1, P_EMBER = 2, P_SHARD = 3, P_BLOOD = 4, P_GLOW = 5;\n\nexport class FXSystem {\n  constructor(max = 3000, sprites = null) {\n    this.max = max;\n    this.list = [];\n    this.decals = [];\n    this.anims = [];      // sprite-sheet effects\n    this.rings = [];      // shockwaves\n    this.arcs = [];       // lightning\n    this.texts = [];\n    this.afterimages = [];\n    this.beams = [];\n    this.sprites = sprites;\n    this.shake = 0; this.shakeT = 0;\n    this.flashes = [];\n    this.screenFlash = { a: 0, color: '#ffffff' };\n    this.lights = [];     // per-frame collected lights (world space)\n    this.aberration = 0;\n  }\n  setSprites(s) { this.sprites = s; }\n\n  // ---------- emitters ----------\n  spawn(o) {\n    if (this.list.length >= this.max) this.list.shift();\n    this.list.push({\n      x: o.x, y: o.y, vx: o.vx || 0, vy: o.vy || 0,\n      life: o.life || 0.5, t: o.life || 0.5,\n      color: o.color || '#ffffff', color2: o.color2 || null,\n      size: o.size || 1.5, endSize: o.endSize ?? null,\n      gravity: o.gravity || 0, drag: o.drag ?? 0.94,\n      kind: o.kind ?? P_SPARK, additive: o.additive ?? true,\n      light: o.light || 0, spin: o.spin || 0, ang: o.ang || 0,\n      alpha: 1, fade: o.fade ?? true, trail: o.trail || 0,\n    });\n  }\n\n  burst(x, y, color, n = 12, opts = {}) {\n    const spd = opts.spd || 120;\n    for (let i = 0; i < n; i++) {\n      const a = opts.ang !== undefined ? opts.ang + rand(-0.5, 0.5) * (opts.cone || TAU) : rand(0, TAU);\n      const s = spd * rand(0.35, 1);\n      this.spawn({\n        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,\n        color, color2: opts.color2, life: (opts.life || 0.5) * rand(0.7, 1.3),\n        size: opts.size || rand(1, 2.4), endSize: 0.5, gravity: opts.gravity || 0,\n        drag: opts.drag ?? 0.9, kind: P_SPARK, light: opts.light || 0,\n      });\n    }\n  }\n  sparks(x, y, color, n, ang, cone = 0.6, spd = 180) {\n    for (let i = 0; i < n; i++) {\n      const a = ang + rand(-cone, cone);\n      const s = spd * rand(0.4, 1.2);\n      this.spawn({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, color, life: rand(0.2, 0.45),\n        size: rand(1, 2), endSize: 0.4, drag: 0.86, gravity: 120 });\n    }\n  }\n  fire(x, y, color = '#ff7a33') {\n    for (let i = 0; i < 3; i++) {\n      this.spawn({ x: x + rand(-3, 3), y, vx: rand(-14, 14), vy: rand(-60, -20), color,\n        color2: '#ffe066', life: rand(0.4, 0.8), size: rand(1.5, 3), endSize: 0.4,\n        gravity: -30, kind: P_EMBER, light: 0.35 });\n    }\n  }\n  smoke(x, y, color = '#8a8aa0', n = 4) {\n    for (let i = 0; i < n; i++) {\n      this.spawn({ x: x + rand(-3, 3), y: y + rand(-2, 2), vx: rand(-12, 12), vy: rand(-30, -10),\n        color, life: rand(0.8, 1.6), size: rand(2, 4), endSize: 6, drag: 0.95,\n        kind: P_SMOKE, additive: false });\n    }\n  }\n  embers(x, y, color = '#ffb040', n = 3) {\n    for (let i = 0; i < n; i++) {\n      this.spawn({ x: x + rand(-5, 5), y, vx: rand(-10, 10), vy: rand(-32, -8), color,\n        life: rand(0.9, 1.8), size: rand(0.8, 1.6), kind: P_EMBER, light: 0.2, gravity: -8 });\n    }\n  }\n  dust(x, y, color = '#cfd4e0', n = 3) {\n    for (let i = 0; i < n; i++) {\n      this.spawn({ x: x + rand(-6, 6), y: y + rand(-2, 2), vx: rand(-25, 25), vy: rand(-18, -4),\n        color, life: rand(0.3, 0.6), size: rand(1, 2), endSize: 2.5, drag: 0.88,\n        additive: false, kind: P_SMOKE });\n    }\n  }\n  blood(x, y, color = '#a01f12', n = 8) {\n    for (let i = 0; i < n; i++) {\n      const a = rand(0, TAU), s = rand(30, 150);\n      this.spawn({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, color, life: rand(0.3, 0.7),\n        size: rand(1, 2.2), gravity: 220, drag: 0.92, additive: false, kind: P_BLOOD });\n    }\n  }\n  sparkle(x, y, color = '#a8d4f4') {\n    for (let i = 0; i < 4; i++) {\n      const a = (i / 4) * TAU + rand(0, 1);\n      this.spawn({ x, y, vx: Math.cos(a) * 34, vy: Math.sin(a) * 34 - 12, color,\n        life: 0.35, size: 1.6, endSize: 0.2, drag: 0.88, light: 0.15 });\n    }\n  }\n  shard(x, y, color, n = 6) {\n    for (let i = 0; i < n; i++) {\n      const a = rand(0, TAU), s = rand(40, 160);\n      this.spawn({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, color, life: rand(0.3, 0.8),\n        size: rand(1.4, 2.6), endSize: 0.2, drag: 0.9, kind: P_SHARD, spin: rand(-8, 8) });\n    }\n  }\n  trailPuff(x, y, color, size = 2) {\n    this.spawn({ x, y, vx: rand(-8, 8), vy: rand(-8, 8), color, life: 0.28, size,\n      endSize: 0.2, drag: 0.85, light: 0.1 });\n  }\n\n  // ---------- big effects ----------\n  explosion(x, y, kind = 'explFire', scale = 1, opts = {}) {\n    this.anims.push({ x, y, kind, t: 0, speed: opts.speed || 22, scale, rot: opts.rot || 0,\n      light: opts.light ?? 1, lightColor: opts.lightColor || '#ffb060' });\n    this.ring(x, y, opts.ringR || 34 * scale, opts.ringColor || '#ffffff', opts.ringLife || 0.32);\n    this.burst(x, y, opts.sparkColor || '#ffe066', Math.round(14 * scale), { spd: 160 * scale, life: 0.5, light: 0.2 });\n    this.smoke(x, y, '#3a3040', Math.round(4 * scale));\n  }\n  ring(x, y, r, color = '#ffffff', life = 0.3, width = 2) {\n    this.rings.push({ x, y, r0: r * 0.15, r, color, life, t: life, width });\n  }\n  shockwave(x, y, r, color = '#ffffff') {\n    this.ring(x, y, r, color, 0.45, 3);\n    this.ring(x, y, r * 0.7, color, 0.3, 2);\n  }\n  lightning(x1, y1, x2, y2, color = '#fff066', segs = 7, life = 0.16) {\n    const pts = [[x1, y1]];\n    for (let i = 1; i < segs; i++) {\n      const t = i / segs;\n      pts.push([x1 + (x2 - x1) * t + rand(-9, 9), y1 + (y2 - y1) * t + rand(-9, 9)]);\n    }\n    pts.push([x2, y2]);\n    const branches = [];\n    for (let i = 2; i < pts.length - 1; i++) {\n      if (Math.random() < 0.4) {\n        const a = rand(0, TAU), l = rand(6, 18);\n        branches.push([pts[i], [pts[i][0] + Math.cos(a) * l, pts[i][1] + Math.sin(a) * l]]);\n      }\n    }\n    this.arcs.push({ pts, branches, color, life, t: life });\n    this.burst(x2, y2, color, 6, { spd: 90, life: 0.25, light: 0.3 });\n  }\n  beam(x1, y1, x2, y2, color, width = 6, life = 0.25) {\n    this.beams.push({ x1, y1, x2, y2, color, width, life, t: life });\n  }\n  afterimage(sprite, x, y, scale = 1, flip = false, color = '#ffffff', life = 0.3) {\n    if (!sprite) return;\n    this.afterimages.push({ sprite, x, y, scale, flip, color, life, t: life });\n  }\n  decal(x, y, r, color = '#180a10', life = 12) {\n    if (this.decals.length > 220) this.decals.shift();\n    this.decals.push({ x, y, r, color, life, t: life, seed: Math.random() * 1000 });\n  }\n  flash(x, y, color = '#ffffff', life = 0.1, r = 14) {\n    this.flashes.push({ x, y, color, life, t: life, r });\n  }\n  screenTint(color, a) { this.screenFlash = { color, a: Math.max(this.screenFlash.a, a) }; }\n  shakeScreen(amount = 6, time = 0.25) { this.shake = Math.max(this.shake, amount); this.shakeT = Math.max(this.shakeT, time); }\n\n  damageText(x, y, text, color = '#ffffff', opts = {}) {\n    if (this.texts.length > 90) this.texts.shift();\n    this.texts.push({\n      x: x + rand(-3, 3), y, vy: opts.vy ?? -46, vx: opts.vx ?? rand(-14, 14),\n      t: opts.life || 0.85, life: opts.life || 0.85, text, color,\n      size: opts.size || 8, crit: opts.crit || false, pop: 1, outline: opts.outline ?? true,\n    });\n  }\n  banner(x, y, text, color = '#ffe066') {\n    this.texts.push({ x, y, vy: -8, vx: 0, t: 1.6, life: 1.6, text, color, size: 12, crit: true, pop: 1, outline: true });\n  }\n\n  // ---------- sim ----------\n  update(dt) {\n    const list = this.list;\n    for (let i = list.length - 1; i >= 0; i--) {\n      const p = list[i];\n      p.t -= dt;\n      if (p.t <= 0) { list.splice(i, 1); continue; }\n      p.vy += p.gravity * dt;\n      const dr = Math.pow(p.drag, dt * 60);\n      p.vx *= dr; p.vy *= dr;\n      p.x += p.vx * dt; p.y += p.vy * dt;\n      p.ang += p.spin * dt;\n      const k = p.t / p.life;\n      p.alpha = p.fade ? Math.min(1, k * 1.6) : 1;\n      if (p.endSize !== null) p.curSize = p.size + (p.endSize - p.size) * (1 - k);\n      else p.curSize = p.size;\n    }\n    for (let i = this.anims.length - 1; i >= 0; i--) {\n      const a = this.anims[i];\n      a.t += dt * a.speed;\n      const frames = this.sprites?.fx?.[a.kind];\n      if (!frames || a.t >= frames.length) this.anims.splice(i, 1);\n    }\n    for (const arr of [this.rings, this.arcs, this.texts, this.afterimages, this.flashes, this.beams]) {\n      for (let i = arr.length - 1; i >= 0; i--) {\n        arr[i].t -= dt;\n        if (arr[i].t <= 0) arr.splice(i, 1);\n      }\n    }\n    for (const t of this.texts) {\n      t.x += t.vx * dt; t.y += t.vy * dt;\n      t.vy += 90 * dt; t.vx *= Math.pow(0.9, dt * 60);\n      t.pop = Math.max(0, t.pop - dt * 5);\n    }\n    for (let i = this.decals.length - 1; i >= 0; i--) {\n      this.decals[i].t -= dt;\n      if (this.decals[i].t <= 0) this.decals.splice(i, 1);\n    }\n    if (this.shakeT > 0) { this.shakeT -= dt; if (this.shakeT <= 0) this.shake = 0; }\n    this.screenFlash.a = Math.max(0, this.screenFlash.a - dt * 3.2);\n    this.aberration = Math.max(0, this.aberration - dt * 6);\n  }\n\n  // ---------- draw (world space; camera already applied) ----------\n  drawDecals(ctx) {\n    for (const d of this.decals) {\n      const a = Math.min(1, d.t / Math.min(2, d.life)) * 0.55;\n      ctx.globalAlpha = a;\n      ctx.fillStyle = d.color;\n      const r = d.r;\n      for (let i = 0; i < 7; i++) {\n        const ang = (i / 7) * TAU + d.seed;\n        const rr = r * (0.45 + ((i * 37 + d.seed | 0) % 10) / 18);\n        ctx.beginPath();\n        ctx.arc(d.x + Math.cos(ang) * r * 0.35, d.y + Math.sin(ang) * r * 0.28, rr, 0, TAU);\n        ctx.fill();\n      }\n      ctx.globalAlpha = 1;\n    }\n  }\n\n  draw(ctx, renderer = null, camera = null) {\n    // afterimages (under everything living)\n    for (const a of this.afterimages) {\n      const k = a.t / a.life;\n      ctx.globalAlpha = k * 0.5;\n      ctx.save();\n      ctx.translate(Math.round(a.x), Math.round(a.y));\n      if (a.flip) ctx.scale(-1, 1);\n      ctx.drawImage(a.sprite, -a.sprite.width / 2 * a.scale, -a.sprite.height / 2 * a.scale,\n        a.sprite.width * a.scale, a.sprite.height * a.scale);\n      ctx.restore();\n      ctx.globalAlpha = 1;\n    }\n\n    // beams\n    for (const b of this.beams) {\n      const k = b.t / b.life;\n      ctx.globalCompositeOperation = 'lighter';\n      ctx.strokeStyle = b.color;\n      ctx.globalAlpha = k;\n      ctx.lineWidth = b.width * k;\n      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();\n      ctx.strokeStyle = '#ffffff';\n      ctx.lineWidth = Math.max(1, b.width * k * 0.35);\n      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();\n      ctx.globalAlpha = 1;\n      ctx.globalCompositeOperation = 'source-over';\n    }\n\n    // particles\n    ctx.globalCompositeOperation = 'lighter';\n    let additive = true;\n    for (const p of this.list) {\n      if (p.alpha <= 0) continue;\n      if (p.additive !== additive) {\n        ctx.globalCompositeOperation = p.additive ? 'lighter' : 'source-over';\n        additive = p.additive;\n      }\n      ctx.globalAlpha = p.alpha;\n      ctx.fillStyle = p.color2 && p.t / p.life < 0.5 ? p.color2 : p.color;\n      const s = Math.max(1, Math.round(p.curSize ?? p.size));\n      const px = Math.round(p.x), py = Math.round(p.y);\n      if (s <= 2) {\n        ctx.fillRect(px - (s >> 1), py - (s >> 1), s, s);\n      } else if (s <= 4) {\n        // chunky pixel diamond\n        ctx.fillRect(px - 1, py - (s >> 1), 2, s);\n        ctx.fillRect(px - (s >> 1), py - 1, s, 2);\n      } else {\n        // soft round blob, still pixel-snapped\n        const h = s >> 1;\n        ctx.beginPath(); ctx.arc(px, py, h, 0, TAU); ctx.fill();\n        ctx.globalAlpha = p.alpha * 0.5;\n        ctx.beginPath(); ctx.arc(px, py, h * 0.55, 0, TAU); ctx.fill();\n        ctx.globalAlpha = p.alpha;\n      }\n    }\n    ctx.globalAlpha = 1;\n    ctx.globalCompositeOperation = 'source-over';\n\n    // sprite explosions\n    const fx = this.sprites?.fx;\n    if (fx) {\n      ctx.globalCompositeOperation = 'lighter';\n      for (const a of this.anims) {\n        const frames = fx[a.kind];\n        if (!frames) continue;\n        const f = frames[Math.min(frames.length - 1, Math.floor(a.t))];\n        if (!f) continue;\n        const w = f.width * a.scale, h = f.height * a.scale;\n        ctx.drawImage(f, Math.round(a.x - w / 2), Math.round(a.y - h / 2), w, h);\n      }\n      ctx.globalCompositeOperation = 'source-over';\n    }\n\n    // rings\n    ctx.globalCompositeOperation = 'lighter';\n    for (const r of this.rings) {\n      const k = 1 - r.t / r.life;\n      const rr = r.r0 + (r.r - r.r0) * k;\n      ctx.globalAlpha = (1 - k) * 0.9;\n      ctx.strokeStyle = r.color;\n      ctx.lineWidth = Math.max(1, r.width * (1 - k));\n      ctx.beginPath(); ctx.arc(r.x, r.y, rr, 0, TAU); ctx.stroke();\n      ctx.globalAlpha = 1;\n    }\n    // arcs\n    for (const a of this.arcs) {\n      const k = a.t / a.life;\n      ctx.globalAlpha = k;\n      ctx.strokeStyle = a.color; ctx.lineWidth = 2;\n      ctx.beginPath();\n      ctx.moveTo(a.pts[0][0], a.pts[0][1]);\n      for (const p of a.pts) ctx.lineTo(p[0], p[1]);\n      ctx.stroke();\n      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;\n      ctx.beginPath();\n      ctx.moveTo(a.pts[0][0], a.pts[0][1]);\n      for (const p of a.pts) ctx.lineTo(p[0], p[1]);\n      ctx.stroke();\n      ctx.strokeStyle = a.color;\n      for (const [p0, p1] of a.branches) {\n        ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();\n      }\n      ctx.globalAlpha = 1;\n    }\n    // flashes\n    for (const f of this.flashes) {\n      const k = f.t / f.life;\n      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * (1 + (1 - k)));\n      g.addColorStop(0, hexA(f.color, k));\n      g.addColorStop(1, hexA(f.color, 0));\n      ctx.fillStyle = g;\n      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 + (1 - k)), 0, TAU); ctx.fill();\n    }\n    ctx.globalCompositeOperation = 'source-over';\n    ctx.globalAlpha = 1;\n\n    // push dynamic lights\n    if (renderer && camera) {\n      for (const p of this.list) {\n        if (!p.light) continue;\n        const s = camera.worldToScreen(p.x, p.y);\n        renderer.addLight(s.x, s.y, (p.curSize ?? p.size) * 6 * camera.zoom, p.color, p.light * p.alpha);\n      }\n      for (const a of this.anims) {\n        if (!a.light) continue;\n        const frames = this.sprites?.fx?.[a.kind];\n        const k = frames ? 1 - a.t / frames.length : 0;\n        const s = camera.worldToScreen(a.x, a.y);\n        renderer.addLight(s.x, s.y, 46 * a.scale * camera.zoom * (0.6 + k), a.lightColor, a.light * (1 - k * 0.7));\n      }\n      for (const f of this.flashes) {\n        const s = camera.worldToScreen(f.x, f.y);\n        renderer.addLight(s.x, s.y, f.r * 2.4 * camera.zoom, f.color, f.t / f.life);\n      }\n      for (const a of this.arcs) {\n        const s = camera.worldToScreen(a.pts[a.pts.length - 1][0], a.pts[a.pts.length - 1][1]);\n        renderer.addLight(s.x, s.y, 40 * camera.zoom, a.color, a.t / a.life);\n      }\n    }\n  }\n\n  // combat text is drawn in screen space for crisp text\n  drawTexts(ctx, camera) {\n    for (const t of this.texts) {\n      const k = t.t / t.life;\n      const p = camera ? camera.worldToScreen(t.x, t.y) : { x: t.x, y: t.y };\n      const pop = 1 + t.pop * 0.6;\n      const size = Math.round(t.size * pop);\n      ctx.font = `bold ${size}px \"Courier New\", monospace`;\n      ctx.textAlign = 'center';\n      ctx.globalAlpha = Math.min(1, k * 2.2);\n      if (t.outline) {\n        ctx.fillStyle = '#000000';\n        ctx.fillText(t.text, Math.round(p.x) + 1, Math.round(p.y) + 1);\n        ctx.fillText(t.text, Math.round(p.x) - 1, Math.round(p.y) + 1);\n      }\n      ctx.fillStyle = t.color;\n      ctx.fillText(t.text, Math.round(p.x), Math.round(p.y));\n      if (t.crit) {\n        ctx.globalAlpha = Math.min(1, k * 2.2) * 0.5;\n        ctx.fillStyle = '#ffffff';\n        ctx.fillText(t.text, Math.round(p.x), Math.round(p.y) - 1);\n      }\n      ctx.globalAlpha = 1;\n      ctx.textAlign = 'left';\n    }\n  }\n}\n","js/data/weapons_extended.js":"// ============================================================\n// HELL TRAIN — Extended Weapon System\n// Bombers, Blasters, and Advanced Weapon Varieties\n// ============================================================\n\nexport const WEAPONS_EXTENDED = {\n  // BOMBER WEAPONS - Area damage specialists\n  BOMBERS: {\n    basicBomber: {\n      name: 'Bomb Launcher',\n      type: 'projectile',\n      damage: 20,\n      firerate: 0.7,\n      projectileSpeed: 150,\n      projectileSize: 10,\n      areaSize: 40,\n      desc: 'Launches explosive bombs',\n      rarity: 'common',\n    },\n    clusterBomb: {\n      name: 'Cluster Bomb',\n      type: 'projectile',\n      damage: 25,\n      firerate: 0.8,\n      projectileSpeed: 140,\n      projectileSize: 12,\n      areaSize: 50,\n      splitCount: 5,\n      desc: 'Splits into multiple explosions',\n      rarity: 'uncommon',\n    },\n    mineLayer: {\n      name: 'Mine Layer',\n      type: 'special',\n      damage: 30,\n      firerate: 1.0,\n      mineCount: 8,\n      mineRadius: 30,\n      desc: 'Places mines that explode on contact',\n      rarity: 'uncommon',\n    },\n    napalm: {\n      name: 'Napalm Thrower',\n      type: 'aoe',\n      damage: 22,\n      firerate: 0.9,\n      areaSize: 35,\n      burnDuration: 4,\n      burnDamage: 5,\n      desc: 'Burns area for sustained damage',\n      rarity: 'rare',\n    },\n    nuke: {\n      name: 'Nuclear Strike',\n      type: 'projectile',\n      damage: 60,\n      firerate: 0.3,\n      projectileSpeed: 160,\n      areaSize: 80,\n      desc: 'Catastrophic nuclear explosion',\n      rarity: 'epic',\n    },\n    detonator: {\n      name: 'Detonation Cascade',\n      type: 'special',\n      damage: 45,\n      firerate: 0.5,\n      chainReactions: 10,\n      areaSize: 60,\n      desc: 'Bombs trigger chain reactions',\n      rarity: 'legendary',\n    },\n  },\n\n  // BLASTER WEAPONS - Rapid fire specialists\n  BLASTERS: {\n    basicBlaster: {\n      name: 'Energy Blaster',\n      type: 'projectile',\n      damage: 6,\n      firerate: 2.5,\n      projectileSpeed: 280,\n      projectileSize: 3,\n      desc: 'Rapid energy projectiles',\n      rarity: 'common',\n    },\n    pulseRifle: {\n      name: 'Pulse Rifle',\n      type: 'projectile',\n      damage: 8,\n      firerate: 3.0,\n      projectileSpeed: 300,\n      projectileSize: 4,\n      burstShots: 3,\n      desc: 'Fires in rapid bursts',\n      rarity: 'uncommon',\n    },\n    gatling: {\n      name: 'Gatling Gun',\n      type: 'projectile',\n      damage: 10,\n      firerate: 4.0,\n      projectileSpeed: 320,\n      projectileSize: 4,\n      desc: 'Ultra-rapid fire',\n      rarity: 'uncommon',\n    },\n    beam: {\n      name: 'Energy Beam',\n      type: 'projectile',\n      damage: 15,\n      firerate: 1.5,\n      projectileSpeed: 400,\n      projectileSize: 6,\n      piercingShots: 5,\n      desc: 'Piercing energy beam',\n      rarity: 'rare',\n    },\n    railgun: {\n      name: 'Railgun',\n      type: 'projectile',\n      damage: 35,\n      firerate: 0.4,\n      projectileSpeed: 500,\n      projectileSize: 8,\n      piercingShots: 999,\n      desc: 'Pierces all enemies',\n      rarity: 'epic',\n    },\n    superBlaster: {\n      name: 'Infinity Blaster',\n      type: 'projectile',\n      damage: 50,\n      firerate: 2.0,\n      projectileSpeed: 400,\n      projectileSize: 8,\n      burstShots: 10,\n      piercingShots: 5,\n      desc: 'Ultimate rapid fire',\n      rarity: 'legendary',\n    },\n  },\n\n  // MELEE WEAPONS - Close range devastation\n  MELEE: {\n    sword: {\n      name: 'Executioner Blade',\n      type: 'melee',\n      damage: 25,\n      firerate: 1.2,\n      range: 30,\n      desc: 'Melee sword attacks',\n      rarity: 'uncommon',\n    },\n    scythe: {\n      name: 'Death Scythe',\n      type: 'melee',\n      damage: 30,\n      firerate: 1.0,\n      range: 40,\n      areaSize: 20,\n      desc: 'Wide area melee swing',\n      rarity: 'rare',\n    },\n    hammer: {\n      name: 'Godly Maul',\n      type: 'melee',\n      damage: 40,\n      firerate: 0.8,\n      range: 35,\n      knockback: 100,\n      areaSize: 30,\n      desc: 'Devastating hammer strikes',\n      rarity: 'epic',\n    },\n  },\n\n  // BEAM WEAPONS - Sustained damage\n  BEAMS: {\n    laserBeam: {\n      name: 'Laser Beam',\n      type: 'beam',\n      damage: 12,\n      firerate: 1.0,\n      beamDuration: 2,\n      beamWidth: 8,\n      desc: 'Sustained laser fire',\n      rarity: 'uncommon',\n    },\n    plasmaBeam: {\n      name: 'Plasma Beam',\n      type: 'beam',\n      damage: 18,\n      firerate: 0.9,\n      beamDuration: 2.5,\n      beamWidth: 10,\n      burnChance: 0.4,\n      desc: 'Burning plasma beam',\n      rarity: 'rare',\n    },\n    voidBeam: {\n      name: 'Void Beam',\n      type: 'beam',\n      damage: 25,\n      firerate: 0.7,\n      beamDuration: 3,\n      beamWidth: 12,\n      pullStrength: 80,\n      desc: 'Pulling void energy',\n      rarity: 'epic',\n    },\n  },\n\n  // SUMMON WEAPONS - Minion based\n  SUMMONS: {\n    basicMinion: {\n      name: 'Shadow Minion',\n      type: 'summon',\n      damage: 8,\n      firerate: 1.0,\n      maxSummons: 3,\n      summonDuration: 10,\n      summonSpeed: 80,\n      desc: 'Summons shadow minions',\n      rarity: 'uncommon',\n    },\n    golem: {\n      name: 'Iron Golem',\n      type: 'summon',\n      damage: 20,\n      firerate: 0.8,\n      maxSummons: 2,\n      summonDuration: 15,\n      summonSpeed: 60,\n      minionHP: 50,\n      desc: 'Summons durable golems',\n      rarity: 'rare',\n    },\n    dragonling: {\n      name: 'Dragon Knight',\n      type: 'summon',\n      damage: 30,\n      firerate: 0.6,\n      maxSummons: 1,\n      summonDuration: 20,\n      summonSpeed: 100,\n      minionHP: 80,\n      desc: 'Summons powerful dragon',\n      rarity: 'epic',\n    },\n  },\n\n  // SPECIAL WEAPONS - Utility based\n  SPECIAL: {\n    timeWarp: {\n      name: 'Time Warp',\n      type: 'special',\n      damage: 0,\n      firerate: 0.5,\n      duration: 3,\n      slowAmount: 0.5,\n      desc: 'Slows enemies in area',\n      rarity: 'rare',\n    },\n    shockwave: {\n      name: 'Shockwave',\n      type: 'special',\n      damage: 28,\n      firerate: 0.7,\n      areaSize: 50,\n      knockback: 150,\n      desc: 'Pushes all enemies away',\n      rarity: 'rare',\n    },\n    blackhole: {\n      name: 'Black Hole',\n      type: 'special',\n      damage: 35,\n      firerate: 0.4,\n      areaSize: 80,\n      pullStrength: 200,\n      duration: 4,\n      desc: 'Pulls and damages enemies',\n      rarity: 'legendary',\n    },\n  },\n\n  // HYBRID WEAPONS - Combination types\n  HYBRID: {\n    blasterBomb: {\n      name: 'Blaster-Bomb Hybrid',\n      type: 'projectile',\n      damage: 18,\n      firerate: 1.5,\n      projectileSpeed: 250,\n      areaSize: 35,\n      burstShots: 3,\n      desc: 'Blaster shots that explode',\n      rarity: 'rare',\n    },\n    chargeShot: {\n      name: 'Charge Cannon',\n      type: 'projectile',\n      damage: 40,\n      firerate: 0.5,\n      projectileSpeed: 200,\n      areaSize: 60,\n      chargeTime: 2,\n      desc: 'Charge for massive damage',\n      rarity: 'epic',\n    },\n    omnistrike: {\n      name: 'Omnistrike',\n      type: 'projectile',\n      damage: 50,\n      firerate: 1.0,\n      projectileSpeed: 250,\n      areaSize: 40,\n      piercingShots: 5,\n      burstShots: 5,\n      desc: 'All-purpose devastating weapon',\n      rarity: 'legendary',\n    },\n  },\n};\n\n// WEAPON EVOLUTION PATHS\nexport const WEAPON_EVOLUTION_PATHS = {\n  fireballPath: [\n    'basicFireball',\n    'infernoBurst',\n    'fireballStorm',\n    'hellstormNova',\n    'apocalypseFlame',\n  ],\n  blasterPath: [\n    'basicBlaster',\n    'pulseRifle',\n    'railgun',\n    'infinityBlaster',\n  ],\n  bomberPath: [\n    'basicBomber',\n    'clusterBomb',\n    'napalm',\n    'nuclearStrike',\n    'detonationCascade',\n  ],\n  beamPath: [\n    'laserBeam',\n    'plasmaBeam',\n    'voidBeam',\n    'infinityBeam',\n  ],\n  summonPath: [\n    'basicMinion',\n    'golem',\n    'dragonling',\n    'armyOfTheGods',\n  ],\n};\n\n// Get all weapons by category\nexport function getWeaponsByCategory() {\n  return {\n    bombers: WEAPONS_EXTENDED.BOMBERS,\n    blasters: WEAPONS_EXTENDED.BLASTERS,\n    melee: WEAPONS_EXTENDED.MELEE,\n    beams: WEAPONS_EXTENDED.BEAMS,\n    summons: WEAPONS_EXTENDED.SUMMONS,\n    special: WEAPONS_EXTENDED.SPECIAL,\n    hybrid: WEAPONS_EXTENDED.HYBRID,\n  };\n}\n\n// Get weapon rarity color\nexport function getWeaponRarityColor(rarity) {\n  const colors = {\n    common: '#888888',\n    uncommon: '#22ff22',\n    rare: '#00d4ff',\n    epic: '#ffd700',\n    legendary: '#ff5a33',\n  };\n  return colors[rarity] || '#ffffff';\n}\n\n// Check if weapon can evolve\nexport function canEvolveWeapon(currentWeapon, allWeapons) {\n  for (const path of Object.values(WEAPON_EVOLUTION_PATHS)) {\n    const idx = path.indexOf(currentWeapon);\n    if (idx !== -1 && idx < path.length - 1) {\n      const nextWeapon = path[idx + 1];\n      return allWeapons.includes(nextWeapon);\n    }\n  }\n  return false;\n}\n\n// Get next evolution\nexport function getNextEvolution(currentWeapon) {\n  for (const path of Object.values(WEAPON_EVOLUTION_PATHS)) {\n    const idx = path.indexOf(currentWeapon);\n    if (idx !== -1 && idx < path.length - 1) {\n      return path[idx + 1];\n    }\n  }\n  return null;\n}\n","js/data/weapons_bridge.js":"// ============================================================\n// HELL TRAIN — EXTENDED ARSENAL BRIDGE\n// `js/data/weapons_extended.js` describes 27 weapons as pure data\n// (bombers, blasters, melee, beams, summons, specials, hybrids).\n// That format has no behaviour attached, so nothing could fire them.\n// This module translates every one of them into the live weapon\n// schema the engine actually runs (see entities/player.js _cast).\n// ============================================================\nimport { WEAPONS_EXTENDED, WEAPON_EVOLUTION_PATHS } from './weapons_extended.js';\n\nconst RARITY_COLOR = {\n  common: '#9aa0b4', uncommon: '#5ad07a', rare: '#4a9cff',\n  epic: '#c07aff', legendary: '#ffb020', mythic: '#ff2a5a',\n};\n\n// Per-category presentation + the behaviour each maps onto.\nconst CATEGORY = {\n  BOMBERS: { family: 'explosive', sprite: 'bomb', icon: 'bomb', color: '#ff9033', slot: 'primary' },\n  BLASTERS: { family: 'plasma', sprite: 'orbPlasma', icon: 'blaster', color: '#2ff0ff', slot: 'primary' },\n  MELEE: { family: 'physical', sprite: 'sawBlade', icon: 'sword', color: '#d0d4e8', slot: 'melee' },\n  BEAMS: { family: 'tech', sprite: 'railSlug', icon: 'bolt', color: '#8ef0ff', slot: 'primary' },\n  SUMMONS: { family: 'shadow', sprite: 'orbShadow', icon: 'ghost', color: '#a05cff', slot: 'summon' },\n  SPECIAL: { family: 'void', sprite: 'orbVoid', icon: 'moon', color: '#c07aff', slot: 'special' },\n  HYBRID: { family: 'fire', sprite: 'orbFire', icon: 'fan', color: '#ff5a33', slot: 'primary' },\n};\n\n// Hand-tuned behaviour per weapon key so each one feels like its name.\nconst BEHAVIOUR = {\n  basicBomber: 'bomber', clusterBomb: 'bomber', mineLayer: 'pool', napalm: 'pool',\n  nuke: 'bomber', detonator: 'bomber',\n  basicBlaster: 'projectile', pulseRifle: 'burst', gatling: 'projectile',\n  beam: 'rail', railgun: 'rail', superBlaster: 'shotgun',\n  sword: 'cone', scythe: 'cone', hammer: 'nova',\n  laserBeam: 'rail', plasmaBeam: 'rail', voidBeam: 'rail',\n  basicMinion: 'drones', golem: 'drones', dragonling: 'drones',\n  timeWarp: 'aura', shockwave: 'nova', blackhole: 'blackhole',\n  blasterBomb: 'bomber', chargeShot: 'rail', omnistrike: 'burst',\n};\n\nfunction convert(key, src, catName) {\n  const cat = CATEGORY[catName] || CATEGORY.BLASTERS;\n  const behavior = BEHAVIOUR[key] || 'projectile';\n  const cd = Math.max(0.12, 1 / (src.firerate || 1));\n  const color = RARITY_COLOR[src.rarity] && catName === 'SPECIAL' ? RARITY_COLOR[src.rarity] : cat.color;\n\n  const w = {\n    id: 'x_' + key.replace(/([A-Z])/g, '_$1').toLowerCase(),\n    name: src.name,\n    family: cat.family,\n    color,\n    sprite: cat.sprite,\n    icon: cat.icon,\n    slot: cat.slot,\n    rarity: src.rarity || 'common',\n    desc: src.desc,\n    extended: true,\n    behavior,\n    cd,\n    dmg: src.damage || 10,\n    speed: src.projectileSpeed || 240,\n    projSize: src.projectileSize || 5,\n    projLife: src.duration || src.summonDuration || 1.8,\n    pierce: src.piercingShots ? Math.min(99, src.piercingShots) : 0,\n    projCount: src.splitCount ? Math.max(2, Math.round(src.splitCount / 2)) : 1,\n    spread: 0.12,\n    knockback: src.knockback || 0,\n    explode: !!src.areaSize,\n    explodeRadius: src.areaSize || 26,\n    burn: src.burnDamage || 0,\n    slow: src.slowAmount || 0,\n    slowDur: src.slowAmount ? 2 : 0,\n  };\n\n  // behaviour-specific fields the engine reads\n  if (behavior === 'bomber') {\n    w.projCount = src.splitCount ? Math.min(6, src.splitCount) : (key === 'nuke' ? 1 : 2);\n    w.cluster = src.chainReactions || (src.splitCount ? 2 : 0);\n    w.explodeRadius = src.areaSize || 40;\n  }\n  if (behavior === 'pool') {\n    w.poolRadius = src.mineRadius || src.areaSize || 30;\n    w.projLife = src.burnDuration || src.duration || 4;\n    w.dmg = (src.damage || 10) * 0.35;   // pools tick, so per-tick damage is lower\n    w.cd = Math.max(0.6, cd);\n  }\n  if (behavior === 'burst') {\n    w.burstCount = src.burstShots || 3;\n    w.burstDelay = 0.06;\n  }\n  if (behavior === 'cone') {\n    w.range = src.range || 60;\n    w.arc = key === 'scythe' ? 1.5 : 0.9;\n  }\n  if (behavior === 'nova') {\n    w.radius = src.areaSize || src.range || 70;\n  }\n  if (behavior === 'aura') {\n    w.radius = src.areaSize || 90;\n    w.dmg = (src.damage || 10) * 0.25;\n    w.cd = 0.35;\n  }\n  if (behavior === 'blackhole') {\n    w.radius = src.areaSize || 80;\n    w.projLife = src.duration || 4;\n  }\n  if (behavior === 'drones') {\n    w.droneCount = src.maxSummons || 2;\n    w.droneCd = Math.max(0.3, 1 / (src.firerate || 1));\n    w.droneRange = 150;\n  }\n  if (behavior === 'rail') {\n    w.beamWidth = src.beamWidth || 7;\n    w.cd = Math.max(0.35, cd);\n  }\n  if (key === 'gatling') { w.spread = 0.22; w.projCount = 1; }\n  if (key === 'railgun') w.pierce = 99;\n\n  // level curve — everything scales, faster and harder each rank\n  const baseCd = w.cd, baseDmg = w.dmg, baseCount = w.projCount;\n  w.curve = (l) => ({\n    cd: Math.max(baseCd * 0.35, baseCd - baseCd * 0.055 * l),\n    dmg: baseDmg + baseDmg * 0.28 * l,\n    projCount: baseCount + Math.floor(l / 4),\n    droneCount: w.droneCount ? w.droneCount + Math.floor(l / 3) : undefined,\n    explodeRadius: w.explodeRadius + l * 2,\n  });\n\n  const evo = WEAPON_EVOLUTION_PATHS?.[key];\n  if (evo) {\n    w.evolutions = [{\n      id: 'x_evo_' + key,\n      name: typeof evo === 'string' ? evo : (evo.name || evo.evolvesTo || 'Ascended Form'),\n      requires: [],\n      desc: typeof evo === 'string' ? 'Evolves into ' + evo : (evo.desc || 'An ascended form of this weapon.'),\n    }];\n  }\n  return w;\n}\n\n// Flatten every category into playable weapons.\nexport const EXTENDED_WEAPONS = (() => {\n  const out = [];\n  for (const [catName, group] of Object.entries(WEAPONS_EXTENDED || {})) {\n    if (!group || typeof group !== 'object') continue;\n    for (const [key, src] of Object.entries(group)) {\n      if (!src || typeof src !== 'object' || !src.name) continue;\n      try { out.push(convert(key, src, catName)); } catch { /* skip malformed entry */ }\n    }\n  }\n  return out;\n})();\n\nexport const EXTENDED_BY_CATEGORY = (() => {\n  const map = {};\n  for (const [catName, group] of Object.entries(WEAPONS_EXTENDED || {})) {\n    map[catName] = Object.keys(group || {}).map(k => 'x_' + k.replace(/([A-Z])/g, '_$1').toLowerCase());\n  }\n  return map;\n})();\n","js/data/weapons.js":"// ============================================================\n// HELL TRAIN — ARSENAL\n// Weapons, abilities, cores and evolutions.\n// Every weapon has a behaviour implemented in entities/player.js.\n// ============================================================\n\nimport { EXTENDED_WEAPONS } from './weapons_bridge.js';\n\nconst W = (o) => o;\n\nexport const WEAPONS = [\n  // ---------------- STARTERS ----------------\n  W({\n    id: 'fireball', name: 'Hellfire Bolt', family: 'fire', color: '#ff5a33', sprite: 'orbFire',\n    slot: 'primary', icon: 'fire',\n    desc: 'Hurls a screaming bolt of hellfire at the nearest soul.',\n    cd: 0.95, dmg: 13, speed: 230, projLife: 1.8, projSize: 5,\n    pierce: 0, explode: false, burn: 0, behavior: 'fireball', projCount: 1, spread: 0.12,\n    curve: (l) => ({ cd: Math.max(0.3, 0.95 - l * 0.04), dmg: 13 + l * 4, projCount: 1 + Math.floor(l / 3) }),\n    evolutions: [\n      { id: 'inferno_nova', requires: ['explosion_core'], name: 'Inferno Nova', desc: 'Bolts detonate in a ring of fire.' },\n      { id: 'hellstorm', requires: ['hellstorm_core'], name: 'Hellstorm', desc: 'A rain of meteors follows every cast.' },\n    ],\n  }),\n  W({\n    id: '
