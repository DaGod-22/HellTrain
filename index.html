========================\n// HELL TRAIN — THE HELL FORGE (coin shop)\n// Coins drop from everything you kill. Spend them here on\n// permanent progression that persists across every run, plus\n// fully animated skins for the Conductor and the Train.\n// ============================================================\nimport { CHAR_SKINS, TRAIN_SKINS } from './skins.js';\nimport { COIN_SHOP } from './progression.js';\n\nconst T = (o) => ({ max: 10, curve: 1.55, ...o });\n\n// ---------------- CONDUCTOR TRACKS ----------------\nexport const PLAYER_TRACKS = [\n  T({ id: 'p_hp', name: 'Vitality', icon: 'heart', base: 60, per: 12, unit: 'max HP',\n    desc: 'Permanent max health for the Conductor.',\n    apply: (p, l) => { p.maxHp += 12 * l; p.hp = p.maxHp; } }),\n  T({ id: 'p_dmg', name: 'Fury', icon: 'sword', base: 80, per: 4, unit: '% damage',\n    desc: 'Permanent damage on every weapon you carry.',\n    apply: (p, l) => p.modMult('atkDmg', 1 + 0.04 * l) }),\n  T({ id: 'p_spd', name: 'Alacrity', icon: 'clock', base: 75, per: 3, unit: '% attack speed',\n    desc: 'Everything you own fires faster.',\n    apply: (p, l) => p.modMult('atkSpd', 1 + 0.03 * l) }),\n  T({ id: 'p_move', name: 'Swiftness', icon: 'boot', base: 70, per: 2.5, unit: '% move speed',\n    desc: 'Outrun the horde.',\n    apply: (p, l) => p.modMult('moveSpd', 1 + 0.025 * l) }),\n  T({ id: 'p_crit', name: 'Precision', icon: 'target', base: 110, per: 1.5, unit: '% crit chance', max: 10,\n    desc: 'Permanent critical strike chance.',\n    apply: (p, l) => { p.crit += 0.015 * l; } }),\n  T({ id: 'p_critdmg', name: 'Savagery', icon: 'skull', base: 110, per: 8, unit: '% crit damage',\n    desc: 'Crits hit like a locomotive.',\n    apply: (p, l) => p.modMult('critDmg', 1 + 0.08 * l) }),\n  T({ id: 'p_armour', name: 'Aegis', icon: 'shield', base: 90, per: 1, unit: 'armour',\n    desc: 'Flat damage reduction from every source.',\n    apply: (p, l) => { p.armour += l; } }),\n  T({ id: 'p_regen', name: 'Mending', icon: 'cross', base: 100, per: 0.4, unit: 'HP/s',\n    desc: 'Slowly stitch yourself back together.',\n    apply: (p, l) => { p.regen += 0.4 * l; } }),\n  T({ id: 'p_magnet', name: 'Magnetism', icon: 'magnet', base: 60, per: 10, unit: '% pickup radius',\n    desc: 'Loot comes to you.',\n    apply: (p, l) => p.modMult('pickupRange', 1 + 0.1 * l) }),\n  T({ id: 'p_greed', name: 'Greed', icon: 'coin', base: 130, per: 6, unit: '% coin gain',\n    desc: 'Earn more coins from every corpse.',\n    apply: (p, l) => { p.coinMult = (p.coinMult || 1) * (1 + 0.06 * l); } }),\n  T({ id: 'p_xp', name: 'Insight', icon: 'gem', base: 120, per: 5, unit: '% XP gain',\n    desc: 'Level up faster inside a run.',\n    apply: (p, l) => p.modMult('xpGain', 1 + 0.05 * l) }),\n  T({ id: 'p_cdr', name: 'Overcharge', icon: 'clock', base: 140, per: 2, unit: '% cooldown', max: 8,\n    desc: 'Shorter cooldowns on abilities and weapons.',\n    apply: (p, l) => p.modMult('cdr', 1 + 0.02 * l) }),\n  T({ id: 'p_luck', name: 'Fate', icon: 'star', base: 180, per: 3, unit: '% rare card chance', max: 8,\n    desc: 'Better upgrade cards appear on level up.',\n    apply: (p, l) => { p.luck = (p.luck || 0) + 0.03 * l; } }),\n  T({ id: 'p_revive', name: 'Second Wind', icon: 'wing', base: 900, per: 1, unit: 'revive', max: 3, curve: 2.4,\n    desc: 'Start every run with an extra life.',\n    apply: (p, l) => { p.revive = (p.revive || 0) + l; } }),\n  T({ id: 'p_start_lvl', name: 'Veteran', icon: 'star', base: 400, per: 1, unit: 'starting level', max: 5, curve: 2.0,\n    desc: 'Begin each run already levelled up (free upgrade cards).',\n    apply: () => {} }),\n  T({ id: 'p_reroll', name: 'Foresight', icon: 'dice', base: 250, per: 1, unit: 'card reroll', max: 5, curve: 1.9,\n    desc: 'Free rerolls on the upgrade screen each run.',\n    apply: () => {} }),\n];\n\n// ---------------- TRAIN TRACKS ----------------\nexport const TRAIN_TRACKS = [\n  T({ id: 't_hp', name: 'Boiler Plating', icon: 'train', base: 70, per: 90, unit: 'train HP',\n    desc: 'The train survives much longer.',\n    apply: (t, l) => { t.maxHp += 90 * l; t.hp = t.maxHp; } }),\n  T({ id: 't_armour', name: 'Hell-Iron Hull', icon: 'shield', base: 95, per: 2, unit: 'train armour',\n    desc: 'Flat reduction on all train damage.',\n    apply: (t, l) => { t.armour += 2 * l; } }),\n  T({ id: 't_dmg', name: 'Ordnance', icon: 'sword', base: 100, per: 5, unit: '% train damage',\n    desc: 'Every mounted gun hits harder.',\n    apply: (t, l) => { t.dmgMul *= 1 + 0.05 * l; } }),\n  T({ id: 't_rate', name: 'Autoloaders', icon: 'clock', base: 110, per: 4, unit: '% train fire rate',\n    desc: 'The train never stops shooting.',\n    apply: (t, l) => { t.fireRate = (t.fireRate || 1) * (1 + 0.04 * l); } }),\n  T({ id: 't_energy', name: 'Soul Reactor', icon: 'bolt', base: 120, per: 6, unit: '% ult charge',\n    desc: 'Ultimates come online sooner.',\n    apply: (t, l) => { t.energyRate = (t.energyRate || 1) * (1 + 0.06 * l); } }),\n  T({ id: 't_repair', name: 'Repair Crew', icon: 'cross', base: 130, per: 1.2, unit: 'HP/s repair',\n    desc: 'The train patches itself mid-fight.',\n    apply: (t, l) => { t.repairRate = (t.repairRate || 0) + 1.2 * l; } }),\n  T({ id: 't_slots', name: 'Weapon Racks', icon: 'fan', base: 350, per: 1, unit: 'weapon slot', max: 4, curve: 2.1,\n    desc: 'Mount more weapons on the train from the start.',\n    apply: (t, l) => { t.extraSlots = (t.extraSlots || 0) + l; } }),\n  T({ id: 't_ram', name: 'Siege Ram', icon: 'fist', base: 220, per: 18, unit: 'ram damage', max: 8,\n    desc: 'The train grinds enemies to paste on contact.',\n    apply: (t, l) => { t.ramDamage = (t.ramDamage || 0) + 18 * l; } }),\n  T({ id: 't_aura', name: 'Furnace Aura', icon: 'fire', base: 260, per: 4, unit: 'aura dmg/s', max: 8,\n    desc: 'Constant burn field around the locomotive.',\n    apply: (t, l) => { t.auraDamage = (t.auraDamage || 0) + 4 * l; } }),\n  T({ id: 't_cargo', name: 'Cargo Hold', icon: 'coin', base: 300, per: 5, unit: '% loot', max: 8,\n    desc: 'Enemies killed by the train drop extra coins.',\n    apply: (t, l) => { t.lootBonus = (t.lootBonus || 0) + 0.05 * l; } }),\n];\n\nexport const ALL_TRACKS = [...PLAYER_TRACKS, ...TRAIN_TRACKS];\nexport const findTrack = (id) => ALL_TRACKS.find(t => t.id === id);\n\nexport function trackCost(track, level) {\n  return Math.round(track.base * Math.pow(track.curve || 1.55, level));\n}\nexport function trackValue(track, level) {\n  return +(track.per * level).toFixed(2);\n}\n\n// ---------------- SKINS AS SHOP ITEMS ----------------\nexport function skinItems() {\n  return [\n    ...CHAR_SKINS.map(s => ({ kind: 'charSkin', ...s })),\n    ...TRAIN_SKINS.map(s => ({ kind: 'trainSkin', ...s })),\n  ];\n}\n\n// ---------------- CLASSIC COIN SHOP (js/ui/coinshop.js) ----------------\n// That shop stores ranks in save.coinShopUpgrades against the COIN_SHOP\n// tables in data/progression.js. Sum every purchased rank's value so the\n// two shops both feed the same run.\nexport function coinShopValue(save, group, cat, key) {\n  const rank = (save.coinShopUpgrades || {})[key] || 0;\n  const table = COIN_SHOP?.[group]?.[cat];\n  if (!rank || !Array.isArray(table)) return 0;\n  let sum = 0;\n  for (const row of table) if (row.level <= rank) sum += row.value || 0;\n  return sum;\n}\nexport function applyCoinShopToPlayer(player, save) {\n  const hp = coinShopValue(save, 'CHARACTER', 'maxHP', 'maxHP');\n  if (hp) { player.maxHp += hp; player.hp = player.maxHp; }\n  const dmg = coinShopValue(save, 'CHARACTER', 'attackDamage', 'attackDamage');\n  if (dmg) player.modMult('atkDmg', 1 + dmg);\n  const spd = coinShopValue(save, 'CHARACTER', 'attackSpeed', 'attackSpeed');\n  if (spd) player.modMult('atkSpd', 1 + spd);\n  const crit = coinShopValue(save, 'CHARACTER', 'critChance', 'critChance');\n  if (crit) player.crit += crit;\n  const dodge = coinShopValue(save, 'CHARACTER', 'dodge', 'dodge');\n  if (dodge) player.dodge = Math.min(0.6, player.dodge + dodge);\n  const cdr = coinShopValue(save, 'CHARACTER', 'cooldownReduction', 'cooldownReduction');\n  if (cdr) player.modMult('cdr', 1 + cdr);\n  return player;\n}\nexport function applyCoinShopToTrain(train, save) {\n  const hp = coinShopValue(save, 'TRAIN', 'hp', 'trainHP');\n  if (hp) { train.maxHp += hp; train.hp = train.maxHp; }\n  const dmg = coinShopValue(save, 'TRAIN', 'damage', 'trainDamage');\n  if (dmg) train.dmgMul *= 1 + dmg;\n  const rate = coinShopValue(save, 'TRAIN', 'fireRate', 'trainFireRate');\n  if (rate) train.fireRate = (train.fireRate || 1) * (1 + rate);\n  const arm = coinShopValue(save, 'TRAIN', 'armour', 'trainArmour');\n  if (arm) train.armour += arm < 1 ? Math.round(arm * 20) : arm;\n  return train;\n}\n\n// ---------------- APPLY EVERYTHING TO A NEW RUN ----------------\nexport function applyPermaToPlayer(player, save) {\n  const lv = save.permaLevels || {};\n  for (const t of PLAYER_TRACKS) {\n    const l = lv[t.id] || 0;\n    if (l > 0) t.apply(player, l);\n  }\n  player.freeRerolls = lv.p_reroll || 0;\n  player.startLevelBonus = lv.p_start_lvl || 0;\n  applyCoinShopToPlayer(player, save);\n  return player;\n}\nexport function applyPermaToTrain(train, save) {\n  const lv = save.permaLevels || {};\n  for (const t of TRAIN_TRACKS) {\n    const l = lv[t.id] || 0;\n    if (l > 0) t.apply(train, l);\n  }\n  applyCoinShopToTrain(train, save);\n  return train;\n}\n\nexport function totalSpent(save) {\n  const lv = save.permaLevels || {};\n  let sum = 0;\n  for (const t of ALL_TRACKS) {\n    for (let i = 0; i < (lv[t.id] || 0); i++) sum += trackCost(t, i);\n  }\n  return sum;\n}\n","js/ui/widgets.js":"// ============================================================\n// HELL TRAIN — UI WIDGETS\n// Shared pixel-UI toolkit: text, panels, bars, icons, cards.\n// ============================================================\nimport { TAU } from '../core/utils.js';\n\nexport const FONT_FAMILY = 'monospace';\n\nexport function text(ctx, str, x, y, color = '#ffffff', size = 8, bold = false, shadow = true) {\n  ctx.font = (bold ? 'bold ' : '') + size + 'px ' + FONT_FAMILY;\n  ctx.textAlign = 'left';\n  ctx.textBaseline = 'alphabetic';\n  if (shadow) { ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillText(str, x + 1, y + 1); }\n  ctx.fillStyle = color;\n  ctx.fillText(str, x, y);\n}\n\nexport function textC(ctx, str, cx, y, color = '#ffffff', size = 8, bold = false, shadow = true) {\n  ctx.font = (bold ? 'bold ' : '') + size + 'px ' + FONT_FAMILY;\n  ctx.textAlign = 'center';\n  if (shadow) { ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillText(str, cx + 1, y + 1); }\n  ctx.fillStyle = color;\n  ctx.fillText(str, cx, y);\n  ctx.textAlign = 'left';\n}\n\nexport function textR(ctx, str, x, y, color = '#ffffff', size = 8, bold = false) {\n  ctx.font = (bold ? 'bold ' : '') + size + 'px ' + FONT_FAMILY;\n  ctx.textAlign = 'right';\n  ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillText(str, x + 1, y + 1);\n  ctx.fillStyle = color; ctx.fillText(str, x, y);\n  ctx.textAlign = 'left';\n}\n\n// Word-wrap into an array of lines that fit `w` pixels.\nexport function wrap(ctx, str, w, size = 6) {\n  ctx.font = size + 'px ' + FONT_FAMILY;\n  const words = String(str).split(/\\s+/);\n  const lines = [];\n  let cur = '';\n  for (const word of words) {\n    const test = cur ? cur + ' ' + word : word;\n    if (ctx.measureText(test).width > w && cur) { lines.push(cur); cur = word; }\n    else cur = test;\n  }\n  if (cur) lines.push(cur);\n  return lines;\n}\n\n// A beveled dark panel with a coloured frame.\nexport function drawPanel(ctx, x, y, w, h, color = '#5a5a78', fill = 'rgba(10,8,18,0.92)') {\n  ctx.fillStyle = fill;\n  ctx.fillRect(x, y, w, h);\n  ctx.strokeStyle = color;\n  ctx.lineWidth = 1;\n  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);\n  ctx.fillStyle = 'rgba(255,255,255,0.07)';\n  ctx.fillRect(x + 1, y + 1, w - 2, 1);\n  ctx.fillStyle = 'rgba(0,0,0,0.35)';\n  ctx.fillRect(x + 1, y + h - 2, w - 2, 1);\n  // corner studs\n  ctx.fillStyle = color;\n  ctx.fillRect(x, y, 2, 2); ctx.fillRect(x + w - 2, y, 2, 2);\n  ctx.fillRect(x, y + h - 2, 2, 2); ctx.fillRect(x + w - 2, y + h - 2, 2, 2);\n}\n\nexport function drawBar(ctx, x, y, w, h, pct, color = '#74c04a', bg = '#12121c', glossy = true) {\n  pct = Math.max(0, Math.min(1, pct || 0));\n  ctx.fillStyle = 'rgba(0,0,0,0.7)';\n  ctx.fillRect(x - 1, y - 1, w + 2, h + 2);\n  ctx.fillStyle = bg;\n  ctx.fillRect(x, y, w, h);\n  ctx.fillStyle = color;\n  ctx.fillRect(x, y, Math.round(w * pct), h);\n  if (glossy && h > 2) {\n    ctx.fillStyle = 'rgba(255,255,255,0.25)';\n    ctx.fillRect(x, y, Math.round(w * pct), 1);\n  }\n}\n\n// ------------------------------------------------------------\n// Vector-ish pixel icons drawn directly (no atlas needed).\n// ------------------------------------------------------------\nexport function drawIcon(ctx, kind, x, y, s = 16, color = '#ffffff') {\n  ctx.save();\n  ctx.translate(x, y);\n  const u = s / 16;\n  ctx.scale(u, u);\n  // plate\n  ctx.fillStyle = 'rgba(0,0,0,0.6)';\n  ctx.fillRect(0, 0, 16, 16);\n  ctx.strokeStyle = color; ctx.globalAlpha = 0.65;\n  ctx.strokeRect(0.5, 0.5, 15, 15);\n  ctx.globalAlpha = 1;\n  ctx.fillStyle = color;\n  const R = (a, b, c, d) => ctx.fillRect(a, b, c, d);\n  switch (kind) {\n    case 'sword': R(7, 2, 2, 9); R(5, 10, 6, 2); R(7, 12, 2, 2); break;\n    case 'axe': R(4, 3, 6, 4); R(9, 3, 3, 6); R(6, 7, 2, 7); break;\n    case 'fire': R(7, 3, 2, 3); R(6, 5, 4, 4); R(5, 8, 6, 4); R(6, 12, 4, 1); break;\n    case 'ice': R(7, 2, 2, 12); R(2, 7, 12, 2); R(4, 4, 2, 2); R(10, 10, 2, 2); R(10, 4, 2, 2); R(4, 10, 2, 2); break;\n    case 'bolt': R(9, 2, 3, 5); R(6, 6, 4, 3); R(4, 8, 3, 6); R(7, 8, 3, 2); break;\n    case 'heart': R(3, 4, 4, 3); R(9, 4, 4, 3); R(3, 6, 10, 3); R(5, 9, 6, 2); R(7, 11, 2, 2); break;\n    case 'shield': R(3, 3, 10, 5); R(4, 8, 8, 3); R(6, 11, 4, 2); break;\n    case 'boot': R(4, 3, 4, 7); R(4, 10, 8, 3); break;\n    case 'coin': ctx.beginPath(); ctx.arc(8, 8, 6, 0, TAU); ctx.fill();\n      ctx.fillStyle = 'rgba(0,0,0,0.5)'; R(7, 5, 2, 6); break;\n    case 'gem': R(5, 3, 6, 2); R(3, 5, 10, 3); R(5, 8, 6, 3); R(7, 11, 2, 2); break;\n    case 'skull': R(4, 3, 8, 6); R(5, 9, 6, 2); R(6, 11, 4, 2);\n      ctx.fillStyle = 'rgba(0,0,0,0.7)'; R(5, 5, 2, 2); R(9, 5, 2, 2); break;\n    case 'target': ctx.strokeStyle = color; ctx.lineWidth = 2;\n      ctx.beginPath(); ctx.arc(8, 8, 5, 0, TAU); ctx.stroke(); R(7, 7, 2, 2); break;\n    case 'clock': ctx.strokeStyle = color; ctx.lineWidth = 1.5;\n      ctx.beginPath(); ctx.arc(8, 8, 5.5, 0, TAU); ctx.stroke(); R(7.5, 4, 1, 5); R(8, 8, 4, 1); break;\n    case 'bomb': ctx.beginPath(); ctx.arc(8, 10, 5, 0, TAU); ctx.fill(); R(9, 2, 2, 4); break;\n    case 'ghost': R(4, 3, 8, 8); R(4, 11, 2, 2); R(8, 11, 2, 2); R(12, 11, 0, 0);\n      ctx.fillStyle = 'rgba(0,0,0,0.7)'; R(6, 6, 2, 2); R(9, 6, 2, 2); break;\n    case 'blood': R(7, 2, 2, 4); R(5, 6, 6, 5); R(6, 11, 4, 2); break;\n    case 'sun': ctx.beginPath(); ctx.arc(8, 8, 4, 0, TAU); ctx.fill();\n      R(7, 1, 2, 3); R(7, 12, 2, 3); R(1, 7, 3, 2); R(12, 7, 3, 2); break;\n    case 'moon': ctx.beginPath(); ctx.arc(8, 8, 6, 0, TAU); ctx.fill();\n      ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.beginPath(); ctx.arc(11, 6, 5.5, 0, TAU); ctx.fill(); break;\n    case 'wing': R(2, 6, 5, 2); R(4, 4, 4, 2); R(9, 6, 5, 2); R(8, 4, 4, 2); R(7, 8, 2, 5); break;\n    case 'twin': R(4, 3, 3, 10); R(9, 3, 3, 10); break;\n    case 'fan': R(7, 8, 2, 5); R(3, 4, 2, 5); R(11, 4, 2, 5); break;\n    case 'arrow': R(7, 2, 2, 9); R(5, 4, 2, 2); R(9, 4, 2, 2); R(6, 11, 4, 2); break;\n    case 'fist': R(4, 5, 8, 6); R(3, 7, 2, 3); R(11, 6, 2, 3); break;\n    case 'spike': R(7, 2, 2, 12); R(3, 6, 2, 8); R(11, 6, 2, 8); break;\n    case 'cross': R(6, 2, 4, 12); R(2, 6, 12, 4); break;\n    case 'candle': R(7, 2, 2, 3); R(5, 6, 6, 8); break;\n    case 'train': R(2, 6, 12, 5); R(4, 3, 5, 3); R(3, 11, 3, 3); R(9, 11, 3, 3); break;\n    case 'gear': ctx.beginPath(); ctx.arc(8, 8, 5, 0, TAU); ctx.fill();\n      ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.beginPath(); ctx.arc(8, 8, 2, 0, TAU); ctx.fill(); break;\n    case 'dash': R(2, 5, 7, 2); R(4, 9, 7, 2); R(10, 3, 4, 2); R(11, 11, 3, 2); break;\n    case 'apocalypse':\n      R(7, 1, 2, 14); R(1, 7, 14, 2);\n      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(8, 8, 3, 0, TAU); ctx.fill(); break;\n    default: ctx.beginPath(); ctx.arc(8, 8, 4, 0, TAU); ctx.fill();\n  }\n  ctx.restore();\n}\n\n// ------------------------------------------------------------\n// The upgrade card.\n// ------------------------------------------------------------\nexport function drawCard(ctx, o) {\n  const { x, y, w, h, title, desc, color = '#ffffff', icon = 'gem',\n    selected = false, index = 0, alpha = 1, level = '', target = null,\n    tagline = '', evolved = false, rarity = 'common' } = o;\n  ctx.save();\n  ctx.globalAlpha = alpha;\n  if (selected) {\n    ctx.translate(0, -3);\n    ctx.shadowColor = color; ctx.shadowBlur = 12;\n  }\n  // body\n  const grad = ctx.createLinearGradient(x, y, x, y + h);\n  grad.addColorStop(0, 'rgba(24,18,38,0.98)');\n  grad.addColorStop(1, 'rgba(8,6,16,0.98)');\n  ctx.fillStyle = grad;\n  ctx.fillRect(x, y, w, h);\n  ctx.shadowBlur = 0;\n  // rarity glow header\n  const hg = ctx.createLinearGradient(x, y, x + w, y);\n  hg.addColorStop(0, hexA(color, 0.15));\n  hg.addColorStop(0.5, hexA(color, 0.55));\n  hg.addColorStop(1, hexA(color, 0.15));\n  ctx.fillStyle = hg;\n  ctx.fillRect(x, y, w, 3);\n  ctx.fillRect(x, y + h - 3, w, 3);\n  // border\n  ctx.strokeStyle = selected ? '#ffffff' : color;\n  ctx.lineWidth = selected ? 2 : 1;\n  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);\n  ctx.lineWidth = 1;\n\n  // icon\n  const ix = x + w / 2 - 11;\n  drawIcon(ctx, icon, ix, y + 10, 22, color);\n  if (evolved) {\n    ctx.fillStyle = '#ffe066';\n    ctx.fillRect(ix - 3, y + 8, 2, 2); ctx.fillRect(ix + 23, y + 8, 2, 2);\n  }\n\n  // title\n  const ty = y + 44;\n  textC(ctx, String(title).toUpperCase(), x + w / 2, ty, color, w > 160 ? 11 : 8, true);\n  if (level) textC(ctx, level, x + w / 2, ty + 9, '#ffffff', 7, true);\n\n  // target tag\n  if (target) {\n    ctx.fillStyle = hexA('#8ef0ff', 0.2);\n    ctx.fillRect(x + w / 2 - 18, y + h - 42, 36, 8);\n    textC(ctx, target, x + w / 2, y + h - 36, '#8ef0ff', 6, true);\n  }\n\n  // description\n  const lines = wrap(ctx, desc, w - 12, 6);\n  let ly = ty + (level ? 20 : 14);\n  ctx.textAlign = 'center';\n  for (const ln of lines.slice(0, 6)) {\n    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillText(ln, x + w / 2 + 1, ly + 1);\n    ctx.fillStyle = '#cfd4e0'; ctx.fillText(ln, x + w / 2, ly);\n    ly += 8;\n  }\n  ctx.textAlign = 'left';\n  if (tagline) {\n    ctx.globalAlpha = alpha * 0.8;\n    textC(ctx, '\"' + tagline + '\"', x + w / 2, y + h - 8, hexA(color, 0.9), 6, false);\n    ctx.globalAlpha = alpha;\n  }\n  // hotkey\n  if (index) {\n    ctx.fillStyle = color;\n    ctx.fillRect(x + 2, y + 2, 9, 9);\n    ctx.fillStyle = '#0a0a12';\n    ctx.font = 'bold 7px ' + FONT_FAMILY;\n    ctx.fillText(String(index), x + 4, y + 9);\n  }\n  ctx.restore();\n  ctx.globalAlpha = 1;\n}\n\nexport function hexA(hex, a) {\n  const h = (hex || '#ffffff').replace('#', '');\n  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);\n  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;\n}\n\n// A simple hover/click button used across menus.\nexport function hitRect(mx, my, x, y, w, h) {\n  return mx >= x && mx <= x + w && my >= y && my <= y + h;\n}\n","js/systems/gameplay.js":"// ============================================================\n// HELL TRAIN — GAMEPLAY\n// The run itself: director-driven waves, the Conductor, the Train,\n// bosses, loot, the Ascension Grid and the Apocalypse Protocol.\n// ============================================================\nimport { CFG } from '../core/config.js';\nimport { rand, randInt, clamp, dist, TAU, fmtNum, fmtTime } from '../core/utils.js';\nimport { World, T } from '../core/world.js';\nimport { FXSystem } from './fx.js';\nimport { Renderer, GameCamera, TimeFlow } from '../core/render.js';\nimport { Player } from '../entities/player.js';\nimport { makeEnemy } from '../entities/enemy.js';\nimport { Projectile, Meteor, Flame, Bomb, Pool, BlackHole } from '../entities/projectile.js';\nimport { Pickup } from '../entities/pickup.js';\nimport { Boss } from '../entities/boss.js';\nimport { Train } from '../entities/train.js';\nimport { REALMS, findRealm, findDifficulty } from '../data/realms.js';\nimport { ASCENSIONS, APOCALYPSE_PROTOCOL, APOCALYPSE_CARDS, RARITY_COLORS, ROMAN,\n  rollCards, apocalypseReady, findAscension } from '../data/upgrades.js';\nimport { applyPermaToPlayer, applyPermaToTrain } from '../data/shop.js';\nimport { checkSynergies } from '../data/upgrades_bridge.js';\nimport { WEAPONS, findWeapon } from '../data/weapons.js';\nimport { addCoins, saveSave } from '../core/save.js';\nimport { drawCard, drawPanel, drawBar, drawIcon, text, textC } from '../ui/widgets.js';\n\nconst AMBIENT = {\n  purgatory: '#8e8ebc', infernal: '#b06a52', forgotten: '#7e7ea4', forest: '#6a9070',\n  frozen: '#90b0dc', desert: '#c8ac82', void: '#7a64a8', terminus: '#a89684', phantom: '#7a64a8',\n};\n\n// Lit floor colours — brighter than the raw realm colour so the world\n// still reads once the lighting multiply pass lands on it.\nconst FLOOR = {\n  purgatory: ['#332748', '#2a1f3c', '#241a33'],\n  infernal:  ['#4a2016', '#3a1710', '#2e110c'],\n  forgotten: ['#2a2a40', '#222234', '#1b1b2a'],\n  forest:    ['#1e3822', '#182e1c', '#132516'],\n  frozen:    ['#26405e', '#1e3450', '#182a42'],\n  desert:    ['#5c4526', '#4c391f', '#3e2e19'],\n  void:      ['#1a1038', '#140c2c', '#0e0822'],\n  terminus:  ['#2a2a2e', '#222226', '#1a1a1e'],\n  phantom:   ['#241440', '#1c1034', '#150c28'],\n};\nconst floorOf = (id, n) => (FLOOR[id] || FLOOR.purgatory)[n % 3];\nconst GRADE = {\n  purgatory: '#6a5ce0', infernal: '#ff5a20', forgotten: '#8a9ad0', forest: '#4ad06a',\n  frozen: '#7ac0ff', desert: '#ffc060', void: '#a05cff', terminus: '#ffd060', phantom: '#c07aff',\n};\n\nexport class GameplayScene {\n  constructor(engine) {\n    this.engine = engine;\n    this.canvas = engine.canvas;\n    this.art = engine.sprites;\n    this.renderer = new Renderer(CFG.VIEW_W, CFG.VIEW_H);\n    this.camera = new GameCamera(CFG.VIEW_W, CFG.VIEW_H, 2);\n    this.time = new TimeFlow();\n    this.fx = new FXSystem(3000, this.art);\n    this.input = engine.input;\n  }\n\n  // ================================================================\n  // RUN SETUP\n  // ================================================================\n  enter(params = {}) {\n    const engine = this.engine;\n    this.save = params.save || engine.save;\n    this.realmId = params.realmId || 'purgatory';\n    this.stage = params.stage || 1;\n    this.difficulty = findDifficulty(params.difficulty || engine._difficulty || 'normal');\n    this.runSeed = params.runSeed || ((Math.random() * 4294967295) >>> 0);\n    this.weeklyChallenge = params.weeklyChallenge || null;\n    this.dailySeed = params.dailySeed || null;\n\n    this.fx = new FXSystem(3000, this.art);\n    this.camera = new GameCamera(CFG.VIEW_W, CFG.VIEW_H, 2);\n    this.time = new TimeFlow();\n    this.renderer.settings.bloom = this.save.settings?.bloom ?? 1;\n    this.renderer.settings.lighting = this.save.settings?.lighting ?? 1;\n    this.renderer.settings.scanlines = this.save.settings?.scanlines ?? 0;\n\n    this.world = new World(this.runSeed ^ hashStr(this.realmId + this.stage), this.realmId, this.difficulty);\n    this.player = new Player(this.world.playerSpawn.x, this.world.playerSpawn.y, this.art, this.save);\n    applyPermaToPlayer(this.player, this.save);\n    this.player.addWeapon('fireball');\n    this.player.onLevelUp = () => this._queueLevelUp();\n\n    this.train = new Train(this.player.x - 90, this.player.y + 26, this.art, this.difficulty, this.save);\n    applyPermaToTrain(this.train, this.save);\n    for (let i = 0; i < (this.train.extraSlots || 0); i++) this.train.mountRandomWeapon();\n\n    this.enemies = []; this.projectiles = []; this.pickups = [];\n    this.meteors = []; this.flames = []; this.bombs = []; this.pools = []; this.holes = [];\n    this.boss = null; this.bossSpawned = false; this.bossDefeated = false;\n\n    this.owned = {};                 // ascension id -> level\n    this.pendingLevelUps = 0;\n    this.cards = null;\n    this.cardIndex = 0;\n    this.rerolls = (this.player.freeRerolls || 0);\n    this.banishes = 1;\n    this.paused = false;\n    this.runTime = 0;\n    this.runCoins = 0;\n    this.gameStats = { shards: 0, kills: 0, elites: 0, bosses: 0 };\n    this.runStats = { kills: 0, damageDealt: 0, damageTaken: 0, level: 1, coins: 0, bestCombo: 0 };\n    this.magnetAll = false;\n    this._magnetT = 0;\n    this.director = { t: 0, wave: 0, nextWave: 3, budget: 0, eliteT: 45, chestT: 38 };\n    this._ended = false;\n    this._flash = { a: 0, color: '#ffffff' };\n    this.apocalypseActive = false;\n    this._synergiesFired = {};\n\n    // veteran perma: start with extra levels\n    for (let i = 0; i < (this.player.startLevelBonus || 0); i++) {\n      this.player.level += 1; this.pendingLevelUps += 1;\n    }\n\n    this.camera.x = this.player.x; this.camera.y = this.player.y;\n    this._spawnAmbient();\n    if (this.pendingLevelUps > 0) this._openCards();\n    this.fx.banner(this.player.x, this.player.y - 40, findRealm(this.realmId).name.toUpperCase(), '#ffe066');\n  }\n  exit() {}\n\n  _spawnAmbient() {\n    this.ambientBits = [];\n    const kinds = { frozen: 'snow', infernal: 'ember', desert: 'sand', forest: 'leaf',\n      void: 'spark', phantom: 'spark', terminus: 'spark' };\n    const kind = kinds[this.realmId] || 'fog';\n    for (let i = 0; i < 70; i++) {\n      this.ambientBits.push({ kind, x: rand(-300, 300), y: rand(-200, 200), s: rand(0.4, 1.4) });\n    }\n  }\n\n  // ================================================================\n  // CONTEXT API used by entities\n  // ================================================================\n  spawnProjectile(o) { this.projectiles.push(new Projectile(o)); }\n  spawnBomb(x, y, o) { this.bombs.push(new Bomb(x, y, o)); }\n  spawnPool(x, y, o) { this.pools.push(new Pool(x, y, o)); }\n  spawnBlackhole(x, y, o) { this.holes.push(new BlackHole(x, y, o)); }\n  spawnMeteor(x, y, dmg, radius) { this.meteors.push(new Meteor(x, y, { x, y }, dmg, radius)); }\n  spawnFlame(x, y, ang, range, dmg) { this.flames.push(new Flame(x, y, ang, range, dmg)); }\n  spawnEnemy(id, x, y) {\n    const e = makeEnemy(id, x, y, this.realmId, this.difficulty);\n    if (!e) return null;\n    e._id = ++ID; this.enemies.push(e);\n    return e;\n  }\n  enemiesInRange(x, y, r) {\n    const out = []; const r2 = r * r;\n    for (const e of this.enemies) {\n      if (!e.alive) continue;\n      const dx = e.x - x, dy = e.y - y;\n      if (dx * dx + dy * dy <= r2) out.push(e);\n    }\n    return out;\n  }\n  findNearestEnemy(x, y, maxR) {\n    let best = null, bd = maxR * maxR;\n    for (const e of this.enemies) {\n      if (!e.alive) continue;\n      const dx = e.x - x, dy = e.y - y;\n      const d2 = dx * dx + dy * dy;\n      if (d2 <= bd) { best = e; bd = d2; }\n    }\n    if (this.boss?.alive && !best) {\n      if (dist(x, y, this.boss.x, this.boss.y) < maxR) return this.boss;\n    }\n    return best;\n  }\n  addRunCoins(n) { this.runCoins += n; this.runStats.coins += n; }\n  magnetPulse() {\n    this.magnetAll = true; this._magnetT = 1.2;\n    this.fx.ring(this.player.x, this.player.y, 200, '#f080cc', 0.5, 3);\n  }\n  onPlayerHit(dealt, color) {\n    this.fx.damageText(this.player.x, this.player.y - 20, '-' + Math.round(dealt), '#ff5a5a', { size: 8 });\n    this.fx.screenTint('#ff2020', 0.22);\n    this.fx.shakeScreen(5, 0.2);\n    this.camera.shake(0.35);\n    this.time.hit(0.05);\n    this.runStats.damageTaken += dealt;\n    this.fx.blood(this.player.x, this.player.y, '#a01f12', 6);\n  }\n  onRevive(p) {\n    this.fx.explosion(p.x, p.y, 'explHoly', 3, { lightColor: '#ffe066' });\n    this.fx.banner(p.x, p.y - 40, 'PHOENIX CLAUSE', '#ffb020');\n    for (const e of this.enemiesInRange(p.x, p.y, 140)) this.dealDamage(e, 200, { family: 'holy' });\n    this.camera.shake(0.8);\n  }\n  onApocalypse() {\n    this.apocalypseActive = true;\n    this.fx.banner(this.player.x, this.player.y - 44, 'APOCALYPSE PROTOCOL', '#ff2a2a');\n    this.fx.screenTint('#ff2020', 0.85);\n    this.camera.shake(1);\n    this.time.slowmo(1.2, 0.25);\n    this.save.stats.apocalypses = (this.save.stats.apocalypses || 0) + 1;\n  }\n  extinctionEvent(dmg) {\n    this.fx.screenTint('#ffffff', 0.7);\n    this.camera.shake(1);\n    this.time.slowmo(0.5, 0.3);\n    for (const e of this.enemies) {\n      if (!e.alive) continue;\n      this.fx.explosion(e.x, e.y, 'explVoid', 1, { lightColor: '#ff2a2a' });\n      this.dealDamage(e, dmg, { family: 'apocalypse' });\n    }\n    if (this.boss?.alive) this.dealDamage(this.boss, dmg, { family: 'apocalypse', boss: true });\n  }\n  openChest() {\n    // a free upgrade card\n    this.pendingLevelUps += 1;\n    this.fx.banner(this.player.x, this.player.y - 30, 'RELIC CHEST', '#ffe066');\n    this._openCards();\n  }\n  spawnExplosion(x, y, radius, dmg, family) {\n    radius *= (this.player?.aoeMult || 1);\n    const kind = family === 'ice' ? 'explIce' : family === 'void' ? 'explVoid' :\n      family === 'holy' ? 'explHoly' : family === 'toxic' ? 'explToxic' : 'explFire';\n    this.fx.explosion(x, y, kind, Math.max(0.5, radius / 26), {\n      lightColor: family === 'ice' ? '#a8d4f4' : family === 'void' ? '#c07aff' : '#ffb060',\n    });\n    this.fx.shakeScreen(3, 0.12);\n    this.camera.shake(0.18);\n    this.fx.decal(x, y, radius * 0.35, '#150a12', 8);\n    for (const e of this.enemiesInRange(x, y, radius)) {\n      this.dealDamage(e, dmg, { family, x, y, knockback: 60 });\n    }\n    if (this.boss?.alive && dist(x, y, this.boss.x, this.boss.y) < radius + this.boss.radius) {\n      this.dealDamage(this.boss, dmg, { family, boss: true });\n    }\n  }\n\n  // ---------------- the one true damage function ----------------\n  dealDamage(target, amount, opts = {}) {\n    if (!target || !target.alive) return 0;\n    const p = this.player;\n    const { dmg, crit } = p.rollDamage(amount, target);\n    let final = dmg;\n    // status riders from the build\n    const rider = {\n      family: opts.family, x: opts.x ?? p.x, y: opts.y ?? p.y,\n      knockback: opts.knockback ?? (p.knockback || 0), angle: opts.angle,\n      burn: (opts.burn || 0) + (p.burnDmg || 0), burnDur: p.burnDur || 3,\n      chill: p.chill || 0, slow: opts.slow, slowDur: opts.slowDur,\n    };\n    if (p.absoluteZero && (rider.chill > 0 || opts.family === 'ice') && Math.random() < 0.25) rider.freeze = 1.4;\n    if (target.freezeT > 0 && p.absoluteZero) final *= 3;\n    if (p.headsman && !opts.boss && target.maxHp && target.hp / target.maxHp < p.headsman) {\n      final = target.hp + 1;\n      this.fx.damageText(target.x, target.y - 16, 'EXECUTE', '#ff4d6a', { size: 8, crit: true });\n    }\n    const dealt = target.takeDamage(final, rider) ?? final;\n    this.runStats.damageDealt += dealt;\n\n    // feedback\n    const big = final > p.maxHp * 0.4 || crit;\n    if (!opts.small || crit) {\n      this.fx.damageText(target.x + rand(-4, 4), target.y - (target.radius || 8) - 4,\n        Math.round(final) + (crit ? '!' : ''), crit ? '#ffe066' : '#ffffff',\n        { size: crit ? 10 : 8, crit });\n    }\n    this.fx.sparks(target.x, target.y, crit ? '#ffe066' : '#ffd0a0', crit ? 6 : 3,\n      opts.angle ?? rand(0, TAU), 0.8, crit ? 160 : 90);\n    if (big) { this.time.hit(crit ? 0.05 : 0.03); this.camera.shake(crit ? 0.2 : 0.1); }\n    if (opts.family === 'fire') this.fx.fire(target.x, target.y, '#ff7a33');\n    if (p.lifesteal > 0 && !opts.byTrain) p.heal(dealt * p.lifesteal);\n    if (opts.lifesteal) p.heal(dealt * opts.lifesteal);\n\n    // chains\n    if (p.chain > 0 && !opts.isChain && Math.random() < 0.5) {\n      const near = this.enemiesInRange(target.x, target.y, p.chainMaster ? 180 : 90)\n        .filter(e => e !== target).slice(0, p.chain);\n      for (const e of near) {\n        this.fx.lightning(target.x, target.y, e.x, e.y, '#8ef0ff', 4, 0.12);\n        this.dealDamage(e, amount * 0.4, { family: 'lightning', isChain: true, small: true });\n      }\n    }\n\n    if (!target.alive) this._onKill(target, opts);\n    return dealt;\n  }\n\n  onEnemyDeath(e) { this._onKill(e); }\n\n  _onKill(e, opts = {}) {\n    const p = this.player;\n    if (e === this.boss) { this._onBossKilled(e); return; }\n    p.onKill(this, e);\n    this.gameStats.kills++; this.runStats.kills++;\n    this.runStats.bestCombo = Math.max(this.runStats.bestCombo, p.combo);\n\n    // visuals\n    this.fx.explosion(e.x, e.y, 'impact', (e.radius || 7) / 9, { light: 0.6, speed: 26 });\n    this.fx.blood(e.x, e.y, '#7a1010', e.giant ? 14 : 7);\n    this.fx.decal(e.x, e.y, (e.radius || 7) * 0.8, '#2a0808', 10);\n    this.fx.shard(e.x, e.y, '#ffd0a0', 4);\n\n    // loot\n    const eliteMul = e.eliteMod ? 4 : 1;\n    const coinBase = Math.max(1, Math.round((e.xp || 4) * 0.12 * eliteMul * (1 + (this.train.lootBonus || 0)) * (this.player.coinMult || 1)));\n    const coinDrops = Math.min(4, 1 + Math.floor(coinBase / 6));\n    for (let i = 0; i < coinDrops; i++) {\n      this.pickups.push(new Pickup('coin', e.x + rand(-5, 5), e.y + rand(-5, 5), Math.ceil(coinBase / coinDrops)));\n    }\n    const xpType = e.eliteMod || e.giant ? 'xpBig' : 'xp';\n    this.pickups.push(new Pickup(xpType, e.x, e.y, (e.xp || 4) * (this.difficulty.xpMult || 1)));\n    if (e.eliteMod) {\n      this.gameStats.elites++;\n      for (let i = 0; i < 3; i++) this.pickups.push(new Pickup('shard', e.x + rand(-6, 6), e.y + rand(-6, 6), 1));\n      if (Math.random() < 0.7) this.pickups.push(new Pickup('heart', e.x, e.y, 30));\n      if (Math.random() < 0.35) this.pickups.push(new Pickup('chest', e.x, e.y, 1));\n    } else {\n      if (Math.random() < 0.035) this.pickups.push(new Pickup('heart', e.x, e.y, 18));\n      if (Math.random() < 0.02) this.pickups.push(new Pickup('magnet', e.x, e.y, 1));\n    }\n\n    // on-kill build effects\n    if (p.corpseBoom) {\n      this.spawnExplosion(e.x, e.y, p.novaEngine ? 70 : 42, p.corpseBoom, 'explosive');\n    }\n    if (p.solarCore && (e.burnT > 0)) {\n      this.spawnExplosion(e.x, e.y, 56, p.burnDmg * 4, 'fire');\n    }\n    if (e.splitInto) {\n      for (let i = 0; i < (e.splits || 2); i++) {\n        const a = rand(0, TAU);\n        this.spawnEnemy(e.splitInto, e.x + Math.cos(a) * 12, e.y + Math.sin(a) * 12);\n      }\n    }\n  }\n\n  _onBossKilled(b) {\n    if (this.bossDefeated) return;\n    this.bossDefeated = true;\n    this.gameStats.bosses++;\n    this.time.slowmo(1.6, 0.25);\n    this.camera.shake(1);\n    this.fx.explosion(b.x, b.y, 'explFire', 4, { lightColor: '#ffe066' });\n    this.fx.banner(b.x, b.y - 40, b.name + ' DESTROYED', '#ffe066');\n    for (let i = 0; i < 24; i++) this.pickups.push(new Pickup('coin', b.x + rand(-30, 30), b.y + rand(-30, 30), 10));\n    for (let i = 0; i < 16; i++) this.pickups.push(new Pickup('xpBig', b.x + rand(-30, 30), b.y + rand(-30, 30), 14));\n    for (let i = 0; i < 3; i++) this.pickups.push(new Pickup('heart', b.x + rand(-16, 16), b.y + rand(-16, 16), 45));\n    this.pickups.push(new Pickup('chest', b.x, b.y, 1));\n    this.save.bossCores = this.save.bossCores || {};\n    this.save.bossCores[b.id] = (this.save.bossCores[b.id] || 0) + 1;\n    const idx = REALMS.findIndex(r => r.id === this.realmId);\n    if (idx >= 0 && idx < REALMS.length - 1) {\n      const next = REALMS[idx + 1].id;\n      this.save.unlockedRealms = Array.from(new Set([...(this.save.unlockedRealms || ['purgatory']), next]));\n    }\n  }\n\n  // ================================================================\n  // LEVEL-UP CARDS\n  // ================================================================\n  _queueLevelUp() {\n    this.pendingLevelUps += 1;\n    // 'Annihilation' tiered card: every level-up wipes the screen\n    if (this.player.screenWipe > 0) {\n      this.extinctionEvent(180 * this.player.screenWipe);\n      this.fx.banner(this.player.x, this.player.y - 52, 'ANNIHILATION', '#ff2a2a');\n    }\n    this.fx.banner(this.player.x, this.player.y - 34, 'LEVEL ' + this.player.level, '#8ef0ff');\n    this.fx.ring(this.player.x, this.player.y, 40, '#8ef0ff', 0.5, 3);\n    if (!this.cards) this._openCards();\n  }\n  _openCards() {\n    if (this.pendingLevelUps <= 0) return;\n    const p = this.player;\n    // Apocalypse Protocol takes priority once you have gone deep enough\n    if (apocalypseReady(this.owned, p.level)) {\n      this.cards = [{ card: APOCALYPSE_PROTOCOL, nextLevel: 1 }];\n      this.cardIndex = 0;\n      this.cardT = 0;\n      return;\n    }\n    let n = 3;\n    if ((p.luck || 0) > 0.15) n = 4;\n    this.cards = rollCards(this.owned, p, this, n);\n    if (!this.cards.length) {\n      // nothing left to offer — hand out a weapon or heal\n      this.pendingLevelUps--;\n      this._grantRandomWeapon();\n      return;\n    }\n    this.cardIndex = 0;\n    this.cardT = 0;\n  }\n  _grantRandomWeapon() {\n    const p = this.player;\n    const pool = WEAPONS.filter(w => !p.hasWeapon(w.id));\n    if (pool.length && p.weapons.length < 6) {\n      const w = pool[randInt(0, pool.length - 1)];\n      p.addWeapon(w.id);\n      this.fx.banner(p.x, p.y - 30, 'NEW WEAPON: ' + w.name.toUpperCase(), w.color);\n    } else {\n      p.heal(p.maxHp * 0.25);\n    }\n  }\n  _pickCard(i) {\n    const pick = this.cards?.[i];\n    if (!pick) return;\n    const c = pick.card;\n    const lvl = (this.owned[c.id] || 0) + 1;\n    this.owned[c.id] = lvl;\n    c.apply(this.player, lvl, this);\n    this.fx.banner(this.player.x, this.player.y - 30, c.name.toUpperCase() + ' ' + (c.max > 1 ? ROMAN[lvl] : ''),\n      RARITY_COLORS[c.rarity] || '#ffffff');\n    this.fx.explosion(this.player.x, this.player.y, 'explHoly', 1.4, { lightColor: RARITY_COLORS[c.rarity] });\n    // tiered-card synergies (data/upgradecards.js SYNERGY_BONUSES)\n    this._synergiesFired = this._synergiesFired || {};\n    checkSynergies(this.owned, this.player, this, this._synergiesFired);\n    this.cards = null;\n    this.pendingLevelUps -= 1;\n    // every 4 levels also offer a new weapon if we have room\n    if (this.player.level % 4 === 0 && this.player.weapons.length < 6) this._grantRandomWeapon();\n    if (this.pendingLevelUps > 0) this._openCards();\n  }\n  _reroll() {\n    if (this.rerolls <= 0 || !this.cards) return;\n    if (this.cards[0]?.card?.rarity === 'apocalypse') return;\n    this.rerolls--;\n    this.cards = rollCards(this.owned, this.player, this, this.cards.length);\n  }\n  _banish() {\n    if (this.banishes <= 0 || !this.cards) return;\n    const c = this.cards[this.cardIndex];\n    if (!c || c.card.rarity === 'apocalypse') return;\n    this.banishes--;\n    this.owned[c.card.id] = c.card.max || 5;   // pretend maxed => never offered again\n    this.cards = rollCards(this.owned, this.player, this, this.cards.length);\n    delete this.owned[c.card.id];\n  }\n\n  // ================================================================\n  // DIRECTOR — continuous escalating waves\n  // ================================================================\n  _director(dt) {\n    const d = this.director;\n    d.t += dt;\n    const stageMul = 1 + (this.stage - 1) * 0.35;\n    const timeMul = 1 + d.t / 55;\n    const cap = Math.min(180, Math.round(26 * stageMul * timeMul));\n    let alive = 0;\n    for (const e of this.enemies) if (e.alive) alive++;\n\n    d.nextWave -= dt;\n    if (d.nextWave <= 0 && alive < cap) {\n      d.wave++;\n      d.nextWave = Math.max(0.7, 2.6 - d.t / 80);\n      const roster = this.world.pickEnemyRoster(this.stage);\n      const count = Math.min(cap - alive, Math.round(rand(4, 7) * stageMul * Math.min(3.4, timeMul)));\n      for (let i = 0; i < count; i++) {\n        const a = rand(0, TAU);\n        const r = rand(140, 185);\n        const x = this.player.x + Math.cos(a) * r;\n        const y = this.player.y + Math.sin(a) * r;\n        const id = roster[randInt(0, roster.length - 1)];\n        const e = this.spawnEnemy(id, x, y);\n        if (e) {\n          const hpScale = 1 + d.t / 130 + (this.stage - 1) * 0.3;\n          e.maxHp *= hpScale; e.hp = e.maxHp;\n          e.dmg *= 1 + d.t / 260;\n          e.xp = Math.round((e.xp || 4) * (1 + d.t / 300));\n          this.fx.spawn({ x, y, vx: 0, vy: 0, color: '#985ce0', life: 0.3, size: 4, endSize: 0 });\n        }\n      }\n    }\n    // elite pack\n    d.eliteT -= dt;\n    if (d.eliteT <= 0) {\n      d.eliteT = Math.max(24, 50 - d.t / 20);\n      this._spawnElite();\n    }\n    // treasure\n    d.chestT -= dt;\n    if (d.chestT <= 0) {\n      d.chestT = 55;\n      const a = rand(0, TAU);\n      this.pickups.push(new Pickup('chest', this.player.x + Math.cos(a) * 130, this.player.y + Math.sin(a) * 130, 1));\n      this.fx.banner(this.player.x, this.player.y - 44, 'A CHEST APPEARED', '#ffe066');\n    }\n    // boss timer\n    if (!this.bossSpawned && d.t > 150 + this.stage * 15) this._spawnBoss();\n  }\n\n  _spawnElite() {\n    const roster = this.world.pickEnemyRoster(this.stage);\n    const mods = ['armoured', 'fast', 'giant', 'regenerating', 'teleporting', 'summoner', 'enraged', 'void_touched'];\n    const n = 1 + Math.floor(this.director.t / 120);\n    for (let k = 0; k < n; k++) {\n      const a = rand(0, TAU);\n      const e = this.spawnEnemy(roster[randInt(0, roster.length - 1)],\n        this.player.x + Math.cos(a) * 155, this.player.y + Math.sin(a) * 155);\n      if (!e) continue;\n      const mod = mods[randInt(0, mods.length - 1)];\n      this._applyEliteMod(e, mod);\n      e.maxHp = e.hp; \n      this.fx.ring(e.x, e.y, 30, '#ffb020', 0.6, 2);\n    }\n    this.fx.banner(this.player.x, this.player.y - 46, 'ELITE INCOMING', '#ff8a30');\n  }\n  _applyEliteMod(e, mod) {\n    const map = {\n      armoured: () => { e.hp *= 2.4; e.radius += 1; },\n      fast: () => { e.spd *= 1.7; e.dmg *= 0.9; },\n      giant: () => { e.hp *= 5; e.spd *= 0.85; e.radius *= 1.7; e.scale = 2; e.dmg *= 1.6; e.giant = true; },\n      regenerating: () => { e.regen = Math.max(3, e.hp * 0.03); e.hp *= 1.5; },\n      teleporting: () => { e.teleportCd = 4; e.hp *= 1.5; },\n      summoner: () => { e.ai = 'summoner'; e.summon = { id: 'firefly_swarm', cd: 3.2, count: 3, max: 8 }; e.hp *= 1.8; },\n      enraged: () => { e.dmg *= 1.8; e.spd *= 1.2; e.hp *= 1.6; },\n      void_touched: () => { e.voidTouched = true; e.hp *= 2; e.dmg *= 1.3; },\n    };\n    map[mod]?.();\n    e.eliteMod = mod;\n    e.hp *= 1 + (this.stage - 1) * 0.3;\n    e.maxHp = e.hp;\n    e.xp = (e.xp || 4) * 6;\n  }\n\n  _spawnBoss() {\n    const def = findRealm(this.realmId).boss;\n    if (!def) return;\n    this.bossSpawned = true;\n    const a = rand(0, TAU);\n    const b = new Boss(def.id, this.player.x + Math.cos(a) * 150, this.player.y + Math.sin(a) * 150,\n      this.realmId, this.difficulty, this.art);\n    b._id = 'boss';\n    this.boss = b;\n    this.fx.banner(this.player.x, this.player.y - 50, def.name.toUpperCase(), '#ff4d6a');\n    this.fx.screenTint('#ff3020', 0.5);\n    this.camera.shake(0.9);\n    this.time.slowmo(1.0, 0.35);\n  }\n\n  // ================================================================\n  // UPDATE\n  // ================================================================\n  update(rawDt) {\n    const input = this.input;\n    if (input.wasPressed('Escape')) { input.endFrame(); this.engine.setScene('pause', { from: 'gameplay', ctx: this }); return; }\n\n    // --- card overlay owns the frame ---\n    if (this.cards) {\n      this.cardT = (this.cardT || 0) + rawDt;\n      this._updateCards();\n      this.fx.update(rawDt * 0.25);\n      input.endFrame();\n      return is.train.y, 'explFire', 4, {});\n    }\n    for (const e of this.enemies) e.update(dt, this);\n    for (const arr of [this.projectiles, this.meteors, this.flames, this.bombs, this.pools, this.holes, this.pickups]) {\n      for (const o of arr) o.update(dt, this);\n    }\n    if (this.boss) {\n      this.boss.update(dt, this);\n      if (!this.boss.alive) {\n        if (!this.bossDefeated) this._onBossKilled(this.boss);\n        if (this.boss.deathT <= 0) this.boss = null;\n      }\n    }\n    this._director(dt);\n\n    // cleanup\n    this.enemies = this.enemies.filter(e => e.alive || e.deathT > 0);\n    this.projectiles = this.projectiles.filter(o => o.alive);\n    this.meteors = this.meteors.filter(o => o.alive);\n    this.flames = this.flames.filter(o => o.alive);\n    this.bombs = this.bombs.filter(o => o.alive);\n    this.pools = this.pools.filter(o => o.alive);\n    this.holes = this.holes.filter(o => o.alive);\n    this.pickups = this.pickups.filter(o => o.alive);\n    if (this.enemies.length > 320) this.enemies.splice(0, this.enemies.length - 320);\n\n    if (this._magnetT > 0) { this._magnetT -= dt; if (this._magnetT <= 0) this.magnetAll = false; }\n\n    // ---- camera & fx ----\n    this.fx.update(dt);\n    this.camera.follow(p.x, p.y, rawDt, p.vx, p.vy);\n    this.camera.update(rawDt);\n    this._updateAmbient(dt);\n\n    input.endFrame();\n  }\n\n  _useAbility(ab) {\n    const p = this.player;\n    if (ab.id === 'dodge') {\n      const a = this.input.axis();\n      const ang = (a.x || a.y) ? Math.atan2(a.y, a.x) :\n        (p.facing === 'left' ? Math.PI : p.facing === 'up' ? -Math.PI / 2 : p.facing === 'down' ? Math.PI / 2 : 0);\n      p.invuln = Math.max(p.invuln, ab.dur + 0.1);\n      p.dashT = ab.dur;\n      const nx = p.x + Math.cos(ang) * ab.dist, ny = p.y + Math.sin(ang) * ab.dist;\n      if (!this.world.isSolidWorld(nx, ny)) { p.x = nx; p.y = ny; }\n      this.fx.burst(p.x, p.y, '#7ec8ff', 14, { spd: 150, life: 0.35, light: 0.2 });\n      this.ca  }\n\n  _drawPickup(ctx, u) {\n    const A = this.art;\n    const frames = A.anim[u.spriteKey()] || A.anim.xp;\n    const f = frames[Math.floor(u.frame) % frames.length];\n    const bob = Math.sin(u.t * 6) * 1.5;\n    ctx.drawImage(f, Math.round(u.x - f.width / 2), Math.round(u.y - f.height / 2 + bob));\n    if (u.type === 'coin' || u.type === 'chest' || u.type === 'heart') {\n      this._light(u.x, u.y, 14, u.color(), 0.35);\n    }\n  }\n\n  _drawProjectile(ctx, pr) {\n    const A = this.art;\n    const key = pr.sprite && A.anim[pr.sprite] ? pr.sprite : null;\n    if (key) {\n      const frames = A.anim[key];\n      const f = frames[Math.floor(this.runTime * 22 + pr._id) % frames.length];\n      ctx.save();\n      ctx.translate(Math.round(pr.x), Math.round(pr.y));\n      if (pr.rot || pr.angle !== undefined) ctx.rotate(pr.rot || pr.angle || 0);\n      const s = pr.omega ? 2 : 1;\n      ctx.drawImage(f, -Math.round(f.width / 2) * s, -Math.round(f.height / 2) * s, f.width * s, f.height * s);\n      ctx.restore();\n    } else {\n      ctx.fillStyle = pr.color || '#ffffff';\n      ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.size, 0, TAU); ctx.fill();\n    }\n    this._light(pr.x, pr.y, (pr.omega ? 60 : 20), pr.color || '#ffffff', pr.omega ? 1 : 0.4);\n  }\n\n  _drawAmbient(ctx, layer) {\n    const bits = this.ambientBits;\n    for (const a of bits) {\n      switch (a.kind) {\n        case 'snow': if (layer) { ctx.fillStyle = '#d4ecff'; ctx.globalAlpha = 0.7; ctx.fillRect(a.x, a.y, 1, 1); } break;\n        case 'ember': if (layer) { ctx.fillStyle = '#ffb040'; ctx.globalAlpha = 0.8; ctx.fillRect(a.x, a.y, 1, 2); } break;\n        case 'sand': if (!layer) { ctx.fillStyle = '#c8a464'; ctx.globalAlpha = 0.18; ctx.fillRect(a.x, a.y, 10, 1); } break;\n        case 'leaf': if (layer) { ctx.fillStyle = '#5a9c33'; ctx.globalAlpha = 0.7; ctx.fillRect(a.x, a.y, 2, 1); } break;\n        case 'spark': if (layer) { ctx.fillStyle = '#c07aff'; ctx.globalAlpha = 0.8; ctx.fillRect(a.x, a.y, 1, 1); } break;\n        default: if (!layer) { ctx.fillStyle = '#8a8ab0'; ctx.globalAlpha = 0.07; ctx.fillRect(a.x, a.y, 40, 8); }\n      }\n      ctx.globalAlpha = 1;\n    }\n  }\n\n  _drawWorld(ctx) {\n    const ts = 16;\n    const cam = this.camera;\n    const halfW = CFG.VIEW_W / 2 / cam.zoom + 24;\n    const halfH = CFG.VIEW_H / 2 / cam.zoom + 24;\n    const tx0 = Math.max(0, Math.floor((cam.x - halfW) / ts));\n    const ty0 = Math.max(0, Math.floor((cam.y - halfH) / ts));\n    const tx1 = Math.min(this.world.W - 1, Math.ceil((cam.x + halfW) / ts));\n    const ty1 = Math.min(this.world.H - 1, Math.ceil((cam.y + halfH) / ts));\n    const realm = findRealm(this.realmId);\n    ctx.fillStyle = floorOf(this.realmId, 2);\n    ctx.fillRect(cam.x - halfW - 32, cam.y - halfH - 32, halfW * 2 + 64, halfH * 2 + 64);\n    for (let y = ty0; y <= ty1; y++) {\n      for (let x = tx0; x <= tx1; x++) {\n        const t = this.world.tiles[y * this.world.W + x];\n        const px = x * ts, py = y * ts;\n        const n = ((x * 73856093) ^ (y * 19349663)) & 7;\n        if (t === T.WALL) {\n          ctx.fillStyle = realm.accent; ctx.fillRect(px, py, ts, ts);\n          ctx.fillStyle = '#00000055'; ctx.fillRect(px + 1, py + 1, ts - 2, ts - 2);\n          ctx.fillStyle = realm.accent; ctx.fillRect(px + 2, py + 2, ts - 5, ts - 5);\n          ctx.fillStyle = '#ffffff10'; ctx.fillRect(px + 2, py + 2, ts - 5, 2);\n        } else if (t === T.TREE) {\n          ctx.fillStyle = floorOf(this.realmId, n); ctx.fillRect(px, py, ts, ts);\n          ctx.fillStyle = '#1a1208'; ctx.fillRect(px + 6, py + 6, 4, 10);\n          ctx.fillStyle = '#24401a'; ctx.beginPath(); ctx.arc(px + 8, py + 6, 6, 0, TAU); ctx.fill();\n          ctx.fillStyle = '#3a6a26'; ctx.beginPath(); ctx.arc(px + 7, py + 5, 4, 0, TAU); ctx.fill();\n        } else if (t === T.ROCK) {\n          ctx.fillStyle = floorOf(this.realmId, n); ctx.fillRect(px, py, ts, ts);\n          ctx.fillStyle = '#2c2c38'; ctx.beginPath(); ctx.arc(px + 8, py + 9, 5, 0, TAU); ctx.fill();\n          ctx.fillStyle = '#48485a'; ctx.beginPath(); ctx.arc(px + 7, py + 8, 3.4, 0, TAU); ctx.fill();\n        } else if (t === T.LAVA) {\n          const pulse = 0.5 + 0.5 * Math.sin(this.runTime * 2 + n);\n          ctx.fillStyle = '#6b1510'; ctx.fillRect(px, py, ts, ts);\n          ctx.fillStyle = pulse > 0.6 ? '#ff6a33' : '#d6311a';\n          ctx.fillRect(px + 2, py + 2, ts - 4, ts - 4);\n          if (Math.random() < 0.02) this.fx.embers(px + 8, py + 8, '#ffb040', 1);\n        } else if (t === T.ICE) {\n          ctx.fillStyle = '#16243c'; ctx.fillRect(px, py, ts, ts);\n          ctx.fillStyle = '#25436a'; ctx.fillRect(px + 1, py + 1, ts - 2, ts - 2);\n          if (n < 2) { ctx.fillStyle = '#7ab0e0'; ctx.fillRect(px + 4 + n, py + 5, 4, 1); }\n        } else if (t === T.SAND) {\n          ctx.fillStyle = '#5c4c20'; ctx.fillRect(px, py, ts, ts);\n          ctx.fillStyle = '#6d5a28'; ctx.fillRect(px + 1, py + 1, ts - 2, ts - 2);\n          if (n < 3) { ctx.fillStyle = '#7a6530'; ctx.fillRect(px + 3 + n * 2, py + 6 + n, 3, 1); }\n        } else if (t === T.VOID) {\n          ctx.fillStyle = '#0a0420'; ctx.fillRect(px, py, ts, ts);\n          if (n === 0) { ctx.fillStyle = '#482278'; ctx.fillRect(px + 4, py + 6, 1, 1); }\n          if (n === 3) { ctx.fillStyle = '#7a44c0'; ctx.fillRect(px + 11, py + 3, 1, 1); }\n        } else if (t === T.PLATFORM) {\n          ctx.fillStyle = '#1c1c24'; ctx.fillRect(px, py, ts, ts);\n          ctx.fillStyle = '#2c2c38'; ctx.fillRect(px + 1, py + 1, ts - 2, ts - 2);\n          ctx.fillStyle = '#3d3d4d'; ctx.fillRect(px, py + 12, ts, 2);\n        } else if (t === T.TRACK) {\n          ctx.fillStyle = floorOf(this.realmId, n); ctx.fillRect(px, py, ts, ts);\n          ctx.fillStyle = '#3a2a18'; ctx.fillRect(px, py + 4, ts, 8);\n          ctx.fillStyle = '#6a6a80'; ctx.fillRect(px, py + 5, ts, 1); ctx.fillRect(px, py + 10, ts, 1);\n        } else if (t === T.ASH) {\n          ctx.fillStyle = '#241a10'; ctx.fillRect(px, py, ts, ts);\n          if (n < 2) { ctx.fillStyle = '#3a2a18'; ctx.fillRect(px + 3 + n * 3, py + 4 + n, 2, 2); }\n        } else {\n          ctx.fillStyle = floorOf(this.realmId, n & 1 ? 0 : 1);\n          ctx.fillRect(px, py, ts, ts);\n          if (n === 0) { ctx.fillStyle = '#ffffff12'; ctx.fillRect(px + 3, py + 5, 3, 1); }\n          if (n === 2) { ctx.fillStyle = '#ffffff0a'; ctx.fillRect(px + 10, py + 2, 2, 2); }\n          if (n === 5) { ctx.fillStyle = '#00000033'; ctx.fillRect(px + 9, py + 10, 4, 2); }\n          if (n === 6) { ctx.fillStyle = '#00000022'; ctx.fillRect(px + 2, py + 12, 5, 1); }\n        }\n      }\n    }\n  }\n\n  // ================================================================\n  // HUD\n  // ================================================================\n  _drawHUD(ctx) {\n    const W = CFG.VIEW_W, H = CFG.VIEW_H;\n    const p = this.player;\n\n    // ---- XP bar across the very top ----\n    ctx.fillStyle = '#0c0a16'; ctx.fillRect(0, 0, W, 7);\n    const xpPct = Math.min(1, p.xp / p.xpNeeded());\n    const g = ctx.createLinearGradient(0, 0, W, 0);\n    g.addColorStop(0, '#2b6ad0'); g.addColorStop(1, '#8ef0ff');\n    ctx.fillStyle = g; ctx.fillRect(0, 0, W * xpPct, 6);\n    ctx.fillStyle = '#ffffff40'; ctx.fillRect(0, 0, W * xpPct, 2);\n    text(ctx, 'LV ' + p.level, 4, 13, '#ffffff', 8, true);\n\n    // ---- HP + shield ----\n    const hx = 34, hy = 8, hw = 118, hh = 9;\n    ctx.fillStyle = '#000000aa'; ctx.fillRect(hx - 1, hy - 1, hw + 2, hh + 2);\n    ctx.fillStyle = '#2a0c10'; ctx.fillRect(hx, hy, hw, hh);\n    const hpPct = Math.max(0, p.hp / p.maxHp);\n    const hg = ctx.createLinearGradient(hx, 0, hx + hw, 0);\n    hg.addColorStop(0, '#c81f2a'); hg.addColorStop(1, '#ff6a5a');\n    ctx.fillStyle = hg; ctx.fillRect(hx, hy, hw * hpPct, hh);\n    ctx.fillStyle = '#ffffff33'; ctx.fillRect(hx, hy, hw * hpPct, 3);\n    if (p.shield > 0) {\n      ctx.fillStyle = '#ffe06699';\n      ctx.fillRect(hx, hy, hw * Math.min(1, p.shield / p.maxHp), hh);\n    }\n    text(ctx, Math.ceil(p.hp) + '/' + Math.round(p.maxHp), hx + 4, hy + 7, '#ffffff', 7, true);\n\n    // ---- coins / time / kills ----\n    const coinF = this.art.anim.coin[Math.floor(this.runTime * 8) % 8];\n    ctx.drawImage(coinF, W - 74, 8);\n    text(ctx, fmtNum(this.runCoins), W - 62, 16, '#ffe878', 8, true);\n    text(ctx, fmtTime(this.runTime), W - 74, 26, '#cfd4e0', 7);\n    text(ctx, 'KILLS ' + this.runStats.kills, W - 74, 34, '#cfd4e0', 7);\n\n    // ---- combo ----\n    if (p.combo > 4) {\n      const a = Math.min(1, p.comboT);\n      ctx.globalAlpha = a;\n      textC(ctx, 'x' + p.combo + ' COMBO', W / 2, 22, p.combo > 40 ? '#ff4d6a' : p.combo > 20 ? '#ffb020' : '#ffe066',\n        p.combo > 40 ? 12 : 10, true);\n      ctx.globalAlpha = 1;\n    }\n\n    // ---- weapons (bottom-left) ----\n    let wx = 6;\n    for (const w of p.weapons) {\n      const st = p.weaponStates[w.id];\n      drawIcon(ctx, w.icon || 'fire', wx, H - 22, 16, w.color);\n      ctx.fillStyle = '#000000aa'; ctx.fillRect(wx, H - 8, 16, 7);\n      text(ctx, 'L' + st.level, wx + 2, H - 2, '#ffffff', 6, true);\n      if (st.cd > 0 && w.cd) {\n        ctx.fillStyle = '#000000aa';\n        const k = Math.max(0, Math.min(1, st.cd / w.cd));\n        ctx.fillRect(wx, H - 22, 16, 16 * k);\n      }\n      wx += 19;\n    }\n    // ---- ability ----\n    for (const ab of p.abilities) {\n      const st = p.abilityStates[ab.id];\n      drawIcon(ctx, 'dash', wx + 4, H - 22, 16, ab.color);\n      if (st.cd > 0) {\n        ctx.fillStyle = '#000000bb';\n        ctx.fillRect(wx + 4, H - 22, 16, 16 * (st.cd / ab.cd));\n        text(ctx, st.cd.toFixed(1), wx + 5, H - 12, '#ffffff', 6, true);\n      } else text(ctx, 'SPC', wx + 5, H - 2, '#8ef0ff', 6, true);\n      wx += 22;\n    }\n\n    // ---- train status (bottom-right) ----\n    const tw = 90, tx = W - tw - 6, ty = H - 26;\n    ctx.fillStyle = '#000000aa'; ctx.fillRect(tx - 2, ty - 2, tw + 4, 24);\n    text(ctx, this.train.set.skin.name.toUpperCase().slice(0, 14), tx, ty + 5, '#cfd4e0', 6, true);\n    drawBar(ctx, tx, ty + 8, tw, 5, this.train.hp / this.train.maxHp, '#74c04a', '#0e2410');\n    drawBar(ctx, tx, ty + 15, tw, 4, this.train.energy / this.train.maxEnergy, '#8ef0ff', '#101a2a');\n    if (this.train.overdrive) text(ctx, 'OVERDRIVE', tx + 20, ty + 24, '#ff4d6a', 6, true);\n\n    // ---- boss bar ----\n    if (this.boss?.alive && this.boss._introT <= 0) {\n      const bw = W - 120, bx = 60, by = 42;\n      ctx.fillStyle = '#000000bb'; ctx.fillRect(bx - 2, by - 2, bw + 4, 12);\n      drawBar(ctx, bx, by, bw, 8, this.boss.hp / this.boss.maxHp, '#ff3a4a', '#2a0a10');\n      textC(ctx, this.boss.name.toUpperCase() + '   PHASE ' + this.boss.phase + '/' + this.boss.phases,\n        W / 2, by + 7, '#ffffff', 7, true);\n    }\n\n    // ---- apocalypse banner ----\n    if (this.apocalypseActive) {\n      ctx.globalAlpha = 0.6 + 0.3 * Math.sin(this.runTime * 5);\n      textC(ctx, 'APOCALYPSE PROTOCOL ACTIVE', W / 2, H - 32, '#ff2a2a', 8, true);\n      ctx.globalAlpha = 1;\n    }\n\n    // ---- low HP vignette ----\n    if (p.hp / p.maxHp < 0.3) {\n      const a = 0.5 * (1 - p.hp / p.maxHp) * (0.7 + 0.3 * Math.sin(this.runTime * 8));\n      ctx.fillStyle = `rgba(255,30,30,${a.toFixed(3)})`;\n      ctx.fillRect(0, 0, W, 5); ctx.fillRect(0, H - 5, W, 5);\n      ctx.fillRect(0, 0, 5, H); ctx.fillRect(W - 5, 0, 5, H);\n    }\n  }\n\n  // ================================================================\n  // CARD OVERLAY\n  // ================================================================\n  _drawCards(ctx) {\n    const W = CFG.VIEW_W, H = CFG.VIEW_H;\n    const apoc = this.cards[0]?.card?.rarity === 'apocalypse';\n    ctx.fillStyle = apoc ? 'rgba(40,0,0,0.9)' : 'rgba(6,4,14,0.86)';\n    ctx.fillRect(0, 0, W, H);\n    const t = Math.min(1, (this.cardT || 0) * 4);\n    if (apoc) {\n      ctx.globalAlpha = 0.25 + 0.15 * Math.sin(this.runTime * 6);\n      ctx.fillStyle = '#ff2a2a'; ctx.fillRect(0, 0, W, H);\n      ctx.globalAlpha = 1;\n      textC(ctx, 'THE GRID IS COMPLETE', W / 2, 26, '#ff8080', 8, true);\n      textC(ctx, 'APOCALYPSE PROTOCOL', W / 2, 40, '#ffffff', 14, true);\n    } else {\n      textC(ctx, 'ASCENSION', W / 2, 24, '#ffe066', 12, true);\n      textC(ctx, 'LEVEL ' + this.player.level + '  ·  CHOOSE YOUR PATH', W / 2, 36, '#cfd4e0', 7);\n    }\n    const geo = this._cardGeometry();\n    for (let i = 0; i < this.cards.length; i++) {\n      const { card, nextLevel } = this.cards[i];\n      const gm = geo[i];\n      drawCard(ctx, {\n        x: gm.x, y: gm.y + (1 - t) * 20 * (i % 2 ? 1 : -1), w: gm.w, h: gm.h,\n        title: card.name, level: (card.max || 5) > 1 ? ROMAN[nextLevel] : '',\n        desc: typeof card.desc === 'function' ? card.desc(nextLevel) : card.desc,\n        rarity: card.rarity, color: RARITY_COLORS[card.rarity], icon: card.icon,\n        selected: this.cardIndex === i, index: i + 1, alpha: t,\n        target: card.target === 'train' ? 'TRAIN' : null,\n        tagline: card.tagline,\n        evolved: !!card.req,\n      });\n    }\n    if (!apoc) {\n      const by = H - 26;\n      const rc = this.rerolls > 0 ? '#8ef0ff' : '#555566';\n      const bc = this.banishes > 0 ? '#ff8a30' : '#555566';\n      drawPanel(ctx, W / 2 - 90, by, 80, 16, rc);\n      textC(ctx, 'REROLL (R) ' + this.rerolls, W / 2 - 50, by + 11, rc, 7, true);\n      drawPanel(ctx, W / 2 + 10, by, 80, 16, bc);\n      textC(ctx, 'BANISH (B) ' + this.banishes, W / 2 + 50, by + 11, bc, 7, true);\n    }\n  }\n}\n\nlet ID = 1;\nfunction hashStr(s) {\n  let h = 5381;\n  for (let i = 0; i < s.length; i++) h = ((h << 5) + h) + s.charCodeAt(i);\n  return h >>> 0;\n}\n","js/ui/shop.js":"// ============================================================\n// HELL TRAIN — THE HELL FORGE\n// The coin shop. Permanent progression for the Conductor and the\n// Train, plus every animated skin in the game.\n// ============================================================\nimport { CFG } from '../core/config.js';\nimport { TAU, fmtNum } from '../core/utils.js';\nimport { PLAYER_TRACKS, TRAIN_TRACKS, findTrack, trackCost, trackValue, totalSpent } from '../data/shop.js';\nimport { CHAR_SKINS, TRAIN_SKINS } from '../data/skins.js';\nimport { spendCoins, saveSave } from '../core/save.js';\nimport { text, textC, textR, drawPanel, drawBar, drawIcon, hexA, hitRect } from './widgets.js';\n\nconst TABS = [\n  { id: 'conductor', name: 'CONDUCTOR', color: '#ff8a30' },\n  { id: 'train', name: 'THE TRAIN', color: '#8ef0ff' },\n  { id: 'skins', name: 'SKINS', color: '#c07aff' },\n];\nconst RCOL = {\n  common: '#9aa0b4', uncommon: '#5ad07a', rare: '#4a9cff',\n  epic: '#c07aff', legendary: '#ffb020', mythic: '#ff2a5a',\n};\n\nexport class ShopScene {\n  constructor(engine) {\n    this.engine = engine;\n    this.input = engine.input;\n    this.art = engine.sprites;\n    this.t = 0;\n    this.tab = 0;\n    this.sel = 0;\n    this.scroll = 0;\n    this.toast = null;\n    this.embers = [];\n    for (let i = 0; i < 40; i++) {\n      this.embers.push({ x: Math.random() * CFG.VIEW_W, y: Math.random() * CFG.VIEW_H, s: 0.4 + Math.random() });\n    }\n  }\n\n  enter(params = {}) {\n    this.save = params.save || this.engine.save;\n    this.from = params.from || 'menu';\n    this.art = this.engine.sprites;\n    this.t = 0;\n    this.sel = 0;\n    this.scroll = 0;\n    this.toast = null;\n  }\n  exit() { saveSave(this.save); }\n\n  // ---------------- data for the current tab ----------------\n  items() {\n    if (this.tab === 0) return PLAYER_TRACKS.map(t => ({ kind: 'track', track: t }));\n    if (this.tab === 1) return TRAIN_TRACKS.map(t => ({ kind: 'track', track: t }));\n    return [\n      ...CHAR_SKINS.map(s => ({ kind: 'charSkin', skin: s })),\n      ...TRAIN_SKINS.map(s => ({ kind: 'trainSkin', skin: s })),\n    ];\n  }\n\n  _levelOf(track) { return (this.save.permaLevels?.[track.id]) || 0; }\n  _owned(item) {\n    if (item.kind === 'charSkin') return (this.save.ownedCharSkins || []).includes(item.skin.id) || item.skin.cost === 0;\n    if (item.kind === 'trainSkin') return (this.save.ownedTrainSkins || []).includes(item.skin.id) || item.skin.cost === 0;\n    return false;\n  }\n  _equipped(item) {\n    if (item.kind === 'charSkin') return this.save.charSkin === item.skin.id;\n    if (item.kind === 'trainSkin') return this.save.trainSkin === item.skin.id;\n    return false;\n  }\n  _price(item) {\n    if (item.kind === 'track') {\n      const l = this._levelOf(item.track);\n      return l >= (item.track.max || 10) ? null : trackCost(item.track, l);\n    }\n    return this._owned(item) ? null : item.skin.cost;\n  }\n\n  _buy(item) {\n    if (!item) return;\n    const save = this.save;\n    if (item.kind === 'track') {\n      const t = item.track;\n      const l = this._levelOf(t);\n      if (l >= (t.max || 10)) return this._say('FULLY FORGED', '#ffb020');\n      const cost = trackCost(t, l);\n      if (!spendCoins(save, cost)) return this._say('NOT ENOUGH COINS', '#ff4d6a');\n      save.permaLevels = save.permaLevels || {};\n      save.permaLevels[t.id] = l + 1;\n      this._say(t.name.toUpperCase() + ' → ' + (l + 1), '#5ad07a');\n      this._sparks();\n    } else {\n      const s = item.skin;\n      const listKey = item.kind === 'charSkin' ? 'ownedCharSkins' : 'ownedTrainSkins';\n      const eqKey = item.kind === 'charSkin' ? 'charSkin' : 'trainSkin';\n      save[listKey] = save[listKey] || [];\n      if (this._owned(item)) {\n        if (save[eqKey] === s.id) return this._say('ALREADY EQUIPPED', '#9aa0b4');\n        save[eqKey] = s.id;\n        this._say('EQUIPPED ' + s.name.toUpperCase(), '#8ef0ff');\n      } else {\n        if (!spendCoins(save, s.cost)) return this._say('NOT ENOUGH COINS', '#ff4d6a');\n        save[listKey].push(s.id);\n        save[eqKey] = s.id;\n        this._say('UNLOCKED ' + s.name.toUpperCase(), RCOL[s.rarity] || '#ffe066');\n        this._sparks();\n      }\n    }\n    saveSave(save);\n  }\n  _say(msg, color) { this.toast = { msg, color, t: 1.6 }; }\n  _sparks() { this.flashT = 0.35; }\n\n  // ---------------- update ----------------\n  update(dt) {\n    const inp = this.input;\n    this.t += dt;\n    if (this.toast) { this.toast.t -= dt; if (this.toast.t <= 0) this.toast = null; }\n    if (this.flashT > 0) this.flashT -= dt;\n\n    const items = this.items();\n    const rows = this._rowGeometry(items.length);\n\n    if (inp.wasPressed('Escape') || inp.wasPressed('Backspace')) {\n      inp.endFrame(); saveSave(this.save); this.engine.setScene(this.from, { save: this.save }); return;\n    }\n    if (inp.wasPressed('KeyQ') || inp.wasPressed('ArrowLeft') || inp.wasPressed('KeyA')) { this.tab = (this.tab + 2) % 3; this.sel = 0; this.scroll = 0; }\n    if (inp.wasPressed('KeyE') || inp.wasPressed('ArrowRight') || inp.wasPressed('KeyD')) { this.tab = (this.tab + 1) % 3; this.sel = 0; this.scroll = 0; }\n    if (inp.wasPressed('ArrowDown') || inp.wasPressed('KeyS')) this.sel = Math.min(items.length - 1, this.sel + 1);\n    if (inp.wasPressed('ArrowUp') || inp.wasPressed('KeyW')) this.sel = Math.max(0, this.sel - 1);\n    if (inp.wasPressed('Enter') || inp.wasPressed('Space')) this._buy(items[this.sel]);\n\n    // mouse\n    const mx = inp.mouse.x, my = inp.mouse.y;\n    for (let i = 0; i < TABS.length; i++) {\n      const tb = this._tabRect(i);\n      if (hitRect(mx, my, tb.x, tb.y, tb.w, tb.h)) {\n        if (inp.mouse.justDown) { this.tab = i; this.sel = 0; this.scroll = 0; }\n      }\n    }\n    for (let i = 0; i < rows.length; i++) {\n      const r = rows[i];\n      if (r.y < 40 || r.y > CFG.VIEW_H - 26) continue;\n      if (hitRect(mx, my, r.x, r.y, r.w, r.h)) {\n        this.sel = i;\n        if (inp.mouse.justDown) this._buy(items[i]);\n      }\n    }\n    // back button\n    const bb = { x: 6, y: CFG.VIEW_H - 16, w: 52, h: 12 };\n    if (inp.mouse.justDown && hitRect(mx, my, bb.x, bb.y, bb.w, bb.h)) {\n      saveSave(this.save); inp.endFrame(); this.engine.setScene(this.from, { save: this.save }); return;\n    }\n\n    // keep selection visible\n    const visible = Math.floor((CFG.VIEW_H - 70) / ROW_H);\n    if (this.sel < this.scroll) this.scroll = this.sel;\n    if (this.sel >= this.scroll + visible) this.scroll = this.sel - visible + 1;\n    this.scroll = Math.max(0, Math.min(Math.max(0, items.length - visible), this.scroll));\n\n    for (const e of this.embers) {\n      e.y -= (10 + e.s * 14) * dt;\n      e.x += Math.sin(this.t * 1.6 + e.s * 9) * 6 * dt;\n      if (e.y < -4) { e.y = CFG.VIEW_H + 4; e.x = Math.random() * CFG.VIEW_W; }\n    }\n    inp.endFrame();\n  }\n\n  _tabRect(i) {\n    const w = 86, gap = 4;\n    const total = TABS.length * w + (TABS.length - 1) * gap;\n    return { x: (CFG.VIEW_W - total) / 2 + i * (w + gap), y: 24, w, h: 14 };\n  }\n  _rowGeometry(n) {\n    const out = [];\n    const x = 8, w = 264;\n    for (let i = 0; i < n; i++) {\n      out.push({ x, y: 44 + (i - this.scroll) * ROW_H, w, h: ROW_H - 2 });\n    }\n    return out;\n  }\n\n  // ---------------- render ----------------\n  render(ctx) {\n    const W = CFG.VIEW_W, H = CFG.VIEW_H;\n    // backdrop: forge interior\n    const g = ctx.createLinearGradient(0, 0, 0, H);\n    g.addColorStop(0, '#160a12'); g.addColorStop(0.6, '#0d0710'); g.addColorStop(1, '#20090a');\n    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);\n    // furnace glow\n    const fg = ctx.createRadialGradient(W / 2, H + 20, 10, W / 2, H + 20, 220);\n    fg.addColorStop(0, 'rgba(255,90,20,0.35)'); fg.addColorStop(1, 'rgba(255,90,20,0)');\n    ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H);\n    for (const e of this.embers) {\n      ctx.fillStyle = 'rgba(255,150,50,' + (0.25 + e.s * 0.4).toFixed(2) + ')';\n      ctx.fillRect(e.x | 0, e.y | 0, 1, e.s > 1 ? 2 : 1);\n    }\n\n    // header\n    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, 20);\n    textC(ctx, 'THE HELL FORGE', W / 2, 14, '#ff8a30', 13, true);\n    const coinF = this.art.anim?.coin?.[Math.floor(this.t * 8) % 8];\n    if (coinF) ctx.drawImage(coinF, W - 70, 5);\n    textR(ctx, fmtNum(this.save.coins || 0), W - 8, 14, '#ffe878', 10, true);\n    text(ctx, 'SPENT ' + fmtNum(totalSpent(this.save)), 6, 14, '#6b6b80', 6);\n\n    // tabs\n    for (let i = 0; i < TABS.length; i++) {\n      const r = this._tabRect(i);\n      const on = i === this.tab;\n      drawPanel(ctx, r.x, r.y, r.w, r.h, on ? TABS[i].color : '#3d3d4d',\n        on ? hexA(TABS[i].color, 0.18) : 'rgba(8,6,14,0.9)');\n      textC(ctx, TABS[i].name, r.x + r.w / 2, r.y + 10, on ? '#ffffff' : '#8a8aa0', 7, true);\n    }\n\n    const items = this.items();\n    const rows = this._rowGeometry(items.length);\n    ctx.save();\n    ctx.beginPath(); ctx.rect(0, 42, 276, H - 60); ctx.clip();\n    for (let i = 0; i < items.length; i++) {\n      const r = rows[i];\n      if (r.y + r.h < 42 || r.y > H - 18) continue;\n      this._drawRow(ctx, items[i], r, i === this.sel);\n    }\n    ctx.restore();\n\n    // scroll hint\n    if (items.length * ROW_H > H - 70) {\n      const trackH = H - 70;\n      const kh = Math.max(10, trackH * (trackH / (items.length * ROW_H)));\n      const ky = 44 + (this.scroll / Math.max(1, items.length)) * trackH;\n      ctx.fillStyle = '#2a2a38'; ctx.fillRect(274, 44, 2, trackH);\n      ctx.fillStyle = '#ff8a30'; ctx.fillRect(274, ky, 2, kh);\n    }\n\n    // ---- detail panel ----\n    this._drawDetail(ctx, items[this.sel], 282, 44, W - 290, H - 66);\n\n    // footer\n    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, H - 18, W, 18);\n    drawPanel(ctx, 6, H - 16, 52, 12, '#8a8aa0');\n    textC(ctx, 'BACK (ESC)', 32, H - 7, '#cfd4e0', 6, true);\n    text(ctx, 'Q/E TABS   W/S SELECT   ENTER BUY', 66, H - 7, '#5a5a70', 6);\n\n    if (this.toast) {\n      const a = Math.min(1, this.toast.t * 2);\n      ctx.globalAlpha = a;\n      drawPanel(ctx, W / 2 - 84, H - 40, 168, 16, this.toast.color);\n      textC(ctx, this.toast.msg, W / 2, H - 29, this.toast.color, 7, true);\n      ctx.globalAlpha = 1;\n    }\n    if (this.flashT > 0) {\n      ctx.fillStyle = 'rgba(255,200,120,' + (this.flashT * 0.5).toFixed(2) + ')';\n      ctx.fillRect(0, 0, W, H);\n    }\n  }\n\n  _drawRow(ctx, item, r, selected) {\n    const isTrack = item.kind === 'track';\n    const color = isTrack ? (this.tab === 0 ? '#ff8a30' : '#8ef0ff') : (RCOL[item.skin.rarity] || '#9aa0b4');\n    const name = isTrack ? item.track.name : item.skin.name;\n    const icon = isTrack ? item.track.icon : (item.kind === 'charSkin' ? 'ghost' : 'train');\n    const lvl = isTrack ? this._levelOf(item.track) : 0;\n    const max = isTrack ? (item.track.max || 10) : 0;\n    const price = this._price(item);\n    const afford = price === null || (this.save.coins || 0) >= price;\n\n    drawPanel(ctx, r.x, r.y, r.w, r.h, selected ? '#ffffff' : hexA(color, 0.5),\n      selected ? hexA(color, 0.16) : 'rgba(10,8,16,0.85)');\n    drawIcon(ctx, icon, r.x + 3, r.y + 3, 16, color);\n    text(ctx, name.toUpperCase(), r.x + 23, r.y + 10, selected ? '#ffffff' : '#cfd4e0', 7, true);\n\n    if (isTrack) {\n      // pip bar\n      const px = r.x + 23, py = r.y + 13;\n      const pw = Math.min(96, max * 8);\n      for (let i = 0; i < max; i++) {\n        ctx.fillStyle = i < lvl ? color : '#2a2a38';\n        ctx.fillRect(px + i * (pw / max), py, Math.max(2, pw / max - 1), 3);\n      }\n      text(ctx, lvl + '/' + max, px + pw + 4, py + 4, '#8a8aa0', 6);\n    } else {\n      const tag = this._equipped(item) ? 'EQUIPPED' : this._owned(item) ? 'OWNED' : item.skin.rarity.toUpperCase();\n      text(ctx, tag, r.x + 23, r.y + 18, this._equipped(item) ? '#5ad07a' : color, 6, true);\n    }\n\n    // price\n    if (price === null) {\n      textR(ctx, isTrack ? 'MAX' : (this._equipped(item) ? '✓' : 'EQUIP'), r.x + r.w - 5, r.y + 13,\n        isTrack ? '#ffb020' : '#5ad07a', 7, true);\n    } else {\n      textR(ctx, fmtNum(price), r.x + r.w - 5, r.y + 13, afford ? '#ffe878' : '#8a4a4a', 8, true);\n    }\n  }\n\n  _drawDetail(ctx, item, x, y, w, h) {\n    drawPanel(ctx, x, y, w, h, '#5a3a2a', 'rgba(14,8,14,0.92)');\n    if (!item) return;\n    const isTrack = item.kind === 'track';\n    const color = isTrack ? (this.tab === 0 ? '#ff8a30' : '#8ef0ff') : (RCOL[item.skin.rarity] || '#9aa0b4');\n\n    if (isTrack) {\n      const t = item.track;\n      const lvl = this._levelOf(t);\n      const max = t.max || 10;\n      drawIcon(ctx, t.icon, x + w / 2 - 14, y + 8, 28, color);\n      textC(ctx, t.name.toUpperCase(), x + w / 2, y + 50, color, 10, true);\n      const lines = wrapLines(ctx, t.desc, w - 14, 6);\n      let ly = y + 62;\n      for (const ln of lines) { textC(ctx, ln, x + w / 2, ly, '#cfd4e0', 6); ly += 8; }\n      ly += 6;\n      textC(ctx, 'CURRENT', x + w / 2, ly, '#6b6b80', 6, true); ly += 9;\n      textC(ctx, '+' + trackValue(t, lvl) + ' ' + t.unit, x + w / 2, ly, '#ffffff', 8, true); ly += 12;\n      if (lvl < max) {\n        textC(ctx, 'NEXT LEVEL', x + w / 2, ly, '#6b6b80', 6, true); ly += 9;\n        textC(ctx, '+' + trackValue(t, lvl + 1) + ' ' + t.unit, x + w / 2, ly, '#5ad07a', 8, true); ly += 14;\n        drawBar(ctx, x + 10, ly, w - 20, 4, lvl / max, color);\n        ly += 14;\n        const cost = trackCost(t, lvl);\n        const afford = (this.save.coins || 0) >= cost;\n        drawPanel(ctx, x + 10, ly, w - 20, 16, afford ? '#ffe878' : '#5a3a3a',\n          afford ? 'rgba(60,40,10,0.9)' : 'rgba(30,10,10,0.9)');\n        textC(ctx, 'FORGE — ' + fmtNum(cost), x + w / 2, ly + 11, afford ? '#ffe878' : '#8a4a4a', 8, true);\n      } else {\n        textC(ctx, 'FULLY FORGED', x + w / 2, ly + 6, '#ffb020', 9, true);\n      }\n    } else {\n      const s = item.skin;\n      // animated live preview\n      const cx = x + w / 2, cy = y + 40;\n      ctx.fillStyle = 'rgba(0,0,0,0.35)';\n      ctx.beginPath(); ctx.ellipse(cx, cy + 22, 26, 6, 0, 0, TAU); ctx.fill();\n      try {\n        if (item.kind === 'charSkin') {\n          const set = this.art.getCharSet(s.id);\n          const frames = set.side.run;\n          const f = frames[Math.floor(this.t * 10) % frames.length];\n          ctx.save(); ctx.translate(cx, cy); ctx.scale(2, 2);\n          ctx.drawImage(f, -f.width / 2, -f.height / 2);\n          ctx.restore();\n        } else {\n          const set = this.art.getTrainSet(s.id);\n          const f = set.engine[Math.floor(this.t * 10) % set.engine.length];\n          ctx.save(); ctx.translate(cx, cy + 6); ctx.scale(1.15, 1.15);\n          ctx.drawImage(f, -f.width / 2, -f.height / 2);\n          ctx.restore();\n        }\n      } catch (err) { /* preview only */ }\n\n      textC(ctx, s.name.toUpperCase(), cx, y + 78, color, 10, true);\n      textC(ctx, s.rarity.toUpperCase(), cx, y + 88, color, 6, true);\n      const lines = wrapLines(ctx, s.desc, w - 14, 6);\n      let ly = y + 102;\n      for (const ln of lines) { textC(ctx, ln, cx, ly, '#cfd4e0', 6); ly += 8; }\n      ly += 6;\n      // palette swatches\n      const pal = Object.values(s.pal);\n      const sw = Math.min(10, (w - 24) / pal.length);\n      for (let i = 0; i < pal.length; i++) {\n        ctx.fillStyle = pal[i];\n        ctx.fillRect(x + 12 + i * sw, ly, sw - 1, 6);\n      }\n      ly += 16;\n      const owned = this._owned(item);\n      const eq = this._equipped(item);\n      const cost = s.cost;\n      const afford = (this.save.coins || 0) >= cost;\n      const label = eq ? 'EQUIPPED' : owned ? 'EQUIP' : 'UNLOCK — ' + fmtNum(cost);\n      const bc = eq ? '#5ad07a' : owned ? '#8ef0ff' : (afford ? '#ffe878' : '#5a3a3a');\n      drawPanel(ctx, x + 10, ly, w - 20, 16, bc, 'rgba(20,14,24,0.9)');\n      textC(ctx, label, cx, ly + 11, bc, 8, true);\n    }\n  }\n}\n\nconst ROW_H = 24;\n\nfunction wrapLines(ctx, str, w, size) {\n  ctx.font = size + 'px monospace';\n  const words = String(str || '').split(/\\s+/);\n  const out = [];\n  let cur = '';\n  for (const word of words) {\n    const test = cur ? cur + ' ' + word : word;\n    if (ctx.measureText(test).width > w && cur) { out.push(cur); cur = word; }\n    else cur = test;\n  }\n  if (cur) out.push(cur);\n  return out;\n}\n","js/ui/coinshop.js":"// ============================================================\n// HELL TRAIN — Coin Shop UI Scene\n// Professional AAA-scale interface for permanent progression\n// ============================================================\nimport { CFG } from '../core/config.js';\nimport { COIN_SHOP, PROGRESSION_TIERS } from '../data/progression.js';\nimport { saveSave } from '../core/save.js';\n\nexport class CoinShopScene {\n  constructor(engine) {\n    this.engine = engine;\n    this.selectedTab = 'character';\n    this.scrollOffset = 0;\n    this.hoveredItem = null;\n    this.coins = engine.save?.coins || 0;\n    this.upgrades = engine.save?.coinShopUpgrades || {\n      maxHP: 0,\n      attackDamage: 0,\n      attackSpeed: 0,\n      critChance: 0,\n      dodge: 0,\n      cooldownReduction: 0,\n      trainHP: 0,\n      trainDamage: 0,\n      trainFireRate: 0,\n      trainArmour: 0,\n    };\n    this.tabs = ['character', 'train', 'skins'];\n    this.animationTime = 0;\n  }\n\n  enter(params = {}) {\n    this.coins = this.engine.save?.coins || 0;\n    this.upgrades = this.engine.save?.coinShopUpgrades || this.upgrades;\n    this.selectedTab = 'character';\n    this.scrollOffset = 0;\n    this.animationTime = 0;\n  }\n\n  exit() {\n    this.engine.save.coins = this.coins;\n    this.engine.save.coinShopUpgrades = this.upgrades;\n  }\n\n  update(dt, t) {\n    this.animationTime += dt;\n    const input = this.engine.input;\n    if (this.toast) { this.toast.t -= dt; if (this.toast.t <= 0) this.toast = null; }\n    this.coins = this.engine.save?.coins || 0;\n\n    // Tab switching\n    if (input.wasPressed('KeyC')) this.selectedTab = 'character';\n    if (input.wasPressed('KeyT')) this.selectedTab = 'train';\n    if (input.wasPressed('KeyS')) this.selectedTab = 'skins';\n\n    // Scroll\n    if (input.wasPressed('ArrowUp') || input.wasPressed('KeyW')) this.scrollOffset = Math.max(0, this.scrollOffset - 30);\n    if (input.wasPressed('ArrowDown') || input.wasPressed('KeyS')) this.scrollOffset += 30;\n\n    // Tab clicks + purchases\n    const m = input.mouse;\n    if (m.justDown) {\n      const tabWidth = CFG.VIEW_W / 3;\n      if (m.y >= 40 && m.y <= 56) {\n        const idx = Math.floor(m.x / tabWidth);\n        if (this.tabs[idx]) { this.selectedTab = this.tabs[idx]; this.scrollOffset = 0; }\n      } else {\n        for (const r of (this._rects || [])) {\n          if (m.x >= r.x && m.x <= r.x + r.w && m.y >= r.y && m.y <= r.y + r.h) {\n            this._buy(r); break;\n          }\n        }\n      }\n    }\n\n    // Back to menu\n    if (input.wasPressed('Escape') || input.wasPressed('Backspace')) {\n      this._persist();\n      this.engine.setScene('menu', { save: this.engine.save });\n    }\n    input.endFrame();\n  }\n\n  _persist() {\n    this.engine.save.coins = this.coins;\n    this.engine.save.coinShopUpgrades = this.upgrades;\n    saveSave(this.engine.save);\n  }\n\n  _say(msg, color) { this.toast = { msg, color, t: 1.5 }; }\n\n  _buy(r) {\n    const save = this.engine.save;\n    if (r.kind === 'skin') {\n      save.ownedSkins = save.ownedSkins || {};\n      if (save.ownedSkins[r.skin.key]) return this._say('ALREADY OWNED', '#00ff41');\n      if (this.coins < r.skin.cost) return this._say('NOT ENOUGH COINS', '#ff3344');\n      this.coins -= r.skin.cost;\n      save.ownedSkins[r.skin.key] = true;\n      this._say('UNLOCKED ' + r.skin.label.toUpperCase(), '#ffd700');\n    } else {\n      const owned = this.upgrades[r.key] || 0;\n      if (r.upgrade.level <= owned) return this._say('ALREADY OWNED', '#00aa00');\n      if (r.upgrade.level !== owned + 1) return this._say('BUY THE PREVIOUS RANK FIRST', '#ff3344');\n      if (this.coins < r.upgrade.cost) return this._say('NOT ENOUGH COINS', '#ff3344');\n      this.coins -= r.upgrade.cost;\n      this.upgrades[r.key] = r.upgrade.level;\n      this._say
