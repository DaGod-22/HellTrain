nst x0 = (KW - total) / 2;\n    return [\n      { label: 'RETRY', x: x0, y, w, h: 32, act: 'retry', color: '#ff8a30' },\n      { label: 'FORGE', x: x0 + w + gap, y, w, h: 32, act: 'shop', color: '#ffe066' },\n      { label: 'HOME', x: x0 + 2 * (w + gap), y, w, h: 32, act: 'menu', color: '#985ce0' },\n    ];\n  }\n  update(dt) {\n    const m = super.base(dt);\n    if (!m) return;\n    this.anim = Math.min(1, this.anim + dt * 1.6);\n    if (!this.grace(dt) && m.justDown) {\n      const p = this.params || {};\n      for (const b of this._buttons()) {\n        if (this.hit(b)) {\n          if (b.act === 'retry') this.engine.setScene('gameplay', { save: this.save, realmId: p.realmId || this.save.lastRealm || 'purgatory', stage: p.stage || 1, difficulty: p.difficulty || this.engine._difficulty || 'normal' });\n          else if (b.act === 'shop') this.engine.setScene('shop', { save: this.save, from: 'menu' });\n          else this.engine.setScene('menu', { save: this.save });\n          m.justDown = false;\n          return;\n        }\n      }\n    }\n    if (!m.down) this._press = null;\n    m.justDown = false;\n  }\n  render(ctx) {\n    lavaBackground(ctx, this.t, this.embers);\n    const p = this.params || {};\n    const rs = p.runStats || {};\n    const k = this.anim || 0;\n    tile(ctx, 8, 40, KW - 16, 46, 12, { fill: '#20182c', fillLo: '#140e1e', outline: K.INK, ring: p.victory ? K.GOLD : K.RED, ringW: 2, lift: 4 });\n    outlineText(ctx, p.victory ? 'SECTOR CLEARED' : 'THE RUN ENDED', KW / 2, 64, p.victory ? '#ffe066' : '#ff7a6a', p.victory ? '#5a1a08' : '#3a0508', 15);\n    label(ctx, findRealm(p.realmId).name.toUpperCase() + ' · SECTOR ' + (p.stage || 1) + ' · ' + fmtTime(p.time || 0), KW / 2, 77, K.SUB, 7);\n    const stats = [\n      ['DEFEATS', fmtNum(rs.kills || 0), '#ff8a30'],\n      ['LEVEL', String(p.level || 1), '#8ef0ff'],\n      ['COINS EARNED', fmtNum(p.coins || 0), '#ffe878'],\n      ['BEST COMBO', 'x' + (rs.bestCombo || 0), '#c07aff'],\n      ['DAMAGE DEALT', fmtNum(Math.round(rs.damageDealt || 0)), '#ff4d6a'],\n      ['DAMAGE TAKEN', fmtNum(Math.round(rs.damageTaken || 0)), '#9aa0b4'],\n    ];\n    const cols = 3, tw = 80, th = 36, gap = 6, x0 = (KW - (cols * tw + (cols - 1) * gap)) / 2;\n    for (let i = 0; i < stats.length; i++) {\n      const c = i % cols, r2 = Math.floor(i / cols);\n      const x = x0 + c * (tw + gap), y = 96 + r2 * (th + gap);\n      const kk = Math.max(0, Math.min(1, k * 3 - i * 0.22));\n      if (kk <= 0) continue;\n      ctx.globalAlpha = kk;\n      tile(ctx, x, y, tw, th, 8, { fill: 'rgba(10,8,18,0.92)', fillLo: 'rgba(6,4,12,0.95)', outline: stats[i][2], ring: stats[i][2], ringW: 1, lift: 2 });\n      label(ctx, stats[i][0], x + tw / 2, y + 12, K.DIM, 5);\n      label(ctx, stats[i][1], x + tw / 2, y + 27, stats[i][2], 9);\n      ctx.globalAlpha = 1;\n    }\n    // ---- damage by weapon — the build, in numbers ----\n    const dmg = p.dmgByWeapon || {};\n    const entries = Object.entries(dmg).sort((a, b) => b[1] - a[1]);\n    const other = p.dmgOther || 0;\n    if (other > 0) entries.push(['Other sources', other]);\n    const by = 178;\n    if (entries.length) {\n      sectionLabel(ctx, 'DAMAGE BY WEAPON', by);\n      const total = entries.reduce((a, e) => a + e[1], 0) || 1;\n      entries.slice(0, 6).forEach(([name, v], i) => {\n        const y = by + 12 + i * 20;\n        const kk = Math.max(0, Math.min(1, k * 2.4 - 0.4 - i * 0.12));\n        if (kk <= 0) return;\n        ctx.globalAlpha = kk;\n        const wid = WEAPONS.find(w2 => w2.id === name);\n        const wname = wid ? wid.name : name;\n        const pct = v / total;\n        const barW = KW - 130;\n        label(ctx, fit(name, 17), 12, y + 9, K.SUB, 6, 'left');\n        ctx.fillStyle = '#00000088'; ctx.fillRect(112, y, barW + 2, 9);\n        ctx.fillStyle = wid?.color || '#8a7a96';\n        ctx.fillRect(113, y + 1, Math.max(2, barW * pct * kk), 7);\n        label(ctx, Math.round(pct * 100) + '%', KW - 14, y + 9, K.TXT, 7, 'right');\n        ctx.globalAlpha = 1;\n      });\n      label(ctx, 'Heavier bars = your build is doing the work.', KW / 2, by + 12 + Math.min(6, entries.length) * 20 + 4, K.DIM, 5);\n    }\n    // ending / death story beat\n    if (p.ending) {\n      const e = p.ending;\n      const y = 300;\n      tile(ctx, 20, y, KW - 40, 96, 10, { fill: '#241a08', fillLo: '#140e06', outline: K.GOLD, ring: K.GOLD, ringW: 2, lift: 3 });\n      outlineText(ctx, 'ENDING REACHED', KW / 2, y + 16, K.GOLD, '#3a2a08', 9);\n      outlineText(ctx, e.title, KW / 2, y + 34, '#ffe066', '#3a2a08', 12);\n      label(ctx, e.text.slice(0, 52), KW / 2, y + 52, '#d8c8a0', 5);\n      label(ctx, e.text.slice(52, 104), KW / 2, y + 62, '#d8c8a0', 5);\n      label(ctx, 'Endings ' + (this.save.endings || []).length + '/' + ENDINGS.length + ' · Relics ' + (this.save.relics || []).length + '/' + RELICS.length, KW / 2, y + 80, K.SUB, 6);\n    } else if (!p.victory && p.cause) {\n      tile(ctx, 20, 322, KW - 40, 24, 8, { fill: '#241014', fillLo: '#140808', outline: K.RED, ring: K.RED, ringW: 1, lift: 2 });\n      label(ctx, 'DEFEATED BY: ' + String(p.cause).toUpperCase(), KW / 2, 338, '#ff7a6a', 7);\n    }\n    label(ctx, 'PURSE  ' + fmtNum(this.save.coins || 0) + ' COINS · ' + fmtNum(this.save.shards || 0) + ' SHARDS', KW / 2, 366, K.GOLD, 8);\n    for (const b of this._buttons()) {\n      const hov = this.hit(b);\n      button(ctx, b, b.label, { color: b.color, hover: hov, size: 8 });\n    }\n    drawToast(ctx, this.toast);\n  }\n}\n\nfunction fit(s, n) {\n  s = String(s);\n  return s.length > n ? s.slice(0, n - 1) + '…' : s;\n}\n\n// ====================================================================\n// PAUSE\n// ====================================================================\nexport class PauseScene extends Page {\n  enter(p) { super.enter(p); this.ctx2 = p.ctx; }\n  _goBack() { if (this.ctx2?.gameplay) this.engine.resumeScene(this.ctx2.gameplay); else this.engine.setScene('menu', { save: this.save }); }\n  _buttons() {\n    const w = 150, x = KW / 2 - w / 2;\n    return [\n      { label: 'RESUME', y: 150, x, w, h: 34, act: 'resume', color: K.GREEN },\n      { label: 'SETTINGS', y: 192, x, w, h: 34, act: 'settings', color: K.BLUE },\n      { label: 'END RUN', y: 234, x, w, h: 34, act: 'quit', color: K.RED },\n    ];\n  }\n  update(dt) {\n    const m = super.base(dt);\n    if (!m) return;\n    if (!this.grace(dt) && m.justDown) {\n      for (const b of this._buttons()) {\n        if (this.hit(b)) {\n          if (b.act === 'resume') this.engine.resumeScene(this.ctx2.gameplay);\n          else if (b.act === 'settings') this.engine.setScene('settings', { save: this.save, from: 'pause', ctx: this.ctx2 });\n          else this.engine.setScene('runSummary', {\n            save: this.save, realmId: this.ctx2?.gameplay?.realmId, stage: this.ctx2?.gameplay?.stage,\n            runStats: this.ctx2?.gameplay?.runStats, time: this.ctx2?.gameplay?.runTime,\n            sectorDuration: this.ctx2?.gameplay?.sectorDuration, victory: false,\n            coins: 0, level: this.ctx2?.gameplay?.player?.level, owned: this.ctx2?.gameplay?.owned,\n            dmgByWeapon: this.ctx2?.gameplay?.runStats?.dmgByWeapon, dmgOther: this.ctx2?.gameplay?.runStats?.dmgOther,\n            cause: 'RUN ENDED AT THE PAUSE SIGNAL',\n          });\n          m.justDown = false;\n          return;\n        }\n      }\n    }\n    if (!m.down) this._press = null;\n    m.justDown = false;\n  }\n  render(ctx) {\n    lavaBackground(ctx, this.t, this.embers);\n    tile(ctx, KW / 2 - 90, 100, 180, 200, 14, { fill: '#20182c', fillLo: '#140e1e', outline: K.INK, ring: K.GOLD, ringW: 2, lift: 5 });\n    outlineText(ctx, 'PAUSED', KW / 2, 130, '#ffffff', '#5a1a08', 16);\n    label(ctx, 'The void waits. The schedule doesn\\'t.', KW / 2, 148, K.SUB, 6);\n    for (const b of this._buttons()) {\n      const hov = this.hit(b);\n      button(ctx, b, b.label, { color: b.color, hover: hov, size: 9 });\n    }\n    drawToast(ctx, this.toast);\n  }\n}\n\n// ====================================================================\n// PROFILE — account + lifetime record\n// ====================================================================\nexport class ProfileScene extends Page {\n  enter(p) {\n    super.enter(p);\n    this.mode = 'main';\n    this.username = ''; this.password = ''; this.error = ''; this.success = '';\n    this.focus = 'username';\n    this.tab = 0;\n    this._setupKeys();\n  }\n  _setupKeys() {\n    if (this._keyHandler) window.removeEventListener('keydown', this._keyHandler);\n    this._keyHandler = (e) => {\n      if (this.engine.current !== this) return;\n      if (this.mode === 'main') return;\n      if (e.key === 'Backspace') {\n        if (this.focus === 'username') this.username = this.username.slice(0, -1);\n        else this.password = this.password.slice(0, -1);\n      } else if (e.key === 'Enter') {\n        this._submit();\n      } else if (e.key.length === 1 && /[a-zA-Z0-9_]/.test(e.key)) {\n        if (this.focus === 'username' && this.username.length < 16) this.username += e.key;\n        else if (this.focus === 'password' && this.password.length < 16) this.password += e.key;\n      }\n    };\n    window.addEventListener('keydown', this._keyHandler);\n  }\n  exit() { super.exit(); if (this._keyHandler) window.removeEventListener('keydown', this._keyHandler); }\n  _submit() {\n    if (this.mode === 'login') {\n      const res = AUTH.login(this.username, this.password);\n      if (res.ok) { this.success = 'Welcome back, ' + res.user.username; this.error = ''; this.mode = 'main'; try { SOUNDS.levelup(); } catch {} }\n      else this.error = res.error;\n    } else if (this.mode === 'register') {\n      const res = AUTH.register(this.username, this.password);\n      if (res.ok) { this.success = 'Account created — welcome, ' + res.user.username; this.error = ''; this.mode = 'main'; try { SOUNDS.levelup(); } catch {} }\n      else this.error = res.error;\n    } else if (this.mode === 'guestUpgrade') {\n      const res = AUTH.upgradeGuest(this.username, this.password);\n      if (res.ok) { this.success = 'Upgraded to ' + res.user.username; this.error = ''; this.mode = 'main'; }\n      else this.error = res.error;\n    }\n  }\n  update(dt) {\n    const m = super.base(dt);\n    if (!m) return;\n    if (!this.grace(dt) && m.justDown) {\n      const cur = AUTH.getCurrentUser();\n      const tabs = ['ACCOUNT', 'RECORD'];\n      for (let i = 0; i < 2; i++) { const r = { x: 8 + i * 127, y: 40, w: 127, h: 24 }; if (this.hit(r)) { this.tab = i; m.justDown = false; return; } }\n      if (this.tab === 0) {\n        if (this.mode === 'main') {\n          const rows = [];\n          if (!cur || cur.guest) rows.push({ y: 130, act: 'login', label: 'SIGN IN' });\n          if (!cur) rows.push({ y: 168, act: 'register', label: 'CREATE ACCOUNT' });\n          rows.push({ y: cur && !cur.guest ? 130 : 206, act: 'guest', label: cur ? 'NEW GUEST PROFILE' : 'PLAY AS GUEST' });\n          for (const r of rows) {\n            if (this.hit({ x: 8, y: r.y, w: KW - 16, h: 30 })) {\n              if (r.act === 'guest') { const res = AUTH.guestLogin(); this.save = this.engine.save; this.success = 'Guest profile: ' + res.user.username; this.error = ''; try { SOUNDS.pickup(); } catch {} }\n              else { this.mode = r.act; this.username = ''; this.password = ''; this.error = ''; }\n              m.justDown = false; return;\n            }\n          }\n          if (cur) {\n            const ly = (cur && !cur.guest ? 168 : 244);\n            if (this.hit({ x: 8, y: ly, w: KW - 16, h: 30 })) { AUTH.logout(); this.success = 'Signed out'; this.error = ''; m.justDown = false; return; }\n            if (cur.guest && this.hit({ x: 8, y: ly + 38, w: KW - 16, h: 30 })) { this.mode = 'guestUpgrade'; this.username = ''; this.password = ''; m.justDown = false; return; }\n          }\n        } else {\n          if (this.hit({ x: 8, y: 74, w: KW - 16, h: 32 })) this.focus = 'username';\n          if (this.hit({ x: 8, y: 114, w: KW - 16, h: 32 })) this.focus = 'password';\n          if (this.hit({ x: 8, y: 156, w: 122, h: 30 })) this._submit();\n          if (this.hit({ x: 140, y: 156, w: 122, h: 30 })) { this.mode = 'main'; this.error = ''; }\n          m.justDown = false; return;\n        }\n      }\n    }\n    if (!m.down) this._press = null;\n    m.justDown = false;\n  }\n  render(ctx) {\n    lavaBackground(ctx, this.t, this.embers);\n    topBar(ctx, { title: 'PROFILE', save: this.save, hover: null });\n    const cur = AUTH.getCurrentUser();\n    const tabs = ['ACCOUNT', 'RECORD'];\n    tabs.forEach((lb, i) => {\n      const r = { x: 8 + i * 127, y: 40, w: 127, h: 24 };\n      const active = this.tab === i;\n      tile(ctx, r.x, r.y, r.w, r.h, 8, { fill: active ? K.PANEL_ACT : '#241a2e', fillLo: K.PANEL_LO, outline: K.INK, ring: active ? K.GOLD : null, ringW: 2, lift: active ? 3 : 1 });\n      label(ctx, lb, r.x + r.w / 2, r.y + 16, active ? K.GOLD : K.SUB, 7);\n    });\n    if (this.tab === 1) {\n      const s = this.save.stats || {};\n      const rows = [\n        ['RUNS', String(s.totalRuns || 0)],\n        ['DEFEATS', fmtNum(s.totalKills || 0)],\n        ['LONGEST RUN', fmtTime(s.longestRun || 0)],\n        ['BEST SCORE', fmtNum(s.bestScore || 0)],\n        ['BEST COMBO', 'x' + (s.bestCombo || 0)],\n        ['BOSS CORES', String(Object.keys(this.save.bossCores || {}).length) + '/' + REALMS.length],\n        ['RELICS', (this.save.relics || []).length + '/' + RELICS.length],\n        ['ENDINGS', (this.save.endings || []).length + '/' + ENDINGS.length],\n      ];\n      rows.forEach(([k2, v], i) => {\n        const y = 76 + i * 40;\n        const appear = Math.max(0, Math.min(1, (this.pageT - 0.05 - i * 0.04) * 3.4));\n        if (appear <= 0) return;\n        ctx.globalAlpha = appear;\n        tile(ctx, 8, y, KW - 16, 34, 9, { fill: K.PANEL, fillLo: K.PANEL_LO, outline: K.INK, lift: 2 });\n        label(ctx, k2, 16, y + 15, K.DIM, 6, 'left');\n        label(ctx, v, 16, y + 27, K.TXT, 8, 'left');\n        ctx.globalAlpha = 1;\n      });\n    } else if (this.mode !== 'main') {\n      outlineText(ctx, this.mode === 'login' ? 'SIGN IN' : this.mode === 'register' ? 'CREATE ACCOUNT' : 'SAVE YOUR GUEST', KW / 2, 84, '#ffffff', '#5a1a08', 11);\n      const uf = this.focus === 'username';\n      tile(ctx, 8, 96, KW - 16, 32, 8, { fill: uf ? '#3a2a5a' : K.PANEL, fillLo: K.PANEL_LO, outline: uf ? K.GOLD : K.INK, lift: 2 });\n      label(ctx, 'NAME: ' + this.username + (uf ? '_' : ''), 16, 116, K.TXT, 8, 'left');\n      const pf = this.focus === 'password';\n      tile(ctx, 8, 136, KW - 16, 32, 8, { fill: pf ? '#3a2a5a' : K.PANEL, fillLo: K.PANEL_LO, outline: pf ? K.BLUE : K.INK, lift: 2 });\n      label(ctx, 'PASS: ' + '*'.repeat(this.password.length) + (pf ? '_' : ''), 16, 156, K.TXT, 8, 'left');\n      label(ctx, '3–16 characters · letters, numbers, _', 16, 180, K.DIM, 6, 'left');\n      button(ctx, { x: 8, y: 192, w: 122, h: 30 }, this.mode === 'login' ? 'SIGN IN' : 'CREATE', { color: K.GREEN, size: 8 });\n      button(ctx, { x: 140, y: 192, w: 122, h: 30 }, 'CANCEL', { color: '#4a3a52', size: 8 });\n      if (this.error) label(ctx, this.error, KW / 2, 240, K.BAD, 7);\n      if (this.success) label(ctx, this.success, KW / 2, 240, K.OK, 7);\n      label(ctx, 'No email needed — the account lives on this device.', KW / 2, KH - 12, K.DIM, 6);\n    } else {\n      tile(ctx, 8, 70, KW - 16, 52, 10, { fill: '#20182c', fillLo: '#140e1e', outline: K.INK, ring: cur ? (cur.guest ? '#9aa0b4' : K.GOLD) : '#3a2a4a', ringW: 2, lift: 3 });\n      if (cur) {\n        label(ctx, cur.username.toUpperCase(), 16, 88, K.TXT, 9, 'left');\n        label(ctx, (cur.title || 'Conductor') + ' · LEVEL ' + (cur.level || 1) + (cur.guest ? ' · GUEST' : ' · SAVED'), 16, 102, cur.guest ? '#9aa0b4' : K.BLUE, 6, 'left');\n        label(ctx, 'Runs ' + (this.save.stats?.totalRuns || 0) + ' · Coins ' + fmtNum(this.save.coins || 0), 16, 114, K.DIM, 6, 'left');\n      } else {\n        label(ctx, 'NO PROFILE ON THIS DEVICE', 16, 90, K.BAD, 8, 'left');\n        label(ctx, 'Create one, or hop aboard as a guest.', 16, 106, K.SUB, 6, 'left');\n      }\n      const rows = [];\n      if (!cur || cur.guest) rows.push({ y: 132, label: 'SIGN IN', color: K.BLUE, sub: 'Existing account' });\n      if (!cur) rows.push({ y: 170, label: 'CREATE ACCOUNT', color: K.GREEN, sub: 'Name + password, no email' });\n      rows.push({ y: cur ? (cur.guest ? 208 : 132) : 208, label: cur ? 'NEW GUEST PROFILE' : 'PLAY AS GUEST', color: '#9aa0b4', sub: 'Instant, upgrade any time' });\n      if (cur) rows.push({ y: cur.guest ? 246 : 170, label: 'SIGN OUT', color: K.RED, sub: 'Switch profile' });\n      if (cur?.guest) rows.push({ y: 284, label: 'SAVE GUEST AS ACCOUNT', color: K.GREEN, sub: 'Keep progress, add a password' });\n      rows.forEach((r, i) => {\n        const hov = this.hit({ x: 8, y: r.y, w: KW - 16, h: 30 });\n        const appear = Math.max(0, Math.min(1, (this.pageT - 0.1 - i * 0.05) * 3.4));\n        if (appear <= 0) return;\n        ctx.globalAlpha = appear;\n        tile(ctx, 8, r.y, KW - 16, 30, 8, { fill: hov ? '#3a2a5a' : K.PANEL, fillLo: K.PANEL_LO, outline: K.INK, ring: r.color, ringW: hov ? 2 : 1, lift: hov ? 3 : 2 });\n        label(ctx, r.label, 18, r.y + 13, r.color, 8, 'left');\n        label(ctx, r.sub, 18, r.y + 24, K.DIM, 6, 'left');\n        ctx.globalAlpha = 1;\n      });\n      if (this.success) label(ctx, this.success, KW / 2, KH - 26, K.OK, 7);\n      if (this.error) label(ctx, this.error, KW / 2, KH - 26, K.BAD, 7);\n    }\n    drawToast(ctx, this.toast);\n  }\n}\n","js/main.js":"// ============================================================\n// HELL TRAIN — main entry — AAA GOD LEVEL\n// ============================================================\nimport { Engine } from './core/engine.js';\nimport { Input } from './core/input.js';\nimport { CFG } from './core/config.js';\nimport { buildSpriteRegistry } from './data/sprites.js';\nimport { buildArt } from './data/art.js';\nimport { loadIcons } from './data/icons.js';\nimport { loadSave, ensureShape, saveSave } from './core/save.js';\nimport { SupabaseClient } from './systems/supabase.js';\nimport { AudioEngine } from './systems/audio.js';\nimport { AUTH } from './systems/auth.js';\n\nimport { GameplayScene } from './systems/gameplay.js';\nimport { ShopScene } from './ui/shop.js';\nimport { CoinShopScene } from './ui/coinshop.js';\nimport { HomeScene } from './ui/home.js';\nimport {\n  MenuScene, WorldMapScene, TrainBaseScene, RunSummaryScene, PauseScene,\n  AchievementsScene, LeaderboardScene, DailyRunScene, WeeklyChallengeScene,\n  SettingsScene, ArsenalScene, ArmouryScene, RelicsScene,\n  ProfileScene, DailyRewardsScene,\n} from './ui/menu.js';\n\nasync function boot() {\n  const root = document.getElementById('root');\n  const loading = document.getElementById('loading');\n  const setStatus = (msg) => {\n    try { const el = loading?.querySelector?.('.subtitle') || loading; if (el) el.textContent = msg; } catch {}\n  };\n  const setProgress = (pct) => {\n    try { const fill = loading?.querySelector?.('.bar-fill'); if (fill) { fill.style.animation = 'none'; fill.style.width = pct + '%'; } } catch {}\n  };\n\n  setStatus('FORGING AAA ASSETS...');\n  setProgress(10);\n  await new Promise(r => setTimeout(r, 16));\n  const t0 = performance.now();\n  const art = buildArt();\n  const legacy = buildSpriteRegistry();\n  for (const k of Object.keys(legacy)) if (!(k in art)) art[k] = legacy[k];\n  console.log('[HELL TRAIN AAA] art forged in ' + Math.round(performance.now() - t0) + ' ms — GOD LEVEL');\n  setStatus('COUPLING INFINITE CARRIAGES...');\n  setProgress(70);\n  try { await loadIcons(); } catch {}\n  setProgress(90);\n  setStatus('ALL ABOARD — AAA GOD LEVEL');\n  setProgress(100);\n  if (loading?.style) loading.style.display = 'none';\n\n  const engine = new Engine(root);\n  engine.sprites = art;\n  engine.input = new Input(engine.canvas);\n  engine.audio = new AudioEngine();\n  engine.supabase = new SupabaseClient();\n  engine._difficulty = 'normal';\n  engine.auth = AUTH;\n\n  // Ensure guest or current user\n  if (!AUTH.getCurrentUser()) {\n    AUTH.guestLogin();\n  }\n\n  let save = ensureShape(loadSave());\n  if (!save.playerId) {\n    save.playerId = 'p_' + Math.random().toString(36).slice(2, 10);\n    saveSave(save);\n  }\n  engine.save = save;\n\n  // Scenes — every page speaks the same UI language (ui/kit.js)\n  engine.addScene('menu', new HomeScene(engine));   // dashboard homescreen\n  engine.addScene('hub', new MenuScene(engine));    // \"MORE\" page with the rest\n  engine.addScene('menuClassic', new MenuScene(engine));\n  engine.addScene('worldmap', new WorldMapScene(engine));\n  engine.addScene('worldMap', new WorldMapScene(engine));\n  engine.addScene('gameplay', new GameplayScene(engine));\n  engine.addScene('trainbase', new TrainBaseScene(engine));\n  engine.addScene('trainBase', new TrainBaseScene(engine));\n  engine.addScene('runSummary', new RunSummaryScene(engine));\n  engine.addScene('pause', new PauseScene(engine));\n  engine.addScene('achievements', new AchievementsScene(engine));\n  engine.addScene('leaderboards', new LeaderboardScene(engine));\n  engine.addScene('leaderboard', new LeaderboardScene(engine));\n  engine.addScene('dailyRun', new DailyRunScene(engine));\n  engine.addScene('daily', new DailyRewardsScene(engine));\n  engine.addScene('rewards', new DailyRewardsScene(engine));\n  engine.addScene('weeklyChallenge', new WeeklyChallengeScene(engine));\n  engine.addScene('settings', new SettingsScene(engine));\n  engine.addScene('arsenal', new ArsenalScene(engine));\n  engine.addScene('armoury', new ArmouryScene(engine));\n  engine.addScene('relics', new RelicsScene(engine));\n  engine.addScene('shop', new ShopScene(engine));        // the Forge (permanent tracks + skins)\n  engine.addScene('coinShop', new CoinShopScene(engine)); // coin shop (fixed-price goods)\n  engine.addScene('profile', new ProfileScene(engine));\n\n  if (typeof globalThis !== 'undefined') globalThis.__ENGINE__ = engine;\n  engine.setScene('menu');\n  engine.start();\n\n  window.addEventListener('beforeunload', () => saveSave(engine.save));\n  setInterval(() => saveSave(engine.save), 10000);\n\n  const resume = () => {\n    engine.audio.resume();\n    document.removeEventListener('click', resume);\n    document.removeEventListener('keydown', resume);\n  };\n  document.addEventListener('click', resume);\n  document.addEventListener('keydown', resume);\n}\n\nboot().catch(err => {\n  console.error('Boot error:', err);\n  const root = document.getElementById('root');\n  root.innerHTML = '<div style=\"color:#ff5a33;font-family:monospace;padding:24px;max-width:720px\">'\n    + '<h2>HELL TRAIN AAA failed to load<\/h2>'\n    + '<p style=\"color:#c8b8d0\">Build v' + CFG.VERSION + ' (' + (CFG.BUILD || '') + '). God level.<\/p>'\n    + '<p><button onclick=\"location.replace(location.pathname + \\'?cb=\\' + Date.now())\"'\n    + ' style=\"font:14px monospace;padding:8px 14px;cursor:pointer\">Reload fresh<\/button><\/p>'\n    + '<pre style=\"white-space:pre-wrap;color:#8a7a9a\">' + (err?.stack || String(err)) + '<\/pre><\/div>';\n});\n","js/data/goals.js":"// ============================================================\n// HELL TRAIN — DAILY GOALS (v1.4)\n// Two fixed goals per day, chosen by the date. Progress counts up\n// during runs; the coin reward is always visible before claiming.\n// No randomness in the reward: the number on the tile is the number\n// you get.\n// ============================================================\n\nexport const GOAL_REWARD = 80;\n\nconst POOL = [\n  { key: 'kills', icon: 'skull', label: 'Defeat {n} foes today', ns: [60, 100, 150] },\n  { key: 'coins', icon: 'coin', label: 'Collect {n} coins today', ns: [120, 200, 300] },\n  { key: 'elites', icon: 'crown', label: 'Defeat {n} elite foes', ns: [3, 4, 6] },\n  { key: 'boss', icon: 'trophy', label: 'Defeat a boss', ns: [1, 1, 1] },\n];\n\nfunction seeded(seedStr) {\n  let h = 2166136261;\n  for (let i = 0; i < seedStr.length; i++) { h ^= seedStr.charCodeAt(i); h = Math.imul(h, 16777619); }\n  return () => {\n    h = Math.imul(h ^ (h >>> 15), 2246822507);\n    h = Math.imul(h ^ (h >>> 13), 3266489909);\n    return ((h ^= h >>> 16) >>> 0) / 4294967296;\n  };\n}\n\n// Two deterministic goals for a given date key (\"2026-08-29\").\nexport function todayGoals(dateKey) {\n  const rng = seeded('helltrain-goals-' + dateKey);\n  const a = Math.floor(rng() * POOL.length);\n  let b = Math.floor(rng() * POOL.length);\n  if (b === a) b = (b + 1) % POOL.length;\n  const pick = (idx) => {\n    const p = POOL[idx];\n    const n = p.ns[Math.floor(rng() * p.ns.length)];\n    return { key: p.key, icon: p.icon, label: p.label, n };\n  };\n  return [pick(a), pick(b)];\n}\n\nexport function goalProgressLabel(have, goal) {\n  return Math.round(Math.min(have, goal.n)) + '/' + goal.n + ' — keep riding';\n}\n\n// Called by gameplay whenever progress happens.\nexport function bumpGoal(save, key, n = 1) {\n  try {\n    const dg = save?.dailyGoals;\n    if (dg && dg.p && dg.p[key] !== undefined) dg.p[key] = (dg.p[key] || 0) + n;\n  } catch {}\n}\n","js/data/mastery.js":"// ============================================================\n// HELL TRAIN — WEAPON FAMILY MASTERY (v1.4)\n// A fixed, visible track per weapon family. Kills made with a\n// family count forever (saved), crossing fixed milestones:\n//   MASTERY I..V — each grants a small permanent damage bonus to\n//   that family, and the bonus feeds the level-5 EVOLUTION:\n//   an evolved weapon inherits every mastery bonus earned.\n// No randomness: the number you see is the number you get.\n// ============================================================\n\n// Kills needed for each milestone, and the damage bonus it grants.\nexport const MASTERY_STEPS = [40, 120, 260, 450, 700];\nexport const MASTERY_BONUS = [0.04, 0.08, 0.12, 0.17, 0.22];\n\nexport const FAMILY_INFO = {\n  fire: { name: 'Fire', color: '#ff7a33', icon: 'fire', blurb: 'Burns over time.' },\n  ice: { name: 'Frost', color: '#7ec8ff', icon: 'ice', blurb: 'Slows, then freezes.' },\n  void: { name: 'Void', color: '#9b6dff', icon: 'void', blurb: 'Implodes and unravels.' },\n  lightning: { name: 'Storm', color: '#fff066', icon: 'bolt', blurb: 'Arcs between foes.' },\n  explosive: { name: 'Blast', color: '#ff9033', icon: 'bomb', blurb: 'Area detonations.' },\n  plasma: { name: 'Plasma', color: '#2ff0ff', icon: 'gun', blurb: 'Rapid bursts.' },\n  tech: { name: 'Tech', color: '#c0c8e0', icon: 'rail', blurb: 'Pierce and ricochet.' },\n  orbital: { name: 'Orbit', color: '#d0d4e8', icon: 'blade', blurb: 'Blades that circle.' },\n  holy: { name: 'Light', color: '#ffe878', icon: 'star', blurb: 'Nova waves, heals.' },\n  toxic: { name: 'Plague', color: '#98e066', icon: 'toxic', blurb: 'Lingering pools.' },\n  blood: { name: 'Blood', color: '#ff3a4a', icon: 'blood', blurb: 'Drinks what it kills.' },\n  shadow: { name: 'Shadow', color: '#9c8ab8', icon: 'shadow', blurb: 'Passes through armour.' },\n  spirit: { name: 'Echo', color: '#a8d4f4', icon: 'echo', blurb: 'Your shots, repeated.' },\n  physical: { name: 'Force', color: '#d0d4e8', icon: 'crown', blurb: 'Raw impact.' },\n  turret: { name: 'Siege', color: '#ff9a4a', icon: 'turret', blurb: 'Holds the ground.' },\n  arcane: { name: 'Arcane', color: '#e08aff', icon: 'charge', blurb: 'Slow, heavy, piercing.' },\n  train: { name: 'Train', color: '#ffb040', icon: 'train', blurb: 'The iron horse.' },\n};\n\nexport function familyColor(f) { return FAMILY_INFO[f]?.color || '#ffb040'; }\nexport function familyIcon(f) { return FAMILY_INFO[f]?.icon || 'star'; }\nexport function familyName(f) { return FAMILY_INFO[f]?.name || 'Arcane'; }\n\n// Mastery level 0..5 from total kills.\nexport function masteryLevel(kills) {\n  let lvl = 0;\n  for (const s of MASTERY_STEPS) if ((kills || 0) >= s) lvl++;\n  return lvl;\n}\n\n// The next milestone, or null when the track is complete.\nexport function nextMilestone(kills) {\n  const lvl = masteryLevel(kills);\n  if (lvl >= MASTERY_STEPS.length) return null;\n  return { level: lvl + 1, need: MASTERY_STEPS[lvl], have: kills || 0 };\n}\n\n// Total damage multiplier this family earns from mastery (1.00 .. 1.63).\n// Applied to run damage; an evolved weapon keeps every step earned.\nexport function masteryMult(kills) {\n  let m = 1;\n  for (let i = 0; i < masteryLevel(kills); i++) m += MASTERY_BONUS[i];\n  return m;\n}\n\n// One-line status for cards: \"MASTERY II · 84/120\" or \"MASTERY V\".\nexport function masteryLabel(kills) {\n  const lvl = masteryLevel(kills);\n  if (lvl === 0) return 'MASTERY 0/5';\n  const next = nextMilestone(kills);\n  return next ? `MASTERY ${'12345'[lvl - 1]}→${'12345'[lvl]} · ${next.have}/${next.need}` : 'MASTERY V — COMPLETE';\n}\n","js/ui/kit.js":"// ============================================================\n// HELL TRAIN — SHARED UI KIT (v1.4)\n// One visual language for every menu page:\n//   · same top bar (back / title / purse)\n//   · same item card (icon · name · one-liner · status)\n//   · same list behaviour (wheel, arrows, scrollbar)\n//   · same tabs, buttons, toasts and page-open animation\n// Drawn straight to the 270x480 portrait canvas.\n// ============================================================\nimport { TAU, fmtNum } from '../core/utils.js';\n\nexport const KW = 270, KH = 480;\n\n// ---- one palette for every page ----\nexport const K = {\n  INK: '#241318',\n  PANEL: '#2b2230', PANEL_HI: '#3d3242', PANEL_LO: '#1d1622', PANEL_ACT: '#463252',\n  GOLD: '#ffc63c', GOLD_D: '#b06a12',\n  RED: '#e8352a', RED_D: '#7a1420',\n  GREEN: '#4ec53c', GREEN_D: '#2a6a1a',\n  BLUE: '#8ef0ff', LAV: '#c07aff', ORANGE: '#ff9033',\n  TXT: '#ffffff', SUB: '#cfc0dc', DIM: '#93839f', FAINT: '#655870',\n  OK: '#8ef07a', BAD: '#ff7a6a',\n};\n\nexport function roundPath(ctx, x, y, w, h, r) {\n  const rr = Math.max(0, Math.min(r, w / 2, h / 2));\n  ctx.beginPath();\n  ctx.moveTo(x + rr, y);\n  ctx.arcTo(x + w, y, x + w, y + h, rr);\n  ctx.arcTo(x + w, y + h, x, y + h, rr);\n  ctx.arcTo(x, y + h, x, y, rr);\n  ctx.arcTo(x, y, x + w, y, rr);\n  ctx.closePath();\n}\nexport function clipRound(ctx, x, y, w, h, r) { roundPath(ctx, x, y, w, h, r); ctx.clip(); }\n\n// A physical-feeling rounded tile: gradient body, ink outline, lift slab.\nexport function tile(ctx, x, y, w, h, r, o = {}) {\n  const lift = o.lift ?? 2;\n  if (lift > 0) {\n    roundPath(ctx, x, y + lift, w, h, r);\n    ctx.fillStyle = o.shadow || 'rgba(20,8,10,0.55)';\n    ctx.fill();\n  }\n  const g = ctx.createLinearGradient(0, y, 0, y + h);\n  g.addColorStop(0, o.fill || K.PANEL);\n  g.addColorStop(1, o.fill2 || o.fillLo || K.PANEL_LO);\n  roundPath(ctx, x, y, w, h, r);\n  ctx.fillStyle = g;\n  ctx.fill();\n  if (o.ring) { ctx.strokeStyle = o.ring; ctx.lineWidth = o.ringW || 2; ctx.stroke(); }\n  roundPath(ctx, x, y, w, h, r);\n  ctx.strokeStyle = o.outline || K.INK;\n  ctx.lineWidth = 2;\n  ctx.stroke();\n  ctx.save();\n  clipRound(ctx, x, y, w, h, r);\n  ctx.globalAlpha *= 0.14;\n  ctx.fillStyle = '#ffffff';\n  ctx.fillRect(x, y + 2, w, Math.max(2, h * 0.24));\n  ctx.restore();\n  ctx.lineWidth = 1;\n}\n\nexport function label(ctx, str, x, y, color, size, align = 'center') {\n  ctx.font = 'bold ' + size + 'px monospace';\n  ctx.textAlign = align;\n  ctx.fillStyle = 'rgba(20,8,12,0.75)';\n  ctx.fillText(str, x + 1, y + 1);\n  ctx.fillStyle = color;\n  ctx.fillText(str, x, y);\n  ctx.textAlign = 'left';\n}\n\nexport function outlineText(ctx, str, cx, y, color, ink, size) {\n  ctx.font = 'bold ' + size + 'px monospace';\n  ctx.textAlign = 'center';\n  ctx.fillStyle = ink;\n  const k = size > 15 ? 2 : 1;\n  for (let dx = -k; dx <= k; dx++) for (let dy = -k; dy <= k; dy++) if (dx || dy) ctx.fillText(str, cx + dx, y + dy);\n  ctx.fillText(str, cx, y + k + 1);\n  ctx.fillStyle = color;\n  ctx.fillText(str, cx, y);\n  ctx.textAlign = 'left';\n}\n\n// Truncate with an ellipsis so long names never overflow their card.\nexport function fitText(ctx, str, w, size, bold = true) {\n  ctx.font = (bold ? 'bold ' : '') + size + 'px monospace';\n  let s = String(str);\n  if (ctx.measureText(s).width <= w) return s;\n  while (s.length > 1 && ctx.measureText(s + '…').width > w) s = s.slice(0, -1);\n  return s + '…';\n}\n\nexport function easeOut(t) { t = Math.max(0, Math.min(1, t)); return 1 - Math.pow(1 - t, 3); }\n\n// Page-open fade+rise. `pageT` is seconds since the page opened.\nexport function pageAlpha(pageT) { return easeOut(pageT * 3.2); }\n\nexport function inRect(m, r) { return r && m.x >= r.x && m.x <= r.x + r.w && m.y >= r.y && m.y <= r.y + r.h; }\n\n// ============================================================\n// TOP BAR — the same furniture on every page:\n// [◀ BACK]  .... TITLE ....  [coins] [shards]\n// Returns the rects so the scene can route clicks.\n// ============================================================\nexport function topBar(ctx, o) {\n  const { title, save, hover } = o;\n  const back = { x: 6, y: 7, w: 52, h: 24 };\n  const coins = { x: KW - 116, y: 7, w: 52, h: 24 };\n  const shards = { x: KW - 60, y: 7, w: 54, h: 24 };\n\n  const hov = hover === 'back';\n  tile(ctx, back.x, back.y, back.w, back.h, 8, {\n    fill: hov ? K.PANEL_ACT : K.PANEL, fillLo: K.PANEL_LO,\n    ring: hov ? K.BLUE : null, ringW: 2, lift: hov ? 3 : 2,\n  });\n  label(ctx, '◀ BACK', back.x + back.w / 2, back.y + 16, hov ? K.BLUE : K.TXT, 8);\n\n  // title — shrink to fit the middle span\n  const midW = (coins.x - 10) - (back.x + back.w + 10);\n  let size = 13;\n  ctx.font = 'bold ' + size + 'px monospace';\n  while (size > 8 && ctx.measureText(title).width > midW) { size -= 1; ctx.font = 'bold ' + size + 'px monospace'; }\n  label(ctx, title, KW / 2, back.y + 17, K.GOLD, size);\n\n  purseChip(ctx, coins, 'coin', fmtNum(save?.coins || 0), K.GOLD, hover === 'coins');\n  purseChip(ctx, shards, 'shard', fmtNum(save?.shards || 0), K.BLUE, hover === 'shards');\n  return { back, coins, shards };\n}\n\nfunction purseChip(ctx, r, kind, value, color, hov) {\n  tile(ctx, r.x, r.y, r.w, r.h, 8, {\n    fill: hov ? '#3a2c4a' : '#241a2e', fillLo: '#150f1c',\n    ring: hov ? color : null, ringW: 1, lift: 2,\n  });\n  glyph(ctx, kind, r.x + 4, r.y + 5, 14, color);\n  label(ctx, value, r.x + 21, r.y + 16, K.TXT, value.length > 5 ? 7 : 8, 'left');\n}\n\n// ============================================================\n// ITEM CARD — the one list-row style used everywhere:\n// (icon) Name..............  [STATUS / cost]\n//        one short line\n// ============================================================\nexport function itemCard(ctx, o) {\n  const {\n    x, y, w, h = 44, icon: ic, iconColor = K.GOLD, name, desc = '',\n    right, rightColor = K.DIM, owned, equipped, locked, cost,\n    selected, pressed, hover, appear = 1, index = 0, accent, tag,\n  } = o;\n  const a = Math.max(0, Math.min(1, appear));\n  if (a <= 0.01) return;\n  const slide = (1 - easeOut(a)) * 26;\n  const lift = pressed ? 1 : hover || selected ? 3 : 2;\n  const yy = y + (pressed ? 2 : 0);\n  ctx.save();\n  ctx.globalAlpha = a;\n\n  const ac = accent || iconColor || K.GOLD;\n  tile(ctx, x + slide, yy, w, h, 10, {\n    fill: selected ? K.PANEL_ACT : hover ? '#342840' : K.PANEL,\n    fillLo: selected ? '#2b1e38' : K.PANEL_LO,\n    outline: K.INK,\n    ring: selected ? '#ffffff' : equipped ? K.GOLD : hover ? ac : null,\n    ringW: selected ? 2 : 1,\n    lift,\n  });\n  // accent spine + keyboard marker\n  ctx.fillStyle = locked ? '#3a3040' : ac;\n  ctx.globalAlpha = a * (locked ? 0.5 : 0.85);\n  ctx.fillRect(x + slide + 2, yy + 5, 3, h - 10);\n  ctx.globalAlpha = a;\n  if (selected) label(ctx, '▶', x + slide - 1, yy + h / 2 + 3, '#ffffff', 7);\n\n  // icon plate\n  tile(ctx, x + slide + 8, yy + (h - 30) / 2, 30, 30, 8, {\n    fill: 'rgba(0,0,0,0.35)', fillLo: 'rgba(0,0,0,0.5)',\n    outline: locked ? '#3a3040' : ac, lift: 0,\n  });\n  glyph(ctx, ic, x + slide + 12, yy + (h - 30) / 2 + 4, 22, locked ? K.FAINT : iconColor);\n\n  // name + one-liner\n  const nx = x + slide + 46;\n  const nw = w - 46 - (rightW(o) + 12);\n  label(ctx, fitText(ctx, name, nw, 8), nx, yy + 17, locked ? K.FAINT : (hover || selected) ? '#ffffff' : K.TXT, 8, 'left');\n  if (desc) label(ctx, fitText(ctx, desc, nw, 6), nx, yy + 30, locked ? '#54485e' : K.DIM, 6, 'left');\n  if (tag) {\n    ctx.fillStyle = 'rgba(142,240,255,0.14)';\n    const tw = ctx.measureText(tag).width + 8;\n    ctx.font = 'bold 5px monospace';\n    ctx.fillRect(nx + Math.min(nw, ctx.measureText(fitText(ctx, name, nw, 8)).width) + 4, yy + 10, tw, 8);\n    label(ctx, tag, nx + Math.min(nw, 90) + 8, yy + 16, K.BLUE, 5);\n  }\n\n  // right status pill\n  drawRight(ctx, o, x + slide + w, yy);\n  ctx.restore();\n}\n\nfunction rightW(o) {\n  if (o.cost !== undefined && !o.owned) return 46;\n  if (o.right) return Math.min(72, o.right.length * 5 + 14);\n  return 40;\n}\nfunction drawRight(ctx, o, rx, y) {\n  const { owned, equipped, locked, cost, right, rightColor } = o;\n  const h = 18;\n  const cy = y + 13;\n  let txt, col, fill, line;\n  if (equipped) { txt = 'EQUIPPED'; col = K.GOLD; fill = 'rgba(255,198,60,0.12)'; line = K.GOLD_D; }\n  else if (owned) { txt = 'OWNED'; col = K.OK; fill = 'rgba(78,197,60,0.10)'; line = K.GREEN_D; }\n  else if (locked) { txt = 'LOCKED'; col = K.BAD; fill = 'rgba(232,53,42,0.10)'; line = '#5a1a16'; }\n  else if (cost !== undefined) { txt = null; col = K.GOLD; fill = 'rgba(255,198,60,0.08)'; line = K.GOLD_D; }\n  else { txt = right || ''; col = rightColor || K.DIM; fill = 'rgba(0,0,0,0.3)'; line = '#3a2e44'; }\n\n  const w = txt === null ? 46 : Math.max(30, (txt.length * 4.6) + 12);\n  const x = rx - w - 8;\n  roundPath(ctx, x, cy, w, h, 7);\n  ctx.fillStyle = fill; ctx.fill();\n  ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.stroke();\n  if (txt === null) {\n    glyph(ctx, 'coin', x + 4, cy + 3, 12, K.GOLD);\n    label(ctx, String(cost), x + 18, cy + 13, (o.costOk === false) ? K.BAD : K.GOLD, 8, 'left');\n  } else {\n    label(ctx, txt, x + w / 2, cy + 13, col, 7);\n  }\n}\n\n// ============================================================\n// TABS\n// ============================================================\nexport function drawTabs(ctx, tabs, activeIdx, y = 40, hoverIdx = -1) {\n  const n = tabs.length;\n  const gap = 4;\n  const w = Math.floor((KW - 16 - gap * (n - 1)) / n);\n  const rects = [];\n  tabs.forEach((t, i) => {\n    const x = 8 + i * (w + gap);\n    rects.push({ x, y, w, h: 24, id: t.id ?? i });\n    const active = i === activeIdx;\n    const hov = i === hoverIdx;\n    tile(ctx, x, y, w, 24, 8, {\n      fill: active ? K.PANEL_ACT : hov ? '#342840' : K.PANEL,\n      fillLo: K.PANEL_LO,\n      ring: active ? K.GOLD : null, ringW: 2, lift: active ? 3 : 1,\n    });\n    label(ctx, t.label, x + w / 2, y + 16, active ? K.GOLD : hov ? '#ffffff' : K.SUB, active ? 8 : 7);\n  });\n  return rects;\n}\n\n// ============================================================\n// BUTTON — tall, chunky, obvious\n// ============================================================\nexport function button(ctx, r, txt, o = {}) {\n  const { color = K.GOLD, hover, pressed, disabled, size = 9, sub } = o;\n  const y = r.y + (pressed ? 2 : 0);\n  const fill = disabled ? '#3a303e' : hover ? shade(color, 0.18) : color;\n  tile(ctx, r.x, y, r.w, r.h, Math.min(12, r.h / 2), {\n    fill, fillLo: disabled ? '#241c26' : shade(color, -0.55),\n    outline: K.INK, ring: hover && !disabled ? '#ffffff' : null, ringW: 2,\n    lift: disabled ? 1 : pressed ? 1 : 4,\n  });\n  const ty = y + (sub ? r.h / 2 + 1 : r.h / 2 + 3);\n  label(ctx, txt, r.x + r.w / 2, ty, disabled ? K.FAINT : '#ffffff', size);\n  if (sub) label(ctx, sub, r.x + r.w / 2, y + r.h / 2 + 13, disabled ? K.FAINT : 'rgba(255,255,255,0.75)', 6);\ (function () {
  var payload = JSON.parse(document.getElementById('hell-train-payload').textContent);
  window.__ICON_DATA = payload.icons;

  var built = {};
  var SPEC = /((?:from|import)\s*\(?\s*)(['"])(\.[^'"]+)\2/g;

  function dirname(p) { var i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i); }
  function resolve(base, spec) {
    var parts = (dirname(base) + '/' + spec).split('/');
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var s = parts[i];
      if (!s || s === '.') continue;
      if (s === '..') out.pop(); else out.push(s);
    }
    return out.join('/');
  }

  function build(file) {
    if (built[file]) return built[file];
    var code = payload.sources[file];
    if (code === undefined) throw new Error('missing module: ' + file);
    code = code.replace(SPEC, function (m, head, q, spec) {
      return head + JSON.stringify(build(resolve(file, spec)));
    });
    var url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
    built[file] = url;
    return url;
  }

  try {
    import(build('js/main.js')).catch(fail);
  } catch (e) { fail(e); }

  function fail(err) {
