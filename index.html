me: 'The Null Point', desc: 'A permanent singularity orbits you.' },\n    ],\n  }),\n  W({\n    id: 'holy_nova', name: 'Requiem Nova', family: 'holy', color: '#ffe878', sprite: null,\n    slot: 'aura', icon: 'nova',\n    desc: 'Detonates a ring of consecrated light around you.',\n    cd: 3.0, dmg: 28, radius: 84, behavior: 'nova', heal: 4,\n    curve: (l) => ({ cd: Math.max(1.2, 3.0 - l * 0.12), dmg: 28 + l * 7, radius: 84 + l * 4, heal: 4 + l }),\n    evolutions: [\n      { id: 'judgement_day', requires: ['eclipse_core'], name: 'Judgement Day', desc: 'Novas leave pillars of light.' },\n    ],\n  }),\n  W({\n    id: 'void_step', name: 'Void Step', family: 'void', color: '#9b6dff', sprite: null,\n    slot: 'special', icon: 'step',\n    desc: 'Blink through space, leaving a detonating afterimage.',\n    cd: 4.0, dmg: 30, explode: true, explodeRadius: 34, behavior: 'teleport',\n    curve: (l) => ({ cd: Math.max(2.0, 4.0 - l * 0.1), dmg: 30 + l * 8, explodeRadius: 34 + l * 3 }),\n    evolutions: [\n      { id: 'phantom_shift', requires: ['shadow_core'], name: 'Phantom Shift', desc: 'Leaves attacking clones at both ends.' },\n    ],\n  }),\n];\n\n// ------------------------------------------------------------------\n// ABILITIES (Space bar)\n// ------------------------------------------------------------------\nexport const ABILITIES = [\n  { id: 'dodge', name: 'Phase Dodge', family: 'survival', color: '#7ec8ff',\n    desc: 'Short invulnerable dash with an afterimage trail.', cd: 2.6, dur: 0.28, dist: 120 },\n  { id: 'blast', name: 'Hellfire Blast', family: 'fire', color: '#ff7a33',\n    desc: 'Knockback shockwave that ignites everything nearby.', cd: 6.0, radius: 96, dmg: 34 },\n  { id: 'magnet', name: 'Soul Magnet', family: 'survival', color: '#9b6dff',\n    desc: 'Rips all loot on screen toward you.', cd: 13.0, dur: 4.0, radius: 240 },\n  { id: 'overclock', name: 'Overclock', family: 'tech', color: '#2ff0ff',\n    desc: 'Triple fire rate for 4 seconds.', cd: 18.0, dur: 4.0 },\n  { id: 'bulwark', name: 'Bulwark', family: 'survival', color: '#ffe066',\n    desc: 'Absorb shield equal to 40% max HP.', cd: 16.0, dur: 6.0 },\n];\n\n// ------------------------------------------------------------------\n// CORES — combine with a weapon to evolve it\n// ------------------------------------------------------------------\nexport const CORES = [\n  { id: 'explosion_core', name: 'Explosion Core', desc: 'Everything you do detonates.', color: '#ff7a33' },\n  { id: 'eclipse_core', name: 'Eclipse Core', desc: 'Bends orbits and light.', color: '#985ce0' },\n  { id: 'ice_core', name: 'Ice Core', desc: 'Absolute cold.', color: '#7ec8ff' },\n  { id: 'shadow_core', name: 'Shadow Core', desc: 'Borrowed darkness.', color: '#6a5a90' },\n  { id: 'hellstorm_core', name: 'Hellstorm Core', desc: 'The sky falls on command.', color: '#ff4d26' },\n  { id: 'thunder_core', name: 'Thunder Core', desc: 'Stored sky-rage.', color: '#fff066' },\n  { id: 'meteor_core', name: 'Meteor Core', desc: 'A fragment of something that fell.', color: '#ff9033' },\n  { id: 'void_core', name: 'Void Core', desc: 'A hole that is also a battery.', color: '#bc84f4' },\n  { id: 'blood_core', name: 'Blood Core', desc: 'It beats when you kill.', color: '#ff3a4a' },\n];\n\n// ---- fold in the extended arsenal (bombers / blasters / beams / summons) ----\n// These come from js/data/weapons_extended.js via the bridge, which converts\n// their data-only definitions into behaviours the engine can actually fire.\nfor (const xw of EXTENDED_WEAPONS) {\n  if (!WEAPONS.some(w => w.id === xw.id)) WEAPONS.push(xw);\n}\n\nexport function findWeapon(id) { return WEAPONS.find(w => w.id === id); }\nexport function findAbility(id) { return ABILITIES.find(w => w.id === id); }\nexport function findCore(id) { return CORES.find(w => w.id === id); }\n\nexport function findEvolution(weaponId, otherId) {\n  const w = findWeapon(weaponId);\n  if (!w?.evolutions) return null;\n  for (const evo of w.evolutions) if (evo.requires.includes(otherId)) return evo;\n  return null;\n}\n\n// Weapons that can be offered as level-up picks\nexport const OFFERABLE_WEAPONS = WEAPONS.map(w => w.id);\n","js/entities/player.js":"// ============================================================\n// HELL TRAIN — The Conductor (player entity)\n// Animation state machine + the whole weapon dispatch.\n// ============================================================\nimport { WEAPONS, ABILITIES, findWeapon } from '../data/weapons.js';\nimport { rand, clamp, dist, TAU } from '../core/utils.js';\n\nconst DIRS = ['down', 'up', 'side'];\n\nexport class Player {\n  constructor(x, y, art, save) {\n    this.x = x; this.y = y; this.vx = 0; this.vy = 0;\n    this.radius = 7;\n    this.facing = 'down'; this.flip = false;\n    this.art = art;\n    this.skinId = save?.charSkin || 'conductor';\n    this.set = art.getCharSet(this.skinId);\n    this.state = 'idle'; this.animT = 0; this.frame = 0;\n    this.alive = true; this.invuln = 0; this.hitT = 0; this.deathT = 0;\n\n    // --- base stats ---\n    this.maxHp = 120; this.hp = 120;\n    this.armour = 0;\n    this.atkDmg = 1; this.atkSpd = 1; this.moveSpd = 1;\n    this.crit = 0.06; this.critDmg = 1.6;\n    this.cdr = 1;\n    this.pickupRange = 68;\n    this.regen = 0; this.dodge = 0; this.lifesteal = 0;\n    this.burnDmg = 0; this.burnDur = 0;\n    this.chill = 0; this.chain = 0;\n    this.pierceBonus = 0; this.extraProjectiles = 0;\n    this.projSpeedMult = 1;\n    this.shield = 0; this.shieldAmount = 0; this.shieldTimer = undefined;\n    this.knockback = 0; this.thorns = 0;\n    this.coinMult = 1; this._xpGain = 1;\n    this.execute = false; this.executeMult = 1;\n    this.eclipse = false; this.eclipseMax = 0;\n    this.momentum = 0; this.momentumStacks = 0;\n    this.frenzy = 0; this.frenzyStacks = 0; this.frenzyT = 0;\n    this.revive = 0; this.luck = 0;\n    this.doubleCast = 0; this.corpseBoom = 0;\n    this.killHeal = 0; this.killTrainEnergy = 0;\n    this.apocalypse = false; this.apocalypseBurn = 0;\n    this.omegaRound = 0; this._shotCount = 0;\n    this.hellsplit = 0; this.extinction = 0; this._extinctionT = 20;\n    this.freeRerolls = 0; this.startLevelBonus = 0;\n    this.aoeMult = 1; this.autoInvuln = null; this.autoDodge = null; this.screenWipe = 0;\n\n    // --- progression ---\n    this.xp = 0; this.level = 1; this.score = 0; this.kills = 0;\n    this.combo = 0; this.comboT = 0; this.bestCombo = 0;\n\n    // --- loadout ---\n    this.weapons = []; this.weaponStates = {};\n    this.orbitals = []; this.drones = [];\n    this.abilities = []; this.abilityStates = {};\n    this.addAbility('dodge');\n    this.t = 0;\n    this._tempest = 0;\n  }\n\n  setSkin(id) {\n    this.skinId = id;\n    this.set = this.art.getCharSet(id);\n  }\n\n  // ---------- loadout ----------\n  hasWeapon(id) { return this.weapons.some(w => w.id === id); }\n  addWeapon(id) {\n    if (this.hasWeapon(id)) { this.upgradeWeapon(id); return; }\n    const base = findWeapon(id);\n    if (!base) return;\n    const w = { ...base };\n    this.weapons.push(w);\n    this.weaponStates[id] = { cd: 0, level: 1, burst: 0, burstT: 0 };\n    if (w.behavior === 'orbital') this._syncOrbitals(w);\n    if (w.behavior === 'drones') this._syncDrones(w);\n  }\n  upgradeWeapon(id) {\n    const w = this.weapons.find(x => x.id === id);\n    if (!w) return;\n    const s = this.weaponStates[id];\n    s.level += 1;\n    if (w.curve) Object.assign(w, w.curve(s.level));\n    if (w.behavior === 'orbital') this._syncOrbitals(w);\n    if (w.behavior === 'drones') this._syncDrones(w);\n  }\n  weaponLevel(id) { return this.weaponStates[id]?.level || 0; }\n  addAbility(id) {\n    if (this.abilities.some(a => a.id === id)) return;\n    const a = ABILITIES.find(x => x.id === id);\n    if (!a) return;\n    this.abilities.push({ ...a });\n    this.abilityStates[id] = { cd: 0 };\n  }\n  modMult(key, mult) {\n    if (key === 'atkDmg') this.atkDmg *= mult;\n    else if (key === 'atkSpd') this.atkSpd *= mult;\n    else if (key === 'moveSpd') this.moveSpd *= mult;\n    else if (key === 'critDmg') this.critDmg *= mult;\n    else if (key === 'cdr') this.cdr *= mult;\n    else if (key === 'pickupRange') this.pickupRange *= mult;\n    else if (key === 'xpGain') this._xpGain *= mult;\n  }\n\n  _syncOrbitals(w) {\n    const want = (w.baseCount || 2) + (this.apocalypse ? 2 : 0);\n    this.orbitals = [];\n    for (let i = 0; i < want; i++) {\n      this.orbitals.push({ ang: (i / want) * TAU, r: w.baseRadius, spd: w.baseSpeed,\n        dmg: w.dmg, size: w.baseSize || 7, weapon: w.id, color: w.color, hitCd: {} });\n    }\n  }\n  _syncDrones(w) {\n    const want = w.droneCount || 2;\n    while (this.drones.length < want) {\n      this.drones.push({ ang: Math.random() * TAU, r: 26 + Math.random() * 10, cd: 0,\n        x: this.x, y: this.y, weapon: w.id });\n    }\n    this.drones.length = want;\n  }\n\n  // ---------- progression ----------\n  xpNeeded() { return Math.floor(9 + this.level * 5 + Math.pow(this.level, 1.42)); }\n  gainXp(amount) {\n    this.xp += amount * this._xpGain;\n    let levels = 0;\n    while (this.xp >= this.xpNeeded() && levels < 40) {\n      this.xp -= this.xpNeeded();\n      this.level += 1; levels++;\n      this.onLevelUp?.();\n    }\n  }\n  addCombo() {\n    this.combo += 1; this.comboT = 3.0;\n    if (this.combo > this.bestCombo) this.bestCombo = this.combo;\n  }\n  get comboMult() { return 1 + Math.min(0.5, this.combo * 0.01); }\n\n  // ---------- damage ----------\n  takeDamage(dmg, ctx, src) {\n    if (this.invuln > 0 || !this.alive) return 0;\n    if (this.dodge > 0 && Math.random() < this.dodge) {\n      ctx?.fx.damageText(this.x, this.y - 16, 'DODGE', '#8ef0ff', { size: 7 });\n      return 0;\n    }\n    let dealt = Math.max(1, dmg - this.armour);\n    if (this.shield > 0) {\n      const abs = Math.min(this.shield, dealt);\n      this.shield -= abs; dealt -= abs;\n      ctx?.fx.ring(this.x, this.y, 18, '#ffe066', 0.2);\n    }\n    this.hp -= dealt;\n    this.hitT = 0.16;\n    this.combo = 0;\n    if (this.thorns && src && src.takeDamage) src.takeDamage(this.thorns, { family: 'physical' });\n    if (this.hp <= 0) {\n      if (this.revive > 0) {\n        this.revive -= 1; this.hp = this.maxHp * 0.6; this.invuln = 2.2;\n        ctx?.onRevive?.(this);\n        return dealt;\n      }\n      if (this.undying && !this.undyingActive) {\n        this.undyingActive = true; this.undyingT = 4; this.hp = 1; this.invuln = 0.6;\n        ctx?.fx.banner(this.x, this.y - 30, 'UNDYING', '#ff4d6a');\n        return dealt;\n      }\n      this.alive = false; this.deathT = 1.4;\n    } else {\n      this.invuln = 0.45;\n    }\n    return dealt;\n  }\n  heal(amount) {\n    const before = this.hp;\n    this.hp = Math.min(this.maxHp, this.hp + amount);\n    const over = amount - (this.hp - before);\n    if (over > 0 && this.overheal) this.shield = Math.min(this.maxHp, this.shield + over * this.overheal);\n  }\n\n  // ---------- update ----------\n  update(dt, ctx) {\n    this.t += dt;\n    if (this.invuln > 0) this.invuln -= dt;\n    if (this.hitT > 0) this.hitT -= dt;\n    if (this.comboT > 0) { this.comboT -= dt; if (this.comboT <= 0) this.combo = 0; }\n    if (this.regen) this.heal(this.regen * dt);\n    if (this.apocalypseBurn) {\n      this.hp -= this.maxHp * this.apocalypseBurn * dt;\n      if (this.hp <= 1) this.hp = 1;\n    }\n    // periodic invulnerability window (tiered card: 'Temporal Bulwark')\n    if (this.autoInvuln) {\n      this.autoInvuln.t -= dt;\n      if (this.autoInvuln.t <= 0) {\n        this.autoInvuln.t = this.autoInvuln.cd;\n        this.invuln = Math.max(this.invuln, this.autoInvuln.dur);\n        ctx?.fx?.ring(this.x, this.y, 22, '#8ef0ff', 0.4, 3);\n        ctx?.fx?.banner?.(this.x, this.y - 26, 'PHASED', '#8ef0ff');\n      }\n    }\n    // automatic dodge pulse (tiered card)\n    if (this.autoDodge) {\n      this.autoDodge.t -= dt;\n      if (this.autoDodge.t <= 0) {\n        this.autoDodge.t = this.autoDodge.every;\n        this.invuln = Math.max(this.invuln, 0.5);\n        ctx?.fx?.afterimage?.(this.currentFrame(), this.x, this.y, 1, this.flip, '#8ef0ff', 0.3);\n      }\n    }\n    if (this.undyingActive) {\n      this.undyingT -= dt;\n      if (this.undyingT <= 0) { this.alive = false; this.deathT = 1.4; }\n    }\n    if (this.shieldAmount > 0) {\n      this.shieldTimer = (this.shieldTimer ?? 8) - dt;\n      if (this.shieldTimer <= 0) {\n        this.shieldTimer = 8;\n        this.shield = Math.min(this.maxHp, this.shield + this.shieldAmount);\n        ctx.fx.ring(this.x, this.y, 22, '#ffe066', 0.35);\n      }\n    }\n    if (this.frenzyT > 0) { this.frenzyT -= dt; if (this.frenzyT <= 0) this.frenzyStacks = 0; }\n    // momentum\n    const speed = Math.hypot(this.vx, this.vy);\n    if (this.momentum) {\n      if (speed > 20) this.momentumStacks = Math.min(1, this.momentumStacks + dt * 0.6);\n      else this.momentumStacks = Math.max(0, this.momentumStacks - dt * 1.6);\n    }\n    // tempest crown\n    if (this.tempest) {\n      this._tempest -= dt;\n      if (this._tempest <= 0) {\n        this._tempest = 0.6;\n        const e = ctx.findNearestEnemy(this.x, this.y, 180);\n        if (e) {\n          ctx.fx.lightning(this.x, this.y - 40, e.x, e.y, '#fff066');\n          ctx.dealDamage(e, 30 * this.atkDmg, { family: 'lightning' });\n        }\n      }\n    }\n    // extinction event\n    if (this.extinction) {\n      this._extinctionT -= dt;\n      if (this._extinctionT <= 0) {\n        this._extinctionT = 20;\n        ctx.extinctionEvent(this.extinction);\n      }\n    }\n\n    // --- animation state ---\n    let st = 'idle';\n    if (!this.alive) st = 'death';\n    else if (this.dashT > 0) st = 'dash';\n    else if (this.hitT > 0) st = 'hurt';\n    else if (this.atkT > 0) st = 'attack';\n    else if (speed > 12) st = 'run';\n    if (st !== this.state) { this.state = st; this.animT = 0; this.frame = 0; }\n    if (this.atkT > 0) this.atkT -= dt;\n    if (this.dashT > 0) this.dashT -= dt;\n    const fps = st === 'run' ? 14 : st === 'attack' ? 16 : st === 'death' ? 7 : 6;\n    this.animT += dt * fps;\n    const frames = this.set[this.dirKey()][st] || this.set[this.dirKey()].idle;\n    if (st === 'death') this.frame = Math.min(frames.length - 1, Math.floor(this.animT));\n    else this.frame = Math.floor(this.animT) % frames.length;\n    if (!this.alive) this.deathT -= dt;\n\n    // orbitals\n    for (const o of this.orbitals) {\n      o.ang += o.spd * dt * (this.apocalypse ? 1.6 : 1);\n      o.x = this.x + Math.cos(o.ang) * o.r;\n      o.y = this.y + Math.sin(o.ang) * o.r;\n      for (const e of ctx.enemiesInRange(o.x, o.y, o.size + 6)) {\n        const key = e._id;\n        if ((o.hitCd[key] || 0) > this.t) continue;\n        o.hitCd[key] = this.t + 0.32;\n        ctx.dealDamage(e, o.dmg * this.atkDmg, { family: 'orbital', x: o.x, y: o.y, small: true });\n        ctx.fx.sparks(o.x, o.y, o.color, 3, o.ang + Math.PI / 2);\n      }\n    }\n    // drones\n    const droneW = this.weapons.find(w => w.behavior === 'drones');\n    if (droneW) {\n      for (let i = 0; i < this.drones.length; i++) {\n        const d = this.drones[i];\n        d.ang += dt * 1.4;\n        const tx = this.x + Math.cos(d.ang + i) * (30 + i * 5);\n        const ty = this.y + Math.sin(d.ang + i) * (22 + i * 4) - 14;\n        d.x += (tx - d.x) * Math.min(1, dt * 6);\n        d.y += (ty - d.y) * Math.min(1, dt * 6);\n        d.cd -= dt * this.cdr;\n        if (d.cd <= 0) {\n          const e = ctx.findNearestEnemy(d.x, d.y, droneW.droneRange || 130);\n          if (e) {\n            d.cd = droneW.droneCd;\n            const a = Math.atan2(e.y - d.y, e.x - d.x);\n            ctx.spawnProjectile({\n              x: d.x, y: d.y, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260,\n              life: 1.0, dmg: droneW.dmg * this.atkDmg, pierce: 1, color: droneW.color,\n              sprite: 'orbPlasma', owner: 'player', size: 3, family: 'plasma',\n            });\n            ctx.fx.sparks(d.x, d.y, droneW.color, 2, a);\n          }\n        }\n      }\n    }\n  }\n\n  dirKey() { return this.facing === 'left' || this.facing === 'right' ? 'side' : this.facing; }\n  currentFrame() {\n    const dir = this.dirKey();\n    const frames = this.set[dir][this.state] || this.set[dir].idle;\n    return frames[Math.min(this.frame, frames.length - 1)];\n  }\n\n  // ---------- damage helpers ----------\n  rollDamage(base, target) {\n    let dmg = base * this.atkDmg * this.comboMult;\n    if (this.momentum) dmg *= 1 + this.momentum * this.momentumStacks;\n    if (this.eclipse) dmg *= 1 + this.eclipseMax * (1 - this.hp / this.maxHp);\n    if (this.execute && target && target.hp < target.maxHp * 0.3) dmg *= this.executeMult;\n    const crit = Math.random() < this.crit;\n    if (crit) dmg *= this.critDmg;\n    return { dmg, crit };\n  }\n  get fireRateMult() {\n    let m = this.atkSpd * this.cdr;\n    if (this.frenzy) m *= 1 + this.frenzy * this.frenzyStacks;\n    return m;\n  }\n  onKill(ctx, enemy) {\n    this.kills += 1;\n    this.addCombo();\n    if (this.frenzy) { this.frenzyStacks = Math.min(40, this.frenzyStacks + 1); this.frenzyT = 4; }\n    if (this.killHeal) this.heal(this.killHeal);\n    if (this.killTrainEnergy && ctx.train) ctx.train.energy = Math.min(ctx.train.maxEnergy, ctx.train.energy + this.killTrainEnergy);\n    if (this.invulnOnKill) this.invuln = Math.max(this.invuln, this.invulnOnKill);\n  }\n\n  // ==================================================================\n  // AUTO ATTACK — one dispatch per weapon behaviour\n  // ==================================================================\n  autoAttack(dt, ctx) {\n    if (!this.alive) return;\n    const enemy = ctx.findNearestEnemy(this.x, this.y, 260);\n    for (const w of this.weapons) {\n      const s = this.weaponStates[w.id];\n      if (w.behavior === 'orbital' || w.behavior === 'drones') continue;\n      // burst continuation\n      if (s.burst > 0) {\n        s.burstT -= dt;\n        if (s.burstT <= 0) {\n          s.burst -= 1; s.burstT = w.burstDelay || 0.07;\n          this._fireProjectiles(ctx, w, enemy, 1);\n        }\n        continue;\n      }\n      s.cd -= dt * this.fireRateMult;\n      if (s.cd > 0) continue;\n      if (!enemy && !['nova', 'aura', 'pool', 'bomber'].includes(w.behavior)) continue;\n      s.cd = w.cd;\n      const casts = 1 + (Math.random() < this.doubleCast ? 1 : 0);\n      for (let c = 0; c < casts; c++) this._cast(ctx, w, s, enemy);\n    }\n  }\n\n  _cast(ctx, w, s, enemy) {\n    const B = w.behavior;\n    this.atkT = 0.18;\n    if (enemy) {\n      const ang = Math.atan2(enemy.y - this.y, enemy.x - this.x);\n      if (Math.abs(Math.cos(ang)) > 0.55) { this.facing = Math.cos(ang) < 0 ? 'left' : 'right'; this.flip = Math.cos(ang) < 0; }\n    }\n    switch (B) {\n      case 'fireball': case 'projectile': case 'shotgun': case 'lob':\n        this._fireProjectiles(ctx, w, enemy, w.projCount || 1); break;\n      case 'burst':\n        s.burst = (w.burstCount || 3) - 1; s.burstT = w.burstDelay || 0.07;\n        this._fireProjectiles(ctx, w, enemy, 1); break;\n      case 'frost':\n        this._fireProjectiles(ctx, w, enemy, w.projCount || 1, { slow: w.slow, slowDur: w.slowDur }); break;\n      case 'homing':\n        this._fireProjectiles(ctx, w, enemy, w.projCount || 1, { homing: w.turnRate || 5, sprite: 'missile' }); break;\n      case 'bounce':\n        this._fireProjectiles(ctx, w, enemy, w.projCount || 1, { bounces: w.bounces || 4, spin: 12 }); break;\n      case 'boomerang':\n        this._fireProjectiles(ctx, w, enemy, w.projCount || 1, { boomerang: true }); break;\n      case 'rail': this._rail(ctx, w, enemy); break;\n      case 'bomber': this._bomber(ctx, w); break;\n      case 'lightning': this._chain(ctx, w, enemy); break;\n      case 'cone': this._cone(ctx, w, enemy); break;\n      case 'aura': this._aura(ctx, w); break;\n      case 'nova': this._nova(ctx, w); break;\n      case 'pool': this._pool(ctx, w, enemy); break;\n      case 'blackhole': this._blackhole(ctx, w, enemy); break;\n      case 'meteor': {\n        const t = enemy || ctx.findNearestEnemy(this.x, this.y, 420);\n        if (t) ctx.spawnMeteor(t.x, t.y, w.dmg * this.atkDmg, w.explodeRadius);\n        break;\n      }\n      case 'teleport': this._blink(ctx, w); break;\n      default: this._fireProjectiles(ctx, w, enemy, w.projCount || 1);\n    }\n  }\n\n  _fireProjectiles(ctx, w, enemy, count, extra = {}) {\n    count = (count || 1) + (this.extraProjectiles || 0);\n    const spread = w.spread ?? 0.14;\n    const baseAng = enemy ? Math.atan2(enemy.y - this.y, enemy.x - this.x) : rand(0, TAU);\n    const speed = (w.speed || 220) * this.projSpeedMult;\n    for (let i = 0; i < count; i++) {\n      const ang = baseAng + (i - (count - 1) / 2) * spread + (w.behavior === 'shotgun' ? rand(-0.06, 0.06) : 0);\n      this._shotCount++;\n      const omega = this.omegaRound && this._shotCount % this.omegaRound === 0;\n      const dmg = w.dmg * (omega ? 5 : 1);\n      ctx.spawnProjectile({\n        x: this.x, y: this.y - 4,\n        vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,\n        life: w.projLife || 1.6, dmg, pierce: (w.pierce || 0) + this.pierceBonus,\n        explode: w.explode || omega, explodeRadius: (w.explodeRadius || 26) * (omega ? 2.4 : 1) * (this.aoeMult || 1),\n        color: omega ? '#ff2a2a' : w.color, sprite: extra.sprite || w.sprite,\n        behavior: w.behavior === 'lob' ? 'lob' : 'projectile',\n        owner: 'player', size: (w.projSize || 5) * (omega ? 2 : 1), family: w.family,\n        knockback: w.knockback || this.knockback, weaponId: w.id, omega,\n        lifesteal: w.lifesteal || 0, angle: ang, ...extra,\n      });\n    }\n    ctx.fx.sparks(this.x + Math.cos(baseAng) * 8, this.y - 4 + Math.sin(baseAng) * 8, w.color || '#ffb040', 4, baseAng, 0.4, 120);\n    ctx.fx.flash(this.x + Math.cos(baseAng) * 10, this.y - 4 + Math.sin(baseAng) * 10, w.color || '#ffb040', 0.07, 10);\n  }\n\n  _rail(ctx, w, enemy) {\n    const ang = enemy ? Math.atan2(enemy.y - this.y, enemy.x - this.x) : rand(0, TAU);\n    const len = 420;\n    const ex = this.x + Math.cos(ang) * len, ey = this.y + Math.sin(ang) * len;\n    ctx.fx.beam(this.x, this.y - 4, ex, ey, w.color, 7, 0.28);\n    ctx.fx.shakeScreen(4, 0.15);\n    ctx.camera?.punch(0.03);\n    const hits = [];\n    for (const e of ctx.enemies) {\n      if (!e.alive) continue;\n      const t = ((e.x - this.x) * Math.cos(ang) + (e.y - this.y) * Math.sin(ang));\n      if (t < 0 || t > len) continue;\n      const px = this.x + Math.cos(ang) * t, py = this.y + Math.sin(ang) * t;\n      if (dist(px, py, e.x, e.y) < e.radius + 8) hits.push(e);\n    }\n    for (const e of hits) ctx.dealDamage(e, w.dmg * this.atkDmg, { family: 'tech' });\n    ctx.fx.burst(this.x, this.y - 4, '#ffffff', 10, { spd: 90, life: 0.25, ang, cone: 0.4 });\n  }\n\n  _bomber(ctx, w) {\n    const n = w.projCount || 2;\n    for (let i = 0; i < n; i++) {\n      const a = rand(0, TAU), r = rand(20, 70);\n      ctx.spawnBomb(this.x + Math.cos(a) * r, this.y + Math.sin(a) * r, {\n        dmg: w.dmg * this.atkDmg, radius: w.explodeRadius, fuse: 0.8 + Math.random() * 0.4,\n        cluster: w.cluster || 0, color: w.color, family: 'explosive',\n      });\n    }\n  }\n\n  _chain(ctx, w, enemy) {\n    const start = enemy || ctx.findNearestEnemy(this.x, this.y, 320);\n    if (!start) return;\n    let jumps = (w.jumps || 3) + (this.chainMaster ? 2 : 0);\n    const range = this.chainMaster ? 260 : 150;\n    let last = { x: this.x, y: this.y - 6 };\n    const hit = new Set();\n    for (let j = 0; j < jumps; j++) {\n      const targets = ctx.enemiesInRange(last.x, last.y, range).filter(e => !hit.has(e._id));\n      if (!targets.length) break;\n      targets.sort((a, b) => dist(last.x, last.y, a.x, a.y) - dist(last.x, last.y, b.x, b.y));\n      const t = targets[0];\n      hit.add(t._id);\n      ctx.fx.lightning(last.x, last.y, t.x, t.y, w.color);\n      ctx.dealDamage(t, w.dmg * this.atkDmg * (1 - j * 0.05), { family: 'lightning' });\n      last = { x: t.x, y: t.y };\n    }\n  }\n\n  _cone(ctx, w, enemy) {\n    const ang = enemy ? Math.atan2(enemy.y - this.y, enemy.x - this.x) : rand(0, TAU);\n    const arc = w.arc || 0.7, range = w.range || 80;\n    ctx.spawnFlame(this.x, this.y - 4, ang, range, w.dmg * this.atkDmg);\n    for (const e of ctx.enemiesInRange(this.x, this.y, range)) {\n      const a = Math.atan2(e.y - this.y, e.x - this.x);\n      let d = Math.abs(((a - ang + Math.PI * 3) % TAU) - Math.PI);\n      if (d < arc) ctx.dealDamage(e, w.dmg * this.atkDmg, { family: 'fire', small: true, burn: w.burn });\n    }\n  }\n\n  _aura(ctx, w) {\n    const r = w.radius || 60;\n    ctx.fx.ring(this.x, this.y, r, w.color, 0.25, 2);\n    for (const e of ctx.enemiesInRange(this.x, this.y, r)) {\n      ctx.dealDamage(e, w.dmg * this.atkDmg, { family: 'lightning', small: true });\n      if (Math.random() < 0.4) ctx.fx.lightning(this.x, this.y, e.x, e.y, w.color, 4, 0.1);\n    }\n  }\n\n  _nova(ctx, w) {\n    const r = w.radius || 80;\n    ctx.fx.shockwave(this.x, this.y, r, w.color);\n    ctx.fx.explosion(this.x, this.y, 'explHoly', r / 34, { light: 1, lightColor: w.color });\n    ctx.camera?.punch(0.02);\n    for (const e of ctx.enemiesInRange(this.x, this.y, r)) {\n      ctx.dealDamage(e, w.dmg * this.atkDmg, { family: 'holy' });\n    }\n    if (w.heal) this.heal(w.heal);\n  }\n\n  _pool(ctx, w, enemy) {\n    const tx = enemy ? enemy.x : this.x, ty = enemy ? enemy.y : this.y;\n    ctx.spawnPool(tx, ty, {\n      radius: w.poolRadius || 26, dmg: w.dmg * this.atkDmg, life: w.projLife || 4,\n      color: w.color, family: 'toxic',\n    });\n  }\n\n  _blackhole(ctx, w, enemy) {\n    const tx = enemy ? enemy.x : this.x + rand(-40, 40);\n    const ty = enemy ? enemy.y : this.y + rand(-40, 40);\n    ctx.spawnBlackhole(tx, ty, { radius: w.radius, dmg: w.dmg * this.atkDmg, life: w.projLife || 3, color: w.color });\n  }\n\n  _blink(ctx, w) {\n    const ang = rand(0, TAU), d = rand(80, 150);\n    const nx = this.x + Math.cos(ang) * d, ny = this.y + Math.sin(ang) * d;\n    ctx.fx.afterimage(this.currentFrame(), this.x, this.y, 1, this.flip, w.color, 0.4);\n    ctx.fx.explosion(this.x, this.y, 'explVoid', 0.7, { lightColor: w.color });\n    for (const e of ctx.enemiesInRange(this.x, this.y, w.explodeRadius)) ctx.dealDamage(e, w.dmg * this.atkDmg, { family: 'void' });\n    if (!ctx.world.isSolidWorld(nx, ny)) { this.x = nx; this.y = ny; }\n    ctx.fx.explosion(this.x, this.y, 'explVoid', 0.7, { lightColor: w.color });\n    for (const e of ctx.enemiesInRange(this.x, this.y, w.explodeRadius)) ctx.dealDamage(e, w.dmg * this.atkDmg, { family: 'void' });\n  }\n}\n","js/entities/enemy.js":"// ============================================================\n// HELL TRAIN — Enemy entities\n// ============================================================\nimport { uid, rand, randInt, clamp, dist, TAU } from '../core/utils.js';\nimport { findEnemy } from '../data/enemies.js';\n\nexport class Enemy {\n  constructor(def, x, y, realmId, difficulty) {\n    Object.assign(this, JSON.parse(JSON.stringify(def)));\n    this.x = x; this.y = y; this.vx = 0; this.vy = 0;\n    this.maxHp = this.hp * (difficulty.enemyHp || 1);\n    this.hp = this.maxHp;\n    this.dmg = this.dmg * (difficulty.enemyDmg || 1);\n    this.radius = this.radius || 7;\n    this.alive = true;\n    this.realmId = realmId;\n    this.colorMod = 0;\n    this.scale = 1;\n    this.giant = false;\n    this.regen = 0;\n    this.animT = Math.random() * 3; this.frame = 0;\n    this.kbx = 0; this.kby = 0;\n    this.freezeT = 0; this.chill = 0; this.chillT = 0;\n    this.touchCd = 0; this.spawnT = 0.25;\n    this.attackCd = 0;\n    this.summonCd = this.summon?.cd || 0;\n    this.summonedCount = 0;\n    this.teleportCd = 0;\n    this.aiT = Math.random() * 2;\n    this.burnDmg = 0; this.burnT = 0; this.slow = 0; this.slowT = 0;\n    this.shield = 0;\n    this.voidTouched = false;\n    this.flashT = 0;\n    this.deathT = 0;\n    // Realm tint of sprite\n    this.tint = realmId;\n  }\n\n  applyMod(mod) {\n    mod.apply(this);\n  }\n\n  update(dt, ctx) {\n    if (!this.alive) {\n      this.deathT -= dt;\n      return;\n    }\n    this.animT += dt * (6 + this.spd * 0.04);\n    this.frame = Math.floor(this.animT) % 6;\n    if (this.flashT > 0) this.flashT -= dt;\n    if (this.spawnT > 0) this.spawnT -= dt;\n    if (this.touchCd > 0) this.touchCd -= dt;\n    if (this.chillT > 0) { this.chillT -= dt; if (this.chillT <= 0) this.chill = 0; }\n    // knockback impulse\n    if (this.kbx || this.kby) {\n      this.x += this.kbx * dt; this.y += this.kby * dt;\n      const damp = Math.pow(0.0009, dt);\n      this.kbx *= damp; this.kby *= damp;\n      if (Math.abs(this.kbx) < 2) this.kbx = 0;\n      if (Math.abs(this.kby) < 2) this.kby = 0;\n    }\n    // frozen solid: no acting at all\n    if (this.freezeT > 0) {\n      this.freezeT -= dt;\n      this.vx = 0; this.vy = 0;\n      if (Math.random() < 0.15) ctx.fx.spawn({ x: this.x + (Math.random() - 0.5) * 10, y: this.y - 6,\n        vx: 0, vy: 12, color: '#a8d4f4', life: 0.4, size: 1.2 });\n      return;\n    }\n    if (this.burnT > 0) {\n      this.burnT -= dt;\n      this.hp -= this.burnDmg * dt;\n      if (Math.random() < 0.22) ctx.fx.fire(this.x + (Math.random() - 0.5) * 6, this.y - 4, '#ff7a33');\n      if (this.hp <= 0) {\n        this.hp = 0; this.alive = false; this.deathT = 0.55;\n        ctx.onEnemyDeath?.(this);\n      }\n    }\n    if (this.slowT > 0) this.slowT -= dt;\n    if (this.regen) this.hp = Math.min(this.maxHp, this.hp + this.regen * dt);\n    if (this.teleportCd !== undefined) {\n      this.teleportCd -= dt;\n      if (this.teleportCd <= 0) {\n        this.teleportCd = 4 + Math.random() * 2;\n        const ang = Math.random() * TAU;\n        const r = 30 + Math.random() * 50;\n        this.x += Math.cos(ang) * r;\n        this.y += Math.sin(ang) * r;\n        ctx.fx.flash(this.x, this.y, '#985ce0', 0.15);\n      }\n    }\n\n    const player = ctx.player;\n    const px = player.x, py = player.y;\n    const d = dist(this.x, this.y, px, py);\n    const spdMul = (this.slowT > 0 ? (1 - this.slow) : 1) * (1 - (this.chill || 0));\n    const speed = this.spd * spdMul;\n\n    // AI behaviors\n    if (this.ai === 'chase' || this.ai === 'tank' || this.ai === 'swarm' || this.ai === 'split') {\n      if (d > 1) {\n        const ang = Math.atan2(py - this.y, px - this.x);\n        this.vx = Math.cos(ang) * speed;\n        this.vy = Math.sin(ang) * speed;\n      } else {\n        this.vx = 0; this.vy = 0;\n      }\n    } else if (this.ai === 'ranged') {\n      if (d > 130) {\n        const ang = Math.atan2(py - this.y, px - this.x);\n        this.vx = Math.cos(ang) * speed;\n        this.vy = Math.sin(ang) * speed;\n      } else if (d < 70) {\n        const ang = Math.atan2(py - this.y, px - this.x);\n        this.vx = -Math.cos(ang) * speed * 0.5;\n        this.vy = -Math.sin(ang) * speed * 0.5;\n      } else { this.vx = 0; this.vy = 0; }\n      // attack\n      this.attackCd -= dt;\n      if (this.attackCd <= 0 && d < 220) {\n        this.attackCd = this.proj?.cd || 1.5;\n        const ang = Math.atan2(py - this.y, px - this.x);\n        ctx.spawnProjectile({\n          x: this.x, y: this.y, vx: Math.cos(ang) * (this.proj?.spd || 160),\n          vy: Math.sin(ang) * (this.proj?.spd || 160), life: 1.6, dmg: this.proj?.dmg || 8,\n          color: this.proj?.id === 'fire_bolt' ? '#ff5a33' : '#9b6dff', owner: 'enemy',\n          size: 4, family: this.proj?.id === 'fire_bolt' ? 'fire' : 'void',\n        });\n      }\n    } else if (this.ai === 'summoner') {\n      if (d > 160) {\n        const ang = Math.atan2(py - this.y, px - this.x);\n        this.vx = Math.cos(ang) * speed;\n        this.vy = Math.sin(ang) * speed;\n      } else { this.vx = 0; this.vy = 0; }\n      this.summonCd -= dt;\n      if (this.summonCd <= 0 && this.summonedCount < (this.summon?.max || 4)) {\n        this.summonCd = this.summon?.cd || 4;\n        this.summonedCount += this.summon?.count || 2;\n        for (let i = 0; i < (this.summon?.count || 2); i++) {\n          const ang = Math.random() * TAU;\n          ctx.spawnEnemy(this.summon.id, this.x + Math.cos(ang) * 18, this.y + Math.sin(ang) * 18);\n        }\n      }\n    } else if (this.ai === 'burrower') {\n      // stand still and emerge for a while, then burrow\n      if (this.aiT > 0) { this.aiT -= dt; if (this.aiT <= 0) this.aiT = -3 - Math.random() * 2; }\n      else { this.aiT += dt; if (this.aiT >= 0) this.aiT = 3 + Math.random() * 2; }\n      if (this.aiT > 0) {\n        if (d > 1) {\n          const ang = Math.atan2(py - this.y, px - this.x);\n          this.vx = Math.cos(ang) * speed;\n          this.vy = Math.sin(ang) * speed;\n        } else { this.vx = 0; this.vy = 0; }\n      } else {\n        this.vx = 0; this.vy = 0;\n      }\n    } else if (this.ai === 'shield') {\n      // Move and block projectiles\n      if (d > 1) {\n        const ang = Math.atan2(py - this.y, px - this.x);\n        this.vx = Math.cos(ang) * speed * 0.5;\n        this.vy = Math.sin(ang) * speed * 0.5;\n      } else { this.vx = 0; this.vy = 0; }\n    } else if (this.ai === 'fly') {\n      // tries to fly above obstacles; ignore walls slightly\n      if (d > 1) {\n        const ang = Math.atan2(py - this.y, px - this.x);\n        this.vx = Math.cos(ang) * speed;\n        this.vy = Math.sin(ang) * speed;\n      } else { this.vx = 0; this.vy = 0; }\n    } else { // fallback\n      if (d > 1) {\n        const ang = Math.atan2(py - this.y, px - this.x);\n        this.vx = Math.cos(ang) * speed;\n        this.vy = Math.sin(ang) * speed;\n      }\n    }\n\n    // Move with collision (skip walls if flying)\n    if (this.ai !== 'fly') {\n      const ax = this.x + this.vx * dt;\n      const ay = this.y + this.vy * dt;\n      if (!ctx.world.isSolidWorld(ax + Math.sign(this.vx) * this.radius, this.y)) this.x = ax;\n      if (!ctx.world.isSolidWorld(this.x, ay + Math.sign(this.vy) * this.radius)) this.y = ay;\n    } else {\n      this.x += this.vx * dt;\n      this.y += this.vy * dt;\n    }\n\n    // Contact damage (burst on touch, then a short cooldown — much better feel\n    // than continuous chip damage)\n    if (d < this.radius + player.radius && this.touchCd <= 0) {\n      this.touchCd = 0.6;\n      const t = player.takeDamage(this.dmg, ctx, this);\n      if (t > 0) ctx.onPlayerHit(t, '#ff3a3a');\n      const a = Math.atan2(player.y - this.y, player.x - this.x);\n      this.kbx = -Math.cos(a) * 90; this.kby = -Math.sin(a) * 90;\n    }\n  }\n\n  takeDamage(amount, opts = {}) {\n    if (!this.alive) return 0;\n    let dmg = amount;\n    if (this.shield > 0) {\n      const absorbed = Math.min(this.shield, dmg);\n      this.shield -= absorbed; dmg -= absorbed;\n    }\n    if (opts.burn && !this.voidTouched) {\n      this.burnDmg = Math.max(this.burnDmg || 0, opts.burn);\n      this.burnT = Math.max(this.burnT || 0, opts.burnDur || 3);\n    }\n    if (opts.slow) {\n      this.slow = Math.max(this.slow || 0, opts.slow);\n      this.slowT = Math.max(this.slowT || 0, opts.slowDur || 2);\n    }\n    if (opts.chill) { this.chill = Math.max(this.chill, opts.chill); this.chillT = 2.5; }\n    if (opts.freeze) this.freezeT = Math.max(this.freezeT, opts.freeze);\n    if (opts.knockback) {\n      const a = opts.angle ?? Math.atan2(this.y - (opts.y ?? this.y), this.x - (opts.x ?? this.x));\n      const scale = this.giant ? 0.35 : 1;\n      this.kbx += Math.cos(a) * opts.knockback * scale;\n      this.kby += Math.sin(a) * opts.knockback * scale;\n    }\n    this.hp -= dmg;\n    this.flashT = 0.1;\n    this.hitScale = 1;\n    if (this.hp <= 0) { this.alive = false; this.deathT = 0.55; }\n    return dmg;\n  }\n\n  spriteName(sprites) {\n    const base = this.sprite || 'ghost';\n    // Realm tint\n    const tintMap = {\n      infernal: 'infernal', frozen: 'ice', forest: 'forest',\n      desert: 'ash', void: 'void', forgotten: 'purple',\n      purgatory: 'blue', terminus: 'pink', phantom: 'void',\n    };\n    const realm = tintMap[this.realmId] || 'blue';\n    let name = base + '_' + realm;\n    if (!sprites[name]) name = base;\n    if (this.giant) {\n      const gname = base + 'Giant';\n      if (sprites[gname]) name = gname;\n    }\n    return name;\n  }\n}\n\n// Factory\nexport function makeEnemy(id, x, y, realmId, difficulty) {\n  const def = findEnemy(id);\n  if (!def) return null;\n  return new Enemy(def, x, y, realmId, difficulty);\n}\n","js/entities/projectile.js":"// ============================================================\n// HELL TRAIN — projectiles, bombs, pools, singularities, meteors\n// ============================================================\nimport { uid, TAU, dist, rand } from '../core/utils.js';\n\nexport class Projectile {\n  constructor(o) {\n    Object.assign(this, o);\n    this.alive = true;\n    this.t = 0;\n    this.size = o.size || 4;\n    this.pierceLeft = o.pierce || 0;\n    this.bouncesLeft = o.bounces || 0;\n    this.hitIds = new Set();\n    this.spin = o.spin || 0;\n    this.rot = 0;\n    this.vy0 = this.vy;\n    this._id = uid();\n  }\n  update(dt, ctx) {\n    if (!this.alive) return;\n    this.t += dt;\n    const life = this.life || 1.6;\n    if (this.t > life) { this._expire(ctx); return; }\n    this.rot += this.spin * dt;\n\n    // --- steering ---\n    if (this.homing) {\n      const target = ctx.findNearestEnemy(this.x, this.y, 220);\n      if (target) {\n        const want = Math.atan2(target.y - this.y, target.x - this.x);\n        const cur = Math.atan2(this.vy, this.vx);\n        let d = ((want - cur + Math.PI * 3) % TAU) - Math.PI;\n        const na = cur + Math.max(-this.homing * dt, Math.min(this.homing * dt, d));\n        const sp = Math.hypot(this.vx, this.vy);\n        this.vx = Math.cos(na) * sp; this.vy = Math.sin(na) * sp;\n        this.angle = na;\n      }\n    }\n    if (this.boomerang) {\n      const k = this.t / life;\n      if (k > 0.45) {\n        const owner = ctx.player;\n        const a = Math.atan2(owner.y - this.y, owner.x - this.x);\n        const sp = Math.hypot(this.vx, this.vy) || 200;\n        this.vx += Math.cos(a) * sp * dt * 4;\n        this.vy += Math.sin(a) * sp * dt * 4;\n        const s2 = Math.hypot(this.vx, this.vy);\n        if (s2 > sp * 1.4) { this.vx *= sp * 1.4 / s2; this.vy *= sp * 1.4 / s2; }\n        if (dist(this.x, this.y, owner.x, owner.y) < 12 && k > 0.6) { this.alive = false; return; }\n        this.hitIds.clear();\n      }\n    }\n    if (this.behavior === 'lob') this.vy += 90 * dt;\n\n    this.x += this.vx * dt;\n    this.y += this.vy * dt;\n\n    // --- trail ---\n    if (Math.random() < 0.75) {\n      ctx.fx.spawn({\n        x: this.x + rand(-1, 1), y: this.y + rand(-1, 1),\n        vx: -this.vx * 0.08, vy: -this.vy * 0.08,\n        color: this.color, life: this.omega ? 0.45 : 0.22, size: this.omega ? 3 : 1.6,\n        endSize: 0.3, drag: 0.85, light: this.omega ? 0.5 : 0.12,\n      });\n    }\n\n    // --- collisions ---\n    if (this.owner === 'enemy') {\n      const p = ctx.player;\n      if (p.alive && dist(this.x, this.y, p.x, p.y) < this.size + p.radius) {\n        const dealt = p.takeDamage(this.dmg, ctx, null);\n        if (dealt > 0) ctx.onPlayerHit(dealt, this.color);\n        this.alive = false;\n        ctx.fx.burst(this.x, this.y, this.color, 6, { spd: 70, life: 0.25 });\n      }\n      if (ctx.train && dist(this.x, this.y, ctx.train.x, ctx.train.y) < this.size + ctx.train.radius) {\n        ctx.train.takeDamage(this.dmg, ctx);\n        this.alive = false;\n      }\n    } else {\n      for (const e of ctx.enemies) {\n        if (!e.alive || this.hitIds.has(e._id)) continue;\n        if (dist(this.x, this.y, e.x, e.y) > this.size + e.radius) continue;\n        this.hitIds.add(e._id);\n        ctx.dealDamage(e, this.dmg, {\n          family: this.family, x: this.x, y: this.y, knockback: this.knockback,\n          slow: this.slow, slowDur: this.slowDur, burn: this.burn,\n          angle: Math.atan2(this.vy, this.vx), lifesteal: this.lifesteal,\n        });\n        if (this.explode) {\n          ctx.spawnExplosion(this.x, this.y, this.explodeRadius, this.dmg * 0.7, this.family);\n          this.alive = false; return;\n        }\n        if (ctx.player.hellsplit && !this.isSplit) this._split(ctx);\n        if (this.pierceLeft <= 0) { this.alive = false; return; }\n        this.pierceLeft -= 1;\n      }\n      if (ctx.boss && ctx.boss.alive && !this.hitIds.has('boss') &&\n          dist(this.x, this.y, ctx.boss.x, ctx.boss.y) < this.size + ctx.boss.radius) {\n        this.hitIds.add('boss');\n        ctx.dealDamage(ctx.boss, this.dmg, { family: this.family, x: this.x, y: this.y, boss: true });\n        if (this.explode) { ctx.spawnExplosion(this.x, this.y, this.explodeRadius, this.dmg * 0.7, this.family); this.alive = false; return; }\n        if (this.pierceLeft <= 0) { this.alive = false; return; }\n        this.pierceLeft -= 1;\n      }\n    }\n\n    // --- walls ---\n    if (ctx.world.isSolidWorld(this.x, this.y)) {\n      if (this.bouncesLeft > 0) {\n        this.bouncesLeft -= 1;\n        // reflect on whichever axis is blocked\n        if (ctx.world.isSolidWorld(this.x + Math.sign(this.vx) * 4, this.y)) this.vx *= -1;\n        else this.vy *= -1;\n        this.hitIds.clear();\n        ctx.fx.sparks(this.x, this.y, this.color, 4, Math.atan2(this.vy, this.vx));\n      } else {\n        this._expire(ctx);\n      }\n    }\n  }\n  _split(ctx) {\n    const n = ctx.player.hellsplit;\n    for (let i = 0; i < n; i++) {\n      const a = rand(0, TAU);\n      ctx.spawnProjectile({\n        x: this.x, y: this.y, vx: Math.cos(a) * 190, vy: Math.sin(a) * 190,\n        life: 0.7, dmg: this.dmg * 0.5, pierce: 0, color: this.color, sprite: this.sprite,\n        owner: 'player', size: Math.max(2, this.size * 0.6), family: this.family, isSplit: true,\n      });\n    }\n  }\n  _expire(ctx) {\n    this.alive = false;\n    if (this.explode) ctx.spawnExplosion(this.x, this.y, this.explodeRadius, this.dmg * 0.7, this.family);\n  }\n}\n\nexport class Bomb {\n  constructor(x, y, o) {\n    this.x = x; this.y = y; Object.assign(this, o);\n    this.t = 0; this.alive = true; this._id = uid();\n    this.fuse = o.fuse || 1.0;\n    this.vy = -60; this.vx = rand(-20, 20);\n  }\n  update(dt, ctx) {\n    this.t += dt;\n    this.vy += 260 * dt;\n    this.x += this.vx * dt; this.y += this.vy * dt;\n    if (this.y > this._ground || this.t > 0.35) { this.vy *= this.vy > 0 ? -0.25 : 1; this._ground = this.y; }\n    if (Math.random() < 0.3) ctx.fx.spawn({ x: this.x, y: this.y - 3, vx: 0, vy: -18, color: '#ffb040', life: 0.3, size: 1.4, light: 0.2 });\n    if (this.t >= this.fuse) {\n      this.alive = false;\n      ctx.spawnExplosion(this.x, this.y, this.radius, this.dmg, this.family || 'explosive');\n      for (let i = 0; i < (this.cluster || 0); i++) {\n        const a = (i / this.cluster) * TAU;\n        ctx.spawnBomb(this.x + Math.cos(a) * 22, this.y + Math.sin(a) * 22, {\n          dmg: this.dmg * 0.45, radius: this.radius * 0.6, fuse: 0.45, cluster: 0,\n          color: this.color, family: this.family,\n        });\n      }\n    }\n  }\n}\n\nexport class Pool {\n  constructor(x, y, o) {\n    this.x = x; this.y = y; Object.assign(this, o);\n    this.t = 0; this.alive = true; this.tick = 0; this._id = uid();\n  }\n  update(dt, ctx) {\n    this.t += dt;\n    if (this.t > this.life) { this.alive = false; return; }\n    this.tick -= dt;\n    if (this.tick <= 0) {\n      this.tick = 0.4;\n      for (const e of ctx.enemiesInRange(this.x, this.y, this.radius)) {\n        ctx.dealDamage(e, this.dmg, { family: this.family, small: true });\n      }\n    }\n    if (Math.random() < 0.5) {\n      const a = rand(0, TAU), r = Math.random() * this.radius;\n      ctx.fx.spawn({ x: this.x + Math.cos(a) * r, y: this.y + Math.sin(a) * r, vx: 0, vy: -12,\n        color: this.color, life: 0.6, size: 1.6, light: 0.1 });\n    }\n  }\n}\n\nexport class BlackHole {\n  constructor(x, y, o) {\n    this.x = x; this.y = y; Object.assign(this, o);\n    this.t = 0; this.alive = true; this.tick = 0; this._id = uid();\n  }\n  update(dt, ctx) {\n    this.t += dt;\n    if (this.t > this.life) {\n      this.alive = false;\n      ctx.spawnExplosion(this.x, this.y, this.radius * 0.8, this.dmg * 4, 'void');\n      return;\n    }\n    for (const e of ctx.enemiesInRange(this.x, this.y, this.radius)) {\n      const a = Math.atan2(this.y - e.y, this.x - e.x);\n      const d = dist(this.x, this.y, e.x, e.y);\n      const pull = (1 - d / this.radius) * 160;\n      e.x += Math.cos(a) * pull * dt; e.y += Math.sin(a) * pull * dt;\n    }\n    this.tick -= dt;\n    if (this.tick <= 0) {\n      this.tick = 0.25;\n      for (const e of ctx.enemiesInRange(this.x, this.y, this.radius * 0.55)) {\n        ctx.dealDamage(e, this.dmg, { family: 'void', small: true });\n      }\n    }\n    for (let i = 0; i < 2; i++) {\n      const a = rand(0, TAU), r = this.radius * rand(0.5, 1);\n      ctx.fx.spawn({ x: this.x + Math.cos(a) * r, y: this.y + Math.sin(a) * r,\n        vx: -Math.cos(a) * 90, vy: -Math.sin(a) * 90, color: this.color, life: 0.5, size: 1.6, light: 0.2 });\n    }\n  }\n}\n\nexport class Meteor {\n  constructor(x, y, target, dmg, radius) {\n    this.tx = target.x; this.ty = target.y;\n    this.startX = this.tx - 40; this.startY = this.ty - 260;\n    this.x = this.startX; this.y = this.startY;\n    this.dmg = dmg; this.radius = radius;\n    this.t = 0; this.dur = 0.55; this.alive = true; this.landed = false;\n    this._id = uid();\n  }\n  update(dt, ctx) {\n    this.t += dt;\n    const k = Math.min(1, this.t / this.dur);\n    this.x = this.startX + (this.tx - this.startX) * k;\n    this.y = this.startY + (this.ty - this.startY) * k;\n    ctx.fx.fire(this.x, this.y + 4, '#ff7a33');\n    ctx.fx.embers(this.x + rand(-3, 3), this.y + 4, '#ffd260', 1);\n    if (k >= 1 && !this.landed) {\n      this.landed = true; this.alive = false;\n      ctx.spawnExplosion(this.tx, this.ty, this.radius, this.dmg, 'fire');\n      ctx.fx.shakeScreen(9, 0.35);\n      ctx.camera?.punch(0.05);\n      ctx.fx.decal(this.tx, this.ty, this.radius * 0.5, '#1a0d08', 14);\n    }\n  }\n}\n\nexport class Flame {\n  constructor(x, y, ang, range, dmg) {\n    this.x = x; this.y = y; this.ang = ang; this.range = range; this.dmg = dmg;\n    this.t = 0; this.dur = 0.22; this.alive = true; this._id = uid();\n  }\n  update(dt, ctx) {\n    this.t += dt;\n    if (this.t >= this.dur) { this.alive = false; return; }\n    for (let i = 0; i < 5; i++) {\n      const r = Math.random() * this.range;\n      const spread = (r / this.range) * 0.5;\n      const a = this.ang + rand(-spread, spread);\n      ctx.fx.spawn({\n        x: this.x + Math.cos(a) * r, y: this.y + Math.sin(a) * r,\n        vx: Math.cos(a) * 60, vy: Math.sin(a) * 60 - 10,\n        color: r / this.range > 0.6 ? '#ff5a33' : '#ffe066', life: 0.3, size: 2 + r / 16,\n        endSize: 0.5, light: 0.25,\n      });\n    }\n  }\n}\n","js/entities/pickup.js":"// ============================================================\n// HELL TRAIN — Pickups: XP, coins, hearts, shards, chests, magnets\n// ============================================================\nimport { uid, dist, rand } from '../core/utils.js';\n\nconst CONF = {\n  xp:     { sprite: 'xp',     color: '#8ef0ff', score: 1 },\n  xpBig:  { sprite: 'xpBig',  color: '#dcb4ff', score: 4 },\n  coin:   { sprite: 'coin',   color: '#ffe878', score: 2 },\n  shard:  { sprite: 'shard',  color: '#ffc040', score: 25 },\n  heart:  { sprite: 'heart',  color: '#ff5a5a', score: 5 },\n  chest:  { sprite: 'chest',  color: '#ffe066', score: 50 },\n  magnet: { sprite: 'magnet', color: '#f080cc', score: 5 },\n};\n\nexport class Pickup {\n  constructor(type, x, y, amount = 1) {\n    this.type = type; this.x = x; this.y = y; this.amount = amount;\n    this.vx = rand(-45, 45); this.vy = rand(-120, -55);\n    this.z = 0; this.vz = rand(30, 70);\n    this.t = 0; this.alive = true; this.magnetized = false;\n    this.frame = Math.floor(Math.random() * 6);\n    this._id = uid();\n    this.conf = CONF[type] || CONF.xp;\n  }\n  color() { return this.conf.color; }\n  spriteKey() { return this.conf.sprite; }\n\n  update(dt, ctx) {\n    if (!this.alive) return;\n    this.t += dt;\n    this.frame += dt * 10;\n    const p = ctx.player;\n    const d = dist(this.x, this.y, p.x, p.y);\n\n    if (!this.magnetized) {\n      // little hop + settle\n      this.vy += 320 * dt;\n      this.x += this.vx * dt; this.y += this.vy * dt;\n      this.vx *= Math.pow(0.9, dt * 60);\n      if (this.t > 0.35) { this.vy *= Math.pow(0.75, dt * 60); }\n      if (ctx.world.isSolidWorld(this.x, this.y)) { this.x -= this.vx * dt; this.y -= this.vy * dt; this.vx *= -0.4; this.vy *= -0.4; }\n      const range = p.pickupRange * (ctx.magnetAll ? 12 : 1);\n      if (d < range) this.magnetized = true;\n    } else {\n      const dx = p.x - this.x, dy = p.y - this.y;\n      const dd = Math.hypot(dx, dy) + 0.01;\n      const speed = 120 + (1 - Math.min(1, dd / 120)) * 420;\n      this.x += (dx / dd) * speed * dt;\n      this.y += (dy / dd) * speed * dt;\n      if (this.type === 'coin' && Math.random() < 0.25) ctx.fx.trailPuff(this.x, this.y, '#ffe878', 1.2);\n    }\n\n    if (d < p.radius + 7) {\n      this.onPickup(ctx);\n      this.alive = false;\n    }\n    if (this.t > 45) this.alive = false;\n  }\n\n  onPickup(ctx) {\n    const p = ctx.player;\n    const c = this.conf;\n    ctx.fx.sparkle(this.x, this.y, c.color);\n    switch (this.type) {\n      case 'xp': case 'xpBig':\n        p.gainXp(this.amount); p.score += c.score; break;\n      case 'coin': {\n        const n = Math.max(1, Math.round(this.amount * (p.coinMult || 1)));\n        ctx.addRunCoins(n);\n        p.score += c.score;\n        if (n >= 5) ctx.fx.damageText(this.x, this.y - 8, '+' + n, '#ffe878', { size: 7, life: 0.6 });\n        break;\n      }\n      case 'shard':\n        ctx.gameStats.shards += this.amount; p.score += c.score; break;\n      case 'heart':\n        p.heal(this.amount);\n        ctx.fx.damageText(this.x, this.y - 8, '+' + Math.round(this.amount), '#7eff9e', { size: 7 });\n        p.score += c.score; break;\n      case 'magnet':\n        ctx.magnetPulse(); p.score += c.score; break;\n      case 'chest':\n        ctx.openChest(this); p.score += c.score; break;\n    }\n  }\n}\n","js/data/realms.js":"// ============================================================\n// HELL TRAIN — realms, bosses, difficulty, challenges\n// ============================================================\nexport const REALMS = [\n  { id: 'purgatory', name: 'Purgatory', idx: 1, sky: '#1d1326', ground: '#1a1322', accent: '#3d2a4f',\n    desc: 'Foggy abandoned railway environment.', music: 'wind_chimes', mechanic: 'Fog reduces visibility.',\n    boss: { id: 'boss_conductor', name: 'The Conductor' }, tier: 1 },\n  { id: 'infernal', name: 'The Infernal Fields', idx: 2, sky: '#2a0c08', ground: '#1f0a0a', accent: '#a0321a',\n    desc: 'Lava and ash.', music: 'low_drums', mechanic: 'Heat pulses damage if you stop moving.',\n    boss: { id: 'boss_ashen', name: 'The Ashen Giant' }, tier: 2 },\n  { id: 'forgotten', name: 'The Forgotten City', idx: 3, sky: '#0d0d1d', ground: '#11111f', accent: '#5a5a78',\n    desc: 'Abandoned supernatural city.', music: 'bells', mechanic: 'The map changes when bells ring.',\n    boss: { id: 'boss_bell', name: 'The Bellmaster' }, tier: 3 },\n  { id: 'forest', name: 'The Haunted Forest', idx: 4, sky: '#09160e', ground: '#0a1410', accent: '#1f3a1a',\n    desc: 'Supernatural forest.', music: 'forest', mechanic: 'Vines trap you in place briefly.',\n    boss: { id: 'boss_root', name: 'The Ancient Root' }, tier: 4 },\n  { id: 'frozen', name: 'The Frozen Realm', idx: 5, sky: '#0c142a', ground: '#0e1428', accent: '#2a4a70',\n    desc: 'Frozen railway.', music: art', rarity: 'legendary', name: 'Forbidden Art: +40% Damage, -10% HP', icon: '🕯',\n    apply: (p) => { p.modMult('atkDmg', 1.40); p.maxHp = Math.floor(p.maxHp * 0.9); } },\n  { id: 'soulbound', rarity: 'legendary', name: 'Soulbound: Projectiles Pierce +2', icon: '✦',\n    apply: (p) => { p.modMult('pierce', 1); p.pierceBonus = (p.pierceBonus || 0) + 2; } },\n  { id: 'phoenix', rarity: 'legendary', name: 'Phoenix: Revive once per run', icon: '🦅',\n    apply: (p) => { p.revive = (p.revive || 0) + 1; } },\n\n  { id: 'eclipse', rarity: 'mythic', name: 'Eclipse: Damage scales with missing HP', icon: '🌒',\n    apply: (p) => { p.eclipse = true; } },\n  { id: 'transcendence', rarity: 'transcendent', name: 'Transcendence: All stats +5%', icon: '✺',\n    apply: (p) => { p.modMult('atkDmg', 1.05); p.modMult('atkSpd', 1.05); p.modMult('moveSpd', 1.05);\n      p.crit += 0.02; p.maxHp = Math.floor(p.maxHp * 1.05); p.hp = Math.min(p.maxHp, p.hp + 10); } },\n\n  // train-themed\n  { id: 'train_heal', rarity: 'rare', name: 'Train Repair Aura', icon: '🚂',\n    apply: (p) => { p.trainRepairRate += 1; } },\n  { id: 'train_fire', rarity: 'rare', name: 'Train Weapon Damage +20%', icon: '🚂',\n    apply: (p) => p.modMult('trainDmg', 1.20) },\n];\n\n// =============================================================\n// RELICS (run-based modifiers)\n// =============================================================\nexport const RELICS = [\n  { id: 'broken_clock', name: 'Broken Clock', desc: 'Attack Speed +25%.',\n    apply: (p) => p.modMult('atkSpd', 1.25) },\n  { id: 'black_lantern', name: 'Black Lantern', desc: 'Visibility radius +35%.',\n    apply: (p) => p.modMult('visibility', 1.35) },\n  { id: 'frozen_heart', name: 'Frozen Heart', desc: 'Frozen enemies generate shields.',\n    apply: (p) => p.frozenHeart = true },\n  { id: 'railway_ticket', name: 'Railway Ticket', desc: '+50% XP near train.',\n    apply: (p) => p.trainXpBoost = 1.5 },\n  { id: 'lost_crown', name: 'Lost Crown', desc: 'Eli
