cone || TAU) : rand(0, TAU);\n      const s = spd * rand(0.35, 1);\n      this.spawn({\n        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,\n        color, color2: opts.color2, life: (opts.life || 0.5) * rand(0.7, 1.3),\n        size: opts.size || rand(1, 2.4), endSize: 0.5, gravity: opts.gravity || 0,\n        drag: opts.drag ?? 0.9, kind: P_SPARK, light: opts.light || 0,\n      });\n    }\n  }\n  sparks(x, y, color, n, ang, cone = 0.6, spd = 180) {\n    for (let i = 0; i < n; i++) {\n      const a = ang + rand(-cone, cone);\n      const s = spd * rand(0.4, 1.2);\n      this.spawn({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, color, life: rand(0.2, 0.45),\n        size: rand(1, 2), endSize: 0.4, drag: 0.86, gravity: 120 });\n    }\n  }\n  fire(x, y, color = '#ff7a33') {\n    for (let i = 0; i < 3; i++) {\n      this.spawn({ x: x + rand(-3, 3), y, vx: rand(-14, 14), vy: rand(-60, -20), color,\n        color2: '#ffe066', life: rand(0.4, 0.8), size: rand(1.5, 3), endSize: 0.4,\n        gravity: -30, kind: P_EMBER, light: 0.35 });\n    }\n  }\n  smoke(x, y, color = '#8a8aa0', n = 4) {\n    for (let i = 0; i < n; i++) {\n      this.spawn({ x: x + rand(-3, 3), y: y + rand(-2, 2), vx: rand(-12, 12), vy: rand(-30, -10),\n        color, life: rand(0.8, 1.6), size: rand(2, 4), endSize: 6, drag: 0.95,\n        kind: P_SMOKE, additive: false });\n    }\n  }\n  embers(x, y, color = '#ffb040', n = 3) {\n    for (let i = 0; i < n; i++) {\n      this.spawn({ x: x + rand(-5, 5), y, vx: rand(-10, 10), vy: rand(-32, -8), color,\n        life: rand(0.9, 1.8), size: rand(0.8, 1.6), kind: P_EMBER, light: 0.2, gravity: -8 });\n    }\n  }\n  dust(x, y, color = '#cfd4e0', n = 3) {\n    for (let i = 0; i < n; i++) {\n      this.spawn({ x: x + rand(-6, 6), y: y + rand(-2, 2), vx: rand(-25, 25), vy: rand(-18, -4),\n        color, life: rand(0.3, 0.6), size: rand(1, 2), endSize: 2.5, drag: 0.88,\n        additive: false, kind: P_SMOKE });\n    }\n  }\n  blood(x, y, color = '#a01f12', n = 8) {\n    for (let i = 0; i < n; i++) {\n      const a = rand(0, TAU), s = rand(30, 150);\n      this.spawn({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, color, life: rand(0.3, 0.7),\n        size: rand(1, 2.2), gravity: 220, drag: 0.92, additive: false, kind: P_BLOOD });\n    }\n  }\n  sparkle(x, y, color = '#a8d4f4') {\n    for (let i = 0; i < 4; i++) {\n      const a = (i / 4) * TAU + rand(0, 1);\n      this.spawn({ x, y, vx: Math.cos(a) * 34, vy: Math.sin(a) * 34 - 12, color,\n        life: 0.35, size: 1.6, endSize: 0.2, drag: 0.88, light: 0.15 });\n    }\n  }\n  shard(x, y, color, n = 6) {\n    for (let i = 0; i < n; i++) {\n      const a = rand(0, TAU), s = rand(40, 160);\n      this.spawn({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, color, life: rand(0.3, 0.8),\n        size: rand(1.4, 2.6), endSize: 0.2, drag: 0.9, kind: P_SHARD, spin: rand(-8, 8) });\n    }\n  }\n  trailPuff(x, y, color, size = 2) {\n    this.spawn({ x, y, vx: rand(-8, 8), vy: rand(-8, 8), color, life: 0.28, size,\n      endSize: 0.2, drag: 0.85, light: 0.1 });\n  }\n\n  // ---------- big effects ----------\n  explosion(x, y, kind = 'explFire', scale = 1, opts = {}) {\n    this.anims.push({ x, y, kind, t: 0, speed: opts.speed || 22, scale, rot: opts.rot || 0,\n      light: opts.light ?? 1, lightColor: opts.lightColor || '#ffb060' });\n    this.ring(x, y, opts.ringR || 34 * scale, opts.ringColor || '#ffffff', opts.ringLife || 0.32);\n    this.burst(x, y, opts.sparkColor || '#ffe066', Math.round(14 * scale), { spd: 160 * scale, life: 0.5, light: 0.2 });\n    this.smoke(x, y, '#3a3040', Math.round(4 * scale));\n  }\n  ring(x, y, r, color = '#ffffff', life = 0.3, width = 2) {\n    this.rings.push({ x, y, r0: r * 0.15, r, color, life, t: life, width });\n  }\n  shockwave(x, y, r, color = '#ffffff') {\n    this.ring(x, y, r, color, 0.45, 3);\n    this.ring(x, y, r * 0.7, color, 0.3, 2);\n  }\n  lightning(x1, y1, x2, y2, color = '#fff066', segs = 7, life = 0.16) {\n    const pts = [[x1, y1]];\n    for (let i = 1; i < segs; i++) {\n      const t = i / segs;\n      pts.push([x1 + (x2 - x1) * t + rand(-9, 9), y1 + (y2 - y1) * t + rand(-9, 9)]);\n    }\n    pts.push([x2, y2]);\n    const branches = [];\n    for (let i = 2; i < pts.length - 1; i++) {\n      if (Math.random() < 0.4) {\n        const a = rand(0, TAU), l = rand(6, 18);\n        branches.push([pts[i], [pts[i][0] + Math.cos(a) * l, pts[i][1] + Math.sin(a) * l]]);\n      }\n    }\n    this.arcs.push({ pts, branches, color, life, t: life });\n    this.burst(x2, y2, color, 6, { spd: 90, life: 0.25, light: 0.3 });\n  }\n  beam(x1, y1, x2, y2, color, width = 6, life = 0.25) {\n    this.beams.push({ x1, y1, x2, y2, color, width, life, t: life });\n  }\n  afterimage(sprite, x, y, scale = 1, flip = false, color = '#ffffff', life = 0.3) {\n    if (!sprite) return;\n    this.afterimages.push({ sprite, x, y, scale, flip, color, life, t: life });\n  }\n  decal(x, y, r, color = '#180a10', life = 12) {\n    if (this.decals.length > 220) this.decals.shift();\n    this.decals.push({ x, y, r, color, life, t: life, seed: Math.random() * 1000 });\n  }\n  flash(x, y, color = '#ffffff', life = 0.1, r = 14) {\n    this.flashes.push({ x, y, color, life, t: life, r });\n  }\n  screenTint(color, a) { this.screenFlash = { color, a: Math.max(this.screenFlash.a, a) }; }\n  shakeScreen(amount = 6, time = 0.25) { this.shake = Math.max(this.shake, amount); this.shakeT = Math.max(this.shakeT, time); }\n\n  damageText(x, y, text, color = '#ffffff', opts = {}) {\n    if (!this.damageNumbers) return;\n    // CLAIRITY: clump tiny numbers into one chunky number so the screen\n    // never turns into a wall of 8px text.\n    const bx = Math.round(x / 9) * 9, by = Math.round(y / 9) * 9;\n    const numeric = /^[0-9]+$/.test(String(text));\n    if (numeric && !opts.crit) {\n      for (const t of this.texts) {\n        if (t._bk === bx + ':' + by && t.t > 0.4 && !t.crit && t.size < 11) {\n          const sum = (parseInt(t.text, 10) || 0) + (parseInt(text, 10) || 0);\n          t.text = String(sum);\n          t.t = Math.min(t.life, t.t + 0.18); t.life = t.t;\n          t.pop = 1; t.color = sum > 60 ? '#ffe066' : color;\n          return;\n        }\n      }\n    }\n    if (this.texts.length > 60) this.texts.shift();\n    this.texts.push({\n      x: x + rand(-3, 3), y, vy: opts.vy ?? -46, vx: opts.vx ?? rand(-14, 14),\n      t: opts.life || 0.85, life: opts.life || 0.85, text, color,\n      size: opts.size || 8, crit: opts.crit || false, pop: 1, outline: opts.outline ?? true,\n      _bk: bx + ':' + by,\n    });\n  }\n  banner(x, y, text, color = '#ffe066') {\n    // banner queue: never more than 2 big banners at once, drop the oldest\n    if (this._bannerCount >= 2) {\n      for (let i = 0; i < this.texts.length; i++) {\n        if (this.texts[i].size >= 11) { this.texts.splice(i, 1); break; }\n      }\n    } else {\n      this._bannerCount += 1;\n    }\n    this.texts.push({ x, y, vy: -8, vx: 0, t: 1.6, life: 1.6, text, color, size: 12, crit: true, pop: 1, outline: true });\n  }\n\n  // ---------- sim ----------\n  update(dt) {\n    const list = this.list;\n    for (let i = list.length - 1; i >= 0; i--) {\n      const p = list[i];\n      p.t -= dt;\n      if (p.t <= 0) { list.splice(i, 1); continue; }\n      p.vy += p.gravity * dt;\n      const dr = Math.pow(p.drag, dt * 60);\n      p.vx *= dr; p.vy *= dr;\n      p.x += p.vx * dt; p.y += p.vy * dt;\n      p.ang += p.spin * dt;\n      const k = p.t / p.life;\n      p.alpha = p.fade ? Math.min(1, k * 1.6) : 1;\n      if (p.endSize !== null) p.curSize = p.size + (p.endSize - p.size) * (1 - k);\n      else p.curSize = p.size;\n    }\n    for (let i = this.anims.length - 1; i >= 0; i--) {\n      const a = this.anims[i];\n      a.t += dt * a.speed;\n      const frames = this.sprites?.fx?.[a.kind];\n      if (!frames || a.t >= frames.length) this.anims.splice(i, 1);\n    }\n    for (const arr of [this.rings, this.arcs, this.texts, this.afterimages, this.flashes, this.beams]) {\n      for (let i = arr.length - 1; i >= 0; i--) {\n        arr[i].t -= dt;\n        if (arr[i].t <= 0) arr.splice(i, 1);\n      }\n    }\n    for (const t of this.texts) {\n      t.x += t.vx * dt; t.y += t.vy * dt;\n      t.vy += 90 * dt; t.vx *= Math.pow(0.9, dt * 60);\n      t.pop = Math.max(0, t.pop - dt * 5);\n    }\n    for (let i = this.decals.length - 1; i >= 0; i--) {\n      this.decals[i].t -= dt;\n      if (this.decals[i].t <= 0) this.decals.splice(i, 1);\n    }\n    // re-count active banners so the queue stays honest\n    this._bannerCount = 0;\n    for (const t of this.texts) if (t.size >= 11) this._bannerCount++;\n    if (this.shakeT > 0) { this.shakeT -= dt; if (this.shakeT <= 0) this.shake = 0; }\n    this.screenFlash.a = Math.max(0, this.screenFlash.a - dt * 3.2);\n    this.aberration = Math.max(0, this.aberration - dt * 6);\n  }\n\n  // ---------- draw (world space; camera already applied) ----------\n  drawDecals(ctx) {\n    for (const d of this.decals) {\n      const a = Math.min(1, d.t / Math.min(2, d.life)) * 0.55;\n      ctx.globalAlpha = a;\n      ctx.fillStyle = d.color;\n      const r = d.r;\n      for (let i = 0; i < 7; i++) {\n        const ang = (i / 7) * TAU + d.seed;\n        const rr = r * (0.45 + ((i * 37 + d.seed | 0) % 10) / 18);\n        ctx.beginPath();\n        ctx.arc(d.x + Math.cos(ang) * r * 0.35, d.y + Math.sin(ang) * r * 0.28, rr, 0, TAU);\n        ctx.fill();\n      }\n      ctx.globalAlpha = 1;\n    }\n  }\n\n  draw(ctx, renderer = null, camera = null) {\n    // afterimages (under everything living)\n    for (const a of this.afterimages) {\n      const k = a.t / a.life;\n      ctx.globalAlpha = k * 0.5;\n      ctx.save();\n      ctx.translate(Math.round(a.x), Math.round(a.y));\n      if (a.flip) ctx.scale(-1, 1);\n      ctx.drawImage(a.sprite, -a.sprite.width / 2 * a.scale, -a.sprite.height / 2 * a.scale,\n        a.sprite.width * a.scale, a.sprite.height * a.scale);\n      ctx.restore();\n      ctx.globalAlpha = 1;\n    }\n\n    // beams\n    for (const b of this.beams) {\n      const k = b.t / b.life;\n      ctx.globalCompositeOperation = 'lighter';\n      ctx.strokeStyle = b.color;\n      ctx.globalAlpha = k;\n      ctx.lineWidth = b.width * k;\n      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();\n      ctx.strokeStyle = '#ffffff';\n      ctx.lineWidth = Math.max(1, b.width * k * 0.35);\n      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();\n      ctx.globalAlpha = 1;\n      ctx.globalCompositeOperation = 'source-over';\n    }\n\n    // particles\n    ctx.globalCompositeOperation = 'lighter';\n    let additive = true;\n    for (const p of this.list) {\n      if (p.alpha <= 0) continue;\n      if (p.additive !== additive) {\n        ctx.globalCompositeOperation = p.additive ? 'lighter' : 'source-over';\n        additive = p.additive;\n      }\n      ctx.globalAlpha = p.alpha;\n      ctx.fillStyle = p.color2 && p.t / p.life < 0.5 ? p.color2 : p.color;\n      const s = Math.max(1, Math.round(p.curSize ?? p.size));\n      const px = Math.round(p.x), py = Math.round(p.y);\n      if (s <= 2) {\n        ctx.fillRect(px - (s >> 1), py - (s >> 1), s, s);\n      } else if (s <= 4) {\n        // chunky pixel diamond\n        ctx.fillRect(px - 1, py - (s >> 1), 2, s);\n        ctx.fillRect(px - (s >> 1), py - 1, s, 2);\n      } else {\n        // soft round blob, still pixel-snapped\n        const h = s >> 1;\n        ctx.beginPath(); ctx.arc(px, py, h, 0, TAU); ctx.fill();\n        ctx.globalAlpha = p.alpha * 0.5;\n        ctx.beginPath(); ctx.arc(px, py, h * 0.55, 0, TAU); ctx.fill();\n        ctx.globalAlpha = p.alpha;\n      }\n    }\n    ctx.globalAlpha = 1;\n    ctx.globalCompositeOperation = 'source-over';\n\n    // sprite explosions\n    const fx = this.sprites?.fx;\n    if (fx) {\n      ctx.globalCompositeOperation = 'lighter';\n      for (const a of this.anims) {\n        const frames = fx[a.kind];\n        if (!frames) continue;\n        const f = frames[Math.min(frames.length - 1, Math.floor(a.t))];\n        if (!f) continue;\n        const w = f.width * a.scale, h = f.height * a.scale;\n        ctx.drawImage(f, Math.round(a.x - w / 2), Math.round(a.y - h / 2), w, h);\n      }\n      ctx.globalCompositeOperation = 'source-over';\n    }\n\n    // rings\n    ctx.globalCompositeOperation = 'lighter';\n    for (const r of this.rings) {\n      const k = 1 - r.t / r.life;\n      const rr = r.r0 + (r.r - r.r0) * k;\n      ctx.globalAlpha = (1 - k) * 0.9;\n      ctx.strokeStyle = r.color;\n      ctx.lineWidth = Math.max(1, r.width * (1 - k));\n      ctx.beginPath(); ctx.arc(r.x, r.y, rr, 0, TAU); ctx.stroke();\n      ctx.globalAlpha = 1;\n    }\n    // arcs\n    for (const a of this.arcs) {\n      const k = a.t / a.life;\n      ctx.globalAlpha = k;\n      ctx.strokeStyle = a.color; ctx.lineWidth = 2;\n      ctx.beginPath();\n      ctx.moveTo(a.pts[0][0], a.pts[0][1]);\n      for (const p of a.pts) ctx.lineTo(p[0], p[1]);\n      ctx.stroke();\n      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;\n      ctx.beginPath();\n      ctx.moveTo(a.pts[0][0], a.pts[0][1]);\n      for (const p of a.pts) ctx.lineTo(p[0], p[1]);\n      ctx.stroke();\n      ctx.strokeStyle = a.color;\n      for (const [p0, p1] of a.branches) {\n        ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();\n      }\n      ctx.globalAlpha = 1;\n    }\n    // flashes\n    for (const f of this.flashes) {\n      const k = f.t / f.life;\n      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * (1 + (1 - k)));\n      g.addColorStop(0, hexA(f.color, k));\n      g.addColorStop(1, hexA(f.color, 0));\n      ctx.fillStyle = g;\n      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 + (1 - k)), 0, TAU); ctx.fill();\n    }\n    ctx.globalCompositeOperation = 'source-over';\n    ctx.globalAlpha = 1;\n\n    // push dynamic lights\n    if (renderer && camera) {\n      for (const p of this.list) {\n        if (!p.light) continue;\n        const s = camera.worldToScreen(p.x, p.y);\n        renderer.addLight(s.x, s.y, (p.curSize ?? p.size) * 6 * camera.zoom, p.color, p.light * p.alpha);\n      }\n      for (const a of this.anims) {\n        if (!a.light) continue;\n        const frames = this.sprites?.fx?.[a.kind];\n        const k = frames ? 1 - a.t / frames.length : 0;\n        const s = camera.worldToScreen(a.x, a.y);\n        renderer.addLight(s.x, s.y, 46 * a.scale * camera.zoom * (0.6 + k), a.lightColor, a.light * (1 - k * 0.7));\n      }\n      for (const f of this.flashes) {\n        const s = camera.worldToScreen(f.x, f.y);\n        renderer.addLight(s.x, s.y, f.r * 2.4 * camera.zoom, f.color, f.t / f.life);\n      }\n      for (const a of this.arcs) {\n        const s = camera.worldToScreen(a.pts[a.pts.length - 1][0], a.pts[a.pts.length - 1][1]);\n        renderer.addLight(s.x, s.y, 40 * camera.zoom, a.color, a.t / a.life);\n      }\n    }\n  }\n\n  // combat text is drawn in screen space for crisp text\n  drawTexts(ctx, camera) {\n    for (const t of this.texts) {\n      const k = t.t / t.life;\n      const p = camera ? camera.worldToScreen(t.x, t.y) : { x: t.x, y: t.y };\n      const pop = 1 + t.pop * 0.6;\n      const size = Math.round(t.size * pop);\n      ctx.font = `bold ${size}px \"Courier New\", monospace`;\n      ctx.textAlign = 'center';\n      ctx.globalAlpha = Math.min(1, k * 2.2);\n      if (t.outline) {\n        ctx.fillStyle = '#000000';\n        ctx.fillText(t.text, Math.round(p.x) + 1, Math.round(p.y) + 1);\n        ctx.fillText(t.text, Math.round(p.x) - 1, Math.round(p.y) + 1);\n      }\n      ctx.fillStyle = t.color;\n      ctx.fillText(t.text, Math.round(p.x), Math.round(p.y));\n      if (t.crit) {\n        ctx.globalAlpha = Math.min(1, k * 2.2) * 0.5;\n        ctx.fillStyle = '#ffffff';\n        ctx.fillText(t.text, Math.round(p.x), Math.round(p.y) - 1);\n      }\n      ctx.globalAlpha = 1;\n      ctx.textAlign = 'left';\n    }\n  }\n}\n","js/data/weapons_extended.js":"// ============================================================\n// HELL TRAIN — Extended Weapon System\n// Bombers, Blasters, and Advanced Weapon Varieties\n// ============================================================\n\nexport const WEAPONS_EXTENDED = {\n  // BOMBER WEAPONS - Area damage specialists\n  BOMBERS: {\n    basicBomber: {\n      name: 'Bomb Launcher',\n      type: 'projectile',\n      damage: 20,\n      firerate: 0.7,\n      projectileSpeed: 150,\n      projectileSize: 10,\n      areaSize: 40,\n      desc: 'Launches explosive bombs',\n      rarity: 'common',\n    },\n    clusterBomb: {\n      name: 'Cluster Bomb',\n      type: 'projectile',\n      damage: 25,\n      firerate: 0.8,\n      projectileSpeed: 140,\n      projectileSize: 12,\n      areaSize: 50,\n      splitCount: 5,\n      desc: 'Splits into multiple explosions',\n      rarity: 'uncommon',\n    },\n    mineLayer: {\n      name: 'Mine Layer',\n      type: 'special',\n      damage: 30,\n      firerate: 1.0,\n      mineCount: 8,\n      mineRadius: 30,\n      desc: 'Places mines that explode on contact',\n      rarity: 'uncommon',\n    },\n    napalm: {\n      name: 'Napalm Thrower',\n      type: 'aoe',\n      damage: 22,\n      firerate: 0.9,\n      areaSize: 35,\n      burnDuration: 4,\n      burnDamage: 5,\n      desc: 'Burns area for sustained damage',\n      rarity: 'rare',\n    },\n    nuke: {\n      name: 'Nuclear Strike',\n      type: 'projectile',\n      damage: 60,\n      firerate: 0.3,\n      projectileSpeed: 160,\n      areaSize: 80,\n      desc: 'Catastrophic nuclear explosion',\n      rarity: 'epic',\n    },\n    detonator: {\n      name: 'Detonation Cascade',\n      type: 'special',\n      damage: 45,\n      firerate: 0.5,\n      chainReactions: 10,\n      areaSize: 60,\n      desc: 'Bombs trigger chain reactions',\n      rarity: 'legendary',\n    },\n  },\n\n  // BLASTER WEAPONS - Rapid fire specialists\n  BLASTERS: {\n    basicBlaster: {\n      name: 'Energy Blaster',\n      type: 'projectile',\n      damage: 6,\n      firerate: 2.5,\n      projectileSpeed: 280,\n      projectileSize: 3,\n      desc: 'Rapid energy projectiles',\n      rarity: 'common',\n    },\n    pulseRifle: {\n      name: 'Pulse Rifle',\n      type: 'projectile',\n      damage: 8,\n      firerate: 3.0,\n      projectileSpeed: 300,\n      projectileSize: 4,\n      burstShots: 3,\n      desc: 'Fires in rapid bursts',\n      rarity: 'uncommon',\n    },\n    gatling: {\n      name: 'Gatling Gun',\n      type: 'projectile',\n      damage: 10,\n      firerate: 4.0,\n      projectileSpeed: 320,\n      projectileSize: 4,\n      desc: 'Ultra-rapid fire',\n      rarity: 'uncommon',\n    },\n    beam: {\n      name: 'Energy Beam',\n      type: 'projectile',\n      damage: 15,\n      firerate: 1.5,\n      projectileSpeed: 400,\n      projectileSize: 6,\n      piercingShots: 5,\n      desc: 'Piercing energy beam',\n      rarity: 'rare',\n    },\n    railgun: {\n      name: 'Railgun',\n      type: 'projectile',\n      damage: 35,\n      firerate: 0.4,\n      projectileSpeed: 500,\n      projectileSize: 8,\n      piercingShots: 999,\n      desc: 'Pierces all enemies',\n      rarity: 'epic',\n    },\n    superBlaster: {\n      name: 'Infinity Blaster',\n      type: 'projectile',\n      damage: 50,\n      firerate: 2.0,\n      projectileSpeed: 400,\n      projectileSize: 8,\n      burstShots: 10,\n      piercingShots: 5,\n      desc: 'Ultimate rapid fire',\n      rarity: 'legendary',\n    },\n  },\n\n  // MELEE WEAPONS - Close range devastation\n  MELEE: {\n    sword: {\n      name: 'Executioner Blade',\n      type: 'melee',\n      damage: 25,\n      firerate: 1.2,\n      range: 30,\n      desc: 'Melee sword attacks',\n      rarity: 'uncommon',\n    },\n    scythe: {\n      name: 'Death Scythe',\n      type: 'melee',\n      damage: 30,\n      firerate: 1.0,\n      range: 40,\n      areaSize: 20,\n      desc: 'Wide area melee swing',\n      rarity: 'rare',\n    },\n    hammer: {\n      name: 'Godly Maul',\n      type: 'melee',\n      damage: 40,\n      firerate: 0.8,\n      range: 35,\n      knockback: 100,\n      areaSize: 30,\n      desc: 'Devastating hammer strikes',\n      rarity: 'epic',\n    },\n  },\n\n  // BEAM WEAPONS - Sustained damage\n  BEAMS: {\n    laserBeam: {\n      name: 'Laser Beam',\n      type: 'beam',\n      damage: 12,\n      firerate: 1.0,\n      beamDuration: 2,\n      beamWidth: 8,\n      desc: 'Sustained laser fire',\n      rarity: 'uncommon',\n    },\n    plasmaBeam: {\n      name: 'Plasma Beam',\n      type: 'beam',\n      damage: 18,\n      firerate: 0.9,\n      beamDuration: 2.5,\n      beamWidth: 10,\n      burnChance: 0.4,\n      desc: 'Burning plasma beam',\n      rarity: 'rare',\n    },\n    voidBeam: {\n      name: 'Void Beam',\n      type: 'beam',\n      damage: 25,\n      firerate: 0.7,\n      beamDuration: 3,\n      beamWidth: 12,\n      pullStrength: 80,\n      desc: 'Pulling void energy',\n      rarity: 'epic',\n    },\n  },\n\n  // SUMMON WEAPONS - Minion based\n  SUMMONS: {\n    basicMinion: {\n      name: 'Shadow Minion',\n      type: 'summon',\n      damage: 8,\n      firerate: 1.0,\n      maxSummons: 3,\n      summonDuration: 10,\n      summonSpeed: 80,\n      desc: 'Summons shadow minions',\n      rarity: 'uncommon',\n    },\n    golem: {\n      name: 'Iron Golem',\n      type: 'summon',\n      damage: 20,\n      firerate: 0.8,\n      maxSummons: 2,\n      summonDuration: 15,\n      summonSpeed: 60,\n      minionHP: 50,\n      desc: 'Summons durable golems',\n      rarity: 'rare',\n    },\n    dragonling: {\n      name: 'Dragon Knight',\n      type: 'summon',\n      damage: 30,\n      firerate: 0.6,\n      maxSummons: 1,\n      summonDuration: 20,\n      summonSpeed: 100,\n      minionHP: 80,\n      desc: 'Summons powerful dragon',\n      rarity: 'epic',\n    },\n  },\n\n  // SPECIAL WEAPONS - Utility based\n  SPECIAL: {\n    timeWarp: {\n      name: 'Time Warp',\n      type: 'special',\n      damage: 0,\n      firerate: 0.5,\n      duration: 3,\n      slowAmount: 0.5,\n      desc: 'Slows enemies in area',\n      rarity: 'rare',\n    },\n    shockwave: {\n      name: 'Shockwave',\n      type: 'special',\n      damage: 28,\n      firerate: 0.7,\n      areaSize: 50,\n      knockback: 150,\n      desc: 'Pushes all enemies away',\n      rarity: 'rare',\n    },\n    blackhole: {\n      name: 'Black Hole',\n      type: 'special',\n      damage: 35,\n      firerate: 0.4,\n      areaSize: 80,\n      pullStrength: 200,\n      duration: 4,\n      desc: 'Pulls and damages enemies',\n      rarity: 'legendary',\n    },\n  },\n\n  // HYBRID WEAPONS - Combination types\n  HYBRID: {\n    blasterBomb: {\n      name: 'Blaster-Bomb Hybrid',\n      type: 'projectile',\n      damage: 18,\n      firerate: 1.5,\n      projectileSpeed: 250,\n      areaSize: 35,\n      burstShots: 3,\n      desc: 'Blaster shots that explode',\n      rarity: 'rare',\n    },\n    chargeShot: {\n      name: 'Charge Cannon',\n      type: 'projectile',\n      damage: 40,\n      firerate: 0.5,\n      projectileSpeed: 200,\n      areaSize: 60,\n      chargeTime: 2,\n      desc: 'Charge for massive damage',\n      rarity: 'epic',\n    },\n    omnistrike: {\n      name: 'Omnistrike',\n      type: 'projectile',\n      damage: 50,\n      firerate: 1.0,\n      projectileSpeed: 250,\n      areaSize: 40,\n      piercingShots: 5,\n      burstShots: 5,\n      desc: 'All-purpose devastating weapon',\n      rarity: 'legendary',\n    },\n  },\n};\n\n// WEAPON EVOLUTION PATHS\nexport const WEAPON_EVOLUTION_PATHS = {\n  fireballPath: [\n    'basicFireball',\n    'infernoBurst',\n    'fireballStorm',\n    'hellstormNova',\n    'apocalypseFlame',\n  ],\n  blasterPath: [\n    'basicBlaster',\n    'pulseRifle',\n    'railgun',\n    'infinityBlaster',\n  ],\n  bomberPath: [\n    'basicBomber',\n    'clusterBomb',\n    'napalm',\n    'nuclearStrike',\n    'detonationCascade',\n  ],\n  beamPath: [\n    'laserBeam',\n    'plasmaBeam',\n    'voidBeam',\n    'infinityBeam',\n  ],\n  summonPath: [\n    'basicMinion',\n    'golem',\n    'dragonling',\n    'armyOfTheGods',\n  ],\n};\n\n// Get all weapons by category\nexport function getWeaponsByCategory() {\n  return {\n    bombers: WEAPONS_EXTENDED.BOMBERS,\n    blasters: WEAPONS_EXTENDED.BLASTERS,\n    melee: WEAPONS_EXTENDED.MELEE,\n    beams: WEAPONS_EXTENDED.BEAMS,\n    summons: WEAPONS_EXTENDED.SUMMONS,\n    special: WEAPONS_EXTENDED.SPECIAL,\n    hybrid: WEAPONS_EXTENDED.HYBRID,\n  };\n}\n\n// Get weapon rarity color\nexport function getWeaponRarityColor(rarity) {\n  const colors = {\n    common: '#888888',\n    uncommon: '#22ff22',\n    rare: '#00d4ff',\n    epic: '#ffd700',\n    legendary: '#ff5a33',\n  };\n  return colors[rarity] || '#ffffff';\n}\n\n// Check if weapon can evolve\nexport function canEvolveWeapon(currentWeapon, allWeapons) {\n  for (const path of Object.values(WEAPON_EVOLUTION_PATHS)) {\n    const idx = path.indexOf(currentWeapon);\n    if (idx !== -1 && idx < path.length - 1) {\n      const nextWeapon = path[idx + 1];\n      return allWeapons.includes(nextWeapon);\n    }\n  }\n  return false;\n}\n\n// Get next evolution\nexport function getNextEvolution(currentWeapon) {\n  for (const path of Object.values(WEAPON_EVOLUTION_PATHS)) {\n    const idx = path.indexOf(currentWeapon);\n    if (idx !== -1 && idx < path.length - 1) {\n      return path[idx + 1];\n    }\n  }\n  return null;\n}\n","js/data/weapons_bridge.js":"// ============================================================\n// HELL TRAIN — EXTENDED ARSENAL BRIDGE\n// `js/data/weapons_extended.js` describes 27 weapons as pure data\n// (bombers, blasters, melee, beams, summons, specials, hybrids).\n// That format has no behaviour attached, so nothing could fire them.\n// This module translates every one of them into the live weapon\n// schema the engine actually runs (see entities/player.js _cast).\n// ============================================================\nimport { WEAPONS_EXTENDED, WEAPON_EVOLUTION_PATHS } from './weapons_extended.js';\n\nconst RARITY_COLOR = {\n  common: '#9aa0b4', uncommon: '#5ad07a', rare: '#4a9cff',\n  epic: '#c07aff', legendary: '#ffb020', mythic: '#ff2a5a',\n};\n\n// Per-category presentation + the behaviour each maps onto.\nconst CATEGORY = {\n  BOMBERS: { family: 'explosive', sprite: 'bomb', icon: 'bomb', color: '#ff9033', slot: 'primary' },\n  BLASTERS: { family: 'plasma', sprite: 'orbPlasma', icon: 'blaster', color: '#2ff0ff', slot: 'primary' },\n  MELEE: { family: 'physical', sprite: 'sawBlade', icon: 'sword', color: '#d0d4e8', slot: 'melee' },\n  BEAMS: { family: 'tech', sprite: 'railSlug', icon: 'bolt', color: '#8ef0ff', slot: 'primary' },\n  SUMMONS: { family: 'shadow', sprite: 'orbShadow', icon: 'ghost', color: '#a05cff', slot: 'summon' },\n  SPECIAL: { family: 'void', sprite: 'orbVoid', icon: 'moon', color: '#c07aff', slot: 'special' },\n  HYBRID: { family: 'fire', sprite: 'orbFire', icon: 'fan', color: '#ff5a33', slot: 'primary' },\n};\n\n// Hand-tuned behaviour per weapon key so each one feels like its name.\nconst BEHAVIOUR = {\n  basicBomber: 'bomber', clusterBomb: 'bomber', mineLayer: 'pool', napalm: 'pool',\n  nuke: 'bomber', detonator: 'bomber',\n  basicBlaster: 'projectile', pulseRifle: 'burst', gatling: 'projectile',\n  beam: 'rail', railgun: 'rail', superBlaster: 'shotgun',\n  sword: 'cone', scythe: 'cone', hammer: 'nova',\n  laserBeam: 'rail', plasmaBeam: 'rail', voidBeam: 'rail',\n  basicMinion: 'drones', golem: 'drones', dragonling: 'drones',\n  timeWarp: 'aura', shockwave: 'nova', blackhole: 'blackhole',\n  blasterBomb: 'bomber', chargeShot: 'rail', omnistrike: 'burst',\n};\n\nfunction convert(key, src, catName) {\n  const cat = CATEGORY[catName] || CATEGORY.BLASTERS;\n  const behavior = BEHAVIOUR[key] || 'projectile';\n  const cd = Math.max(0.12, 1 / (src.firerate || 1));\n  const color = RARITY_COLOR[src.rarity] && catName === 'SPECIAL' ? RARITY_COLOR[src.rarity] : cat.color;\n\n  const w = {\n    id: 'x_' + key.replace(/([A-Z])/g, '_$1').toLowerCase(),\n    name: src.name,\n    family: cat.family,\n    color,\n    sprite: cat.sprite,\n    icon: cat.icon,\n    slot: cat.slot,\n    rarity: src.rarity || 'common',\n    desc: src.desc,\n    extended: true,\n    behavior,\n    cd,\n    dmg: src.damage || 10,\n    speed: src.projectileSpeed || 240,\n    projSize: src.projectileSize || 5,\n    projLife: src.duration || src.summonDuration || 1.8,\n    pierce: src.piercingShots ? Math.min(99, src.piercingShots) : 0,\n    projCount: src.splitCount ? Math.max(2, Math.round(src.splitCount / 2)) : 1,\n    spread: 0.12,\n    knockback: src.knockback || 0,\n    explode: !!src.areaSize,\n    explodeRadius: src.areaSize || 26,\n    burn: src.burnDamage || 0,\n    slow: src.slowAmount || 0,\n    slowDur: src.slowAmount ? 2 : 0,\n  };\n\n  // behaviour-specific fields the engine reads\n  if (behavior === 'bomber') {\n    w.projCount = src.splitCount ? Math.min(6, src.splitCount) : (key === 'nuke' ? 1 : 2);\n    w.cluster = src.chainReactions || (src.splitCount ? 2 : 0);\n    w.explodeRadius = src.areaSize || 40;\n  }\n  if (behavior === 'pool') {\n    w.poolRadius = src.mineRadius || src.areaSize || 30;\n    w.projLife = src.burnDuration || src.duration || 4;\n    w.dmg = (src.damage || 10) * 0.35;   // pools tick, so per-tick damage is lower\n    w.cd = Math.max(0.6, cd);\n  }\n  if (behavior === 'burst') {\n    w.burstCount = src.burstShots || 3;\n    w.burstDelay = 0.06;\n  }\n  if (behavior === 'cone') {\n    w.range = src.range || 60;\n    w.arc = key === 'scythe' ? 1.5 : 0.9;\n  }\n  if (behavior === 'nova') {\n    w.radius = src.areaSize || src.range || 70;\n  }\n  if (behavior === 'aura') {\n    w.radius = src.areaSize || 90;\n    w.dmg = (src.damage || 10) * 0.25;\n    w.cd = 0.35;\n  }\n  if (behavior === 'blackhole') {\n    w.radius = src.areaSize || 80;\n    w.projLife = src.duration || 4;\n  }\n  if (behavior === 'drones') {\n    w.droneCount = src.maxSummons || 2;\n    w.droneCd = Math.max(0.3, 1 / (src.firerate || 1));\n    w.droneRange = 150;\n  }\n  if (behavior === 'rail') {\n    w.beamWidth = src.beamWidth || 7;\n    w.cd = Math.max(0.35, cd);\n  }\n  if (key === 'gatling') { w.spread = 0.22; w.projCount = 1; }\n  if (key === 'railgun') w.pierce = 99;\n\n  // level curve — everything scales, faster and harder each rank\n  const baseCd = w.cd, baseDmg = w.dmg, baseCount = w.projCount;\n  w.curve = (l) => ({\n    cd: Math.max(baseCd * 0.35, baseCd - baseCd * 0.055 * l),\n    dmg: baseDmg + baseDmg * 0.28 * l,\n    projCount: baseCount + Math.floor(l / 4),\n    droneCount: w.droneCount ? w.droneCount + Math.floor(l / 3) : undefined,\n    explodeRadius: w.explodeRadius + l * 2,\n  });\n\n  const evo = WEAPON_EVOLUTION_PATHS?.[key];\n  if (evo) {\n    w.evolutions = [{\n      id: 'x_evo_' + key,\n      name: typeof evo === 'string' ? evo : (evo.name || evo.evolvesTo || 'Ascended Form'),\n      requires: [],\n      desc: typeof evo === 'string' ? 'Evolves into ' + evo : (evo.desc || 'An ascended form of this weapon.'),\n    }];\n  }\n  return w;\n}\n\n// Flatten every category into playable weapons.\nexport const EXTENDED_WEAPONS = (() => {\n  const out = [];\n  for (const [catName, group] of Object.entries(WEAPONS_EXTENDED || {})) {\n    if (!group || typeof group !== 'object') continue;\n    for (const [key, src] of Object.entries(group)) {\n      if (!src || typeof src !== 'object' || !src.name) continue;\n      try { out.push(convert(key, src, catName)); } catch { /* skip malformed entry */ }\n    }\n  }\n  return out;\n})();\n\nexport const EXTENDED_BY_CATEGORY = (() => {\n  const map = {};\n  for (const [catName, group] of Object.entries(WEAPONS_EXTENDED || {})) {\n    map[catName] = Object.keys(group || {}).map(k => 'x_' + k.replace(/([A-Z])/g, '_$1').toLowerCase());\n  }\n  return map;\n})();\n","js/data/weapons.js":"// ============================================================\n// HELL TRAIN — ARSENAL\n// Weapons, abilities, cores and evolutions.\n// Every weapon has a behaviour implemented in entities/player.js.\n// ============================================================\n\nimport { EXTENDED_WEAPONS } from './weapons_bridge.js';\n\nconst W = (o) => o;\n\nexport const WEAPONS = [\n  // ---------------- STARTERS ----------------\n  W({\n    id: 'fireball', name: 'Hellfire Bolt', family: 'fire', color: '#ff5a33', sprite: 'orbFire',\n    slot: 'primary', icon: 'fire',\n    desc: 'Hurls a screaming bolt of hellfire at the nearest soul.',\n    cd: 0.95, dmg: 13, speed: 230, projLife: 1.8, projSize: 5,\n    pierce: 0, explode: false, burn: 0, behavior: 'fireball', projCount: 1, spread: 0.12,\n    curve: (l) => ({ cd: Math.max(0.45, 0.95 - l * 0.03), dmg: 13 + l * 3, projCount: Math.min(2, 1 + Math.floor(l / 5)) }),\n    evolutions: [\n      { id: 'inferno_nova', requires: ['explosion_core'], name: 'Inferno Nova', desc: 'Bolts detonate in a ring of fire.' },\n      { id: 'hellstorm', requires: ['hellstorm_core'], name: 'Hellstorm', desc: 'A rain of meteors follows every cast.' },\n    ],\n  }),\n  W({\n    id: 'orbital_blades', name: 'Orbital Blades', family: 'orbital', color: '#d0d4e8', sprite: 'sawBlade',\n    slot: 'orbital', icon: 'blade',\n    desc: 'Spectral blades orbit you, shredding anything they touch.',\n    cd: 0, dmg: 9, projSize: 6, pierce: 99, behavior: 'orbital',\n    baseRadius: 40, baseSpeed: 3.6, baseCount: 2, baseSize: 7,\n    curve: (l) => ({ dmg: 9 + l * 1.8, baseCount: Math.min(4, 2 + Math.floor(l / 4)),\n      baseRadius: 40 + Math.min(30, l * 1.5), baseSpeed: 3.6 + l * 0.06 }),\n    evolutions: [\n      { id: 'eclipse_ring', requires: ['eclipse_core'], name: 'Eclipse Ring', desc: 'Blades launch outward on a timer.' },\n      { id: 'storm_ring', requires: ['lightning'], name: 'Storm Ring', desc: 'Every blade arcs lightning.' },\n    ],\n  }),\n\n  // ---------------- BLASTERS ----------------\n  W({\n    id: 'plasma_blaster', name: 'Plasma Blaster', family: 'plasma', color: '#2ff0ff', sprite: 'orbPlasma',\n    slot: 'primary', icon: 'blaster',\n    desc: 'Full-auto plasma. Three-round bursts that punch through crowds.',\n    cd: 1.05, dmg: 8, speed: 300, projLife: 1.2, projSize: 4, pierce: 1,\n    behavior: 'burst', burstCount: 3, burstDelay: 0.07, projCount: 1, spread: 0.06,\n    curve: (l) => ({ cd: Math.max(0.45, 1.05 - l * 0.04), dmg: 8 + l * 2.0,\n      burstCount: Math.min(5, 3 + Math.floor(l / 5)), pierce: Math.min(3, 1 + Math.floor(l / 6)) }),\n    evolutions: [\n      { id: 'ion_stormfront', requires: ['thunder_core'], name: 'Ion Stormfront', desc: 'Bolts chain and overcharge.' },\n      { id: 'annihilator', requires: ['void_core'], name: 'Annihilator', desc: 'Infinite pierce, void detonations.' },\n    ],\n  }),\n  W({\n    id: 'scatter_blaster', name: 'Scatter Blaster', family: 'plasma', color: '#ffb040', sprite: 'orbLight',\n    slot: 'primary', icon: 'shotgun',\n    desc: 'Point blank devastation. Six pellets, one very bad day.',\n    cd: 1.5, dmg: 9, speed: 260, projLife: 0.45, projSize: 4, pierce: 0,\n    behavior: 'shotgun', projCount: 6, spread: 0.16, knockback: 90,\n    curve: (l) => ({ cd: Math.max(0.7, 1.5 - l * 0.05), dmg: 9 + l * 2.2, projCount: Math.min(8, 6 + Math.floor(l / 4)) }),\n    evolutions: [\n      { id: 'devils_dozen', requires: ['explosion_core'], name: \"Devil's Dozen\", desc: 'Twelve explosive pellets.' },\n    ],\n  }),\n  W({\n    id: 'rail_lance', name: 'Rail Lance', family: 'tech', color: '#c0c0d8', sprite: 'railSlug',\n    slot: 'primary', icon: 'rail',\n    desc: 'Charges, then erases a straight line of reality.',\n    cd: 2.6, dmg: 55, speed: 620, projLife: 0.9, projSize: 5, pierce: 99,\n    behavior: 'rail', chargeTime: 0.5,\n    curve: (l) => ({ cd: Math.max(1.2, 2.6 - l * 0.1), dmg: 55 + l * 15 }),\n    evolutions: [\n      { id: 'terminus_cannon', requires: ['void_core'], name: 'Terminus Cannon', desc: 'Fires a screen-wide void lance.' },\n    ],\n  }),\n\n  // ---------------- BOMBERS ----------------\n  W({\n    id: 'bomber', name: 'Cluster Bomber', family: 'explosive', color: '#ff9033', sprite: 'bomb',\n    slot: 'special', icon: 'bomb',\n    desc: 'Drops timed bombs that split into shrapnel charges.',\n    cd: 2.2, dmg: 30, speed: 90, projLife: 1.1, projSize: 6,\n    explode: true, explodeRadius: 40, behavior: 'bomber', projCount: 2, cluster: 3,\n    curve: (l) => ({ cd: Math.max(1.2, 2.2 - l * 0.06), dmg: 30 + l * 6,\n      explodeRadius: Math.min(60, 40 + l * 2), projCount: Math.min(3, 2 + Math.floor(l / 5)), cluster: Math.min(4, 3 + Math.floor(l / 4)) }),\n    evolutions: [\n      { id: 'carpet_bombing', requires: ['explosion_core'], name: 'Carpet Bombing', desc: 'A rolling barrage follows you everywhere.' },\n      { id: 'singularity_mine', requires: ['void_core'], name: 'Singularity Mine', desc: 'Bombs collapse into black holes.' },\n    ],\n  }),\n  W({\n    id: 'void_bomb', name: 'Void Bomb', family: 'void', color: '#9b6dff', sprite: 'orbVoid',\n    slot: 'special', icon: 'void',\n    desc: 'A lobbed hole in the world.',\n    cd: 2.2, dmg: 28, speed: 170, projLife: 1.6, projSize: 7,\n    explode: true, explodeRadius: 44, behavior: 'lob', projCount: 1,\n    curve: (l) => ({ cd: Math.max(1.2, 2.2 - l * 0.05), dmg: 28 + l * 5,\n      explodeRadius: Math.min(60, 44 + l * 2), projCount: Math.min(2, 1 + Math.floor(l / 6)) }),\n    evolutions: [\n      { id: 'chain_reaction', requires: ['explosion_core'], name: 'Chain Reaction', desc: 'Explosions trigger explosions.' },\n      { id: 'void_impact', requires: ['meteor'], name: 'Void Impact', desc: 'Calls a void meteor with a lingering singularity.' },\n    ],\n  }),\n  W({\n    id: 'missile_pod', name: 'Missile Pod', family: 'explosive', color: '#ff7a33', sprite: 'missile',\n    slot: 'special', icon: 'missile',\n    desc: 'Homing warheads that hunt whatever hates you most.',\n    cd: 2.0, dmg: 22, speed: 150, projLife: 2.6, projSize: 5,\n    explode: true, explodeRadius: 26, behavior: 'homing', projCount: 2, turnRate: 5,\n    curve: (l) => ({ cd: Math.max(1.0, 2.0 - l * 0.06), dmg: 22 + l * 4, projCount: Math.min(4, 2 + Math.floor(l / 4)) }),\n    evolutions: [\n      { id: 'saturation_barrage', requires: ['hellstorm_core'], name: 'Saturation Barrage', desc: 'Twelve warheads per volley.' },\n    ],\n  }),\n\n  // ---------------- ELEMENTAL ----------------\n  W({\n    id: 'lightning', name: 'Chain Lightning', family: 'lightning', color: '#fff066', sprite: 'orbLight',\n    slot: 'primary', icon: 'bolt',\n    desc: 'Arcs between the damned. Never misses.',\n    cd: 1.35, dmg: 15, behavior: 'lightning', jumps: 3,\n    curve: (l) => ({ cd: Math.max(0.6, 1.35 - l * 0.04), dmg: 15 + l * 2.5, jumps: Math.min(6, 3 + Math.floor(l/2)) }),\n    evolutions: [\n      { id: 'thunder_god', requires: ['thunder_core'], name: 'Thunder God', desc: 'A permanent storm follows you.' },\n      { id: 'storm_ring', requires: ['orbital_blades'], name: 'Storm Ring', desc: 'Orbitals conduct the storm.' },\n    ],\n  }),\n  W({\n    id: 'frost', name: 'Frostbite', family: 'ice', color: '#7ec8ff', sprite: 'orbIce',\n    slot: 'primary', icon: 'ice',\n    desc: 'Shards that slow, then freeze, then shatter.',\n    cd: 1.05, dmg: 10, speed: 250, projLife: 1.4, projSize: 5, pierce: 1,\n    behavior: 'frost', slow: 0.45, slowDur: 2.0, projCount: 1,\n    curve: (l) => ({ cd: Math.max(0.5, 1.05 - l * 0.03), dmg: 10 + l * 2.0,\n      projCount: Math.min(2, 1 + Math.floor(l / 5)), slowDur: 2 + l * 0.15 }),\n    evolutions: [\n      { id: 'absolute_zero', requires: ['ice_core'], name: 'Absolute Zero', desc: 'Frozen enemies shatter into frost novas.' },\n    ],\n  }),\n  W({\n    id: 'flamethrower', name: 'Pyre Thrower', family: 'fire', color: '#ff7a1a', sprite: null,\n    slot: 'primary', icon: 'flame',\n    desc: 'A continuous cone of burning judgement.',\n    cd: 0.28, dmg: 6, range: 78, behavior: 'cone', arc: 0.7, burn: 5,\n    curve: (l) => ({ dmg: 6 + l * 1.8, range: 78 + l * 4, arc: 0.7 + l * 0.03, burn: 5 + l }),\n    evolutions: [\n      { id: 'sun_breath', requires: ['hellstorm_core'], name: 'Sun Breath', desc: 'A 360° corona of solar fire.' },\n    ],\n  }),\n  W({\n    id: 'toxic_pool', name: 'Plague Censer', family: 'toxic', color: '#98e066', sprite: 'orbToxic',\n    slot: 'special', icon: 'toxic',\n    desc: 'Leaves pools of corrosive plague in your wake.',\n    cd: 1.6, dmg: 7, projLife: 4.0, projSize: 16, behavior: 'pool', poolRadius: 26,\n    curve: (l) => ({ cd: Math.max(0.9, 1.6 - l * 0.05), dmg: 7 + l * 1.5, poolRadius: Math.min(36, 26 + l * 1.5) }),\n    evolutions: [\n      { id: 'black_bloom', requires: ['void_core'], name: 'Black Bloom', desc: 'Pools spread and seek.' },\n    ],\n  }),\n  W({\n    id: 'blood_lance', name: 'Blood Lance', family: 'blood', color: '#ff3a4a', sprite: 'orbBlood',\n    slot: 'primary', icon: 'blood',\n    desc: 'A piercing spear that drinks what it kills.',\n    cd: 1.7, dmg: 26, speed: 330, projLife: 1.1, projSize: 5, pierce: 4,\n    behavior: 'projectile', lifesteal: 0.12,\n    curve: (l) => ({ cd: Math.max(0.7, 1.7 - l * 0.06), dmg: 26 + l * 6, pierce: 4 + Math.floor(l / 2) }),\n    evolutions: [\n      { id: 'crimson_choir', requires: ['blood_core'], name: 'Crimson Choir', desc: 'Lances split on every kill.' },\n    ],\n  }),\n  W({\n    id: 'shadow', name: 'Shadowbolt', family: 'shadow', color: '#9c8ab8', sprite: 'orbShadow',\n    slot: 'primary', icon: 'shadow',\n    desc: 'Silent projectiles that haunt through armour.',\n    cd: 1.4, dmg: 12, speed: 210, projLife: 1.6, projSize: 5, pierce: 2,\n    behavior: 'projectile', projCount: 1, armourPierce: 0.5,\n    curve: (l) => ({ cd: Math.max(0.45, 1.4 - l * 0.05), dmg: 12 + l * 3, projCount: 1 + Math.floor(l / 3) }),\n    evolutions: [\n      { id: 'shadow_army', requires: ['shadow_core'], name: 'Shadow Army', desc: 'Kills raise shadow copies that fight for you.' },\n    ],\n  }),\n  W({\n    id: 'meteor', name: 'Meteor Call', family: 'fire', color: '#ff7a33', sprite: null,\n    slot: 'special', icon: 'meteor',\n    desc: 'Drags a burning rock out of the sky.',\n    cd: 4.2, dmg: 65, explode: true, explodeRadius: 72, behavior: 'meteor',\n    curve: (l) => ({ cd: Math.max(2.0, 4.2 - l * 0.12), dmg: 65 + l * 16, explodeRadius: 72 + l * 3 }),\n    evolutions: [\n      { id: 'world_breaker', requires: ['meteor_core'], name: 'World Breaker', desc: 'Continent-cracking impacts with lava craters.' },\n    ],\n  }),\n\n  // ---------------- EXOTIC ----------------\n  W({\n    id: 'sawblade', name: 'Ricochet Saw', family: 'tech', color: '#c0c8e0', sprite: 'sawBlade',\n    slot: 'special', icon: 'saw',\n    desc: 'Bouncing saws that never seem to run out of walls.',\n    cd: 2.0, dmg: 18, speed: 190, projLife: 3.4, projSize: 7, pierce: 99,\n    behavior: 'bounce', bounces: 5, projCount: 1,\n    curve: (l) => ({ cd: Math.max(0.9, 2.0 - l * 0.07), dmg: 18 + l * 4,\n      bounces: 5 + l, projCount: 1 + Math.floor(l / 4) }),\n    evolutions: [\n      { id: 'meat_grinder', requires: ['blood_core'], name: 'Meat Grinder', desc: 'Saws grow with every kill.' },\n    ],\n  }),\n  W({\n    id: 'boomerang', name: 'Soul Boomerang', family: 'spirit', color: '#a8d4f4', sprite: 'orbIce',\n    slot: 'special', icon: 'boomerang',\n    desc: 'Thrown out, comes back angrier.',\n    cd: 1.8, dmg: 20, speed: 220, projLife: 2.0, projSize: 6, pierce: 99,\n    behavior: 'boomerang', projCount: 1,\n    curve: (l) => ({ cd: Math.max(0.7, 1.8 - l * 0.07), dmg: 20 + l * 4.5, projCount: 1 + Math.floor(l / 3) }),\n    evolutions: [\n      { id: 'karmic_wheel', requires: ['eclipse_core'], name: 'Karmic Wheel', desc: 'Boomerangs orbit before returning.' },\n    ],\n  }),\n  W({\n    id: 'drone_swarm', name: 'Wraith Drones', family: 'tech', color: '#8ef0ff', sprite: 'orbPlasma',\n    slot: 'orbital', icon: 'drone',\n    desc: 'Autonomous spirits that pick their own targets.',\n    cd: 0, dmg: 10, behavior: 'drones', droneCount: 2, droneCd: 1.2, droneRange: 130,\n    curve: (l) => ({ dmg: 10 + l * 2.6, droneCount: Math.min(6, 2 + Math.floor(l / 2)),\n      droneCd: Math.max(0.4, 1.2 - l * 0.06) }),\n    evolutions: [\n      { id: 'iron_choir', requires: ['thunder_core'], name: 'Iron Choir', desc: 'Six drones firing beams in unison.' },\n    ],\n  }),\n  W({\n    id: 'tesla_aura', name: 'Tesla Halo', family: 'lightning', color: '#8ef0ff', sprite: null,\n    slot: 'aura', icon: 'aura',\n    desc: 'A crackling field that punishes anything near you.',\n    cd: 0.7, dmg: 9, radius: 62, behavior: 'aura',\n    curve: (l) => ({ cd: Math.max(0.25, 0.7 - l * 0.03), dmg: 9 + l * 2.4, radius: 62 + l * 3 }),\n    evolutions: [\n      { id: 'god_capacitor', requires: ['thunder_core'], name: 'God Capacitor', desc: 'The field becomes a permanent storm.' },\n    ],\n  }),\n  W({\n    id: 'black_hole', name: 'Event Horizon', family: 'void', color: '#bc84f4', sprite: 'orbVoid',\n    slot: 'special', icon: 'hole',\n    desc: 'Opens a singularity that drags everything to its death.',\n    cd: 8.0, dmg: 14, projLife: 3.2, radius: 78, behavior: 'blackhole',\n    curve: (l) => ({ cd: Math.max(4.0, 8.0 - l * 0.3), dmg: 14 + l * 5, radius: 78 + l * 4 }),\n    evolutions: [\n      { id: 'the_null_point', requires: ['void_core'], name: 'The Null Point', desc: 'A permanent singularity orbits you.' },\n    ],\n  }),\n  W({\n    id: 'holy_nova', name: 'Requiem Nova', family: 'holy', color: '#ffe878', sprite: null,\n    slot: 'aura', icon: 'nova',\n    desc: 'Detonates a ring of consecrated light around you.',\n    cd: 3.0, dmg: 28, radius: 84, behavior: 'nova', heal: 4,\n    curve: (l) => ({ cd: Math.max(1.2, 3.0 - l * 0.12), dmg: 28 + l * 7, radius: 84 + l * 4, heal: 4 + l }),\n    evolutions: [\n      { id: 'judgement_day', requires: ['eclipse_core'], name: 'Judgement Day', desc: 'Novas leave pillars of light.' },\n    ],\n  }),\n  W({\n    id: 'void_step', name: 'Void Step', family: 'void', color: '#9b6dff', sprite: null,\n    slot: 'special', icon: 'step',\n    desc: 'Blink through space, leaving a detonating afterimage.',\n    cd: 4.0, dmg: 30, explode: true, explodeRadius: 34, behavior: 'teleport',\n    curve: (l) => ({ cd: Math.max(2.0, 4.0 - l * 0.1), dmg: 30 + l * 8, explodeRadius: 34 + l * 3 }),\n    evolutions: [\n      { id: 'phantom_shift', requires: ['shadow_core'], name: 'Phantom Shift', desc: 'Leaves attacking clones at both ends.' },\n    ],\n  }),\n  // ---- v1.4: three new mechanics — charge, deployable, echo ----\n  W({\n    id: 'arcane_lance', name: 'Arcane Lance', family: 'arcane', color: '#e08aff', sprite: 'orbVoid',\n    desc: 'Charges up, then fires a heavy piercing bolt.',\n    cd: 0.1, dmg: 26, speed: 460, projLife: 1.3, projSize: 7, pierce: 3,\n    behavior: 'charge', chargeTime: 1.7,\n    curve: (l) => ({ dmg: 26 + l * 9, chargeTime: Math.max(1.0, 1.7 - l * 0.08), pierce: 3 + Math.floor(l / 3) }),\n    evolutions: [\n      { id: 'star_lance', requires: ['void_core'], name: 'Starlance', desc: 'Charged bolts detonate in star-fire.' },\n    ],\n  }),\n  W({\n    id: 'sentry_kit', name: 'Sentry Kit', family: 'turret', color: '#ff9a4a', sprite: 'bomb',\n    desc: 'Deploys a gun turret that holds the ground for 12s.',\n    cd: 9.0, dmg: 9, behavior: 'turret', turretLife: 12, turretCd: 0.55,\n    curve: (l) => ({ dmg: 9 + l * 2.2, turretLife: 12 + l, turretCd: Math.max(0.3, 0.55 - l * 0.025) }),\n    evolutions: [\n      { id: 'fortress_protocol', requires: ['explosion_core'], name: 'Fortress Protocol', desc: 'Two turrets firing rockets.' },\n    ],\n  }),\n  W({\n    id: 'echo_shard', name: 'Echo Shard', family: 'spirit', color: '#a8d4f4', sprite: 'orbIce',\n    desc: 'Repeats your last shot a moment later, slightly weaker.',\n    cd: 0.9, dmg: 1, behavior: 'echo', echoMult: 0.6, echoDelay: 0.7,\n    curve: (l) => ({ echoMult: Math.min(1.0, 0.6 + l * 0.05), echoDelay: Math.max(0.3, 0.7 - l * 0.04) }),\n    evolutions: [\n      { id: 'chorus', requires: ['ice_core'], name: 'Chorus', desc: 'Every shot echoes twice, at full power.' },\n    ],\n  }),\n];\n\n// ------------------------------------------------------------------\n// ABILITIES (Space bar)\n// ------------------------------------------------------------------\nexport const ABILITIES = [\n  { id: 'dodge', name: 'Phase Dodge', family: 'survival', color: '#7ec8ff',\n    desc: 'Short invulnerable dash with an afterimage trail.', cd: 2.6, dur: 0.28, dist: 120 },\n  { id: 'blast', name: 'Hellfire Blast', family: 'fire', color: '#ff7a33',\n    desc: 'Knockback shockwave that ignites everything nearby.', cd: 6.0, radius: 96, dmg: 34 },\n  { id: 'magnet', name: 'Soul Magnet', family: 'survival', color: '#9b6dff',\n    desc: 'Rips all loot on screen toward you.', cd: 13.0, dur: 4.0, radius: 240 },\n  { id: 'overclock', name: 'Overclock', family: 'tech', color: '#2ff0ff',\n    desc: 'Triple fire rate for 4 seconds.', cd: 18.0, dur: 4.0 },\n  { id: 'bulwark', name: 'Bulwark', family: 'survival', color: '#ffe066',\n    desc: 'Absorb shield equal to 40% max HP.', cd: 16.0, dur: 6.0 },\n];\n\n// ------------------------------------------------------------------\n// CORES — combine with a weapon to evolve it\n// ------------------------------------------------------------------\nexport const CORES = [\n  { id: 'explosion_core', name: 'Explosion Core', desc: 'Everything you do detonates.', color: '#ff7a33' },\n  { id: 'eclipse_core', name: 'Eclipse Core', desc: 'Bends orbits and light.', color: '#985ce0' },\n  { id: 'ice_core', name: 'Ice Core', desc: 'Absolute cold.', color: '#7ec8ff' },\n  { id: 'shadow_core', name: 'Shadow Core', desc: 'Borrowed darkness.', color: '#6a5a90' },\n  { id: 'hellstorm_core', name: 'Hellstorm Core', desc: 'The sky falls on command.', color: '#ff4d26' },\n  { id: 'thunder_core', name: 'Thunder Core', desc: 'Stored sky-rage.', color: '#fff066' },\n  { id: 'meteor_core', name: 'Meteor Core', desc: 'A fragment of something that fell.', color: '#ff9033' },\n  { id: 'void_core', name: 'Void Core', desc: 'A hole that is also a battery.', color: '#bc84f4' },\n  { id: 'blood_core', name: 'Blood Core', desc: 'It beats when you kill.', color: '#ff3a4a' },\n];\n\n// ---- fold in the extended arsenal (bombers / blasters / beams / summons) ----\n// These come from js/data/weapons_extended.js via the bridge, which converts\n// their data-only definitions into behaviours the engine can actually fire.\nfor (const xw of EXTENDED_WEAPONS) {\n  if (!WEAPONS.some(w => w.id === xw.id)) WEAPONS.push(xw);\n}\n\nexport function findWeapon(id) { return WEAPONS.find(w => w.id === id); }\nexport function findAbility(id) { return ABILITIES.find(w => w.id === id); }\nexport function findCore(id) { return CORES.find(w => w.id === id); }\n\nexport function findEvolution(weaponId, otherId) {\n  const w = findWeapon(weaponId);\n  if (!w?.evolutions) return null;\n  for (const evo of w.evolutions) if (evo.requires.includes(otherId)) return evo;\n  return null;\n}\n\n// Weapons that can be offered as level-up picks\nexport const OFFERABLE_WEAPONS = WEAPONS.map(w => w.id);\n","js/data/evolutions.js":"// ============================================================\n// HELL TRAIN — WEAPON EVOLUTIONS\n// When a weapon hits mastery level 5 it ASCENDS into a named,\n// visually distinct, build-defining weapon. One evolution per\n// core weapon; each carries its own playstyle hook.\n// ============================================================\n\nexport const WEAPON_EVOLUTIONS = {\n  fireball: {\n    id: 'hellstorm', name: 'HELLSTORM', color: '#ff2a2a', tagline: 'BOLTS THAT BURN THE WORLD',\n    apply: (w, p) => {\n      w.evolved = true; w.evolution = 'hellstorm';\n      w.name = 'HELLSTORM';\n      w.color = '#ff2a2a';\n      w.dmg = Math.round(w.dmg * 1.9);\n      w.projCount = (w.projCount || 1) + 1;\n      w.explode = true;\n      w.explodeRadius = Math.max(w.explodeRadius || 26, 34);\n      w.burn = (w.burn || 0) + 8;\n      p.modMult('atkSpd', 1.08);\n    },\n  },\n  orbital_blades: {\n    id: 'eclipse_ring', name: 'ECLIPSE RING', color: '#c07aff', tagline: 'THE SUN IS A BLADE',\n    apply: (w, p) => {\n      w.evolved = true; w.evolution = 'eclipse_ring';\n      w.name = 'ECLIPSE RING'; w.color = '#c07aff';\n      w.dmg = Math.round(w.dmg * 1.8);\n      w.baseCount = Math.min(4, (w.baseCount || 2) + 1);\n      w.baseRadius = (w.baseRadius || 46) + 10;\n      w.baseSpeed = (w.baseSpeed || 2.6) + 0.8;\n      p.orbitBarrage = true; // blades fling outward on a timer (handled in player.update)\n      p.orbitBarrageDmg = 24;\n    },\n  },\n  plasma_blaster: {\n    id: 'ion_stormfront', name: 'ION STORMFRONT', color: '#2ff0ff', tagline: 'CHAINED LIGHTNING ON EVERY SHOT',\n    apply: (w, p) => {\n      w.evolved = true; w.evolution = 'ion_stormfront';\n      w.name = 'ION STORMFRONT'; w.color = '#2ff0ff';\n      w.dmg = Math.round(w.dmg * 1.8);\n      w.burstCount = (w.burstCount || 3) + 1;\n      w.chainOnHit = true;\n      p.chain = (p.chain || 0) + 1;\n    },\n  },\n  lightning: {\n    id: 'thunder_god', name: 'THUNDER GOD', color: '#fff066', tagline: 'THE SKY FOLLOWS YOU',\n    apply: (w, p) => {\n      w.evolved = true; w.evolution = 'thunder_god';\n      w.name = 'THUNDER GOD'; w.color = '#fff066';\n      w.dmg = Math.round(w.dmg * 2.0);\n      w.jumps = Math.min(8, (w.jumps || 3) + 3);\n      p.tempest = true;\n      p.tempestDmg = 22;\n    },\n  },\n  frost: {\n    id: 'absolute_zero', name: 'ABSOLUTE ZERO', color: '#9cd8ff', tagline: 'WINTER IS AN ORDER',\n    apply: (w, p) => {\n      w.evolved = true; w.evolution = 'absolute_zero';\n      w.name = 'ABSOLUTE ZERO'; w.color = '#9cd8ff';\n      w.dmg = Math.round(w.dmg * 1.9);\n      w.projCount = (w.projCount || 1) + 1;\n      w.pierce = (w.pierce || 0) + 2;\n      p.absoluteZero = true;\n    },\n  },\n  flamethrower: {\n    id: 'sun_breath', name: 'SUN BREATH', color: '#ffb040', tagline: 'A CORONA OF SOLAR FIRE',\n    apply: (w, p) => {\n      w.evolved = true; w.evolution = 'sun_breath';\n      w.name = 'SUN BREATH'; w.color = '#ffb040';\n      w.dmg = Math.round(w.dmg * 1.8);\n      w.range = (w.range || 78) + 30;\n      w.arc = Math.min(1.4, (w.arc || 0.7) + 0.5);\n      w.burn = (w.burn || 0) + 8;\n      p.burnDmg = (p.burnDmg || 0) + 8;\n    },\n  },\n  void_bomb: {\n    id: 'void_impact', name: 'VOID IMPACT', color: '#bc84f4', tagline: 'EVERY CRATER IS A GATEWAY',\n    apply: (w, p) => {\n      w.evolved = true; w.evolution = 'void_impact';\n      w.name = 'VOID IMPACT'; w.color = '#bc84f4';\n      w.dmg = Math.round(w.dmg * 1.9);\n      w.explodeRadius = Math.min(84, (w.explodeRadius || 44) + 16);\n      w.projCount = (w.projCount || 1) + 1;\n      w.blackholeOnImpact = true;\n    },\n  },\n  sawblade: {\n    id: 'ghost_grinder', name: 'GHOST GRINDER', color: '#e0e0ff', tagline: 'IT NEVER STOPS RETURNING',\n    apply: (w, p) => {\n      w.evolved = true; w.evolution = 'ghost_grinder';\n      w.name = 'GHOST GRINDER'; w.color = '#e0e0ff';\n      w.dmg = Math.round(w.dmg * 1.8);\n      w.bounces = Math.min(10, (w.bounces || 4) + 4);\n      w.spin = (w.spin || 12) + 8;\n      w.projCount = (w.projCount || 1) + 1;\n    },\n  },\n  // ---- v1.4 evolutions: charge / deployable / echo ----\n  arcane_lance: {\n    id: 'star_lance', name: 'STARLANCE', color: '#ffd0ff', tagline: 'A STAR, ON A STICK',\n    apply: (w, p) => {\n      w.evolved = true; w.evolution = 'star_lance';\n      w.name = 'STARLANCE'; w.color = '#ffd0ff';\n      w.dmg = Math.round(w.dmg * 2.1);\n      w.chargeTime = Math.max(0.9, (w.chargeTime || 1.7) - 0.4);\n      w.explode = true;\n      w.explodeRadius = 38;\n      w.pierce = (w.pierce || 3) + 3;\n      p.modMult('atkSpd', 1.05);\n    },\n  },\n  sentry_kit: {\n    id: 'fortress_protocol', name: 'FORTRESS PROTOCOL', color: '#ffb06a', tagline: 'THE GROUND FIGHTS BACK',\n    apply: (w, p) => {\n      w.evolved = true; w.evolution = 'fortress_protocol';\n      w.name = 'FORTRESS PROTOCOL'; w.color = '#ffb06a';\n      w.dmg = Math.round(w.dmg * 1.6);\n      w.turretLife = (w.turretLife || 12) + 6;\n      w.turretCd = Math.max(0.3, (w.turretCd || 0.55) - 0.1);\n      // two turrets firing homing rockets (handled in the turret logic)\n    },\n  },\n  echo_shard: {\n    id: 'chorus', name: 'CHORUS', color: '#cfe8ff', tagline: 'EVERY SHOT, SUNG TWICE',\n    apply: (w, p) => {\n      w.evolved = true; w.evolution = 'chorus';\n      w.name = 'CHORUS'; w.color = '#cfe8ff';\n      w.echoMult = 1.0;\n      w.echoDelay = Math.max(0.3, (w.echoDelay || 0.7) - 0.15);\n    },\n  },\n};\n\nexport function findEvolution(weaponId) {\n  return WEAPON_EVOLUTIONS[weaponId] || null;\n}\n","js/entities/player.js":"// ============================================================\n// HELL TRAIN — The Conductor (player entity)\n// Animation state machine + the whole weapon dispatch.\n// ============================================================\nimport { WEAPONS, ABILITIES, findWeapon } from '../data/weapons.js';\nimport { findEvolution } from '../data/evolutions.js';\nimport { rand, clamp, dist, TAU } from '../core/utils.js';\nimport { SOUNDS } from '../core/sound.js';\n\nconst DIRS = ['down', 'up', 'side'];\n\nexport class Player {\n  constructor(x, y, art, save) {\n    this.x = x; this.y = y; this.vx = 0; this.vy = 0;\n    this.radius = 7;\n    this.facing = 'down'; this.flip = false;\n    this.art = art;\n    this.skinId = save?.charSkin || 'conductor';\n    this.set = art.getCharSet(this.skinId);\n    this.state = 'idle'; this.animT = 0; this.frame = 0;\n    this.alive = true; this.invuln = 0; this.hitT = 0; this.deathT = 0;\n\n    // --- base stats ---\n    this.maxHp = 120; this.hp = 120;\n    this.armour = 0;\n    this.atkDmg = 1; this.atkSpd = 1; this.moveSpd = 1;\n    this.crit = 0.06; this.critDmg = 1.6;\n    this.cdr = 1;\n    this.pickupRange = 68;\n    this.regen = 0; this.dodge = 0; this.lifesteal = 0;\n    this.burnDmg = 0; this.burnDur = 0;\n    this.chill = 0; this.chain = 0;\n    this.pierceBonus = 0; this.extraProjectiles = 0;\n    this.projSpeedMult = 1;\n    this.shield = 0; this.shieldAmount = 0; this.shieldTimer = undefined;\n    this.knockback = 0; this.thorns = 0;\n    this.coinMult = 1; this._xpGain = 1;\n    this.execute = false; this.executeMult = 1;\n    this.eclipse = false; this.eclipseMax = 0;\n    this.momentum = 0; this.momentumStacks = 0;\n    this.frenzy = 0; this.frenzyStacks = 0; this.frenzyT = 0;\n    this.revive = 0; this.luck = 0;\n    this.doubleCast = 0; this.corpseBoom = 0;\n    this.killHeal = 0; this.killTrainEnergy = 0;\n    this.apocalypse = false; this.apocalypseBurn = 0;\n    this.omegaRound = 0; this._shotCount = 0;\n    this.hellsplit = 0; this.extinction = 0; this._extinctionT = 20;\n    this.freeRerolls = 0; this.startLevelBonus = 0;\n    this.aoeMult = 1; this.autoInvuln = null; this.autoDodge = null; this.screenWipe = 0;\n    this.rootT = 0; this.orbitBarrage = false; this.orbitBarrageDmg = 0; this._orbitBarrageT = 0;\n\n    // --- progression ---\n    this.xp = 0; this.level = 1; this.score = 0; this.kills = 0;\n    this.combo = 0; this.comboT = 0; this.bestCombo = 0;\n\n    // --- loadout ---\n    this.weapons = []; this.weaponStates = {};\n    this.orbitals = []; this.drones = []; this.turrets = [];\n    this.lastShot = null;           // ECHO SHARD: snapshot of the previous shot\n    this.abilities = []; this.abilityStates = {};\n    this.addAbility('dodge');\n    this.t = 0;\n    this._tempest = 0;\n  }\n\n  setSkin(id) {\n    this.skinId = id;\n    this.set = this.art.getCharSet(id);\n  }\n\n  // ---------- loadout ----------\n  hasWeapon(id) { return this.weapons.some(w => w.id === id); }\n  addWeapon(id) {\n    if (this.hasWeapon(id)) { this.upgradeWeapon(id); return; }\n    const base = findWeapon(id);\n    if (!base) return;\n    const w = { ...base };\n    this.weapons.push(w);\n    this.weaponStates[id] = { cd: 0, level: 1, burst: 0, burstT: 0 };\n    if (w.behavior === 'orbital') this._syncOrbitals(w);\n    if (w.behavior === 'drones') this._syncDrones(w);\n  }\n  upgradeWeapon(id) {\n    const w = this.weapons.find(x => x.id === id);\n    if (!w) return;\n    const s = this.weaponStates[id];\n    s.level += 1;\n    if (w.curve) Object.assign(w, w.curve(s.level));\n    if (w.behavior === 'orbital') this._syncOrbitals(w);\n    if (w.behavior === 'drones') this._syncDrones(w);\n    if (!w.evolved && s.level >= 5) this.evolveWeapon(id);\n  }\n  // Weapon mastery 5 -> named EVOLUTION (build-defining moment)\n  evolveWeapon(id) {\n    const w = this.weapons.find(x => x.id === id);\n    if (!w || w.evolved) return false;\n    const evo = findEvolution(id);\n    if (!evo) return false;\n    evo.apply(w, this);\n    w.evolved = true; w.evolution = evo.id;\n    if (w.behavior === 'orbital') this._syncOrbitals(w);\n    if (w.behavior === 'drones') this._syncDrones(w);\n    return true;\n  }\n  weaponLevel(id) { return this.weaponStates[id]?.level || 0; }\n  addAbility(id) {\n    if (this.abilities.some(a => a.id === id)) return;\n    const a = ABILITIES.find(x => x.id === id);\n    if (!a) return;\n    this.abilities.push({ ...a });\n    this.abilityStates[id] = { cd: 0 };\n  }\n  modMult(key, mult) {\n    if (key === 'atkDmg') this.atkDmg = Math.min(5, this.atkDmg * mult);\n    else if (key === 'atkSpd') this.atkSpd = Math.min(3, this.atkSpd * mult);\n    else if (key === 'moveSpd') this.moveSpd = Math.min(2.5, this.moveSpd * mult);\n    else if (key === 'critDmg') this.critDmg = Math.min(4, this.critDmg * mult);\n    else if (key === 'cdr') this.cdr = Math.min(2.2, this.cdr * mult);\n    else if (key === 'pickupRange') this.pickupRange = Math.min(180, this.pickupRange * mult);\n    else if (key === 'xpGain') this._xpGain = Math.min(3, this._xpGain * mult);\n  }\n  clampChaos(){\n    this.extraProjectiles = Math.min(2, this.extraProjectiles||0);\n    this.chain = Math.min(3, this.chain||0);\n    this.pierceBonus = Math.min(3, this.pierceBonus||0);\n    this.doubleCast = Math.min(0.25, this.doubleCast||0);\n  }\n\n  _syncOrbitals(w) {\n    const want = Math.min(4, (w.baseCount || 2) + (this.apocalypse ? 1 : 0));\n    this.orbitals = [];\n    for (let i = 0; i < want; i++) {\n      this.orbitals.push({ ang: (i / want) * TAU, r: w.baseRadius, spd: w.baseSpeed,\n        dmg: w.dmg, size: w.baseSize || 7, weapon: w.id, color: w.color, hitCd: {} });\n    }\n  }\n  _syncDrones(w) {\n    const want = Math.min(3, w.droneCount || 2);\n    while (this.drones.length < want) {\n      this.drones.push({ ang: Math.random() * TAU, r: 26 + Math.random() * 10, cd: 0,\n        x: this.x, y: this.y, weapon: w.id });\n    }\n    this.drones.length = want;\n  }\n\n  // ---------- progression ----------\n  xpNeeded() { return Math.floor(9 + this.level * 5 + Math.pow(this.level, 1.42)); }\n  gainXp(amount) {\n    this.xp += amount * this._xpGain;\n    let levels = 0;\n    while (this.xp >= this.xpNeeded() && levels < 40) {\n      this.xp -= this.xpNeeded();\n      this.level += 1; levels++;\n      this.onLevelUp?.();\n    }\n  }\n  addCombo() {\n    this.combo += 1; this.comboT = 3.0;\n    if (this.combo > this.bestCombo) this.bestCombo = this.combo;\n  }\n  get comboMult() { return 1 + Math.min(0.5, this.combo * 0.01); }\n\n  // ---------- damage ----------\n  takeDamage(dmg, ctx, src) {\n    if (this.invuln > 0 || !this.alive) return 0;\n    if (this.dodge > 0 && Math.random() < this.dodge) {\n      ctx?.fx.damageText(this.x, this.y - 16, 'DODGE', '#8ef0ff', { size: 7 });\n      return 0;\n    }\n    let dealt = Math.max(1, dmg - this.armour);\n    if (this.shield > 0) {\n      const abs = Math.min(this.shield, dealt);\n      this.shield -= abs; dealt -= abs;\n      ctx?.fx.ring(this.x, this.y, 18, '#ffe066', 0.2);\n    }\n    this.hp -= dealt;\n    this.hitT = 0.16;\n    this.combo = 0;\n    if (this.thorns && src && src.takeDamage) src.takeDamage(this.thorns, { family: 'physical' });\n    if (this.hp <= 0) {\n      if (this.revive > 0) {\n        this.revive -= 1; this.hp = this.maxHp * 0.6; this.invuln = 2.2;\n        ctx?.onRevive?.(this);\n        return dealt;\n      }\n      if (this.undying && !this.undyingActive) {\n        this.undyingActive = true; this.undyingT = 4; this.hp = 1; this.invuln = 0.6;\n        ctx?.fx.banner(this.x, this.y - 30, 'UNDYING', '#ff4d6a');\n        return dealt;\n      }\n      this.alive = false; this.deathT = 1.4;\n    } else {\n      this.invuln = 0.45;\n    }\n    return dealt;\n  }\n  heal(amount) {\n    const before = this.hp;\n    this.hp = Math.min(this.maxHp, this.hp + amount);\n    const over = amount - (this.hp - before);\n    if (over > 0 && this.overheal) this.shield = Math.min(this.maxHp, this.shield + over * this.overheal);\n  }\n\n  // ---------- update ----------\n  update(dt, ctx) {\n    this.t += dt;\n    if (this.invuln > 0) this.invuln -= dt;\n    if (this.hitT > 0) this.hitT -= dt;\n    if (this.comboT > 0) { this.comboT -= dt; if (this.comboT <= 0) this.combo = 0; }\n    if (this.regen) this.heal(this.regen * dt);\n    if (this.apocalypseBurn) {\n      this.hp -= this.maxHp * this.apocalypseBurn * dt;\n      if (this.hp <= 1) this.hp = 1;\n    }\n    // periodic invulnerability window (tiered card: 'Temporal Bulwark')\n    if (this.autoInvuln) {\n      this.autoInvuln.t -= dt;\n      if (this.autoInvuln.t <= 0) {\n        this.autoInvuln.t = this.autoInvuln.cd;\n        this.invuln = Math.max(this.invuln, this.autoInvuln.dur);\n        ctx?.fx?.ring(this.x, this.y, 22, '#8ef0ff', 0.4, 3);\n        ctx?.fx?.banner?.(this.x, this.y - 26, 'PHASED', '#8ef0ff');\n      }\n    }\n    // automatic dodge pulse (tiered card)\n    if (this.autoDodge) {\n      this.autoDodge.t -= dt;\n      if (this.autoDodge.t <= 0) {\n        this.autoDodge.t = this.autoDodge.every;\n        this.invuln = Math.max(this.invuln, 0.5);\n        ctx?.fx?.afterimage?.(this.currentFrame(), this.x, this.y, 1, this.flip, '#8ef0ff', 0.3);\n      }\n    }\n    if (this.undyingActive) {\n      this.undyingT -= dt;\n      if (this.undyingT <= 0) { this.alive = false; this.deathT = 1.4; }\n    }\n    if (this.shieldAmount > 0) {\n      this.shieldTimer = (this.shieldTimer ?? 8) - dt;\n      if (this.shieldTimer <= 0) {\n        this.shieldTimer = 8;\n        this.shield = Math.min(this.maxHp, this.shield + this.shieldAmount);\n        ctx.fx.ring(this.x, this.y, 22, '#ffe066', 0.35);\n      }\n    }\n    if (this.frenzyT > 0) { this.frenzyT -= dt; if (this.frenzyT <= 0) this.frenzyStacks = 0; }\n    // momentum\n    const speed = Math.hypot(this.vx, this.vy);\n    if (this.momentum) {\n      if (speed > 20) this.momentumStacks = Math.min(1, this.momentumStacks + dt * 0.6);\n      else this.momentumStacks = Math.max(0, this.momentumStacks - dt * 1.6);\n    }\n    // tempest crown\n    if (this.tempest) {\n      this._tempest -= dt;\n      if (this._tempest <= 0) {\n        this._tempest = 0.6;\n        const e = ctx.findNearestEnemy(this.x, this.y, 180);\n        if (e) {\n          ctx.fx.lightning(this.x, this.y - 40, e.x, e.y, '#fff066');\n          ctx.dealDamage(e, 30 * this.atkDmg, { family: 'lightning' });\n        }\n      }\n    }\n    // extinction event\n    if (this.extinction) {\n      this._extinctionT -= dt;\n      if (this._extinctionT <= 0) {\n        this._extinctionT = 20;\n        ctx.extinctionEvent(this.extinction);\n      }\n    }\n\n    // --- animation state ---\n    let st = 'idle';\n    if (!this.alive) st = 'death';\n    else if (this.dashT > 0) st = 'dash';\n    else if (this.hitT > 0) st = 'hurt';\n    else if (this.atkT > 0) st = 'attack';\n    else if (speed > 12) st = 'run';\n    if (st !== this.state) { this.state = st; this.animT = 0; this.frame = 0; }\n    if (this.atkT > 0) this.atkT -= dt;\n    if (this.dashT > 0) this.dashT -= dt;\n    const fps = st === 'run' ? 14 : st === 'attack' ? 16 : st === 'death' ? 7 : 6;\n    this.animT += dt * fps;\n    const frames = this.set[this.dirKey()][st] || this.set[this.dirKey()].idle;\n    if (st === 'death') this.frame = Math.min(frames.length - 1, Math.floor(this.animT));\n    else this.frame = Math.floor(this.animT) % frames.length;\n    if (!this.alive) this.deathT -= dt;\n\n    // root trap (boss Vine/root attacks pin you in place)\n    if (this.rootT > 0) this.rootT -= dt;\n\n    // orbitals\n    for (const o of this.orbitals) {\n      o.ang += o.spd * dt * (this.apocalypse ? 1.6 : 1);\n      o.x = this.x + Math.cos(o.ang) * o.r;\n      o.y = this.y + Math.sin(o.ang) * o.r;\n      for (const e of ctx.enemiesInRange(o.x, o.y, o.size + 6)) {\n        const key = e._id;\n        if ((o.hitCd[key] || 0) > this.t) continue;\n        o.hitCd[key] = this.t + 0.32;\n        ctx.dealDamage(e, o.dmg * this.atkDmg, { family: 'orbital', x: o.x, y: o.y, small: true });\n        ctx.fx.sparks(o.x, o.y, o.color, 3, o.ang + Math.PI / 2);\n      }\n    }\n    // ECLIPSE RING evolution: blades barrage outward every 4s\n    if (this.orbitBarrage && this.orbitals.length) {\n      this._orbitBarrageT -= dt;\n      if (this._orbitBarrageT <= 0) {\n        this._orbitBarrageT = 4;\n        for (const o of this.orbitals) {\n          const a = o.ang;\n          ctx.spawnProjectile({\n            x: o.x, y: o.y, vx: Math.cos(a) * 300, vy: Math.sin(a) * 300,\n            life: 0.6, dmg: (this.orbitBarrageDmg || 24) * this.atkDmg, pierce: 3,\n            color: '#c07aff', sprite: 'sawBlade', owner: 'player', size: 5,\n            family: 'orbital', angle: a, spin: 18,\n          });\n        }\n        ctx.fx.ring(this.x, this.y, 60, '#c07aff', 0.3, 2);\n      }\n    }\n    // drones\n    const droneW = this.weapons.find(w => w.behavior === 'drones');\n    if (droneW) {\n      for (let i = 0; i < this.drones.length; i++) {\n        const d = this.drones[i];\n        d.ang += dt * 1.4;\n        const tx = this.x + Math.cos(d.ang + i) * (30 + i *
